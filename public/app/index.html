function RichText({ text, accounts }) {
  const parts = [];
  const re = /(^|[^A-Za-z0-9._-])@([A-Za-z0-9._-]{3,30})/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const name = m[2].replace(/[._-]+$/, "");
    if (!accounts.some(a => a.username && a.username.toLowerCase() === name.toLowerCase())) continue;
    const start = m.index + m[1].length;
    parts.push(text.slice(last, start));
    parts.push(<span key={start} style={{ color: "var(--accent-2)", fontWeight: 600, background: "#5B6EF51F", borderRadius: 4, padding: "0 3px" }}>@{name}</span>);
    last = start + 1 + name.length;
  }
  parts.push(text.slice(last));
  return <>{parts}</>;
}

/* ---------------- Annonce programmée (table system_alerts : message + display_at) ---------------- */
function AlertBanner({ inline }) {
  const [alert, setAlert] = useState(null);
  const [hidden, setHidden] = useState(false);
  const keyOf = (a) => a.id + "|" + a.display_at + "|" + a.message;
  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const { data, error } = await supabase.from('system_alerts').select('id,message,display_at,is_maintenance')
          .lte('display_at', new Date().toISOString()).order('display_at', { ascending: false }).limit(5);
        if (error || !alive) return;
        const a = (data || []).find(r => !r.is_maintenance && r.message && r.message.trim());
        if (!a) { setAlert(null); return; }
        let dismissed = null;
        try { dismissed = localStorage.getItem("carnet-alert-dismissed"); } catch (_) {}
        setAlert(a); setHidden(dismissed === keyOf(a));
      } catch (_) {}
    };
    load();
    const id = setInterval(load, 5 * 60 * 1000);
    const onVis = () => { if (!document.hidden) load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { alive = false; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  if (!alert || hidden) return null;
  const close = () => { try { localStorage.setItem("carnet-alert-dismissed", keyOf(alert)); } catch (_) {} setHidden(true); };
  return (
    <div className="alert-banner" role="status" style={{ ...(inline ? { marginBottom: 18 } : { position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 45, width: "min(560px, 92vw)", boxShadow: "0 12px 30px rgba(0,0,0,.45)" }), display: "flex", alignItems: "flex-start", gap: 10, background: "#2A2410", border: "1px solid #6B5A1E", color: "#FFE3A0", borderRadius: 12, padding: "11px 14px", fontSize: 13.5, lineHeight: 1.45 }}>
      <I.Alert size={17} style={{ flexShrink: 0, marginTop: 1, color: "#FFC97A" }} />
      <div style={{ flex: 1, minWidth: 0, wordBreak: "break-word" }}>{alert.message}</div>
      <button type="button" onClick={close} aria-label="Fermer l'annonce" style={{ background: "none", border: "none", color: "#FFE3A0", cursor: "pointer", padding: 2, flexShrink: 0 }}><I.X size={16} /></button>
    </div>
  );
}
function Shell({ children, footer, noAlert }) { return <div style={{ minHeight: "100vh", width: "100%", position: "relative", overflow: "hidden" }}><GrainOverlay />{children}{!noAlert && <AlertBanner />}{footer && <SiteFooter floating />}</div>; }

/* ============================================================
   App racine
   ============================================================ */
function App() {
  const [session, setSession] = useState(undefined); // undefined = chargement, null = déconnecté
  const [profile, setProfile] = useState(null);
  const [toast, setToast] = useState(null);
  const notify = (text, kind = "ok", action) => {
    setToast({ text, kind, action: action && { label: action.label, onClick: () => { setToast(null); action.onClick(); } }, key: uid() });
    clearTimeout(notify._t);
    notify._t = setTimeout(() => setToast(null), action ? 8000 : 3200);
  };

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((event, s) => { if (event === "PASSWORD_RECOVERY") setRecovery(true); setSession(s); });
    return () => sub.subscription.unsubscribe();
  }, []);

  const [profileChecked, setProfileChecked] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [recovery, setRecovery] = useState(false);

  useEffect(() => {
    let cancelled = false;
    async function loadProfile() {
      if (session === undefined) return;
      if (!session) { setProfile(null); setProfileChecked(true); return; }
      const { data } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (!cancelled) { setProfile(data || null); setProfileChecked(true); }
    }
    loadProfile();
    const id = setInterval(loadProfile, 8000); // revérifie si une demande a été approuvée
    return () => { cancelled = true; clearInterval(id); };
  }, [session, reloadKey]);

  if (session === undefined || !profileChecked) {
    return <Shell><div style={{ minHeight: "100vh", display: "grid", placeItems: "center" }}><Spinner /></div></Shell>;
  }

  if (session && recovery) {
    return <Shell footer><ResetPassword notify={notify} onDone={() => setRecovery(false)} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!session) {
    const inviteToken = new URLSearchParams(window.location.search).get("invite");
    if (inviteToken) return <Shell footer><InviteAccept token={inviteToken} notify={notify} />{toast && <Toast toast={toast} />}</Shell>;
    return <Shell footer><AuthGate notify={notify} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!profile && ((session.user.app_metadata && session.user.app_metadata.providers) || []).includes("google")) {
    return <Shell footer><CompleteProfile session={session} notify={notify} onDone={() => setReloadKey(k => k + 1)} onLogout={() => supabase.auth.signOut()} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!profile) {
    return (
      <Shell>
        <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
          <div style={{ maxWidth: 380, textAlign: "center", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 16, padding: 32 }}>
            <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 19, margin: "0 0 8px" }}>Aucun accès</h1>
            <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 }}>Ton compte n'est rattaché à aucun serveur pour l'instant. Demande un nouveau code d'invitation, ou crée ton propre serveur.</p>
            <button onClick={() => supabase.auth.signOut()} style={{ ...secondaryBtn, width: "100%" }}>Se déconnecter</button>
          </div>
        </div>
        {toast && <Toast toast={toast} />}
      </Shell>
    );
  }

  if (profile.status === "pending") {
    return <Shell footer><PendingScreen onLogout={() => supabase.auth.signOut()} />{toast && <Toast toast={toast} />}</Shell>;
  }

  return (
    <Shell noAlert>
      <Workspace me={profile} session={session} onLogout={() => supabase.auth.signOut()} notify={notify} onProfileChanged={() => setReloadKey(k => k + 1)} />
      {toast && <Toast toast={toast} />}
    </Shell>
  );
}

/* ---------------- Acceptation d'une invitation reçue par email ---------------- */
function InviteAccept({ token, notify }) {
  const [info, setInfo] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [username, setUsername] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    callApi('/api/accept-invite', { action: 'check', token })
      .then(setInfo)
      .catch(e => setLoadErr(e.message));
  }, [token]);

  const goHome = () => { window.location.href = window.location.pathname; };

  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      await callApi('/api/accept-invite', { action: 'accept', token, username: username.trim(), displayName: displayName.trim(), password });
      const { error } = await supabase.auth.signInWithPassword({ email: info.email, password });
      if (error) throw new Error("Compte créé, mais la connexion a échoué. Connecte-toi manuellement.");
      window.history.replaceState({}, "", window.location.pathname);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div onKeyDown={(e) => { if (e.key === "Enter" && info) submit(); }} style={{ width: 400, maxWidth: "92vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><NotebookMark size={34} /></div>
        {!info && !loadErr && <div style={{ display: "grid", placeItems: "center", padding: 20 }}><Spinner /></div>}
        {loadErr && (
          <div style={{ textAlign: "center" }}>
            <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 20, margin: "0 0 10px" }}>Invitation indisponible</h1>
            <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 }}>{loadErr}</p>
            <button type="button" onClick={goHome} style={{ ...secondaryBtn, width: "100%" }}>Aller à la connexion</button>
          </div>
        )}
        {info && (
          <div>
            <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, textAlign: "center", margin: "0 0 4px" }}>Rejoindre « {info.serverName} »</h1>
            <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 20px" }}>Crée ton compte pour {info.email}</p>
            <Field label="Identifiant (pour te connecter)"><input autoFocus value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
            <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
            <Field label="Mot de passe (8 caractères minimum)">
              <div style={{ position: "relative" }}>
                <input type={showPw ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} style={{ ...inputStyle, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowPw(v => !v)} style={eyeBtn}>{showPw ? <I.EyeOff size={16} /> : <I.Eye size={16} />}</button>
              </div>
            </Field>
            {err && <div style={{ display: "flex", gap: 8, alignItems: "center", color: "#FF9A8F", fontSize: 13, margin: "4px 0 14px" }}><I.Alert size={14} /> {err}</div>}
            <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Création…" : "Créer mon compte"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

  const [joinCode, setJoinCode] = useState("");
  const [displayName, setDisplayName] = useState(meta.full_name || meta.name || "");
  const [username, setUsername] = useState(email.split("@")[0].replace(/[^A-Za-z0-9._-]/g, "").slice(0, 30));
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    callApi('/api/accept-invite', { action: 'my-invites' }, session)
      .then(r => { setInvites(r.invites || []); setStep((r.invites || []).length ? "invite" : "choose"); })
      .catch(() => setStep("choose"));
  }, []);

  const friendly = (e) => /duplicate|unique/i.test(e.message || "") ? "Cet identifiant est déjà pris, choisis-en un autre." : (e.message || "Erreur");
  const needIdentity = () => !username.trim() || !displayName.trim();

  const claim = async (inv) => {
    if (needIdentity()) { setErr("Renseigne ton nom et ton identifiant."); return; }
    setBusy(true); setErr("");
    try {
      await callApi('/api/accept-invite', { action: 'claim-invite', inviteId: inv.id, username: username.trim(), displayName: displayName.trim() }, session);
      notify("Bienvenue dans « " + inv.serverName + " » !");
      onDone();
    } catch (e) { setErr(friendly(e)); }
    setBusy(false);
  };
  const createServer = async () => {
    if (!serverName.trim() || needIdentity()) { setErr("Remplis tous les champs."); return; }
    setBusy(true); setErr("");
    try {
      const { data: server, error: sErr } = await supabase.from('servers').insert({ name: serverName.trim(), owner_id: user.id }).select().single();
      if (sErr) throw sErr;
      const { error: pErr } = await supabase.from('profiles').insert({ id: user.id, server_id: server.id, username: username.trim(), email, display_name: displayName.trim(), color: "#9B7EF5" });
      if (pErr) throw pErr;
      notify("Ton serveur est prêt !");
      onDone();
    } catch (e) { setErr(friendly(e)); }
    setBusy(false);
  };
  const joinServer = async () => {
    if (!joinCode.trim() || needIdentity()) { setErr("Remplis tous les champs."); return; }
    setBusy(true); setErr("");
    try {
      const { data: found, error: sErr } = await supabase.rpc('server_for_code', { p_code: joinCode });
      const server = Array.isArray(found) ? found[0] : found;
      if (sErr || !server) throw new Error("Code d'invitation introuvable.");
      const { error: pErr } = await supabase.from('profiles').insert({ id: user.id, server_id: server.id, username: username.trim(), email, display_name: displayName.trim(), color: "#5B9EF5" });
      if (pErr) throw pErr;
      onDone();
    } catch (e) { setErr(friendly(e)); }
    setBusy(false);
  };

  const cardStyle = { width: 400, maxWidth: "92vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" };
  const identityFields = (
    <div>
      <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
      <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
    </div>
  );
  const errBox = err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>;
  const wrap = (children) => (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}><NotebookMark size={32} /></div>
        {children}
        <button type="button" onClick={onLogout} style={{ ...secondaryBtn, width: "100%", marginTop: 14 }}>Se déconnecter</button>
      </div>
    </div>
  );

  if (step === "loading") return wrap(<div style={{ display: "grid", placeItems: "center", padding: 16 }}><Spinner /></div>);

  if (step === "invite") {
    const inv = invites[0];
    return wrap(<div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 20, textAlign: "center", margin: "0 0 6px" }}>Tu as été invité(e)</h1>
      <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13.5, margin: "0 0 18px" }}>Rejoins « {inv.serverName} » avec {email}.</p>
      {identityFields}{errBox}
      <button type="button" onClick={() => claim(inv)} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "…" : "Rejoindre " + inv.serverName}</button>
      <button type="button" onClick={() => setStep("choose")} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", marginTop: 12, width: "100%" }}>Plutôt créer ou rejoindre un autre serveur</button>
    </div>);
  }

  if (step === "choose") {
    const opt = (onClick, grad, icon, title, sub) => (
      <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 11, padding: "14px 16px", marginBottom: 10, cursor: "pointer" }}>
        <div style={{ width: 36, height: 36, borderRadius: 9, background: grad, display: "grid", placeItems: "center", flexShrink: 0 }}>{icon}</div>
        <div><div style={{ fontWeight: 600, fontSize: 14, color: "var(--text)" }}>{title}</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>{sub}</div></div>
      </button>
    );
    return wrap(<div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, textAlign: "center", margin: "0 0 4px" }}>Bienvenue{displayName ? ", " + displayName.split(" ")[0] : ""} !</h1>
      <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 20px" }}>Connecté avec {email}. Choisis ton espace.</p>
      {opt(() => { setErr(""); setStep("create"); }, "linear-gradient(135deg,var(--admin),#B08CFA)", <I.Shield size={17} color="#fff" />, "Créer un nouveau serveur", "Tu en seras l'administrateur")}
      {opt(() => { setErr(""); setStep("join"); }, "linear-gradient(135deg,var(--accent),var(--accent-2))", <I.UserPlus size={17} color="#fff" />, "Rejoindre un serveur existant", "Avec un code d'invitation")}
    </div>);
  }

  const isCreate = step === "create";
  return wrap(<div>
    <button onClick={() => { setStep("choose"); setErr(""); }} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 12 }}>← Retour</button>
    <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 19, margin: "0 0 16px" }}>{isCreate ? "Nouveau serveur" : "Rejoindre un serveur"}</h1>
    {isCreate
      ? <Field label="Nom du serveur"><input value={serverName} onChange={e => setServerName(e.target.value)} placeholder="ex. Famille Borget" style={inputStyle} /></Field>
      : <Field label="Code d'invitation"><input value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="ex. a1b2c3d4" style={inputStyle} /></Field>}
    {identityFields}{errBox}
    <button type="button" onClick={isCreate ? createServer : joinServer} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "…" : isCreate ? "Créer le serveur" : "Envoyer la demande"}</button>
  </div>);
}

/* ---------------- Mot de passe oublié / nouveau mot de passe ---------------- */
function ForgotPassword({ initial, onBack }) {
  const [identifier, setIdentifier] = useState(initial || "");
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");
  const send = async () => {
    if (!identifier.trim() || busy) return;
    setBusy(true); setErr("");
    try { await callApi('/api/forgot-password', { identifier: identifier.trim() }); setSent(true); }
    catch (e) { setErr(e.message); }
    setBusy(false);
  };
  return (
    <div onKeyDown={e => { if (e.key === "Enter") send(); }} style={{ width: "100%", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
      <button type="button" onClick={onBack} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 14 }}>← Retour</button>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, margin: "0 0 6px" }}>Mot de passe oublié</h1>
      {sent ? (
        <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6 }}>Si un compte correspond à « {identifier} », un email avec un lien vient de partir. Pense à regarder dans les spams. Le lien est valable peu de temps.</p>
      ) : (<div>
        <p style={{ color: "var(--text-dim)", fontSize: 13, margin: "0 0 18px" }}>Entre ton email ou ton identifiant : on t'envoie un lien pour choisir un nouveau mot de passe.</p>
        <Field label="Email ou identifiant"><input autoFocus value={identifier} onChange={e => setIdentifier(e.target.value)} style={inputStyle} /></Field>
        {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>}
        <button type="button" onClick={send} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Envoi…" : "Envoyer le lien"}</button>
      </div>)}
    </div>
  );
}
function ResetPassword({ onDone, notify }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (busy) return;
    if (pw.length < 8) { setErr("Le mot de passe doit faire au moins 8 caractères."); return; }
    if (pw !== pw2) { setErr("Les deux mots de passe sont différents."); return; }
    setBusy(true); setErr("");
    const { error } = await supabase.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    notify("Mot de passe modifié.");
    onDone();
  };
  return (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div onKeyDown={e => { if (e.key === "Enter") save(); }} style={{ width: 400, maxWidth: "92vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}><NotebookMark size={32} /></div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, textAlign: "center", margin: "0 0 18px" }}>Nouveau mot de passe</h1>
        <Field label="Nouveau mot de passe (8 caractères minimum)"><input autoFocus type="password" value={pw} onChange={e => setPw(e.target.value)} style={inputStyle} /></Field>
        <Field label="Confirme le mot de passe"><input type="password" value={pw2} onChange={e => setPw2(e.target.value)} style={inputStyle} /></Field>
        {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>}
        <button type="button" onClick={save} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "…" : "Enregistrer"}</button>
      </div>
    </div>
  );
}

/* ---------------- Login ---------------- */
function Login({ notify }) {
  const [identifier, setIdentifier] = useState(""); // username OU email
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState("login"); // login | forgot

  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      let email = identifier.trim();
      if (!email.includes("@")) {
        const { data } = await supabase.rpc('email_for_username', { p_username: identifier.trim() });
        if (!data) throw new Error("Identifiant ou mot de passe incorrect.");
        email = data;
      }
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw new Error("Identifiant ou mot de passe incorrect.");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const onKey = (e) => { if (e.key === "Enter") submit(); };
  if (mode === "forgot") return <ForgotPassword initial={identifier} onBack={() => setMode("login")} />;

  return (
    <div onKeyDown={onKey} style={{ width: "100%", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}><div style={{ width: 48, height: 48, borderRadius: 13, background: "linear-gradient(135deg,var(--accent),var(--accent-2))", display: "grid", placeItems: "center", boxShadow: "0 8px 20px rgba(91,110,245,.35)" }}><I.Lock size={20} color="#fff" /></div></div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, textAlign: "center", margin: "0 0 4px" }}>Content de vous revoir</h1>
      <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 22px" }}>Connecte-toi à ton serveur.</p>
      <Field label="Identifiant ou email"><input autoFocus value={identifier} onChange={e => setIdentifier(e.target.value)} style={inputStyle} /></Field>
      <Field label="Mot de passe">
        <div style={{ position: "relative" }}>
          <input type={showPw ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} style={{ ...inputStyle, paddingRight: 40 }} />
          <button type="button" onClick={() => setShowPw(s => !s)} style={eyeBtn}>{showPw ? <I.EyeOff size={16} /> : <I.Eye size={16} />}</button>
        </div>
      </Field>
      {err && <div style={{ display: "flex", gap: 8, alignItems: "center", color: "#FF9A8F", fontSize: 13, margin: "4px 0 14px" }}><I.Alert size={14} /> {err}</div>}
      <div style={{ textAlign: "right", margin: "-6px 0 12px" }}><button type="button" onClick={() => setMode("forgot")} style={{ background: "none", border: "none", color: "var(--accent-2)", fontSize: 12.5, cursor: "pointer", padding: 0 }}>Mot de passe oublié ?</button></div>
      <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Connexion…" : "Se connecter"}</button>
      <OrDivider />
      <GoogleButton label="Continuer avec Google" onError={setErr} />
    </div>
  );
}

/* ---------------- Création de compte : nouveau serveur ou rejoindre ---------------- */
function Signup({ notify }) {
  const [step, setStep] = useState("choose"); // choose | create | join | done-pending
  const [serverName, setServerName] = useState("");
  const [joinCode, setJoinCode] = useState("");
  const [username, setUsername] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const doSignupCore = async () => {
    const { data, error } = await supabase.auth.signUp({ email: email.trim(), password });
    if (error) throw error;
    let session = data.session;
    if (!session) {
      // Confirmation email activée côté Supabase : on tente une connexion directe
      // (fonctionne si la confirmation est désactivée malgré tout).
      const r = await supabase.auth.signInWithPassword({ email: email.trim(), password });
      if (r.error) throw new Error("Vérifie ta boîte mail pour confirmer ton compte, puis reviens te connecter.");
      session = r.data.session;
    }
    return session;
  };

  const createServer = async () => {
    if (!serverName.trim() || !username.trim() || !displayName.trim() || !email.trim() || !password) return;
    setBusy(true); setErr("");
    try {
      const session = await doSignupCore();
      const { data: server, error: sErr } = await supabase.from('servers').insert({ name: serverName.trim(), owner_id: session.user.id }).select().single();
      if (sErr) throw sErr;
      const { error: pErr } = await supabase.from('profiles').insert({
        id: session.user.id, server_id: server.id, username: username.trim(), email: email.trim(),
        display_name: displayName.trim(), color: "#9B7EF5",
      });
      if (pErr) throw pErr;
      notify("Ton serveur est prêt !");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const joinServer = async () => {
    if (!joinCode.trim() || !username.trim() || !displayName.trim() || !email.trim() || !password) return;
    setBusy(true); setErr("");
    try {
      const session = await doSignupCore();
      const { data: found, error: sErr } = await supabase.rpc('server_for_code', { p_code: joinCode });
      const server = Array.isArray(found) ? found[0] : found;
      if (sErr || !server) throw new Error("Code d'invitation introuvable.");
      const { error: pErr } = await supabase.from('profiles').insert({
        id: session.user.id, server_id: server.id, username: username.trim(), email: email.trim(),
        display_name: displayName.trim(), color: "#5B9EF5",
      });
      if (pErr) throw pErr;
      setStep("done-pending");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const cardStyle = { width: "100%", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" };

  if (step === "choose") {
    return (
      <div style={cardStyle}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, textAlign: "center", margin: "0 0 4px" }}>Créer un compte</h1>
        <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 22px" }}>Chaque serveur est un espace totalement séparé.</p>
        <GoogleButton label="S'inscrire avec Google" onError={setErr} />
        {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginTop: 10 }}>{err}</div>}
        <OrDivider />
        <button onClick={() => setStep("create")} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 11, padding: "14px 16px", marginBottom: 10, cursor: "pointer" }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: "linear-gradient(135deg,var(--admin),#B08CFA)", display: "grid", placeItems: "center", flexShrink: 0 }}><I.Shield size={17} color="#fff" /></div>
          <div><div style={{ fontWeight: 600, fontSize: 14, color: "var(--text)" }}>Créer un nouveau serveur</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Tu en seras l'administrateur</div></div>
        </button>
        <button onClick={() => setStep("join")} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 11, padding: "14px 16px", cursor: "pointer" }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: "linear-gradient(135deg,var(--accent),var(--accent-2))", display: "grid", placeItems: "center", flexShrink: 0 }}><I.UserPlus size={17} color="#fff" /></div>
          <div><div style={{ fontWeight: 600, fontSize: 14, color: "var(--text)" }}>Rejoindre un serveur existant</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Avec un code d'invitation</div></div>
        </button>
      </div>
    );
  }

  if (step === "done-pending") {
    return (
      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><I.Check size={34} color="#5FBF8B" /></div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 20, textAlign: "center", margin: "0 0 8px" }}>Demande envoyée</h1>
        <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6 }}>L'administrateur de ce serveur doit approuver ta demande. Tu peux patienter sur cette page, ou revenir plus tard en te connectant.</p>
      </div>
    );
  }

  const isCreate = step === "create";
  return (
    <div style={cardStyle}>
      <button onClick={() => { setStep("choose"); setErr(""); }} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 14 }}>← Retour</button>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 19, margin: "0 0 18px" }}>{isCreate ? "Nouveau serveur" : "Rejoindre un serveur"}</h1>
      {isCreate
        ? <Field label="Nom du serveur"><input value={serverName} onChange={e => setServerName(e.target.value)} placeholder="ex. Famille Borget" style={inputStyle} /></Field>
        : <Field label="Code d'invitation"><input value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="ex. a1b2c3d4" style={inputStyle} /></Field>}
      <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
      <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
      <Field label="Email"><input type="email" value={email} onChange={e => setEmail(e.target.value)} style={inputStyle} /></Field>
      <Field label="Mot de passe"><input type="password" value={password} onChange={e => setPassword(e.target.value)} style={inputStyle} /></Field>
      {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>}
      <button type="button" onClick={isCreate ? createServer : joinServer} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>
        {busy ? "…" : isCreate ? "Créer le serveur" : "Envoyer la demande"}
      </button>
    </div>
  );
}

function useLiveTable(table, setRows, shape) {
  const loadRef = useRef(null);
  useEffect(() => {
    let alive = true;
    const load = () => {
      let q = supabase.from(table).select('*');
      if (shape) q = shape(q);
      q.then(({ data }) => { if (alive) setRows(data || []); });
    };
    loadRef.current = load;
    load();
    const ch = supabase.channel(table + '-live').on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
    return () => { alive = false; supabase.removeChannel(ch); };
  }, []);
  return () => loadRef.current && loadRef.current();
}

}
function HomeView({ me, accounts, tasks, comments, onOpen, goTo }) {
  const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id));
  const late = mine.filter(t => t.due && dueInfo(t).late);
  const today = mine.filter(t => t.due && !dueInfo(t).late && daysUntil(t.due) === 0);
  const soon = mine.filter(t => t.due && daysUntil(t.due) > 0 && daysUntil(t.due) <= 3);
  const doing = mine.filter(t => t.doing && !(t.due && daysUntil(t.due) <= 3));
  const weekAgo = Date.now() - 7 * 86400000;
  const doneWeek = tasks.filter(t => t.done && t.done_at && new Date(t.done_at).getTime() >= weekAgo);
  const myDoneWeek = doneWeek.filter(t => assigneeIds(t).includes(me.id));
  const createdWeek = tasks.filter(t => t.created_at && new Date(t.created_at).getTime() >= weekAgo);
  const urgent = [...late, ...today, ...soon].sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
  const perPerson = new Map();
  for (const t of doneWeek) for (const id of assigneeIds(t)) perPerson.set(id, (perPerson.get(id) || 0) + 1);
  const top = [...perPerson.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, n]) => ({ user: accounts.find(a => a.id === id), n })).filter(x => x.user);
  const first = (me.display_name || "").split(" ")[0];
  const dateLabel = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

  const Row = ({ t }) => {
    const label = LABELS.find(l => l.id === t.label) || LABELS[0];
    const di = dueInfo(t);
    return (
      <button type="button" onClick={() => onOpen(t.id)} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `5px solid ${label.hex}`, borderRadius: 10, padding: "10px 14px", cursor: "pointer", color: "var(--text)" }}>
        <span style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis" }}>{t.title}</span>
        {t.due && <span style={{ fontSize: 12, color: di.late ? "#FF9A8F" : di.dleft === 0 ? "#FFC97A" : "var(--text-dim)", whiteSpace: "nowrap" }}>{di.label}</span>}
      </button>
    );
  };

  return (
    <div>
      <div style={{ marginBottom: 22 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Bonjour {first} 👋</h1>
        <p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0", textTransform: "capitalize" }}>{dateLabel}</p>
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 26 }}>
        <StatCard value={mine.length} label="À faire pour moi" hex="#5B9EF5" onClick={() => goTo("tasks")} />
        <StatCard value={late.length} label="En retard" hex="#FF6B5E" onClick={() => goTo("tasks")} />
        <StatCard value={today.length} label="Pour aujourd'hui" hex="#FFB648" onClick={() => goTo("calendar")} />
        <StatCard value={myDoneWeek.length} label="Terminées cette semaine" hex="#5FBF8B" />
      </div>

      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>À traiter en priorité</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>
        {urgent.length === 0 && <EmptyState text={mine.length ? "Rien d'urgent dans les 3 prochains jours. 🎉" : "Aucune tâche ne t'est assignée pour l'instant."} />}
        {urgent.map(t => <Row key={t.id} t={t} />)}
      </div>

      {doing.length > 0 && (<>
        <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>En cours</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>{doing.map(t => <Row key={t.id} t={t} />)}</div>
      </>)}

      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>Récap de la semaine</div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "16px 18px", display: "flex", gap: 28, flexWrap: "wrap", alignItems: "center" }}>
        <div><div style={{ fontFamily: "Fraunces, serif", fontSize: 24, fontWeight: 600 }}>{doneWeek.length}</div><div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>tâche(s) terminée(s) sur le serveur</div></div>
        <div><div style={{ fontFamily: "Fraunces, serif", fontSize: 24, fontWeight: 600 }}>{createdWeek.length}</div><div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>nouvelle(s) tâche(s)</div></div>
        {top.length > 0 && (
          <div style={{ marginLeft: "auto" }}>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginBottom: 6 }}>Les plus actifs</div>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>{top.map(({ user, n }) => <div key={user.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}><Avatar user={user} size={22} /> {user.display_name} <span style={{ color: "var(--text-dimmer)" }}>· {n}</span></div>)}</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   Mon profil : nom, couleur, mot de passe, suppression du compte
   ============================================================ */
function ProfileView({ me, session, isAdmin, myPerms, tasks, notify, onChanged, onLogout }) {
  const [displayName, setDisplayName] = useState(me.display_name || "");
  const [username, setUsername] = useState(me.username || "");
  const [color, setColor] = useState(me.color || LABELS[3].hex);
  const [busy, setBusy] = useState(false);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const [delBusy, setDelBusy] = useState(false);
  const dirty = displayName.trim() !== me.display_name || username.trim() !== me.username || color !== me.color;
  const preview = { ...me, display_name: displayName || me.display_name, color };
  const roleLabel = isAdmin ? "Administrateur" : (ROLES.find(r => r.id === me.role) || {}).label || "Membre";
  const mineOpen = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id)).length;
  const created = tasks.filter(t => t.created_by === me.id).length;

  const saveProfile = async () => {
    if (busy || !dirty) return;
    setBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'update-self', patch: { display_name: displayName.trim(), username: username.trim(), color } }, session);
      notify("Profil mis à jour.");
      onChanged();
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const savePassword = async () => {
    if (pwBusy) return;
    if (pw.length < 8) { notify("Le mot de passe doit faire au moins 8 caractères.", "err"); return; }
    if (pw !== pw2) { notify("Les deux mots de passe sont différents.", "err"); return; }
    setPwBusy(true);
    const { error } = await supabase.auth.updateUser({ password: pw });
    setPwBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setPw(""); setPw2("");
    notify("Mot de passe modifié.");
  };
  const deleteAccount = async () => {
    if (delBusy || confirmText.trim().toUpperCase() !== "SUPPRIMER") return;
    setDelBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'delete-self' }, session);
      await supabase.auth.signOut();
    } catch (e) { notify(e.message, "err"); setDelBusy(false); }
  };
  const card = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 14, padding: "20px 22px", marginBottom: 18, maxWidth: 560 };

  return (
    <div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: "0 0 20px" }}>Mon profil</h1>

      <div style={card}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
          <Avatar user={preview} size={52} />
          <div>
            <div style={{ fontWeight: 600, fontSize: 16 }}>{me.display_name}</div>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{roleLabel} · {me.email}</div>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 2 }}>{mineOpen} tâche(s) en cours · {created} créée(s)</div>
          </div>
        </div>
        <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
        <Field label="Identifiant (pour te connecter et être mentionné avec @)"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur du profil</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" onClick={() => setColor(l.hex)} title={l.name} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: color === l.hex ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <button type="button" onClick={saveProfile} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "10px 22px", opacity: busy || !dirty ? 0.5 : 1, cursor: dirty ? "pointer" : "default" }}>{busy ? "Enregistrement…" : "Enregistrer"}</button>
      </div>

      <NotificationPrefs me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <div style={card}>
        <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 12 }}>Changer de mot de passe</div>
        <Field label="Nouveau mot de passe (8 caractères minimum)"><input type="password" value={pw} onChange={e => setPw(e.target.value)} style={inputStyle} /></Field>
        <Field label="Confirme le mot de passe"><input type="password" value={pw2} onChange={e => setPw2(e.target.value)} onKeyDown={e => { if (e.key === "Enter") savePassword(); }} style={inputStyle} /></Field>
        <button type="button" onClick={savePassword} disabled={pwBusy || !pw} style={{ ...secondaryBtn, padding: "10px 22px", opacity: pwBusy || !pw ? 0.5 : 1 }}>{pwBusy ? "…" : "Modifier le mot de passe"}</button>
      </div>

      <div style={{ ...card, borderColor: "#4A2A28" }}>
        <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 6, color: "#FF9A8F" }}>Supprimer mon compte</div>
        {isAdmin ? (
          <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6, margin: 0 }}>Tu es l'administrateur de ce serveur. Pour pouvoir supprimer ton compte, transfère d'abord l'administration à quelqu'un d'autre (onglet Admin → « Transférer l'administration »).</p>
        ) : (<>
          <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6, margin: "0 0 12px" }}>Cette action est définitive : ton compte et ton accès au serveur disparaissent. Les tâches que tu as créées restent sur le serveur.</p>
          <Field label="Tape SUPPRIMER pour confirmer"><input value={confirmText} onChange={e => setConfirmText(e.target.value)} style={inputStyle} /></Field>
          <button type="button" onClick={deleteAccount} disabled={delBusy || confirmText.trim().toUpperCase() !== "SUPPRIMER"} style={{ ...secondaryBtn, padding: "10px 22px", color: "#FF9A8F", borderColor: "#6A3532", opacity: confirmText.trim().toUpperCase() === "SUPPRIMER" ? 1 : 0.5 }}>{delBusy ? "Suppression…" : "Supprimer définitivement mon compte"}</button>
        </>)}
      </div>
    </div>
  );
}

/* ---------------- Notifications par email : une case par type ---------------- */
const NOTIF_OPTIONS = [
  { key: "notify_assigned", label: "Quand une tâche m'est assignée" },
  { key: "notify_soon", label: "Quand il me reste peu de temps avant l'heure limite d'une tâche" },
  { key: "notify_overdue", label: "Quand une de mes tâches est en retard" },
  { key: "notify_digest", label: "Chaque matin : récapitulatif d'aujourd'hui et de demain" },
];
const LEAD_OPTIONS = [{ v: 15, l: "15 minutes" }, { v: 30, l: "30 minutes" }, { v: 60, l: "1 heure" }, { v: 120, l: "2 heures" }, { v: 240, l: "4 heures" }, { v: 720, l: "12 heures" }, { v: 1440, l: "1 jour" }];
function NotificationPrefs({ me, session, notify, onChanged, card }) {
  const read = () => ({ notify_assigned: me.notify_assigned !== false, notify_soon: me.notify_soon !== false, notify_overdue: me.notify_overdue !== false, notify_digest: me.notify_digest !== false, remind_lead_minutes: me.remind_lead_minutes || 120 });
  const [prefs, setPrefs] = useState(read);
  const [busy, setBusy] = useState(false);
  const save = async (patch) => {
    const prev = prefs;
    setPrefs(p => ({ ...p, ...patch })); setBusy(true);
    try { await callApi('/api/manage-account', { action: 'update-self', patch }, session); notify("Préférences enregistrées."); onChanged(); }
    catch (e) { setPrefs(prev); notify(e.message, "err"); }
    setBusy(false);
  };
  return (
    <div style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}><I.Mail size={16} /> Notifications par email</div>
      <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 12px" }}>Envoyées à {me.email}. Les changements sont enregistrés tout de suite.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {NOTIF_OPTIONS.map(o => (
          <label key={o.key} style={{ display: "flex", alignItems: "flex-start", gap: 10, fontSize: 13.5, cursor: "pointer", padding: "6px 0" }}>
            <input type="checkbox" checked={prefs[o.key]} disabled={busy} onChange={e => save({ [o.key]: e.target.checked })} style={{ width: 16, height: 16, marginTop: 2, accentColor: "var(--accent)", flexShrink: 0 }} />
            <span>{o.label}</span>
          </label>
        ))}
      </div>
      {prefs.notify_soon && (
        <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontSize: 13.5 }}>
          <span style={{ color: "var(--text-dim)" }}>Me prévenir</span>
          <select value={prefs.remind_lead_minutes} disabled={busy} onChange={e => save({ remind_lead_minutes: Number(e.target.value) })} style={{ ...inputStyle, width: "auto", padding: "7px 10px" }}>
            {LEAD_OPTIONS.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
          </select>
          <span style={{ color: "var(--text-dim)" }}>avant l'heure limite</span>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Tasks
   ============================================================ */
const statusOf = (t) => t.done ? "done" : t.doing ? "doing" : "todo";
const COLUMNS = [
  { id: "todo", label: "À faire", hex: "#9098A8" },
  { id: "doing", label: "En cours", hex: "#FFB648" },
  { id: "done", label: "Terminé", hex: "#5FBF8B" },
];

function TasksView({ me, session, isAdmin, myPerms, accounts, tasks, trashed, templates, comments, attachments, onOpen, notify }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showTrash, setShowTrash] = useState(false);
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("priority");
  const [filterLabel, setFilterLabel] = useState(null);
  const [filterDone, setFilterDone] = useState("open");
  const [filterMine, setFilterMine] = useState(false);
  const [view, setView] = useState(() => { try { return localStorage.getItem("carnet-view") === "kanban" ? "kanban" : "list"; } catch (_) { return "list"; } });
  const changeView = (v) => { setView(v); try { localStorage.setItem("carnet-view", v); } catch (_) {} };

  const visible = useMemo(() => {
    let list = tasks.filter(t => {
      if (view === "list") {
        if (filterDone === "open" && t.done) return false;
        if (filterDone === "done" && !t.done) return false;
      }
      if (filterLabel && t.label !== filterLabel) return false;
      if (filterMine && !assigneeIds(t).includes(me.id)) return false;
      if (query && ![t.title, t.notes || "", ...(t.tags || [])].join(" ").toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
    list.sort((a, b) => {
      if (sortBy === "priority") return b.priority - a.priority || dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "due") return dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "title") return a.title.localeCompare(b.title, "fr");
      return 0;
    });
    return list;
  }, [tasks, query, sortBy, filterLabel, filterDone, filterMine, view, me.id]);

  const canEditTask = (t) => isAdmin || myPerms.editAnyTask || (t.created_by === me.id && myPerms.editOwnTask);
  const tellAssignees = async (taskId, userIds) => {
    if (!userIds.length) return 0;
    try { const r = await callApi('/api/notify-task', { taskId, userIds }, session); return r.sent || 0; }
    catch (_) { return 0; }
  };
  const saveTemplate = async (draft, name) => {
    const { error } = await supabase.from('task_templates').insert({
      server_id: me.server_id, created_by: me.id, name: name.slice(0, 80), title: draft.title, notes: draft.notes || "",
      label: draft.label, priority: draft.priority, tags: draft.tags || [], recurrence: draft.recurrence || null,
      subtasks: (draft.subtasks || []).map(x => ({ ...x, done: false })),
    });
    return error ? error.message : null;
  };
  const saveTask = async (draft) => {
    const { saveAsTemplate, ...data } = draft;
    data.assignee = (data.assignees || [])[0] || null;
    let message = "";
    if (data.id) {
      const { id, ...rest } = data;
      const { error } = await supabase.from('tasks').update(rest).eq('id', id);
      if (error) { notify(error.message, "err"); return; }
      const added = (rest.assignees || []).filter(x => x !== me.id && !(editing ? assigneeIds(editing) : []).includes(x));
      const sent = await tellAssignees(id, added);
      message = sent ? "Tâche mise à jour · email envoyé." : "Tâche mise à jour.";
    } else {
      const { data: created, error } = await supabase.from('tasks').insert({ ...data, done: false, created_by: me.id, server_id: me.server_id }).select().single();
      if (error) { notify(error.message, "err"); return; }
      const sent = created ? await tellAssignees(created.id, (data.assignees || []).filter(x => x !== me.id)) : 0;
      message = sent ? "Tâche créée · email envoyé." : "Tâche créée.";
    }
    if (saveAsTemplate) {
      const err = await saveTemplate(data, saveAsTemplate);
      message += err ? " (Modèle non enregistré : " + err + ")" : " Modèle enregistré.";
    }
    notify(message);
    setShowForm(false); setEditing(null);
  };
  const deleteTemplate = async (id) => {
    const { error } = await supabase.from('task_templates').delete().eq('id', id);
    notify(error ? error.message : "Modèle supprimé.", error ? "err" : "ok");
  };

  const restoreTask = async (id) => {
    const { error } = await supabase.rpc('restore_task', { p_id: id });
    notify(error ? error.message : "Tâche restaurée.", error ? "err" : "ok");
  };
  const removeTask = async (t) => {
    const { error } = await supabase.rpc('trash_task', { p_id: t.id });
    if (error) { notify(error.message, "err"); return; }
    notify("Tâche placée dans la corbeille.", "ok", { label: "Annuler", onClick: () => restoreTask(t.id) });
  };
  const purgeTask = async (t) => {
    const paths = attachments.filter(a => a.task_id === t.id).map(a => a.path);
    const { error } = await supabase.from('tasks').delete().eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (paths.length) await supabase.storage.from('task-files').remove(paths);
    notify("Tâche supprimée définitivement.");
  };

  const spawnNext = async (t) => {
    const next = nextOccurrence(t.due, t.recurrence);
    const ids = assigneeIds(t);
    const { error } = await supabase.from('tasks').insert({
      title: t.title, notes: t.notes, label: t.label, priority: t.priority, due: next, due_time: t.due_time || null, assignee: ids[0] || null, assignees: ids,
      tags: t.tags || [], subtasks: (t.subtasks || []).map(x => ({ ...x, done: false })), recurrence: t.recurrence,
      done: false, created_by: t.created_by, server_id: me.server_id,
    });
    return { next, error };
  };
  const setStatus = async (t, status) => {
    if (statusOf(t) === status) return;
    const patch = status === "done" ? { done: true } : status === "doing" ? { done: false, doing: true } : { done: false, doing: false };
    const { error } = await supabase.from('tasks').update(patch).eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (status === "done" && !t.done && t.recurrence) {
      const { next, error: e2 } = await spawnNext(t);
      notify(e2 ? "Terminée, mais la prochaine occurrence n'a pas pu être créée." : `Terminée · prochaine échéance : ${formatDue(next, daysUntil(next))}.`, e2 ? "err" : "ok");
    }
  };
  const toggleDone = (t) => setStatus(t, t.done ? "todo" : "done");

  const counts = { open: tasks.filter(t => !t.done).length, late: tasks.filter(t => !t.done && t.due && dueInfo(t).late).length };
  const viewBtn = (id, Icon, title) => (
    <button key={id} type="button" title={title} onClick={() => changeView(id)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6, padding: "8px 10px", background: view === id ? "var(--panel-2)" : "var(--bg-2)", color: view === id ? "var(--text)" : "var(--text-dim)", borderColor: view === id ? "var(--accent)" : "var(--border-soft)" }}><Icon size={14} /> <span className="hide-mobile">{title}</span></button>
  );
  const openEdit = (t) => { setEditing(t); setShowForm(true); };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Tâches</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>{counts.open} en cours{counts.late > 0 && <span style={{ color: "#FF9A8F" }}> · {counts.late} en retard</span>}</p></div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {trashed.length > 0 && <button type="button" onClick={() => setShowTrash(true)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6 }}><I.Trash size={14} /> Corbeille ({trashed.length})</button>}
          <button onClick={() => { setEditing(null); setShowForm(true); }} style={{ display: (isAdmin || myPerms.createTasks) ? "flex" : "none", alignItems: "center", gap: 7, ...primaryBtn, padding: "10px 16px", width: "auto" }}><I.Plus size={16} /> Nouvelle tâche</button>
        </div>
      </div>
      <div className="task-toolbar" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 6 }}>{viewBtn("list", I.List, "Liste")}{viewBtn("kanban", I.Columns, "Kanban")}</div>
        <div style={{ position: "relative", flex: "1 1 220px", minWidth: 180 }}><I.Search size={14} style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)" }} /><input value={query} onChange={e => setQuery(e.target.value)} placeholder="Rechercher (titre, notes, #étiquette)…" style={{ ...inputStyle, paddingLeft: 32, background: "var(--bg-2)" }} /></div>
        <SelectPill icon={I.Sort} value={sortBy} onChange={setSortBy} options={[{ value: "priority", label: "Trier : priorité" }, { value: "due", label: "Trier : échéance" }, { value: "title", label: "Trier : titre" }]} />
        {view === "list" && <SelectPill icon={I.Filter} value={filterDone} onChange={setFilterDone} options={[{ value: "open", label: "À faire" }, { value: "done", label: "Terminées" }, { value: "all", label: "Toutes" }]} />}
        <button onClick={() => setFilterMine(m => !m)} style={{ ...chipBtn, background: filterMine ? "var(--panel-2)" : "var(--bg-2)", color: filterMine ? "var(--text)" : "var(--text-dim)", borderColor: filterMine ? "var(--accent)" : "var(--border-soft)" }}>Assignées à moi</button>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto" }}>{LABELS.map(l => (<button key={l.id} title={l.name} onClick={() => setFilterLabel(f => f === l.id ? null : l.id)} style={{ width: 22, height: 22, borderRadius: "50%", background: l.hex, cursor: "pointer", border: filterLabel === l.id ? "2px solid var(--text)" : "2px solid transparent" }} />))}</div>
      </div>

      {view === "list" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {visible.length === 0 && <EmptyState text="Aucune tâche ici." />}
          {visible.map(t => (<TaskCard key={t.id} task={t} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} commentCount={comments.filter(c => c.task_id === t.id).length} attachCount={attachments.filter(a => a.task_id === t.id).length} onOpen={() => onOpen(t.id)} onTagClick={setQuery} onToggle={() => toggleDone(t)} onEdit={() => openEdit(t)} onDelete={() => removeTask(t)} />))}
        </div>
      ) : (
        <KanbanBoard tasks={visible} accounts={accounts} canEditTask={canEditTask} onOpen={onOpen} onMove={setStatus} />
      )}

      {showForm && <TaskForm initial={editing} meId={me.id} accounts={accounts} templates={templates} onDeleteTemplate={deleteTemplate} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={saveTask} />}
      {showTrash && <TrashModal trashed={trashed} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} onRestore={restoreTask} onPurge={purgeTask} onClose={() => setShowTrash(false)} />}
    </div>
  );
}
function SelectPill({ icon: Icon, value, onChange, options }) {
  return (<div style={{ position: "relative" }}><Icon size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /><select value={value} onChange={e => onChange(e.target.value)} style={{ ...chipBtn, paddingLeft: 28, paddingRight: 26, appearance: "none", cursor: "pointer" }}>{options.map(o => <option key={o.value} value={o.value} style={{ background: "var(--bg-2)" }}>{o.label}</option>)}</select><I.Chevron size={12} style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /></div>);
}

/* ---------------- Vue Kanban ---------------- */
function KanbanBoard({ tasks, accounts, canEditTask, onOpen, onMove }) {
  const [overCol, setOverCol] = useState(null);
  const byCol = { todo: [], doing: [], done: [] };
  for (const t of tasks) byCol[statusOf(t)].push(t);
  byCol.done.sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  const DONE_LIMIT = 15;
  const drop = (e, col) => {
    e.preventDefault(); setOverCol(null);
    const id = e.dataTransfer.getData("text/plain");
    const t = tasks.find(x => x.id === id);
    if (t) onMove(t, col);
  };
  return (
    <div className="kanban" style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 14, alignItems: "start" }}>
      {COLUMNS.map((col, ci) => {
        const list = col.id === "done" ? byCol.done.slice(0, DONE_LIMIT) : byCol[col.id];
        return (
          <div key={col.id} onDragOver={e => { e.preventDefault(); if (overCol !== col.id) setOverCol(col.id); }} onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setOverCol(null); }} onDrop={e => drop(e, col.id)}
            style={{ background: overCol === col.id ? "#5B6EF514" : "var(--bg-2)", border: `1px solid ${overCol === col.id ? "var(--accent)" : "var(--border)"}`, borderRadius: 14, padding: 10, minHeight: 140 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 6px 10px", fontSize: 13, fontWeight: 700 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: col.hex }} /> {col.label}
              <span style={{ color: "var(--text-dimmer)", fontWeight: 500 }}>{byCol[col.id].length}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {list.length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", textAlign: "center", padding: "18px 0" }}>Glisse une tâche ici</div>}
              {list.map(t => {
                const label = LABELS.find(l => l.id === t.label) || LABELS[0];
                const prio = PRIORITIES.find(p => p.id === t.priority) || PRIORITIES[1];
                const di = dueInfo(t);
                const late = Boolean(di && di.late);
                const people = assigneeIds(t).map(id => accounts.find(a => a.id === id)).filter(Boolean);
                const editable = canEditTask(t);
                return (
                  <div key={t.id} draggable={editable} onDragStart={e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; }}
                    style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `4px solid ${label.hex}`, borderRadius: 10, padding: "10px 12px", cursor: editable ? "grab" : "default", opacity: t.done ? 0.65 : 1 }}>
                    <div onClick={() => onOpen(t.id)} style={{ fontSize: 13.5, fontWeight: 600, cursor: "pointer", wordBreak: "break-word", textDecoration: t.done ? "line-through" : "none" }}>{t.title}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11, fontWeight: 600, color: prio.hex }}><I.Flag size={10} /> {prio.label}</span>
                      {t.due && <span style={{ fontSize: 11.5, color: late ? "#FF9A8F" : "var(--text-dim)" }}>{di.label}</span>}
                      {(t.subtasks || []).length > 0 && <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>☑ {t.subtasks.filter(x => x.done).length}/{t.subtasks.length}</span>}
                      <span style={{ marginLeft: "auto" }}><AvatarStack users={people} size={20} max={3} /></span>
                    </div>
                    {editable && (
                      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                        {ci > 0 && <button type="button" onClick={() => onMove(t, COLUMNS[ci - 1].id)} style={{ ...iconBtn, padding: "2px 8px", fontSize: 11 }} title={"Déplacer vers « " + COLUMNS[ci - 1].label + " »"}>←</button>}
                        {ci < 2 && <button type="button" onClick={() => onMove(t, COLUMNS[ci + 1].id)} style={{ ...iconBtn, padding: "2px 8px", fontSize: 11, marginLeft: ci === 0 ? "auto" : 0 }} title={"Déplacer vers « " + COLUMNS[ci + 1].label + " »"}>→</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              {col.id === "done" && byCol.done.length > DONE_LIMIT && <div style={{ fontSize: 12, color: "var(--text-dimmer)", textAlign: "center" }}>+ {byCol.done.length - DONE_LIMIT} plus ancienne(s) — voir la vue Liste</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Corbeille ---------------- */
function TrashModal({ trashed, accounts, me, isAdmin, myPerms, onRestore, onPurge, onClose }) {
  const can = (t) => isAdmin || me.role === "moderator" || myPerms.deleteAnyTask || (t.created_by === me.id && myPerms.deleteOwnTask);
  const [confirmId, setConfirmId] = useState(null);
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ ...modalStyle, width: 520 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>Corbeille</h2><button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <p style={{ fontSize: 12.5, color: "var(--text-dimmer)", margin: "0 0 16px" }}>Les tâches supprimées sont conservées 30 jours, puis effacées automatiquement.</p>
        {trashed.length === 0 && <EmptyState text="La corbeille est vide." />}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {trashed.map(t => {
            const who = accounts.find(a => a.id === t.deleted_by);
            const daysLeft = Math.max(0, 30 - Math.floor((Date.now() - new Date(t.deleted_at).getTime()) / 86400000));
            return (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 10, padding: "10px 12px", flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 150 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, wordBreak: "break-word" }}>{t.title}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>Supprimée {who ? "par " + who.display_name + " " : ""}· encore {daysLeft} j</div>
                </div>
                {can(t) ? (confirmId === t.id ? (<>
                  <button type="button" onClick={() => { setConfirmId(null); onPurge(t); }} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, color: "#FF9A8F" }}>Confirmer</button>
                  <button type="button" onClick={() => setConfirmId(null)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12 }}>Non</button>
                </>) : (<>
                  <button type="button" onClick={() => onRestore(t.id)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 5 }}><I.Undo size={12} /> Restaurer</button>
                  <button type="button" onClick={() => setConfirmId(t.id)} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer définitivement"><I.Trash size={13} /></button>
                </>)) : <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>Pas les droits</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function TaskCard({ task, accounts, me, isAdmin, myPerms, commentCount, attachCount, onOpen, onTagClick, onToggle, onEdit, onDelete }) {
  const label = LABELS.find(l => l.id === task.label) || LABELS[0];
  const prio = PRIORITIES.find(p => p.id === task.priority) || PRIORITIES[1];
  const people = assigneeIds(task).map(id => accounts.find(a => a.id === id)).filter(Boolean);
  const di = dueInfo(task);
  const late = Boolean(di && di.late);
  const soon = Boolean(di && di.soon);
  const own = task.created_by === me.id;
  const canEdit = isAdmin || myPerms.editAnyTask || (own && myPerms.editOwnTask);
  const canDelete = isAdmin || myPerms.deleteAnyTask || (own && myPerms.deleteOwnTask);
  const hasMeta = (task.tags || []).length > 0 || (task.subtasks || []).length > 0 || task.recurrence || commentCount > 0 || attachCount > 0 || task.doing;
  return (
    <div className="fade-in" style={{ display: "flex", alignItems: "stretch", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden", opacity: task.done ? 0.55 : 1 }}>
      <div style={{ width: 5, background: label.hex, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 14, padding: "13px 16px", flexWrap: "wrap" }}>
        <button onClick={onToggle} style={{ background: "none", border: "none", cursor: "pointer", color: task.done ? "#5FBF8B" : "var(--text-dimmer)", flexShrink: 0 }}>{task.done ? <I.Check size={20} /> : <I.Circle size={20} />}</button>
        <div style={{ flex: 1, minWidth: 140 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, flexWrap: "wrap" }}><span onClick={onOpen} style={{ cursor: "pointer", fontSize: 14.5, fontWeight: 600, textDecoration: task.done ? "line-through" : "none", color: task.done ? "#7A8190" : "var(--text)" }}>{task.title}</span><span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600, color: prio.hex, background: `${prio.hex}1A`, padding: "2px 7px", borderRadius: 6 }}><I.Flag size={10} /> {prio.label}</span></div>
          {task.notes && <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginTop: 3 }}>{task.notes}</div>}
          {hasMeta && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
              {task.doing && !task.done && <span style={{ fontSize: 11, fontWeight: 600, color: "#FFB648", background: "#FFB6481A", padding: "1px 7px", borderRadius: 6 }}>En cours</span>}
              {(task.tags || []).map(tag => <button key={tag} type="button" onClick={() => onTagClick(tag)} style={{ background: "var(--bg-2)", border: "1px solid var(--border-soft)", color: "var(--text-dim)", fontSize: 11, padding: "1px 7px", borderRadius: 6, cursor: "pointer" }}>#{tag}</button>)}
              {(task.subtasks || []).length > 0 && <span onClick={onOpen} style={{ cursor: "pointer", fontSize: 11.5, color: "var(--text-dim)" }}>☑ {(task.subtasks || []).filter(x => x.done).length}/{(task.subtasks || []).length}</span>}
              {task.recurrence && <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>↻ {(RECURRENCES.find(r => r.value === task.recurrence) || {}).label}</span>}
              {commentCount > 0 && <span onClick={onOpen} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--text-dim)" }}><I.Message size={11} /> {commentCount}</span>}
              {attachCount > 0 && <span onClick={onOpen} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--text-dim)" }}><I.Paperclip size={11} /> {attachCount}</span>}
            </div>
          )}
        </div>
        {task.due && (<div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, flexShrink: 0, color: late ? "#FF9A8F" : soon ? "#FFC97A" : "var(--text-dim)" }}>{late ? <I.Alert size={13} /> : di.timed ? <I.Clock size={13} /> : <I.Calendar size={13} />}{di.label}</div>)}
        {people.length > 0 && <AvatarStack users={people} size={26} max={3} />}
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {canEdit && <button onClick={onEdit} style={iconBtn} title="Modifier"><I.Settings size={14} /></button>}
          {canDelete && <button onClick={onDelete} style={{ ...iconBtn, color: "#FF9A8F" }} title="Mettre à la corbeille"><I.Trash size={14} /></button>}
        </div>
      </div>
    </div>
  );
}
function TaskForm({ initial, meId, accounts, templates, onDeleteTemplate, onCancel, onSave }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [label, setLabel] = useState(initial?.label || LABELS[0].id);
  const [priority, setPriority] = useState(initial?.priority || 2);
  const [due, setDue] = useState(initial?.due || "");
  const [timed, setTimed] = useState(Boolean(initial?.due_time));
  const [dueTime, setDueTime] = useState(initial?.due_time ? hhmm(initial.due_time) : "");
  const [assignees, setAssignees] = useState(() => initial ? assigneeIds(initial) : (accounts.some(a => a.id === meId) ? [meId] : []));
  const [tagsText, setTagsText] = useState((initial?.tags || []).join(", "));
  const [subtasks, setSubtasks] = useState(initial?.subtasks || []);
  const [newSub, setNewSub] = useState("");
  const [recurrence, setRecurrence] = useState(initial?.recurrence || "");
  const [tplId, setTplId] = useState("");
  const [asTemplate, setAsTemplate] = useState(false);
  const [tplName, setTplName] = useState("");
  const toggleAssignee = (id) => setAssignees(l => l.includes(id) ? l.filter(x => x !== id) : [...l, id]);
  const addSub = () => { const v = newSub.trim(); if (!v) return; setSubtasks(l => [...l, { id: uid(), text: v.slice(0, 120), done: false }]); setNewSub(""); };
  const applyTemplate = (id) => {
    setTplId(id);
    const t = (templates || []).find(x => x.id === id);
    if (!t) return;
    setTitle(t.title); setNotes(t.notes || ""); setLabel(t.label || LABELS[0].id); setPriority(t.priority || 2);
    setTagsText((t.tags || []).join(", ")); setRecurrence(t.recurrence || "");
    setSubtasks((t.subtasks || []).map(x => ({ ...x, id: uid(), done: false })));
  };
  const submit = () => {
    if (!title.trim()) return;
    const pendingSub = newSub.trim() ? [...subtasks, { id: uid(), text: newSub.trim().slice(0, 120), done: false }] : subtasks;
    onSave({
      ...(initial?.id ? { id: initial.id } : {}),
      title: title.trim(), notes: notes.trim(), label, priority: Number(priority), due: due || null, due_time: due && timed && dueTime ? dueTime : null,
      assignees, assignee: assignees[0] || null,
      tags: parseTags(tagsText), subtasks: pendingSub, recurrence: recurrence || null,
      saveAsTemplate: asTemplate ? (tplName.trim() || title.trim()) : null,
    });
  };
  const selectedTpl = (templates || []).find(x => x.id === tplId);
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-card" style={{ ...modalStyle, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier la tâche" : "Nouvelle tâche"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        {!initial && (templates || []).length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <select value={tplId} onChange={e => applyTemplate(e.target.value)} style={inputStyle}>
              <option value="">Partir d'un modèle…</option>
              {templates.map(t => <option key={t.id} value={t.id} style={{ background: "var(--bg-2)" }}>{t.name}</option>)}
            </select>
            {selectedTpl && <button type="button" onClick={() => { onDeleteTemplate(selectedTpl.id); setTplId(""); }} style={{ background: "none", border: "none", color: "#FF9A8F", fontSize: 12, cursor: "pointer", padding: "6px 0 0" }}>Supprimer le modèle « {selectedTpl.name} »</button>}
          </div>
        )}
        <Field label="Titre"><input autoFocus value={title} onChange={e => setTitle(e.target.value)} style={inputStyle} /></Field>
        <Field label="Notes (optionnel)"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}><Field label="Échéance"><input type="date" value={due} onChange={e => setDue(e.target.value)} style={inputStyle} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Répétition"><select value={recurrence} onChange={e => setRecurrence(e.target.value)} style={inputStyle}>{RECURRENCES.map(r => <option key={r.value} value={r.value} style={{ background: "var(--bg-2)" }}>{r.label}</option>)}</select></Field></div>
        </div>
        {due && (
          <div style={{ marginBottom: 14, marginTop: -4 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              {[[false, "Toute la journée"], [true, "À une heure précise"]].map(([val, lab]) => (
                <button key={lab} type="button" onClick={() => { setTimed(val); if (val && !dueTime) setDueTime("18:00"); }} style={{ padding: "7px 12px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${timed === val ? "var(--accent)" : "var(--border-soft)"}`, background: timed === val ? "#5B6EF51A" : "transparent", color: timed === val ? "var(--accent-2)" : "var(--text-dim)" }}>{lab}</button>
              ))}
              {timed && <input type="time" value={dueTime} onChange={e => setDueTime(e.target.value)} aria-label="Heure limite" style={{ ...inputStyle, width: 120 }} />}
            </div>
            <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>{timed ? "Les personnes assignées sont prévenues par email avant l'heure limite." : "La tâche est à terminer avant la fin de la journée."}</div>
          </div>
        )}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Assignée à {assignees.length > 1 ? `(${assignees.length} personnes)` : ""}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {accounts.map(a => { const on = assignees.includes(a.id); return (
              <button key={a.id} type="button" onClick={() => toggleAssignee(a.id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "5px 11px 5px 6px", borderRadius: 20, cursor: "pointer", fontSize: 13, border: `1.5px solid ${on ? a.color : "var(--border-soft)"}`, background: on ? `${a.color}22` : "transparent", color: on ? "var(--text)" : "var(--text-dim)" }}><Avatar user={a} size={20} /> {a.display_name}</button>
            ); })}
          </div>
        </div>
        <Field label="Étiquettes (séparées par des virgules)"><input value={tagsText} onChange={e => setTagsText(e.target.value)} placeholder="maison, courses" style={inputStyle} /></Field>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Sous-tâches</div>
          {subtasks.map(st => (
            <div key={st.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
