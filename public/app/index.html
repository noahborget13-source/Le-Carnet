function EventForm({ me, day, onCancel, onSaved, notify }) {
  const [title, setTitle] = useState("");
  const [start, setStart] = useState(day);
  const [end, setEnd] = useState(day);
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (busy) return;
    if (!title.trim()) { notify("Donnez un nom à l'événement.", "err"); return; }
    if (!start || !end || end < start) { notify("Le dernier jour doit être après le premier.", "err"); return; }
    setBusy(true);
    const { error } = await supabase.from("team_events").insert({ server_id: me.server_id, created_by: me.id, title: title.trim().slice(0, 120), start_date: start, end_date: end });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    notify("Événement ajouté."); onSaved();
  };
  return (
    <div style={overlayStyle} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) onCancel(); }}>
      <div className="modal-card" style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>Événement d'équipe</h2><button type="button" onClick={onCancel} aria-label="Fermer" style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <Field label="Nom"><input autoFocus value={title} onChange={e => setTitle(e.target.value)} maxLength={120} style={inputStyle} aria-label="Nom de l'événement" placeholder="Repas d'équipe, séminaire, fermeture…" /></Field>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field label="Premier jour"><input type="date" value={start} onChange={e => { setStart(e.target.value); if (e.target.value > end) setEnd(e.target.value); }} style={inputStyle} aria-label="Premier jour" /></Field></div>
          <div style={{ flex: 1 }}><Field label="Dernier jour"><input type="date" value={end} min={start} onChange={e => setEnd(e.target.value)} style={inputStyle} aria-label="Dernier jour de l'événement" /></Field></div>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 6 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={save} disabled={busy} style={{ ...primaryBtn, flex: 1, opacity: busy ? 0.6 : 1 }}>{busy ? "…" : "Ajouter"}</button></div>
      </div>
    </div>
  );
}

/* ---------------- Réunions : trouver un créneau commun ---------------- */
function SlotFinder({ ids, accounts, tasks, durationMin, ignoreMeetingId, onPick }) {
  const [state, setState] = useState(null); // null | "loading" | {slots}
  const find = async () => {
    setState("loading");
    const now = Date.now(), today = parisDay(now), until = parisInstant(shiftDay(today, 15));
    const { data } = await supabase.rpc("busy_for", { p_users: ids, p_from: new Date(now).toISOString(), p_to: new Date(until).toISOString(), p_ignore_meeting: ignoreMeetingId || null });
    const busy = data || [], slots = [];
    for (let i = 0; i < 15 && slots.length < 6; i++) {
      const day = shiftDay(today, i);
      if (isoWd(day) > 5) continue;
      for (let m = 8 * 60; m + durationMin <= 20 * 60 && slots.length < 6; m += 30) {
        const hm = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
        const s = parisInstant(day, hm), e = s + durationMin * 60000;
        if (s < now + 15 * 60000) continue;
        const free = ids.every(id => { const u = accounts.find(a => a.id === id); return !u || conflictsC({ s, e, user: u, busy: busy.filter(b => b.user_id === id) }).length === 0; });
        if (free) slots.push({ day, from: hm, to: parisHM(e), s, e });
      }
    }
    setState({ slots });
  };
  return (
    <div data-testid="slot-finder" style={{ marginBottom: 14 }}>
      <button type="button" onClick={find} disabled={state === "loading"} style={{ ...chipBtn, color: "var(--accent-2)" }}>🔎 {state === "loading" ? "Recherche…" : "Trouver un créneau où tout le monde est libre"}</button>
      {state && state !== "loading" && (
        <div style={{ marginTop: 10 }}>
          {state.slots.length === 0
            ? <div style={{ fontSize: 13, color: "var(--text-dim)" }}>Aucun créneau libre pour tous dans les 15 prochains jours (heures ouvrées). Essayez avec moins de participants ou une durée plus courte.</div>
            : <>
              <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginBottom: 6 }}>Propositions ({durationMin} min) — cliquez pour choisir :</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {state.slots.map(x => <button key={x.s} type="button" onClick={() => onPick(x)} style={{ ...chipBtn, fontSize: 12.5, textTransform: "capitalize" }}>{fmtDay(x.day, { weekday: "short", day: "numeric", month: "short" })} · {x.from.replace(":", "h")}–{x.to.replace(":", "h")}</button>)}
              </div>
            </>}
        </div>
      )}
    </div>
  );
}

/* ---------------- Réunions : compte-rendu et tâches issues de la réunion ---------------- */
function MinutesPanel({ m, me, session, canManage, canMakeTasks, people, notify }) {
  const [text, setText] = useState(m.minutes || "");
  const [busy, setBusy] = useState(false);
  const [who, setWho] = useState("");
  const [made, setMade] = useState({});
  useEffect(() => { setText(m.minutes || ""); }, [m.minutes]);
  const dirty = text !== (m.minutes || "");
  const save = async () => {
    if (busy || !dirty) return;
    setBusy(true);
    const { error } = await supabase.from("meetings").update({ minutes: text.slice(0, 20000) }).eq("id", m.id);
    setBusy(false);
    notify(error ? error.message : "Compte-rendu enregistré.", error ? "err" : "ok");
  };
  const lines = (m.minutes || "").split("\n").map(l => l.replace(/^\s*(?:[-*•]|\d+[.)]|\[[ xX]?\])\s*/, "").trim()).filter(l => l.length >= 3);
  const makeTask = async (line, i) => {
    const assignees = who ? [who] : [];
    const { data, error } = await supabase.from("tasks").insert({ title: line.slice(0, 120), notes: `Issue de la réunion « ${m.title} ».`, label: LABELS[0].id, priority: 2, done: false, assignees, assignee: assignees[0] || null, created_by: me.id, server_id: me.server_id }).select().single();
    if (error) { notify(error.message, "err"); return; }
    setMade(x => ({ ...x, [i]: true }));
    let mail = "";
    if (data && assignees.filter(x => x !== me.id).length) { try { const r = await callApi("/api/notify-task", { taskId: data.id, userIds: assignees.filter(x => x !== me.id) }, session); if (r.sent) mail = " · email envoyé"; } catch (_) {} }
    notify("Tâche créée" + mail + ".");
  };
  return (
    <div data-testid="minutes" style={{ marginTop: 12, borderTop: "1px solid var(--border)", paddingTop: 12 }}>
      {canManage ? (<>
        <textarea aria-label="Compte-rendu" value={text} onChange={e => setText(e.target.value)} rows={6} maxLength={20000} placeholder={"Décisions, points abordés…\nUne action par ligne : vous pourrez la transformer en tâche."} style={{ ...inputStyle, resize: "vertical", fontSize: 13.5 }} />
        <button type="button" onClick={save} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "8px 18px", marginTop: 8, opacity: busy || !dirty ? 0.5 : 1 }}>{busy ? "…" : "Enregistrer le compte-rendu"}</button>
      </>) : (m.minutes ? <div style={{ whiteSpace: "pre-wrap", fontSize: 13.5, color: "var(--text)" }}>{m.minutes}</div> : <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Pas encore de compte-rendu.</div>)}
      {canMakeTasks && lines.length > 0 && !dirty && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
            <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-dim)" }}>Transformer une ligne en tâche, assignée à</span>
            <select aria-label="Assigner à" value={who} onChange={e => setWho(e.target.value)} style={{ ...inputStyle, width: "auto", padding: "6px 10px", fontSize: 13 }}><option value="">Personne</option>{people.map(p => <option key={p.id} value={p.id}>{p.id === me.id ? "Moi" : p.display_name}</option>)}</select>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            {lines.slice(0, 30).map((l, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13.5, background: "var(--bg)", borderRadius: 8, padding: "6px 10px" }}>
                <span style={{ flex: 1 }}>{l}</span>
                {made[i] ? <span style={{ fontSize: 12, color: "#5FBF8B" }}>✓ créée</span> : <button type="button" data-make-task onClick={() => makeTask(l, i)} style={{ ...chipBtn, padding: "4px 10px", fontSize: 12 }}>→ tâche</button>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const REACTION_EMOJIS = ["👍", "✅", "❤️", "😂", "🎉", "👀"];
function ReactionBar({ kind, targetId, reactions = [], me, accounts, notify }) {
  const [pick, setPick] = useState(false);
  const mine = reactions.filter(r => r.kind === kind && r.target_id === targetId);
  const groups = REACTION_EMOJIS.map(e => ({ e, list: mine.filter(r => r.emoji === e) })).filter(g => g.list.length);
  const canReact = me.role !== "guest";
  const toggle = async (e) => {
    setPick(false);
    const had = mine.find(r => r.emoji === e && r.user_id === me.id);
    const { error } = had
      ? await supabase.from("reactions").delete().eq("id", had.id)
      : await supabase.from("reactions").insert({ server_id: me.server_id, kind, target_id: targetId, user_id: me.id, emoji: e });
    if (error) notify(error.message, "err");
  };
  if (!groups.length && !canReact) return null;
  const nameOf = (id) => id === me.id ? "vous" : ((accounts.find(a => a.id === id) || {}).display_name || "?");
  return (
    <div data-reactions style={{ display: "flex", gap: 5, flexWrap: "wrap", alignItems: "center", marginTop: 4 }}>
      {groups.map(g => { const on = g.list.some(r => r.user_id === me.id); return (
        <button key={g.e} type="button" disabled={!canReact} aria-pressed={on} data-react={g.e} title={g.list.map(r => nameOf(r.user_id)).join(", ")} onClick={() => toggle(g.e)}
          style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12.5, padding: "1px 8px", borderRadius: 12, cursor: canReact ? "pointer" : "default", background: on ? "#5B6EF522" : "var(--bg-2)", border: `1px solid ${on ? "var(--accent)" : "var(--border-soft)"}`, color: "var(--text)" }}>{g.e} <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>{g.list.length}</span></button>
      ); })}
      {canReact && (
        <span style={{ position: "relative" }}>
          <button type="button" data-react-open aria-label="Ajouter une réaction" title="Réagir" onClick={() => setPick(v => !v)} style={{ fontSize: 12, padding: "1px 8px", borderRadius: 12, cursor: "pointer", background: "transparent", border: "1px dashed var(--border-soft)", color: "var(--text-dimmer)" }}>☺ +</button>
          {pick && (
            <span style={{ position: "absolute", left: 0, bottom: "calc(100% + 4px)", zIndex: 5, display: "flex", gap: 2, background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 10, padding: 4, boxShadow: "0 8px 24px rgba(0,0,0,.35)" }}>
              {REACTION_EMOJIS.map(e => <button key={e} type="button" data-pick={e} aria-label={"Réagir avec " + e} onClick={() => toggle(e)} style={{ fontSize: 16, background: "none", border: "none", cursor: "pointer", padding: "3px 5px", borderRadius: 6 }}>{e}</button>)}
            </span>
          )}
        </span>
      )}
    </div>
  );
}

/* ---------------- Historique d'une tâche (administrateur) ---------------- */
const HIST_LABELS = { title: "Titre", notes: "Description", label: "Étiquette", priority: "Priorité", due: "Échéance", due_time: "Heure", done: "Terminée", assignees: "Assignés", tags: "Étiquettes #", recurrence: "Répétition", deleted_at: "Corbeille", subtasks: "Sous-tâches" };
function describeChange(k, [o, n], accounts) {
  const nm = (ids) => (ids || []).map(id => (accounts.find(a => a.id === id) || {}).display_name || "?").join(", ") || "personne";
  const short = (v) => { const t = v == null || v === "" ? "—" : String(v); return t.length > 60 ? t.slice(0, 60) + "…" : t; };
  switch (k) {
    case "done": return n ? "a marqué la tâche comme terminée" : "a rouvert la tâche";
    case "deleted_at": return n ? "a mis la tâche à la corbeille" : "a restauré la tâche";
    case "assignees": return `Assignés : ${nm(o)} → ${nm(n)}`;
    case "priority": return `Priorité : ${(PRIORITIES.find(x => x.id === o) || {}).label || o} → ${(PRIORITIES.find(x => x.id === n) || {}).label || n}`;
    case "label": return `Étiquette : ${(LABELS.find(x => x.id === o) || {}).name || o} → ${(LABELS.find(x => x.id === n) || {}).name || n}`;
    case "due": return `Échéance : ${o ? fmtDay(o, { day: "numeric", month: "short" }) : "—"} → ${n ? fmtDay(n, { day: "numeric", month: "short" }) : "—"}`;
    case "due_time": return `Heure : ${o ? hhmm(o) : "toute la journée"} → ${n ? hhmm(n) : "toute la journée"}`;
    case "tags": return `Étiquettes # : ${(o || []).join(", ") || "—"} → ${(n || []).join(", ") || "—"}`;
    case "subtasks": return `Sous-tâches : ${o} → ${n}`;
    case "notes": return "Description modifiée";
    default: return `${HIST_LABELS[k] || k} : ${short(o)} → ${short(n)}`;
  }
}
function TaskHistory({ taskId, accounts }) {
  const [rows, setRows] = useState(null);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    let alive = true;
    supabase.from("task_history").select("*").eq("task_id", taskId).order("at", { ascending: false }).limit(100).then(({ data, error }) => { if (alive) setRows(error ? false : (data || [])); });
    return () => { alive = false; };
  }, [open, taskId]);
  const who = (id) => id ? ((accounts.find(a => a.id === id) || {}).display_name || "Ancien membre") : "Le système";
  return (
    <div style={{ marginBottom: 14 }}>
      <button type="button" data-history-toggle onClick={() => setOpen(v => !v)} style={{ ...chipBtn, fontSize: 12.5 }}>🕓 Historique (administrateur) {open ? "▲" : "▼"}</button>
      {open && (
        <div data-testid="task-history" style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
          {rows === null && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Chargement…</div>}
          {rows === false && <div style={{ fontSize: 13, color: "#FF9A8F" }}>Historique indisponible : lancez la migration 10 dans Supabase.</div>}
          {rows && rows.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune modification enregistrée depuis l'activation de l'historique.</div>}
          {rows && rows.map(r => (
            <div key={r.id} style={{ fontSize: 13, background: "var(--bg)", borderRadius: 8, padding: "7px 10px" }}>
              <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>{new Date(r.at).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })} · <strong style={{ color: "var(--text-dim)" }}>{who(r.actor_id)}</strong></div>
              {r.kind === "create" ? <div>a créé la tâche</div> : Object.entries(r.changes || {}).map(([k, v]) => <div key={k}>{/^a /.test(describeChange(k, v, accounts)) ? <><strong>{who(r.actor_id)}</strong> {describeChange(k, v, accounts)}</> : describeChange(k, v, accounts)}</div>)}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Admin : statut du site ---------------- */
const agoText = (iso) => {
  if (!iso) return "jamais";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  if (m < 1440) return `il y a ${Math.floor(m / 60)} h`;
  return `il y a ${Math.floor(m / 1440)} j`;
};
/* ---------------- Notifications du navigateur ---------------- */
const BN_KEY = "carnet-bn";
const bnSupported = () => typeof window !== "undefined" && "Notification" in window;
const bnOn = () => { try { return localStorage.getItem(BN_KEY) === "on"; } catch (_) { return false; } };
function showNotif(title, body, tag) {
  if (!bnSupported() || Notification.permission !== "granted" || !bnOn()) return;
  if (!window.__forceNotif && document.visibilityState === "visible" && document.hasFocus()) return;   // vous regardez déjà l'appli
  const opts = { body, tag, icon: "/icons/icon-192.png", badge: "/icons/icon-192.png", data: { url: "/app/" } };
  const fallback = () => { try { new Notification(title, opts); } catch (_) {} };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(reg => (reg && reg.showNotification ? reg.showNotification(title, opts) : fallback())).catch(fallback);
    else fallback();
  } catch (_) { fallback(); }
}
/** Surveille les données en direct et prévient (si autorisé) : tâche assignée, réunion qui commence, message privé, mention, congé traité. */
function useDesktopNotifications({ me, tasks, meetings, attendees, messages, channelMsgs, leaves, accounts }) {
  const [ready, setReady] = useState(false);
  const known = useRef({ tasks: new Set(), dm: new Set(), ch: new Set(), leaves: new Map(), meet: new Set() });
  useEffect(() => { const t = setTimeout(() => setReady(true), 3500); return () => clearTimeout(t); }, []);
  const nameOf = (id) => (accounts.find(a => a.id === id) || {}).display_name || "Quelqu'un";
  useEffect(() => {
    const k = known.current;
    const mineTasks = tasks.filter(t => assigneeIds(t).includes(me.id));
    const dms = messages.filter(m => m.to_id === me.id);
    const re = new RegExp("(^|[^A-Za-z0-9._-])@" + (me.username || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z0-9_-])", "i");
    const ments = channelMsgs.filter(m => m.from_id !== me.id && me.username && re.test(m.text));
    const mine = leaves.filter(l => l.user_id === me.id);
    if (!ready) {
      mineTasks.forEach(t => k.tasks.add(t.id)); dms.forEach(m => k.dm.add(m.id)); ments.forEach(m => k.ch.add(m.id)); mine.forEach(l => k.leaves.set(l.id, l.status));
      return;
    }
    for (const t of mineTasks) if (!k.tasks.has(t.id)) { k.tasks.add(t.id); if (t.created_by !== me.id) showNotif("Nouvelle tâche", `${nameOf(t.created_by)} vous a assigné « ${t.title} »`, "task-" + t.id); }
    for (const m of dms) if (!k.dm.has(m.id)) { k.dm.add(m.id); showNotif(`Message de ${nameOf(m.from_id)}`, m.poll ? "📊 Sondage" : String(m.text).slice(0, 120), "dm-" + m.id); }
    for (const m of ments) if (!k.ch.has(m.id)) { k.ch.add(m.id); showNotif(`${nameOf(m.from_id)} vous a mentionné`, String(m.text).slice(0, 120), "ch-" + m.id); }
    for (const l of mine) { const before = k.leaves.get(l.id); k.leaves.set(l.id, l.status); if (before === "pending" && l.status !== "pending") showNotif(l.status === "approved" ? "Congé accepté ✅" : "Demande de congé refusée", l.admin_note || "", "leave-" + l.id); }
  }, [ready, tasks, messages, channelMsgs, leaves, me.id]);
  useEffect(() => {
    const tick = () => {
      const now = Date.now(), k = known.current;
      for (const m of meetings) {
        const going = m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined");
        if (!going) continue;
        const dt = Date.parse(m.starts_at) - now;
        if (dt > 0 && dt <= 10 * 60000 && !k.meet.has(m.id + "s")) { k.meet.add(m.id + "s"); showNotif("Réunion dans " + Math.max(1, Math.round(dt / 60000)) + " min", m.title, "meet-" + m.id); }
        else if (dt <= 0 && dt > -5 * 60000 && !k.meet.has(m.id + "n")) { k.meet.add(m.id + "n"); showNotif("La réunion commence", m.title, "meet-" + m.id); }
      }
    };
    tick(); const id = setInterval(tick, 20000); return () => clearInterval(id);
  }, [meetings, attendees, me.id]);
}
function BrowserNotifCard({ card }) {
  const [on, setOn] = useState(bnOn());
  const [perm, setPerm] = useState(bnSupported() ? Notification.permission : "unsupported");
  const [msg, setMsg] = useState("");
  const enable = async () => {
    if (!bnSupported()) return;
    let p = Notification.permission;
    if (p === "default") p = await Notification.requestPermission();
    setPerm(p);
    if (p !== "granted") { setMsg(p === "denied" ? "Le navigateur a refusé. Autorisez les notifications pour ce site dans les réglages du navigateur (cadenas à côté de l'adresse), puis réessayez." : "Autorisation non donnée."); return; }
    try { localStorage.setItem(BN_KEY, "on"); } catch (_) {}
    setOn(true); setMsg("");
    const prevForce = window.__forceNotif; window.__forceNotif = true; showNotif("Notifications activées ✓", "Vous serez prévenu(e) ici, même quand Le Carnet est en arrière-plan.", "bn-test"); window.__forceNotif = prevForce;
  };
  const disable = () => { try { localStorage.setItem(BN_KEY, "off"); } catch (_) {} setOn(false); };
  return (
    <div style={card} data-testid="bn-card">
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Notifications du navigateur</div>
      <div style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 12, lineHeight: 1.5 }}>Une alerte sur votre écran quand une tâche vous est assignée, qu'une réunion va commencer, qu'on vous écrit ou vous mentionne, ou qu'un congé est traité. Elles arrivent <strong>tant que Le Carnet est ouvert</strong> dans un onglet ou l'appli installée (même en arrière-plan). Les emails restent là pour le reste du temps.</div>
      {perm === "unsupported" ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Votre navigateur ne gère pas les notifications. Sur iPhone, installez d'abord Le Carnet sur l'écran d'accueil.</div> : (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          {on && perm === "granted"
            ? <><span style={{ fontSize: 13.5, color: "#5FBF8B", fontWeight: 600 }}>✓ Activées sur cet appareil</span><button type="button" onClick={disable} style={chipBtn}>Désactiver</button></>
            : <button type="button" onClick={enable} style={{ ...primaryBtn, padding: "10px 20px" }}>Activer les notifications</button>}
        </div>
      )}
      {msg && <div role="status" style={{ fontSize: 12.5, color: "#FFC97A", marginTop: 10 }}>{msg}</div>}
    </div>
  );
}

/* ---------------- Tâches : vue Semaine (glisser-déposer pour replanifier) ---------------- */
/* ============================================================
   Suivi du temps, recherche globale, notes partagées
   ============================================================ */
/** Durée d'une entrée de temps en millisecondes (une minuterie en cours compte jusqu'à maintenant, 24 h au plus). */
const entryMs = (e, now = Date.now()) => Math.max(0, Math.min((e.ended_at ? Date.parse(e.ended_at) : now) - Date.parse(e.started_at), 24 * 3600e3));
const fmtDur = (ms) => {
  const m = Math.round(ms / 60000);
  if (m < 1) return ms >= 1000 ? "< 1 min" : "0 min";
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " h" + (r ? " " + String(r).padStart(2, "0") : "");
};
const fmtClock = (ms) => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60; return [h, m, sec].map(x => String(x).padStart(2, "0")).join(":"); };
/** « 45 », « 1h30 », « 1:30 », « 2 h », « 1,5 » (heures si virgule) → minutes, ou null. */
function parseMinutes(txt) {
  const t = String(txt || "").trim().toLowerCase().replace(",", ".");
  let m;
  if ((m = t.match(/^(\d+)\s*(?:h|:)\s*(\d{1,2})?\s*(?:min|m)?$/))) return Number(m[1]) * 60 + Number(m[2] || 0);
  if ((m = t.match(/^(\d+(?:\.\d+)?)\s*h$/))) return Math.round(Number(m[1]) * 60);
  if ((m = t.match(/^(\d+)\s*(?:min|m)?$/))) return Number(m[1]);
  if ((m = t.match(/^(\d+\.\d+)$/))) return Math.round(Number(m[1]) * 60);
  return null;
}
async function stopEntry(e) {
  const end = new Date(Math.min(Math.max(Date.now(), Date.parse(e.started_at) + 1000), Date.parse(e.started_at) + 24 * 3600e3)).toISOString();
  return supabase.from("time_entries").update({ ended_at: end }).eq("id", e.id);
}

function TimeTracker({ task, me, isAdmin, entries, accounts, notify }) {
  const [, tick] = useState(0);
  const [minutes, setMinutes] = useState("");
  const [day, setDay] = useState(parisDay());
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const mine = entries.find(e => e.user_id === me.id && !e.ended_at);
  const canTrack = me.role !== "guest";
  useEffect(() => { if (!entries.some(e => !e.ended_at)) return; const id = setInterval(() => tick(n => n + 1), 1000); return () => clearInterval(id); }, [entries]);
  const total = entries.reduce((n, e) => n + entryMs(e), 0);
  const perPerson = accounts.map(a => ({ a, ms: entries.filter(e => e.user_id === a.id).reduce((n, e) => n + entryMs(e), 0) })).filter(x => x.ms > 0).sort((x, y) => y.ms - x.ms);
  const start = async () => {
    if (busy) return; setBusy(true);
    // une seule minuterie à la fois : on arrête celle d'une autre tâche
    const { data: running } = await supabase.from("time_entries").select("*").eq("user_id", me.id).is("ended_at", null);
    for (const r of running || []) await stopEntry(r);
    const { error } = await supabase.from("time_entries").insert({ server_id: me.server_id, task_id: task.id, user_id: me.id, started_at: new Date().toISOString() });
    setBusy(false);
    if (error) notify(error.message, "err"); else notify("Chrono démarré.");
  };
  const stop = async () => { if (!mine || busy) return; setBusy(true); const { error } = await stopEntry(mine); setBusy(false); notify(error ? error.message : "Chrono arrêté : " + fmtDur(entryMs({ ...mine, ended_at: new Date().toISOString() })) + " enregistrés."); };
  const addManual = async () => {
    const m = parseMinutes(minutes);
    if (!m || m < 1 || m > 24 * 60) { notify("Indiquez une durée, par exemple 45, 1h30 ou 2 h (24 h au maximum).", "err"); return; }
    if (busy) return; setBusy(true);
    const startMs = parisInstant(day || parisDay(), "09:00");
    const { error } = await supabase.from("time_entries").insert({ server_id: me.server_id, task_id: task.id, user_id: me.id, started_at: new Date(startMs).toISOString(), ended_at: new Date(startMs + m * 60000).toISOString(), note: note.trim().slice(0, 200) });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setMinutes(""); setNote(""); notify(fmtDur(m * 60000) + " ajoutés.");
  };
  const remove = async (e) => { const { error } = await supabase.from("time_entries").delete().eq("id", e.id); if (error) notify(error.message, "err"); };
  const list = entries.filter(e => e.ended_at).sort((a, b) => b.started_at.localeCompare(a.started_at)).slice(0, 8);
  return (
    <div data-time-tracker style={{ borderTop: "1px solid var(--border)", paddingTop: 14, marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 8 }}>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600 }}>⏱ Temps passé</div>
        <strong data-time-total style={{ fontSize: 13 }}>{total ? fmtDur(total) : "—"}</strong>
        {canTrack && (mine
          ? <button key="stop" type="button" data-timer-stop onClick={stop} disabled={busy} style={{ ...chipBtn, marginLeft: "auto", color: "#FF9A8F", borderColor: "#FF6B5E" }}>■ Arrêter · <span data-timer-clock>{fmtClock(entryMs(mine))}</span></button>
          : <button key="start" type="button" data-timer-start onClick={start} disabled={busy} style={{ ...chipBtn, marginLeft: "auto" }}>▶ Démarrer le chrono</button>)}
      </div>
      {perPerson.length > 1 && <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginBottom: 8 }}>{perPerson.map(x => `${x.a.display_name} : ${fmtDur(x.ms)}`).join(" · ")}</div>}
      {canTrack && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
          <input data-time-minutes value={minutes} onChange={e => setMinutes(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addManual(); } }} placeholder="Durée : 45, 1h30…" aria-label="Durée à ajouter" style={{ ...inputStyle, width: 130, padding: "6px 10px" }} />
          <input type="date" value={day} max={parisDay()} onChange={e => setDay(e.target.value)} aria-label="Jour" style={{ ...inputStyle, width: "auto", padding: "6px 10px" }} />
          <input value={note} onChange={e => setNote(e.target.value)} maxLength={200} placeholder="Note (facultatif)" aria-label="Note" style={{ ...inputStyle, flex: "1 1 120px", width: "auto", padding: "6px 10px" }} />
          <button type="button" data-time-add onClick={addManual} disabled={busy} style={chipBtn}>Ajouter</button>
        </div>
      )}
      {list.map(e => { const u = accounts.find(a => a.id === e.user_id); return (
        <div key={e.id} data-time-entry style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 12.5, color: "var(--text-dim)", padding: "3px 0" }}>
          <span style={{ minWidth: 70 }}>{fmtDay(parisDay(Date.parse(e.started_at)), { day: "numeric", month: "short" })}</span>
          <strong style={{ color: "var(--text)", minWidth: 56 }}>{fmtDur(entryMs(e))}</strong>
          <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{u ? u.display_name : "?"}{e.note ? " · " + e.note : ""}</span>
          {(e.user_id === me.id || isAdmin) && <button type="button" data-time-delete onClick={() => remove(e)} aria-label="Supprimer cette entrée" style={{ background: "none", border: "none", color: "var(--text-dimmer)", cursor: "pointer" }}>✕</button>}
        </div>); })}
    </div>
  );
}

/** Minuterie en cours (visible partout, en haut de la page). */
function RunningTimer({ me, entries, tasks, onOpen, notify }) {
  const [, tick] = useState(0);
  const run = entries.find(e => e.user_id === me.id && !e.ended_at);
  useEffect(() => { if (!run) return; const id = setInterval(() => tick(n => n + 1), 1000); return () => clearInterval(id); }, [run && run.id]);
  if (!run) return null;
  const t = tasks.find(x => x.id === run.task_id);
  const stop = async () => { const { error } = await stopEntry(run); notify(error ? error.message : "Chrono arrêté : " + fmtDur(entryMs({ ...run, ended_at: new Date().toISOString() })) + " enregistrés."); };
  return (
    <div data-running-timer style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--panel)", border: "1px solid #9B7EF5", borderRadius: 10, padding: "8px 14px", marginBottom: 14, flexWrap: "wrap" }}>
      <span aria-hidden="true" style={{ color: "#9B7EF5" }}>⏱</span>
      <button type="button" onClick={() => t && onOpen(t.id)} style={{ background: "none", border: "none", color: "var(--text)", cursor: "pointer", fontSize: 13.5, fontWeight: 600, padding: 0, textAlign: "left" }}>{t ? t.title : "Tâche"}</button>
      <span data-running-clock style={{ fontVariantNumeric: "tabular-nums", color: "var(--text-dim)", fontSize: 13 }}>{fmtClock(entryMs(run))}</span>
      <button type="button" data-running-stop onClick={stop} style={{ ...chipBtn, marginLeft: "auto", color: "#FF9A8F", borderColor: "#FF6B5E" }}>■ Arrêter</button>
    </div>
  );
}

/** Recherche globale (Ctrl K) : pages, tâches, réunions, notes. */
const normSearch = (x) => String(x || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function CommandPalette({ tasks, meetings, notes, accounts, tabs, onClose, onTab, onTask, onNote, onNewTask, canCreate }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  const needle = normSearch(q.trim());
  const items = useMemo(() => {
    const out = [];
    const pages = tabs.map(t => ({ k: "tab-" + t.id, kind: "Page", label: t.label, hint: "Aller à cette page", run: () => onTab(t.id) }));
    if (canCreate) pages.unshift({ k: "new-task", kind: "Action", label: "Nouvelle tâche", hint: "Créer une tâche", run: onNewTask });
    const match = (txt) => !needle || normSearch(txt).includes(needle);
    out.push(...pages.filter(p => match(p.label)).slice(0, needle ? 4 : 9));
    if (needle) {
      out.push(...tasks.filter(t => match(t.title) || match((t.tags || []).join(" "))).slice(0, 6).map(t => ({ k: "task-" + t.id, kind: t.done ? "Tâche terminée" : "Tâche", label: t.title, hint: t.due ? "Échéance " + formatDue(t.due, daysUntil(t.due)).toLowerCase() : "Sans échéance", run: () => onTask(t.id) })));
      out.push(...notes.filter(n => match(n.title) || match(n.body)).slice(0, 4).map(n => ({ k: "note-" + n.id, kind: "Note", label: n.title, hint: "Ouvrir la note", run: () => onNote(n.id) })));
      out.push(...meetings.filter(m => match(m.title) && Date.parse(m.ends_at) > Date.now() - 7 * 864e5).slice(0, 3).map(m => ({ k: "meet-" + m.id, kind: "Réunion", label: m.title, hint: fmtWhen(m), run: () => onTab("meetings") })));
      out.push(...accounts.filter(a => match(a.display_name) || match(a.username)).slice(0, 3).map(a => ({ k: "user-" + a.id, kind: "Personne", label: a.display_name, hint: "Écrire un message", run: () => onTab("messages") })));
    }
    return out;
  }, [needle, tasks, meetings, notes, accounts, tabs]);
  useEffect(() => { setSel(0); }, [needle]);
  const key = (e) => {
    if (e.key === "Escape") { e.preventDefault(); onClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setSel(i => Math.min(items.length - 1, i + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel(i => Math.max(0, i - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); const it = items[sel]; if (it) it.run(); }
  };
  return (
    <div style={{ ...overlayStyle, placeItems: "start center", paddingTop: "12vh" }} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" data-palette style={{ ...modalStyle, width: 560, padding: 0, overflow: "hidden" }}>
        <input ref={inputRef} data-palette-input value={q} onChange={e => setQ(e.target.value)} onKeyDown={key} placeholder="Rechercher une tâche, une note, une réunion, une page…" aria-label="Recherche globale" style={{ ...inputStyle, border: "none", borderBottom: "1px solid var(--border)", borderRadius: 0, padding: "16px 18px", fontSize: 15 }} />
        <div role="listbox" style={{ maxHeight: "50vh", overflowY: "auto", padding: 6 }}>
          {items.length === 0 && <div style={{ padding: "18px 14px", fontSize: 13.5, color: "var(--text-dimmer)" }}>Aucun résultat pour « {q} ».</div>}
          {items.map((it, i) => (
            <button key={it.k} type="button" role="option" aria-selected={i === sel} data-palette-item={it.label} onMouseEnter={() => setSel(i)} onClick={() => it.run()} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", background: i === sel ? "var(--panel)" : "transparent", border: "none", color: "var(--text)", borderRadius: 8, padding: "9px 12px", cursor: "pointer", font: "inherit", fontSize: 13.5 }}>
              <span style={{ fontSize: 11, color: "var(--text-dimmer)", width: 96, flexShrink: 0 }}>{it.kind}</span>
              <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.label}</span>
              <span style={{ fontSize: 11.5, color: "var(--text-dimmer)", flexShrink: 0 }}>{it.hint}</span>
            </button>
          ))}
        </div>
        <div style={{ borderTop: "1px solid var(--border)", padding: "8px 14px", fontSize: 11.5, color: "var(--text-dimmer)", display: "flex", gap: 14 }}><span>↑↓ naviguer</span><span>↵ ouvrir</span><span>Échap fermer</span></div>
      </div>
    </div>
  );
}

/** Mini mise en forme des notes : titres (#), listes (-), cases à cocher (- [ ]), **gras**, liens https. */
function renderInline(text, key) {
  const parts = []; const re = /(\*\*[^*]+\*\*|https:\/\/[^\s<]+)/g; let last = 0, m, i = 0;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    const tok = m[0];
    parts.push(tok.startsWith("**") ? <strong key={key + "-" + i++}>{tok.slice(2, -2)}</strong> : <a key={key + "-" + i++} href={tok} target="_blank" rel="noopener noreferrer" style={{ color: "var(--accent-2)" }}>{tok}</a>);
    last = m.index + tok.length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}
function NoteBody({ body, onToggle }) {
  const lines = String(body || "").split("\n");
  return (
    <div data-note-body style={{ fontSize: 14, lineHeight: 1.65 }}>
      {lines.map((l, i) => {
        let m;
        if ((m = l.match(/^(#{1,3})\s+(.*)$/))) return <div key={i} style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: m[1].length === 1 ? 22 : m[1].length === 2 ? 18 : 15.5, margin: "14px 0 4px" }}>{renderInline(m[2], i)}</div>;
        if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))) { const on = m[1] !== " "; return <label key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", cursor: onToggle ? "pointer" : "default" }}><input type="checkbox" data-note-check checked={on} disabled={!onToggle} onChange={() => onToggle && onToggle(i)} style={{ marginTop: 5 }} /><span style={{ textDecoration: on ? "line-through" : "none", opacity: on ? 0.6 : 1 }}>{renderInline(m[2], i)}</span></label>; }
        if ((m = l.match(/^\s*[-*]\s+(.*)$/))) return <div key={i} style={{ display: "flex", gap: 8 }}><span aria-hidden="true">•</span><span>{renderInline(m[1], i)}</span></div>;
        if (!l.trim()) return <div key={i} style={{ height: 8 }} />;
        return <div key={i}>{renderInline(l, i)}</div>;
      })}
    </div>
  );
}

                <textarea data-note-text value={draft.body} onChange={e => setDraft(d => ({ ...d, body: e.target.value }))} rows={16} maxLength={20000} aria-label="Contenu de la note" placeholder={"# Titre\n- point\n- [ ] à faire\n**gras**, liens https://…"} style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit", lineHeight: 1.6 }} />
                {projects.length > 0 && <select data-note-project value={draft.project_id} onChange={e => setDraft(d => ({ ...d, project_id: e.target.value }))} aria-label="Projet lié" style={{ ...inputStyle, width: "auto", marginTop: 10 }}><option value="">Aucun projet</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
                <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                  <button type="button" onClick={() => setEditing(false)} style={{ ...secondaryBtn, width: "auto", padding: "9px 18px" }}>Annuler</button>
                  <button type="button" data-note-save onClick={save} disabled={busy} style={{ ...primaryBtn, width: "auto", padding: "9px 22px", opacity: busy ? 0.6 : 1 }}>{busy ? "Enregistrement…" : "Enregistrer"}</button>
                </div>
              </>) : (<>
                <div style={{ display: "flex", gap: 10, alignItems: "flex-start", flexWrap: "wrap" }}>
                  <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 24, fontWeight: 600, margin: 0, flex: 1, minWidth: 180 }}>{cur.pinned ? "📌 " : ""}{cur.title}</h2>
                  {canWrite && <button type="button" data-note-edit onClick={startEdit} style={chipBtn}>✎ Modifier</button>}
                  {canWrite && <button type="button" data-note-pin onClick={togglePin} style={chipBtn}>{cur.pinned ? "Désépingler" : "📌 Épingler"}</button>}
                  {(cur.created_by === me.id || isAdmin) && <button type="button" data-note-delete onClick={remove} style={{ ...chipBtn, color: "#FF9A8F" }}>Supprimer</button>}
                </div>
                <div style={{ fontSize: 12, color: "var(--text-dimmer)", margin: "6px 0 14px" }}>Créée par {who(cur.created_by)} · modifiée le {dt(cur.updated_at)}{cur.updated_by && cur.updated_by !== cur.created_by ? " par " + who(cur.updated_by) : ""}{proj ? " · 📁 " + proj.name : ""}</div>
                {cur.body.trim() ? <NoteBody body={cur.body} onToggle={canWrite ? toggleCheck : null} /> : <div style={{ color: "var(--text-dimmer)", fontSize: 13.5 }}>Cette note est vide.{canWrite ? " Cliquez sur « Modifier » pour écrire." : ""}</div>}
              </>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Rapports ---------------- */
const REPORT_PERIODS = [[7, "7 jours"], [30, "30 jours"], [90, "90 jours"]];
/** Calcule tous les indicateurs d'un rapport (fonction pure, testable). */
function computeReport({ tasks, meetings, attendees, accounts, projects, days, projectId, today, timeEntries = [] }) {
  const from = shiftDay(today, -(days - 1));
  const dayOf = (iso) => (iso ? parisDay(Date.parse(iso)) : null);
  const inRange = (d) => d && d >= from && d <= today;
  const list = tasks.filter(t => !t.deleted_at && (!projectId || (projectId === "none" ? !t.project_id : t.project_id === projectId)));
  const created = list.filter(t => inRange(dayOf(t.created_at)));
  const done = list.filter(t => t.done && inRange(dayOf(t.done_at)));
  const open = list.filter(t => !t.done);
  const late = open.filter(t => t.due && t.due < today);
  const dueIn = list.filter(t => t.due && t.due >= from && t.due <= today);
  const onTime = dueIn.filter(t => t.done && dayOf(t.done_at) && dayOf(t.done_at) <= t.due);
  const lead = done.map(t => daysBetween(dayOf(t.created_at), dayOf(t.done_at))).filter(n => n >= 0);
  const avgLead = lead.length ? lead.reduce((a, b) => a + b, 0) / lead.length : null;
  // Série temporelle : un point par jour (jusqu'à 30 jours), sinon par semaine
  const step = days > 31 ? 7 : 1;
  const series = [];
  for (let d = from; d <= today; d = shiftDay(d, step)) {
    const end = shiftDay(d, step - 1);
    series.push({ day: d, created: created.filter(t => { const x = dayOf(t.created_at); return x >= d && x <= end; }).length, done: done.filter(t => { const x = dayOf(t.done_at); return x >= d && x <= end; }).length });
  }
  const people = accounts.filter(a => a.status !== "pending").map(a => {
    const mine = list.filter(t => assigneeIds(t).includes(a.id));
    return { user: a, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length, late: mine.filter(t => !t.done && t.due && t.due < today).length };
  }).filter(r => r.done || r.open).sort((a, b) => b.done - a.done || b.open - a.open);
  const byProject = [...projects.map(p => ({ id: p.id, name: p.name })), { id: "none", name: "Sans projet" }].map(p => {
    const mine = list.filter(t => (p.id === "none" ? !t.project_id : t.project_id === p.id));
    return { ...p, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length };
  }).filter(r => r.done || r.open);
  const byLabel = LABELS.map(l => ({ ...l, done: done.filter(t => t.label === l.id).length, open: open.filter(t => t.label === l.id).length })).filter(r => r.done || r.open);
  const mts = meetings.filter(m => inRange(parisDay(Date.parse(m.starts_at))));
  const hours = mts.reduce((a, m) => a + (Date.parse(m.ends_at) - Date.parse(m.starts_at)) / 3600e3, 0);
  // Temps suivi : entrées commencées pendant la période, sur les tâches du filtre
  const listIds = new Set(list.map(t => t.id));
  const tEntries = timeEntries.filter(e => listIds.has(e.task_id) && inRange(dayOf(e.started_at)));
  const timeByPerson = accounts.map(a => ({ user: a, ms: tEntries.filter(e => e.user_id === a.id).reduce((n, e) => n + entryMs(e), 0) })).filter(x => x.ms > 0).sort((a, b) => b.ms - a.ms);
  const timeMs = timeByPerson.reduce((n, x) => n + x.ms, 0);
  return { timeMs, timeByPerson, from, created: created.length, done: done.length, open: open.length, late: late.length, lateTasks: late, dueCount: dueIn.length, onTimeRate: dueIn.length ? Math.round(onTime.length / dueIn.length * 100) : null, avgLead, series, people, byProject, byLabel, meetings: mts.length, meetingHours: hours };
}
function BarRow({ label, value, max, color, extra, avatar }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13, marginBottom: 7 }}>
      <div style={{ width: 150, flexShrink: 0, display: "flex", alignItems: "center", gap: 6, overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis" }}>{avatar}{label}</div>
      <div style={{ flex: 1, background: "var(--bg)", borderRadius: 6, height: 14, overflow: "hidden" }}><div style={{ width: (max ? Math.max(value / max * 100, value ? 3 : 0) : 0) + "%", height: "100%", background: color || "var(--accent)", borderRadius: 6 }} /></div>
      <div style={{ width: 120, flexShrink: 0, color: "var(--text-dim)", fontSize: 12 }}><strong style={{ color: "var(--text)" }}>{value}</strong>{extra}</div>
    </div>
  );
}

        {kpi("lead", r.avgLead === null ? "—" : (r.avgLead < 1 ? "< 1 j" : Math.round(r.avgLead * 10) / 10 + " j"), "Délai moyen", "de la création à la fin")}

/* ---------------- Chronologie (Gantt) ---------------- */
const GANTT_SPANS = [[14, "2 semaines"], [28, "4 semaines"], [84, "12 semaines"]];
function GanttBoard({ tasks, accounts, onOpen }) {
  const [span, setSpan] = useState(28);
  const [offset, setOffset] = useState(0);                       // décalage en jours depuis le lundi de la semaine courante
  const today = parisDay();
  const first = shiftDay(today, -(isoWd(today) - 1) + offset);
  const last = shiftDay(first, span - 1);
  const days = Array.from({ length: span }, (_, i) => shiftDay(first, i));
  const dated = tasks.filter(t => t.due);
  const rows = dated.map(t => ({ t, a: t.start_date && t.start_date <= t.due ? t.start_date : t.due, b: t.due }))
    .filter(r => r.b >= first && r.a <= last)
    .sort((x, y) => x.a.localeCompare(y.a) || x.b.localeCompare(y.b) || y.t.priority - x.t.priority);
  const undated = tasks.filter(t => !t.due && !t.done).length;
  const pct = (d) => (daysBetween(first, d) / span) * 100;
  const todayPct = today >= first && today <= last ? pct(today) + 50 / span : null;
  const nav = (n) => setOffset(o => o + n);
  const headDay = (d) => span <= 28 ? fmtDay(d, { day: "numeric" }) : (d.slice(8) === "01" || isoWd(d) === 1 ? fmtDay(d, { day: "numeric", month: "short" }) : "");
  return (
    <div data-gantt>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
        <button type="button" data-gantt-prev onClick={() => nav(-Math.max(7, span / 2))} style={chipBtn} aria-label="Période précédente">◀</button>
        <button type="button" data-gantt-today onClick={() => setOffset(0)} style={chipBtn}>Aujourd'hui</button>
        <button type="button" data-gantt-next onClick={() => nav(Math.max(7, span / 2))} style={chipBtn} aria-label="Période suivante">▶</button>
        <span style={{ fontSize: 13, color: "var(--text-dim)", textTransform: "capitalize" }}>{fmtDay(first, { day: "numeric", month: "long" })} → {fmtDay(last, { day: "numeric", month: "long", year: "numeric" })}</span>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>{GANTT_SPANS.map(([n, l]) => <button key={n} type="button" data-gantt-span={n} aria-pressed={span === n} onClick={() => setSpan(n)} style={{ ...chipBtn, borderColor: span === n ? "var(--accent)" : "var(--border-soft)", color: span === n ? "var(--text)" : "var(--text-dim)" }}>{l}</button>)}</div>
      </div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflowX: "auto" }}>
        <div style={{ minWidth: 720 }}>
          <div style={{ display: "flex", borderBottom: "1px solid var(--border)" }}>
            <div style={{ width: 200, flexShrink: 0, padding: "8px 12px", fontSize: 12, color: "var(--text-dimmer)", fontWeight: 600 }}>Tâche</div>
            <div style={{ flex: 1, position: "relative", display: "flex" }}>
              {days.map(d => <div key={d} style={{ flex: 1, textAlign: "center", fontSize: 10.5, padding: "8px 0", color: d === today ? "var(--accent)" : "var(--text-dimmer)", fontWeight: d === today ? 700 : 500, background: isoWd(d) >= 6 ? "var(--bg)" : "transparent", overflow: "hidden" }}>{headDay(d)}</div>)}
            </div>
          </div>
          {rows.length === 0 && <div style={{ padding: "26px 16px", fontSize: 13.5, color: "var(--text-dimmer)", textAlign: "center" }}>Aucune tâche avec une échéance sur cette période.</div>}
          {rows.map(({ t, a, b }) => {
            const label = LABELS.find(l => l.id === t.label) || LABELS[0];
            const left = Math.max(0, pct(a)), right = Math.min(100, pct(b) + 100 / span);
            const late = !t.done && t.due < today;
            const who = assigneeIds(t).map(id => accounts.find(x => x.id === id)).filter(Boolean);
            return (
              <div key={t.id} data-gantt-row={t.title} style={{ display: "flex", alignItems: "center", borderBottom: "1px solid var(--border-soft)", minHeight: 38 }}>
                <div onClick={() => onOpen(t.id)} title={t.title} style={{ width: 200, flexShrink: 0, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textDecoration: t.done ? "line-through" : "none", opacity: t.done ? 0.6 : 1 }}>{t.title}</div>
                <div style={{ flex: 1, position: "relative", height: 38 }}>
                  {todayPct !== null && <div style={{ position: "absolute", left: todayPct + "%", top: 0, bottom: 0, width: 2, background: "var(--accent)", opacity: 0.45 }} />}
                  <button type="button" data-gantt-bar={t.id} onClick={() => onOpen(t.id)} title={`${t.title} · ${a === b ? fmtDay(b, { day: "numeric", month: "short" }) : fmtDay(a, { day: "numeric", month: "short" }) + " → " + fmtDay(b, { day: "numeric", month: "short" })}`}
                    style={{ position: "absolute", top: 7, height: 24, left: left + "%", width: Math.max(right - left, 1.2) + "%", background: label.hex, opacity: t.done ? 0.35 : 0.9, border: late ? "2px solid #FF6B5E" : "none", borderRadius: 6, cursor: "pointer", padding: "0 6px", color: "#fff", fontSize: 11, fontWeight: 600, textAlign: "left", overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis", display: "flex", alignItems: "center", gap: 4 }}>
                    {who.length > 0 && <AvatarStack users={who} size={14} max={2} />}{right - left > 14 ? t.title : ""}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 10, lineHeight: 1.6 }}>Une barre va du début à l'échéance de la tâche (une tâche sans début n'occupe que son jour d'échéance). Renseignez le début dans la fiche de la tâche. Contour rouge : en retard.{undated > 0 ? ` ${undated} tâche${undated > 1 ? "s" : ""} sans échéance ne figure${undated > 1 ? "nt" : ""} pas ici.` : ""}</div>
    </div>
  );
}

function WeekBoard({ tasks, accounts, canEditTask, onOpen, onMoveDue }) {
  const [wk, setWk] = useState(0);
  const [over, setOver] = useState(null);
  const today = parisDay();
  const monday = shiftDay(today, -(isoWd(today) - 1) + wk * 7);
  const days = Array.from({ length: 7 }, (_, i) => shiftDay(monday, i));
  const byDay = (d) => tasks.filter(t => t.due === d).sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
  const noDate = tasks.filter(t => !t.due && !t.done);
  const late = tasks.filter(t => t.due && t.due < today && !t.done);
  const drop = (e, day) => { e.preventDefault(); setOver(null); const id = e.dataTransfer.getData("text/plain"); const t = tasks.find(x => x.id === id); if (t && t.due !== day) onMoveDue(t, day); };
  const card = (t) => {
    const label = LABELS.find(l => l.id === t.label) || LABELS[0];
    const can = canEditTask(t);
    const who = assigneeIds(t).map(id => accounts.find(x => x.id === id)).filter(Boolean);
    return (
      <div key={t.id} data-week-task={t.title} draggable={can} onDragStart={e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; }}
        style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `4px solid ${label.hex}`, borderRadius: 8, padding: "6px 8px", fontSize: 12.5, cursor: can ? "grab" : "pointer", opacity: t.done ? 0.5 : 1 }}>
        <div onClick={() => onOpen(t.id)} style={{ fontWeight: 600, textDecoration: t.done ? "line-through" : "none", cursor: "pointer", wordBreak: "break-word" }}>{t.title}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 3, color: "var(--text-dimmer)", fontSize: 11.5 }}>
          {t.due_time && <span>{hhmm(t.due_time)}</span>}
          {who.length > 0 && <AvatarStack users={who} size={16} max={3} />}
          {can && <select aria-label={"Déplacer « " + t.title + " »"} value="" onChange={e => { if (e.target.value) onMoveDue(t, e.target.value === "none" ? null : e.target.value); }} style={{ marginLeft: "auto", background: "transparent", border: "none", color: "var(--text-dimmer)", fontSize: 11.5, cursor: "pointer", maxWidth: 62 }}>
            <option value="">Déplacer…</option>
            {days.map(d => <option key={d} value={d} style={{ background: "var(--bg-2)" }}>{fmtDay(d, { weekday: "short", day: "numeric" })}</option>)}
            <option value="none" style={{ background: "var(--bg-2)" }}>Sans date</option>
          </select>}
        </div>
      </div>
    );
  };
  const col = (key, title, list, droppable, extra) => (
    <div key={key} data-week-col={key} onDragOver={droppable ? (e => { e.preventDefault(); if (over !== key) setOver(key); }) : undefined} onDragLeave={droppable ? (e => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }) : undefined} onDrop={droppable ? (e => drop(e, key === "none" ? null : key)) : undefined}
      style={{ background: over === key ? "#5B6EF514" : "var(--bg-2)", border: `1px solid ${over === key ? "var(--accent)" : key === today ? "var(--accent-2)" : "var(--border)"}`, borderRadius: 12, padding: 8, minHeight: 110, minWidth: 0 }}>
      <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8, textTransform: "capitalize", color: key === today ? "var(--accent-2)" : "var(--text)" }}>{title}{extra}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{list.map(card)}{list.length === 0 && droppable && <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", textAlign: "center", padding: "10px 0" }}>—</div>}</div>
    </div>
  );
  return (
    <div data-testid="week-board">
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        <button type="button" onClick={() => setWk(w => w - 1)} style={chipBtn} aria-label="Semaine précédente">←</button>
        <div style={{ fontWeight: 600, fontSize: 14.5 }}>Semaine du {fmtDay(monday, { day: "numeric", month: "long" })}{wk === 0 ? " (cette semaine)" : ""}</div>
        <button type="button" onClick={() => setWk(w => w + 1)} style={chipBtn} aria-label="Semaine suivante">→</button>
        {wk !== 0 && <button type="button" onClick={() => setWk(0)} style={chipBtn}>Cette semaine</button>}
        <span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Glissez une tâche sur un autre jour pour la replanifier (l'heure est conservée).</span>
      </div>
      <div className="week-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 8 }}>
        {days.map(d => col(d, fmtDay(d, { weekday: "long", day: "numeric" }), byDay(d), true))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 8, marginTop: 12 }}>
        {col("late", "En retard", late, false, <span style={{ color: "#FF9A8F", fontWeight: 500 }}> · {late.length}</span>)}
        {col("none", "Sans date", noDate, true, <span style={{ color: "var(--text-dimmer)", fontWeight: 500 }}> · {noDate.length}</span>)}
      </div>
    </div>
  );
}

  const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id));
  const timed = mine.filter(t => t.due === today && t.due_time);
  const allDay = mine.filter(t => t.due === today && !t.due_time);
  const late = mine.filter(t => t.due && t.due < today);
  const items = [
    ...myMeetings.map(m => ({ k: "m-" + m.id, at: Date.parse(m.starts_at), end: Date.parse(m.ends_at), kind: "meeting", m })),
    ...timed.map(t => ({ k: "t-" + t.id, at: parisInstant(today, t.due_time), end: parisInstant(today, t.due_time), kind: "task", t })),
  ].sort((a, b) => a.at - b.at);
  const myLeave = leaves.find(l => l.user_id === me.id && l.status === "approved" && l.start_date <= today && l.end_date >= today);

  const next = items.find(i => i.end >= now);

      </div>
      {myLeave && <div role="status" style={{ marginTop: 12, background: "#16281F", border: "1px solid #234B36", color: "#8FD6AE", borderRadius: 10, padding: "9px 12px", fontSize: 13.5 }}>🌴 Vous êtes en congé aujourd'hui ({fmtLeave(myLeave)}). Pas de rappels par email.</div>}
      {(extras.events.length > 0 || extras.birthdays.length > 0) && (
        <div data-testid="day-extras" style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
          {extras.events.map(ev => <div key={ev.id} style={{ background: "var(--bg)", borderRadius: 10, padding: "8px 12px", fontSize: 13.5 }}>🎉 <strong>{ev.title}</strong>{ev.end_date !== ev.start_date ? <span style={{ color: "var(--text-dimmer)" }}> · jusqu'au {fmtDay(ev.end_date, { day: "numeric", month: "long" })}</span> : null}</div>)}
          {extras.birthdays.map(a => <div key={a.id} style={{ background: "var(--bg)", borderRadius: 10, padding: "8px 12px", fontSize: 13.5 }}>🎂 C'est l'anniversaire de <strong>{a.id === me.id ? "vous" : a.display_name}</strong> aujourd'hui !</div>)}

      )}
      {empty && !myLeave && <div style={{ marginTop: 10, fontSize: 13.5, color: "var(--text-dim)" }}>Rien de prévu aujourd'hui. Profites-en ✨</div>}
      {items.length > 0 && (<>
        <div style={sec}>Planning</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {items.map(i => i.kind === "meeting" ? (
            <div key={i.k} style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--bg)", borderRadius: 10, padding: "9px 12px", opacity: i.end < now ? 0.5 : 1 }}>
              <span style={{ minWidth: 92, fontSize: 12.5, fontWeight: 700, color: "#7DB4FF" }}>{fmtHM(i.at)} – {fmtHM(i.end)}</span>
              <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>📹 {i.m.title}</span>

            </div>

            <button key={i.k} type="button" onClick={() => onOpen(i.t.id)} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: "var(--bg)", border: "none", borderRadius: 10, padding: "9px 12px", cursor: "pointer", color: "var(--text)", opacity: i.at < now ? 0.75 : 1 }}>
              <span style={{ minWidth: 92, fontSize: 12.5, fontWeight: 700, color: "#FFC97A" }}>{fmtHM(i.at)}</span>
              <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>✅ {i.t.title}</span>

      {allDay.length > 0 && (<>
        <div style={sec}>À finir aujourd'hui</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{allDay.map(t => <button key={t.id} type="button" onClick={() => onOpen(t.id)} style={{ textAlign: "left", background: "var(--bg)", border: "none", borderRadius: 10, padding: "9px 12px", cursor: "pointer", color: "var(--text)", fontSize: 14, fontWeight: 600 }}>{t.title}</button>)}</div>

      {away.length > 0 && (

        </div>
      )}
    </section>
  );
}

/* ---------------- Photos : réduction avant envoi (limite de 5 Mo) ---------------- */
async function shrinkImage(file, maxSide = 1600) {
  if (!file || !(file.type || "").startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    URL.revokeObjectURL(url);
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    if (scale === 1 && file.size <= 1.5 * 1024 * 1024) return file;
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    if (!blob || blob.size >= file.size) return file;
    const base = (file.name || "photo").replace(/\.[^.]+$/, "");
    return new File([blob], base + ".jpg", { type: "image/jpeg", lastModified: Date.now() });
  } catch (_) { return file; }
}

/** Calcule mes statistiques personnelles à partir des tâches qui me sont assignées. */
function computeStats(tasks, meId, now = Date.now()) {
  const today = parisDay(now);
  const monday = shiftDay(today, -(isoWd(today) - 1)), lastMonday = shiftDay(monday, -7);
  const mine = tasks.filter(t => assigneeIds(t).includes(meId));
  const done = mine.filter(t => t.done && t.done_at).map(t => ({ t, day: parisDay(Date.parse(t.done_at)) }));
  const thisWeek = done.filter(x => x.day >= monday && x.day <= today);
  const lastWeek = done.filter(x => x.day >= lastMonday && x.day < monday);
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = shiftDay(today, -i); days.push({ day: d, n: done.filter(x => x.day === d).length }); }
  const since30 = shiftDay(today, -29);
  const dueDone = done.filter(x => x.day >= since30 && x.t.due);
  const onTime = dueDone.filter(x => x.day <= x.t.due).length;
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = shiftDay(today, -i);
    if (done.some(x => x.day === d)) streak++; else if (i > 0) break;
  }
  const overdue = mine.filter(t => !t.done && t.due && t.due < today).length;
  const perProject = new Map();
  for (const x of thisWeek) perProject.set(x.t.project_id || "", (perProject.get(x.t.project_id || "") || 0) + 1);
  return { thisWeek: thisWeek.length, lastWeek: lastWeek.length, days, rate: dueDone.length ? Math.round(100 * onTime / dueDone.length) : null, dueDone: dueDone.length, streak, overdue, perProject: [...perProject.entries()].sort((a, b) => b[1] - a[1]) };
}
function MyStats({ me, tasks, projects }) {
  const st = useMemo(() => computeStats(tasks, me.id), [tasks, me.id]);
  const max = Math.max(1, ...st.days.map(d => d.n));
  const delta = st.thisWeek - st.lastWeek;
  const big = { fontFamily: "Fraunces, serif", fontSize: 24, fontWeight: 600 };
  const sub = { fontSize: 12.5, color: "var(--text-dim)" };
  return (
    <div data-my-stats style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>Mes statistiques</div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "16px 18px" }}>
        <div style={{ display: "flex", gap: 26, flexWrap: "wrap", alignItems: "flex-start" }}>
          <div><div style={big} data-stat="week">{st.thisWeek}</div><div style={sub}>terminée(s) cette semaine</div><div style={{ fontSize: 12, marginTop: 2, color: delta > 0 ? "#5FBF8B" : delta < 0 ? "#FFB648" : "var(--text-dimmer)" }}>{delta === 0 ? "comme la semaine dernière" : (delta > 0 ? "+" : "") + delta + " vs la semaine dernière (" + st.lastWeek + ")"}</div></div>
          <div><div style={big} data-stat="rate">{st.rate === null ? "—" : st.rate + " %"}</div><div style={sub}>à temps (30 derniers jours)</div><div style={{ fontSize: 12, marginTop: 2, color: "var(--text-dimmer)" }}>{st.dueDone ? `sur ${st.dueDone} tâche(s) avec échéance` : "pas encore d'échéance terminée"}</div></div>
          <div><div style={big} data-stat="streak">{st.streak}{st.streak > 0 ? " 🔥" : ""}</div><div style={sub}>jour(s) d'affilée avec une tâche terminée</div></div>
          <div><div style={{ ...big, color: st.overdue ? "#FF9A8F" : undefined }} data-stat="overdue">{st.overdue}</div><div style={sub}>en retard en ce moment</div></div>
        </div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 54, marginTop: 16 }} aria-label="Tâches terminées sur 14 jours">
          {st.days.map(d => (<div key={d.day} title={`${fmtDay(d.day, { day: "numeric", month: "short" })} : ${d.n}`} style={{ flex: 1, height: d.n ? Math.max(8, Math.round(54 * d.n / max)) : 3, background: d.n ? "#5FBF8B" : "var(--border-soft)", borderRadius: 3 }} />))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-dimmer)", marginTop: 4 }}><span>il y a 14 jours</span><span>aujourd'hui</span></div>
        {st.perProject.length > 0 && projects.length > 0 && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12, alignItems: "center" }}>
            <span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Cette semaine par projet :</span>
            {st.perProject.map(([pid, n]) => { const p = projects.find(x => x.id === pid); return <span key={pid || "none"} style={{ display: "inline-flex", gap: 6, alignItems: "center", fontSize: 12.5 }}>{p ? <ProjectChip project={p} /> : <span style={{ color: "var(--text-dim)" }}>Sans projet</span>}<strong>{n}</strong></span>; })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Patch notes ----------------
   Les nouveautés visibles de tous sont dans /patchnotes.json (affichées sur la page d'accueil du site).

const frDate = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
/** Onglet réservé à l'administrateur du site : historique complet, avec les détails techniques. */
function HomeView({ me, accounts, tasks, comments, leaves = [], meetings = [], attendees = [], events = [], onOpen, goTo, projects = [] }) {
  const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id));
  const late = mine.filter(t => t.due && dueInfo(t).late);
  const today = mine.filter(t => t.due && !dueInfo(t).late && daysUntil(t.due) === 0);
  const soon = mine.filter(t => t.due && daysUntil(t.due) > 0 && daysUntil(t.due) <= 3);
  const doing = mine.filter(t => t.doing && !(t.due && daysUntil(t.due) <= 3));
  const weekAgo = Date.now() - 7 * 86400000;
  const doneWeek = tasks.filter(t => t.done && t.done_at && new Date(t.done_at).getTime() >= weekAgo);
  const myDoneWeek = doneWeek.filter(t => assigneeIds(t).includes(me.id));
  const createdWeek = tasks.filter(t => t.created_at && new Date(t.created_at).getTime() >= weekAgo);
  const urgent = [...late, ...today, ...soon].sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
  const perPerson = new Map();
  for (const t of doneWeek) for (const id of assigneeIds(t)) perPerson.set(id, (perPerson.get(id) || 0) + 1);
  const top = [...perPerson.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, n]) => ({ user: accounts.find(a => a.id === id), n })).filter(x => x.user);
  const first = (me.display_name || "").split(" ")[0];
  const dateLabel = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

  const Row = ({ t }) => {
    const label = LABELS.find(l => l.id === t.label) || LABELS[0];
    const di = dueInfo(t);

      <button type="button" onClick={() => onOpen(t.id)} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `5px solid ${label.hex}`, borderRadius: 10, padding: "10px 14px", cursor: "pointer", color: "var(--text)" }}>
        <span style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis" }}>{t.title}</span>
        {t.due && <span style={{ fontSize: 12, color: di.late ? "#FF9A8F" : di.dleft === 0 ? "#FFC97A" : "var(--text-dim)", whiteSpace: "nowrap" }}>{di.label}</span>}
      </button>
    );
  };

  return (
    <div>
      <div style={{ marginBottom: 22 }}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Bonjour {first} 👋</h1>
        <p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0", textTransform: "capitalize" }}>{dateLabel}</p>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 26 }}>
        <StatCard value={mine.length} label="À faire pour moi" hex="#5B9EF5" onClick={() => goTo("tasks")} />
        <StatCard value={late.length} label="En retard" hex="#FF6B5E" onClick={() => goTo("tasks")} />
        <StatCard value={today.length} label="Pour aujourd'hui" hex="#FFB648" onClick={() => goTo("calendar")} />
        <StatCard value={myDoneWeek.length} label="Terminées cette semaine" hex="#5FBF8B" />
      </div>

      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>À traiter en priorité</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>
        {urgent.length === 0 && <EmptyState text={mine.length ? "Rien d'urgent dans les 3 prochains jours. 🎉" : "Aucune tâche ne vous est assignée pour l'instant."} />}
        {urgent.map(t => <Row key={t.id} t={t} />)}
      </div>

      {doing.length > 0 && (<>
        <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>En cours</div>

/* ============================================================
   Mon profil : nom, couleur, mot de passe, suppression du compte
   ============================================================ */
function ProfileView({ me, session, isAdmin, myPerms, tasks, leaves = [], notify, onChanged, onLogout, accounts = [], projects = [], meetings = [], attendees = [] }) {
  const [displayName, setDisplayName] = useState(me.display_name || "");
  const [username, setUsername] = useState(me.username || "");
  const [color, setColor] = useState(me.color || LABELS[3].hex);
  const [busy, setBusy] = useState(false);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const [delBusy, setDelBusy] = useState(false);
  const dirty = displayName.trim() !== me.display_name || username.trim() !== me.username || color !== me.color;
  const preview = { ...me, display_name: displayName || me.display_name, color };
  const roleLabel = isAdmin ? "Administrateur" : (ROLES.find(r => r.id === me.role) || {}).label || "Membre";
  const mineOpen = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id)).length;
  const created = tasks.filter(t => t.created_by === me.id).length;

  const saveProfile = async () => {
    if (busy || !dirty) return;
    setBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'update-self', patch: { display_name: displayName.trim(), username: username.trim(), color } }, session);
      notify("Profil mis à jour.");
      onChanged();
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const savePassword = async () => {
    if (pwBusy) return;
    if (pw.length < 8) { notify("Le mot de passe doit faire au moins 8 caractères.", "err"); return; }
    if (pw !== pw2) { notify("Les deux mots de passe sont différents.", "err"); return; }
    setPwBusy(true);
    let error = null;
    try { await callApi('/api/manage-account', { action: 'set-password', password: pw }, session); } catch (e) { error = e; }
    setPwBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setPw(""); setPw2("");
    notify("Mot de passe modifié.");
  };
  const deleteAccount = async () => {
    if (delBusy || confirmText.trim().toUpperCase() !== "SUPPRIMER") return;
    setDelBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'delete-self' }, session);
      await supabase.auth.signOut();
    } catch (e) { notify(e.message, "err"); setDelBusy(false); }
  };
  const card = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 14, padding: "20px 22px", marginBottom: 18, maxWidth: 560 };

  return (
    <div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: "0 0 20px" }}>Mon profil</h1>

      <div style={card}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
          <Avatar user={preview} size={52} />
          <div>
            <div style={{ fontWeight: 600, fontSize: 16 }}>{me.display_name}</div>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{roleLabel} · {me.email}</div>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 2 }}>{mineOpen} tâche(s) en cours · {created} créée(s)</div>
          </div>
        </div>
        <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
        <Field label="Identifiant (pour vous connecter et être mentionné avec @)"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur du profil</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" onClick={() => setColor(l.hex)} title={l.name} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: color === l.hex ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <button type="button" onClick={saveProfile} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "10px 22px", opacity: busy || !dirty ? 0.5 : 1, cursor: dirty ? "pointer" : "default" }}>{busy ? "Enregistrement…" : "Enregistrer"}</button>
      </div>

      <NotificationPrefs me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <BrowserNotifCard card={card} />

      <PersonalCard me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <LeaveCard me={me} session={session} isAdmin={isAdmin} leaves={leaves} notify={notify} card={card} />

      <HoursCard me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <CalendarFeedCard session={session} notify={notify} card={card} />

      <InstallCard card={card} />

      <ExportCard me={me} tasks={tasks} accounts={accounts} projects={projects} meetings={meetings} attendees={attendees} notify={notify} card={card} />

      <div style={card}>
        <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 12 }}>Changer de mot de passe</div>
        <Field label="Nouveau mot de passe (8 caractères minimum)"><input type="password" value={pw} onChange={e => setPw(e.target.value)} style={inputStyle} /></Field>
        <Field label="Confirmez le mot de passe"><input type="password" value={pw2} onChange={e => setPw2(e.target.value)} onKeyDown={e => { if (e.key === "Enter") savePassword(); }} style={inputStyle} /></Field>
        <button type="button" onClick={savePassword} disabled={pwBusy || !pw} style={{ ...secondaryBtn, padding: "10px 22px", opacity: pwBusy || !pw ? 0.5 : 1 }}>{pwBusy ? "…" : "Modifier le mot de passe"}</button>
      </div>

      <div style={{ ...card, borderColor: "#4A2A28" }}>
        <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 6, color: "#FF9A8F" }}>Supprimer mon compte</div>
        {isAdmin ? (
          <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6, margin: 0 }}>Vous êtes l'administrateur de ce serveur. Pour pouvoir supprimer votre compte, transférez d'abord l'administration à quelqu'un d'autre (onglet Admin → « Transférer l'administration »).</p>
        ) : (<>
          <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6, margin: "0 0 12px" }}>Cette action est définitive : votre compte et votre accès au serveur disparaissent. Les tâches que vous avez créées restent sur le serveur.</p>
          <Field label="Tapez SUPPRIMER pour confirmer"><input value={confirmText} onChange={e => setConfirmText(e.target.value)} style={inputStyle} /></Field>
          <button type="button" onClick={deleteAccount} disabled={delBusy || confirmText.trim().toUpperCase() !== "SUPPRIMER"} style={{ ...secondaryBtn, padding: "10px 22px", color: "#FF9A8F", borderColor: "#6A3532", opacity: confirmText.trim().toUpperCase() === "SUPPRIMER" ? 1 : 0.5 }}>{delBusy ? "Suppression…" : "Supprimer définitivement mon compte"}</button>
        </>)}
      </div>
    </div>
  );
}
