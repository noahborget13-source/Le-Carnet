/* ---------------- Export : tâches en CSV, agenda en .ics ---------------- */
const csvCell = (v) => { const t = String(v ?? ""); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
function buildTasksCsv(tasks, accounts, projects) {
  const head = ["Titre", "Statut", "Priorité", "Échéance", "Heure", "Assignés", "Projet", "Étiquettes", "Récurrence", "Notes", "Sous-tâches faites", "Créée le"];
  const rows = tasks.map(t => {
    const who = assigneeIds(t).map(id => (accounts.find(a => a.id === id) || {}).display_name).filter(Boolean).join(", ");
    const proj = (projects.find(p => p.id === t.project_id) || {}).name || "";
    const subs = t.subtasks || [];
    return [t.title, t.done ? "Terminée" : t.doing ? "En cours" : "À faire", (PRIORITIES.find(p => p.id === t.priority) || {}).label || "", t.due || "", t.due_time ? hhmm(t.due_time) : "", who, proj, [t.label, ...(t.tags || [])].filter(Boolean).join(" "), t.recurrence ? ((RECURRENCES.find(r => r.value === t.recurrence) || {}).label || t.recurrence) : "", t.notes || "", subs.length ? `${subs.filter(x => x.done).length}/${subs.length}` : "", t.created_at ? parisDay(Date.parse(t.created_at)) : ""];
  });
  // Point-virgule + BOM : s'ouvre correctement dans Excel en français
  return "\ufeff" + [head, ...rows].map(r => r.map(csvCell).join(";")).join("\r\n") + "\r\n";
}
const icsEsc = (v) => String(v || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const icsFoldLine = (line) => { const out = []; let cur = line; while (cur.length > 73) { out.push(cur.slice(0, 73)); cur = " " + cur.slice(73); } out.push(cur); return out.join("\r\n"); };
const icsUtc = (ms) => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
function buildCalendarIcs({ me, tasks, meetings, attendees }) {
  const stamp = icsUtc(Date.now());
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Le Carnet//FR", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Le Carnet"];
  for (const m of meetings) {
    if (m.created_by !== me.id && !attendees.some(a => a.meeting_id === m.id && a.user_id === me.id)) continue;
    L.push("BEGIN:VEVENT", `UID:meeting-${m.id}@le-carnet`, `DTSTAMP:${stamp}`, `DTSTART:${icsUtc(Date.parse(m.starts_at))}`, `DTEND:${icsUtc(Date.parse(m.ends_at))}`, `SUMMARY:${icsEsc("📹 " + m.title)}`, `DESCRIPTION:${icsEsc((m.notes ? m.notes + "\n" : "") + "Appel : " + meetLink(m))}`, `URL:${meetLink(m)}`, "END:VEVENT");
  }
  for (const t of tasks) {
    if (t.done || !t.due || !assigneeIds(t).includes(me.id)) continue;
    L.push("BEGIN:VEVENT", `UID:task-${t.id}@le-carnet`, `DTSTAMP:${stamp}`);
    if (t.due_time) { const a = parisInstant(t.due, hhmm(t.due_time)); L.push(`DTSTART:${icsUtc(a)}`, `DTEND:${icsUtc(a + 30 * 60000)}`); }
    else L.push(`DTSTART;VALUE=DATE:${t.due.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${shiftDay(t.due, 1).replace(/-/g, "")}`);
    L.push(`SUMMARY:${icsEsc("☑ " + t.title)}`, ...(t.notes ? [`DESCRIPTION:${icsEsc(t.notes)}`] : []), "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFoldLine).join("\r\n") + "\r\n";
}
/* ---- Export Word (.docx) : fichier ZIP minimal écrit à la main, sans bibliothèque ---- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (bytes) => { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const u16 = (n) => [n & 255, (n >>> 8) & 255], u32 = (n) => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  for (const [name, text] of files) {
    const nameB = enc.encode(name), data = enc.encode(text), crc = crc32(data);

    parts.push(head, nameB, data);
    central.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), nameB);

const xmlEsc = (v) => String(v ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/** Paragraphes d'une cellule : chaque ligne de `lines` = { t, b?, sz?, color? } */
const docxCell = (w, lines, shade) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${shade}"/>` : ""}</w:tcPr>${(lines.length ? lines : [{ t: "" }]).map(l => `<w:p><w:pPr><w:spacing w:before="0" w:after="40"/></w:pPr><w:r><w:rPr>${l.b ? "<w:b/>" : ""}${l.color ? `<w:color w:val="${l.color}"/>` : ""}<w:sz w:val="${l.sz || 20}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(l.t)}</w:t></w:r></w:p>`).join("")}</w:tc>`;
function buildTasksDocx({ title, subtitle, tasks, accounts, projects }) {
  const cols = [["Tâche", 5200], ["Statut", 1300], ["Priorité", 1200], ["Échéance", 1900], ["Assignés", 2200], ["Projet", 1800]];
  const border = ["top", "left", "bottom", "right", "insideH", "insideV"].map(b => `<w:${b} w:val="single" w:sz="4" w:space="0" w:color="BFC5D2"/>`).join("");
  const head = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${cols.map(([n, w]) => docxCell(w, [{ t: n, b: true, sz: 20 }], "E8EBF5")).join("")}</w:tr>`;
  const rows = tasks.map(t => {
    const who = assigneeIds(t).map(id => (accounts.find(a => a.id === id) || {}).display_name).filter(Boolean).join(", ");
    const proj = (projects.find(p => p.id === t.project_id) || {}).name || "";
    const subs = t.subtasks || [];
    const main = [{ t: t.title, b: true }];
    if ((t.tags || []).length) main.push({ t: t.tags.map(x => "#" + x).join(" "), sz: 16, color: "6B7385" });
    if (t.notes) t.notes.split(/\r?\n/).slice(0, 12).forEach(l => main.push({ t: l, sz: 18, color: "444B5C" }));
    subs.forEach(x => main.push({ t: (x.done ? "☑ " : "☐ ") + x.text, sz: 18 }));
    const due = t.due ? formatDue(t.due, daysUntil(t.due)) + (t.due_time ? " · " + hhmm(t.due_time) : "") : "";
    const status = t.done ? "Terminée" : t.doing ? "En cours" : "À faire";
    return `<w:tr><w:trPr><w:cantSplit/></w:trPr>${[main, [{ t: status, color: t.done ? "2E8B57" : undefined }], [{ t: (PRIORITIES.find(p => p.id === t.priority) || {}).label || "" }], [{ t: due, color: !t.done && t.due && dueInfo(t).late ? "C0392B" : undefined }], [{ t: who }], [{ t: proj }]].map((l, i) => docxCell(cols[i][1], l)).join("")}</w:tr>`;
  }).join("");
  const body = `<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="40"/></w:rPr><w:t>${xmlEsc(title)}</w:t></w:r></w:p><w:p><w:pPr><w:spacing w:after="240"/></w:pPr><w:r><w:rPr><w:color w:val="6B7385"/><w:sz w:val="20"/></w:rPr><w:t xml:space="preserve">${xmlEsc(subtitle)}</w:t></w:r></w:p>`
    + (tasks.length ? `<w:tbl><w:tblPr><w:tblW w:w="${cols.reduce((n, c) => n + c[1], 0)}" w:type="dxa"/><w:tblBorders>${border}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${cols.map(c => `<w:gridCol w:w="${c[1]}"/>`).join("")}</w:tblGrid>${head}${rows}</w:tbl>` : `<w:p><w:r><w:t>Aucune tâche.</w:t></w:r></w:p>`)

  return zipStore([
    ["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ["word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`],
  ]);
}
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function downloadText(name, mime, content) {
  const url = URL.createObjectURL(new Blob([content], { type: mime + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function ExportCard({ me, tasks, accounts, projects, meetings, attendees, notify, card }) {
  const today = parisDay();
  const exportCsv = (mineOnly) => {
    const list = mineOnly ? tasks.filter(t => assigneeIds(t).includes(me.id)) : tasks;
    downloadText(`le-carnet-taches-${today}.csv`, "text/csv", buildTasksCsv(list, accounts, projects));
    notify(`${list.length} tâche(s) exportée(s).`);
  };
  const exportIcs = () => {
    const ics = buildCalendarIcs({ me, tasks, meetings, attendees });
    downloadText(`le-carnet-agenda-${today}.ics`, "text/calendar", ics);
    notify("Agenda exporté : ouvrez le fichier pour l'ajouter à Google Agenda, Outlook ou Apple Calendrier.");
  };
  const exportDocx = (mineOnly) => {
    const list = (mineOnly ? tasks.filter(t => assigneeIds(t).includes(me.id)) : tasks).slice().sort((a, b) => Number(a.done) - Number(b.done) || dueKey(a).localeCompare(dueKey(b)));
    const blob = buildTasksDocx({ title: mineOnly ? "Mes tâches" : "Tâches du serveur", subtitle: `Le Carnet · ${me.display_name} · exporté le ${new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "Europe/Paris" })} · ${list.length} tâche(s)`, tasks: list, accounts, projects });
    downloadBlob(`le-carnet-${mineOnly ? "mes-taches" : "taches"}-${today}.docx`, blob);
    notify(`${list.length} tâche(s) exportée(s) en Word.`);
  };
  return (
    <div data-export-card style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Exporter mes données</div>
      <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 12px" }}>Conservez une copie de vos tâches (Word ou tableur) ou ajoutez vos échéances et réunions à un autre agenda. Seul ce serveur est concerné.</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button type="button" data-export="csv-mine" onClick={() => exportCsv(true)} style={chipBtn}>⬇ Mes tâches (CSV)</button>
        <button type="button" data-export="csv-all" onClick={() => exportCsv(false)} style={chipBtn}>⬇ Toutes les tâches visibles (CSV)</button>
        <button type="button" data-export="docx-mine" onClick={() => exportDocx(true)} style={chipBtn}>📄 Mes tâches (Word)</button>
        <button type="button" data-export="docx-all" onClick={() => exportDocx(false)} style={chipBtn}>📄 Toutes les tâches visibles (Word)</button>
        <button type="button" data-export="ics" onClick={exportIcs} style={chipBtn}>📅 Mon agenda (.ics)</button>
      </div>
    </div>
  );
}

function InstallCard({ card }) {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(n => n + 1); window.addEventListener('carnet-install-ready', f); return () => window.removeEventListener('carnet-install-ready', f); }, []);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const prompt = window.__installPrompt;
  const install = async () => {
    if (!prompt) return;
    prompt.prompt();
    try { await prompt.userChoice; } catch (_) {}
    window.__installPrompt = null; force(n => n + 1);
  };
  return (
    <div style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}><I.Check size={16} /> Application</div>
      {standalone ? (
        <div style={{ fontSize: 13.5, color: "var(--text-dim)", lineHeight: 1.55 }}>Le Carnet est installé sur cet appareil.</div>
      ) : prompt ? (
        <>
          <div style={{ fontSize: 13.5, color: "var(--text-dim)", lineHeight: 1.55, marginBottom: 12 }}>Installez Le Carnet comme une vraie application : icône sur l'écran d'accueil, plein écran, sans barre d'adresse.</div>
          <button type="button" onClick={install} style={{ ...primaryBtn, padding: "10px 22px" }}>Installer l'application</button>
        </>
      ) : ios ? (
        <div style={{ fontSize: 13.5, color: "var(--text-dim)", lineHeight: 1.6 }}>Sur iPhone et iPad : ouvrez cette page dans <strong>Safari</strong>, appuyez sur le bouton <strong>Partager</strong> (le carré avec une flèche), puis sur <strong>Sur l'écran d'accueil</strong>.</div>
      ) : (
        <div style={{ fontSize: 13.5, color: "var(--text-dim)", lineHeight: 1.6 }}>Pour l'installer : dans le menu de votre navigateur (⋮ ou ⋯), choisissez <strong>Installer l'application</strong> ou <strong>Ajouter à l'écran d'accueil</strong>. Si l'option n'apparaît pas, ouvrez le site dans Chrome, Edge ou Safari.</div>
      )}
    </div>
  );
}

/* ---------------- Notifications par email : une case par type ---------------- */
const NOTIF_OPTIONS = [
  { key: "notify_assigned", label: "Quand une tâche m'est assignée" },
  { key: "notify_soon", label: "Quand il me reste peu de temps avant l'heure limite d'une tâche" },
  { key: "notify_overdue", label: "Quand une de mes tâches est en retard" },
  { key: "notify_digest", label: "Chaque matin : récapitulatif d'aujourd'hui et de demain" },
  { key: "notify_meetings", label: "Invitations et rappels de réunion" },
  { key: "notify_weekly", label: "Chaque lundi : le résumé de votre semaine (tâches, réunions, absences, anniversaires)" },
  { key: "notify_dm", label: "Quand quelqu'un vous écrit en message privé (un email au plus toutes les 30 minutes par personne)" },
  { key: "notify_conflicts", label: "Avertissements quand deux tâches ou réunions se chevauchent (ou tombent pendant un congé)" },
];
const LEAD_OPTIONS = [{ v: 15, l: "15 minutes" }, { v: 30, l: "30 minutes" }, { v: 60, l: "1 heure" }, { v: 120, l: "2 heures" }, { v: 240, l: "4 heures" }, { v: 720, l: "12 heures" }, { v: 1440, l: "1 jour" }];
function NotificationPrefs({ me, session, notify, onChanged, card }) {
  const read = () => ({ notify_assigned: me.notify_assigned !== false, notify_soon: me.notify_soon !== false, notify_overdue: me.notify_overdue !== false, notify_digest: me.notify_digest !== false, notify_meetings: me.notify_meetings !== false, notify_conflicts: me.notify_conflicts !== false, notify_weekly: me.notify_weekly !== false, notify_dm: me.notify_dm !== false, remind_lead_minutes: me.remind_lead_minutes || 120 });
  const [prefs, setPrefs] = useState(read);
  const [busy, setBusy] = useState(false);
  const save = async (patch) => {
    const prev = prefs;
    setPrefs(p => ({ ...p, ...patch })); setBusy(true);
    try { await callApi('/api/manage-account', { action: 'update-self', patch }, session); notify("Préférences enregistrées."); onChanged(); }
    catch (e) { setPrefs(prev); notify(e.message, "err"); }
    setBusy(false);
  };
  return (
    <div style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}><I.Mail size={16} /> Notifications par email</div>
      <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 12px" }}>Envoyées à {me.email}. Les changements sont enregistrés tout de suite.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {NOTIF_OPTIONS.map(o => (
          <label key={o.key} style={{ display: "flex", alignItems: "flex-start", gap: 10, fontSize: 13.5, cursor: "pointer", padding: "6px 0" }}>
            <input type="checkbox" checked={prefs[o.key]} disabled={busy} onChange={e => save({ [o.key]: e.target.checked })} style={{ width: 16, height: 16, marginTop: 2, accentColor: "var(--accent)", flexShrink: 0 }} />
            <span>{o.label}</span>
          </label>
        ))}
      </div>
      {prefs.notify_soon && (
        <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontSize: 13.5 }}>
          <span style={{ color: "var(--text-dim)" }}>Me prévenir</span>
          <select value={prefs.remind_lead_minutes} disabled={busy} onChange={e => save({ remind_lead_minutes: Number(e.target.value) })} style={{ ...inputStyle, width: "auto", padding: "7px 10px" }}>
            {LEAD_OPTIONS.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
          </select>
          <span style={{ color: "var(--text-dim)" }}>avant l'heure limite</span>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Tasks
   ============================================================ */
const statusOf = (t) => t.done ? "done" : t.doing ? "doing" : "todo";
const COLUMNS = [
  { id: "todo", label: "À faire", hex: "#9098A8" },
  { id: "doing", label: "En cours", hex: "#FFB648" },
  { id: "done", label: "Terminé", hex: "#5FBF8B" },
];

function TasksView({ me, session, isAdmin, myPerms, accounts, tasks, trashed, templates, comments, attachments, onOpen, notify, projects = [], projectMembers = [] }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showTrash, setShowTrash] = useState(false);
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("priority");
  const [filterLabel, setFilterLabel] = useState(null);
  const [filterDone, setFilterDone] = useState("open");
  const [filterMine, setFilterMine] = useState(false);
  const [filterProject, setFilterProject] = useState("");
  const [filterDue, setFilterDue] = useState("");
  const [showProjects, setShowProjects] = useState(false);
  const canCreateProject = isAdmin || me.role === "moderator";
  const [view, setView] = useState(() => { try { const v = localStorage.getItem("carnet-view"); return v === "kanban" || v === "week" || v === "gantt" ? v : "list"; } catch (_) { return "list"; } });
  useEffect(() => {
    const f = () => { window.__carnetNewTask = false; if (isAdmin || myPerms.createTasks) { setEditing(null); setShowForm(true); } };
    if (window.__carnetNewTask) f();
    window.addEventListener("carnet-new-task", f);
    return () => window.removeEventListener("carnet-new-task", f);
  }, [isAdmin, myPerms.createTasks]);
  const changeView = (v) => { setView(v); if (v === "week") setFilterMine(true); try { localStorage.setItem("carnet-view", v); } catch (_) {} };
  const moveDue = async (t, day) => {
    const patch = day ? duePatch(t, day) : { due: null, due_time: null, start_date: null };
    const { error } = await supabase.from("tasks").update(patch).eq("id", t.id);
    notify(error ? "Vous n'avez pas le droit de modifier cette tâche." : (day ? `« ${t.title} » déplacée au ${fmtDay(day, { weekday: "long", day: "numeric", month: "long" })}.` : `« ${t.title} » n'a plus de date.`), error ? "err" : "ok");
  };

  const visible = useMemo(() => {
    let list = tasks.filter(t => {
      if (view === "list") {
        if (filterDone === "open" && t.done) return false;
        if (filterDone === "done" && !t.done) return false;
        if (filterDue === "none" && t.due) return false;
        if (filterDue && filterDue !== "none") {
          if (!t.due) return false;
          const d = daysUntil(t.due);
          if (filterDue === "late" && !(!t.done && dueInfo(t).late)) return false;
          if (filterDue === "today" && d !== 0) return false;
          if (filterDue === "week" && !(d >= 0 && d <= 7)) return false;
        }
      }
      if (filterLabel && t.label !== filterLabel) return false;
      if (filterMine && !assigneeIds(t).includes(me.id)) return false;
      if (filterProject === "none" ? t.project_id : (filterProject && t.project_id !== filterProject)) return false;
      if (query && ![t.title, t.notes || "", ...(t.tags || [])].join(" ").toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
    list.sort((a, b) => {
      if (sortBy === "priority") return b.priority - a.priority || dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "due") return dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "title") return a.title.localeCompare(b.title, "fr");
      return 0;
    });
    return list;
  }, [tasks, query, sortBy, filterLabel, filterDone, filterMine, filterProject, filterDue, view, me.id]);

  const canEditTask = (t) => isAdmin || myPerms.editAnyTask || (t.created_by === me.id && myPerms.editOwnTask);
  const tellAssignees = async (taskId, userIds) => {
    if (!userIds.length) return 0;
    try { const r = await callApi('/api/notify-task', { taskId, userIds }, session); return r.sent || 0; }
    catch (_) { return 0; }
  };
  const saveTemplate = async (draft, name) => {
    const { error } = await supabase.from('task_templates').insert({
      server_id: me.server_id, created_by: me.id, name: name.slice(0, 80), title: draft.title, notes: draft.notes || "",
      label: draft.label, priority: draft.priority, tags: draft.tags || [], recurrence: draft.recurrence || null,
      subtasks: (draft.subtasks || []).map(x => ({ ...x, done: false })),
    });
    return error ? error.message : null;
  };
  const saveTask = async (draft) => {
    const { saveAsTemplate, __files = [], ...data } = draft;
    let taskId = data.id || null, toNotify = [], message;
    data.assignee = (data.assignees || [])[0] || null;
    if (data.id) {
      const { id, ...rest } = data;
      const { error } = await supabase.from('tasks').update(rest).eq('id', id);
      if (error) { notify(error.message, "err"); return; }
      toNotify = (rest.assignees || []).filter(x => x !== me.id && !(editing ? assigneeIds(editing) : []).includes(x));
      message = "Tâche mise à jour.";
    } else {
      const { data: created, error } = await supabase.from('tasks').insert({ ...data, done: false, created_by: me.id, server_id: me.server_id }).select().single();
      if (error) { notify(error.message, "err"); return; }
      taskId = created ? created.id : null;
      toNotify = created ? (data.assignees || []).filter(x => x !== me.id) : [];
      message = "Tâche créée.";
    }
    if (saveAsTemplate) {
      const err = await saveTemplate(data, saveAsTemplate);
      message += err ? " (Modèle non enregistré : " + err + ")" : " Modèle enregistré.";
    }
    // La tâche est enregistrée : la fenêtre se ferme tout de suite. Fichiers et e-mails partent ensuite, en arrière-plan.
    notify(message);
    setShowForm(false); setEditing(null);
    (async () => {
      if (__files.length && taskId) {
        const n = await uploadAttachments(__files, { me, folder: taskId, table: "task_attachments", extra: { task_id: taskId }, existing: attachments.filter(a => a.task_id === taskId).length, noun: "tâche", notify });
        if (n < __files.length) notify("Tâche enregistrée, mais certains fichiers n'ont pas pu être joints.", "err");
      }
      if (taskId && toNotify.length) {
        const sent = await tellAssignees(taskId, toNotify);
        if (sent) notify(sent === 1 ? "E-mail envoyé à la personne assignée." : `E-mails envoyés (${sent}).`);
      }
    })();
  };
  const deleteTemplate = async (id) => {
    const { error } = await supabase.from('task_templates').delete().eq('id', id);
    notify(error ? error.message : "Modèle supprimé.", error ? "err" : "ok");
  };

  const restoreTask = async (id) => {
    const { error } = await supabase.rpc('restore_task', { p_id: id });
    notify(error ? error.message : "Tâche restaurée.", error ? "err" : "ok");
  };
  const removeTask = async (t) => {
    const { error } = await supabase.rpc('trash_task', { p_id: t.id });
    if (error) { notify(error.message, "err"); return; }
    notify("Tâche placée dans la corbeille.", "ok", { label: "Annuler", onClick: () => restoreTask(t.id) });
  };
  const purgeTask = async (t) => {
    const paths = attachments.filter(a => a.task_id === t.id).map(a => a.path);
    const { error } = await supabase.from('tasks').delete().eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (paths.length) await supabase.storage.from('task-files').remove(paths);
    notify("Tâche supprimée définitivement.");
  };

  const spawnNext = async (t) => {
    const next = nextOccurrence(t.due, t.recurrence);
    const ids = assigneeIds(t);
    const { error } = await supabase.from('tasks').insert({
      title: t.title, notes: t.notes, label: t.label, priority: t.priority, due: next, start_date: t.start_date && t.due ? shiftDay(next, -daysBetween(t.start_date, t.due)) : null, due_time: t.due_time || null, assignee: ids[0] || null, assignees: ids,
      tags: t.tags || [], subtasks: (t.subtasks || []).map(x => ({ ...x, done: false })), recurrence: t.recurrence,
      done: false, created_by: t.created_by, server_id: me.server_id, project_id: t.project_id || null,
    });
    return { next, error };
  };
  const setStatus = async (t, status) => {
    if (statusOf(t) === status) return;
    const patch = status === "done" ? { done: true } : status === "doing" ? { done: false, doing: true } : { done: false, doing: false };
    const { error } = await supabase.from('tasks').update(patch).eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (status === "done" && !t.done && t.recurrence) {
      const { next, error: e2 } = await spawnNext(t);
      notify(e2 ? "Terminée, mais la prochaine occurrence n'a pas pu être créée." : `Terminée · prochaine échéance : ${formatDue(next, daysUntil(next))}.`, e2 ? "err" : "ok");
    }
  };
  const toggleDone = (t) => setStatus(t, t.done ? "todo" : "done");

  // ---- Sélection multiple (vue Liste) : terminer, reporter ou supprimer plusieurs tâches d'un coup
  const [selectMode, setSelectMode] = useState(false);
  const [picked, setPicked] = useState([]);
  const [bulkBusy, setBulkBusy] = useState(false);
  const canDeleteTask = (t) => isAdmin || myPerms.deleteAnyTask || (t.created_by === me.id && myPerms.deleteOwnTask);
  const pickedTasks = visible.filter(t => picked.includes(t.id));
  const exitSelect = () => { setSelectMode(false); setPicked([]); };
  const bulk = async (kind) => {
    if (bulkBusy || !pickedTasks.length) return;
    const allowed = pickedTasks.filter(t => (kind === "delete" ? canDeleteTask(t) : canEditTask(t)) && (kind !== "done" || !t.done) && (kind !== "tomorrow" || (t.due && !t.done)));
    const skipped = pickedTasks.length - allowed.length;
    if (!allowed.length) { notify(kind === "tomorrow" ? "Aucune tâche sélectionnée n'a d'échéance à reporter." : kind === "done" ? "Ces tâches sont déjà terminées ou vous ne pouvez pas les modifier." : "Vous n'avez pas le droit d'agir sur ces tâches.", "err"); return; }
    setBulkBusy(true);
    let ok = 0;
    const tomorrow = shiftDay(parisDay(), 1);
    for (const t of allowed) {
      let error = null;
      if (kind === "done") { await setStatus(t, "done"); ok++; continue; }
      if (kind === "tomorrow") ({ error } = await supabase.from('tasks').update(duePatch(t, tomorrow)).eq('id', t.id));
      else ({ error } = await supabase.rpc('trash_task', { p_id: t.id }));
      if (!error) ok++;
    }
    setBulkBusy(false);
    const what = kind === "done" ? "terminée(s)" : kind === "tomorrow" ? "reportée(s) à demain" : "placée(s) dans la corbeille";
    const undo = kind === "delete" && ok ? { label: "Annuler", onClick: async () => { for (const t of allowed) await supabase.rpc('restore_task', { p_id: t.id }); } } : undefined;
    notify(`${ok} tâche(s) ${what}${skipped ? ` · ${skipped} ignorée(s) (droits ou état)` : ""}.`, ok ? "ok" : "err", undo);
    exitSelect();
  };

  const counts = { open: tasks.filter(t => !t.done).length, late: tasks.filter(t => !t.done && t.due && dueInfo(t).late).length };
  const viewBtn = (id, Icon, title) => (
    <button key={id} type="button" title={title} onClick={() => changeView(id)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6, padding: "8px 10px", background: view === id ? "var(--panel-2)" : "var(--bg-2)", color: view === id ? "var(--text)" : "var(--text-dim)", borderColor: view === id ? "var(--accent)" : "var(--border-soft)" }}><Icon size={14} /> <span className="hide-mobile">{title}</span></button>
  );
  const openEdit = (t) => { setEditing(t); setShowForm(true); };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Tâches</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>{counts.open} en cours{counts.late > 0 && <span style={{ color: "#FF9A8F" }}> · {counts.late} en retard</span>}</p></div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {(projects.length > 0 || canCreateProject) && <button type="button" data-open-projects onClick={() => setShowProjects(true)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6 }}>📁 Projets{projects.length ? ` (${projects.length})` : ""}</button>}
          {trashed.length > 0 && <button type="button" onClick={() => setShowTrash(true)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6 }}><I.Trash size={14} /> Corbeille ({trashed.length})</button>}
          <button onClick={() => { setEditing(null); setShowForm(true); }} style={{ display: (isAdmin || myPerms.createTasks) ? "flex" : "none", alignItems: "center", gap: 7, ...primaryBtn, padding: "10px 16px", width: "auto" }}><I.Plus size={16} /> Nouvelle tâche</button>
        </div>
      </div>
      <div className="task-toolbar" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 6 }}>{viewBtn("list", I.List, "Liste")}{viewBtn("kanban", I.Columns, "Kanban")}{viewBtn("week", I.Calendar, "Semaine")}{viewBtn("gantt", I.Calendar, "Chronologie")}</div>
        <div style={{ position: "relative", flex: "1 1 220px", minWidth: 180 }}><I.Search size={14} style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)" }} /><input data-search value={query} onChange={e => setQuery(e.target.value)} placeholder="Rechercher (titre, notes, #étiquette)…" style={{ ...inputStyle, paddingLeft: 32, background: "var(--bg-2)" }} /></div>
        <SelectPill icon={I.Sort} value={sortBy} onChange={setSortBy} options={[{ value: "priority", label: "Trier : priorité" }, { value: "due", label: "Trier : échéance" }, { value: "title", label: "Trier : titre" }]} />
        {view === "list" && <button type="button" data-select-toggle onClick={() => (selectMode ? exitSelect() : setSelectMode(true))} style={{ ...chipBtn, borderColor: selectMode ? "var(--accent)" : "var(--border-soft)", color: selectMode ? "var(--text)" : "var(--text-dim)" }}>{selectMode ? "✕ Quitter la sélection" : "☑ Sélectionner"}</button>}
        {view === "list" && <SelectPill icon={I.Calendar} value={filterDue} onChange={setFilterDue} options={[{ value: "", label: "Toutes les échéances" }, { value: "late", label: "En retard" }, { value: "today", label: "Aujourd'hui" }, { value: "week", label: "7 prochains jours" }, { value: "none", label: "Sans échéance" }]} />}
        {view === "list" && <SelectPill icon={I.Filter} value={filterDone} onChange={setFilterDone} options={[{ value: "open", label: "À faire" }, { value: "done", label: "Terminées" }, { value: "all", label: "Toutes" }]} />}
        {projects.length > 0 && <SelectPill icon={I.Filter} value={filterProject} onChange={setFilterProject} options={[{ value: "", label: "Tous les projets" }, { value: "none", label: "Sans projet" }, ...projects.map(p => ({ value: p.id, label: (p.is_private ? "🔒 " : "") + p.name }))]} />}
        <button onClick={() => setFilterMine(m => !m)} style={{ ...chipBtn, background: filterMine ? "var(--panel-2)" : "var(--bg-2)", color: filterMine ? "var(--text)" : "var(--text-dim)", borderColor: filterMine ? "var(--accent)" : "var(--border-soft)" }}>Assignées à moi</button>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto" }}>{LABELS.map(l => (<button key={l.id} title={l.name} onClick={() => setFilterLabel(f => f === l.id ? null : l.id)} style={{ width: 22, height: 22, borderRadius: "50%", background: l.hex, cursor: "pointer", border: filterLabel === l.id ? "2px solid var(--text)" : "2px solid transparent" }} />))}</div>
      </div>

      {view === "list" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {visible.length === 0 && <EmptyState text="Aucune tâche ici." />}
          {visible.map(t => (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              {selectMode && <input type="checkbox" data-pick={t.id} checked={picked.includes(t.id)} onChange={() => setPicked(p => (p.includes(t.id) ? p.filter(x => x !== t.id) : [...p, t.id]))} aria-label={"Sélectionner « " + t.title + " »"} style={{ width: 18, height: 18, flexShrink: 0, accentColor: "var(--accent)", cursor: "pointer" }} />}
              <div style={{ flex: 1, minWidth: 0 }}><TaskCard task={t} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} project={projects.find(p => p.id === t.project_id)} commentCount={comments.filter(c => c.task_id === t.id).length} attachCount={attachments.filter(a => a.task_id === t.id).length} onOpen={() => onOpen(t.id)} onTagClick={setQuery} onToggle={() => toggleDone(t)} onEdit={() => openEdit(t)} onDelete={() => removeTask(t)} /></div>
            </div>
          ))}
          {selectMode && (
            <div data-bulk-bar style={{ position: "sticky", bottom: 12, zIndex: 20, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 12, padding: "10px 14px", boxShadow: "0 8px 30px rgba(0,0,0,.35)" }}>
              <span style={{ fontSize: 13, fontWeight: 600, marginRight: "auto" }}>{pickedTasks.length} sélectionnée(s)</span>
              <button type="button" data-bulk="all" onClick={() => setPicked(picked.length === visible.length ? [] : visible.map(t => t.id))} style={chipBtn}>{picked.length === visible.length && visible.length ? "Tout désélectionner" : "Tout sélectionner"}</button>
              <button type="button" data-bulk="done" disabled={!pickedTasks.length || bulkBusy} onClick={() => bulk("done")} style={{ ...chipBtn, opacity: pickedTasks.length ? 1 : 0.5 }}>✓ Terminer</button>
              <button type="button" data-bulk="tomorrow" disabled={!pickedTasks.length || bulkBusy} onClick={() => bulk("tomorrow")} style={{ ...chipBtn, opacity: pickedTasks.length ? 1 : 0.5 }}>⏭ Reporter à demain</button>
              <button type="button" data-bulk="delete" disabled={!pickedTasks.length || bulkBusy} onClick={() => bulk("delete")} style={{ ...chipBtn, color: "#FF9A8F", opacity: pickedTasks.length ? 1 : 0.5 }}>🗑 Corbeille</button>
            </div>
          )}
        </div>
      ) : view === "gantt" ? (
        <GanttBoard tasks={visible} accounts={accounts} onOpen={onOpen} />
      ) : view === "week" ? (
        <WeekBoard tasks={visible} accounts={accounts} canEditTask={canEditTask} onOpen={onOpen} onMoveDue={moveDue} />
      ) : (
        <KanbanBoard tasks={visible} accounts={accounts} canEditTask={canEditTask} onOpen={onOpen} onMove={setStatus} />
      )}

      {showProjects && <ProjectsModal projects={projects} members={projectMembers} accounts={accounts} me={me} isAdmin={isAdmin} canCreate={canCreateProject} notify={notify} onClose={() => setShowProjects(false)} />}
      {showForm && <TaskForm projects={projects} projectMembers={projectMembers} defaultProject={filterProject && filterProject !== "none" ? filterProject : ""} initial={editing} meId={me.id} accounts={accounts} templates={templates} tasks={tasks} onDeleteTemplate={deleteTemplate} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={saveTask} />}
      {showTrash && <TrashModal trashed={trashed} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} onRestore={restoreTask} onPurge={purgeTask} onClose={() => setShowTrash(false)} />}
    </div>
  );
}
function SelectPill({ icon: Icon, value, onChange, options }) {
  return (<div style={{ position: "relative" }}><Icon size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /><select value={value} onChange={e => onChange(e.target.value)} style={{ ...chipBtn, paddingLeft: 28, paddingRight: 26, appearance: "none", cursor: "pointer" }}>{options.map(o => <option key={o.value} value={o.value} style={{ background: "var(--bg-2)" }}>{o.label}</option>)}</select><I.Chevron size={12} style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /></div>);
}

/* ---------------- Vue Kanban ---------------- */
function KanbanBoard({ tasks, accounts, canEditTask, onOpen, onMove }) {
  const [overCol, setOverCol] = useState(null);
  const byCol = { todo: [], doing: [], done: [] };
  for (const t of tasks) byCol[statusOf(t)].push(t);
  byCol.done.sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  const DONE_LIMIT = 15;
  const drop = (e, col) => {
    e.preventDefault(); setOverCol(null);
    const id = e.dataTransfer.getData("text/plain");
    const t = tasks.find(x => x.id === id);
    if (t) onMove(t, col);
  };
  return (
    <div className="kanban" style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 14, alignItems: "start" }}>
      {COLUMNS.map((col, ci) => {
        const list = col.id === "done" ? byCol.done.slice(0, DONE_LIMIT) : byCol[col.id];
        return (
          <div key={col.id} onDragOver={e => { e.preventDefault(); if (overCol !== col.id) setOverCol(col.id); }} onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setOverCol(null); }} onDrop={e => drop(e, col.id)}
            style={{ background: overCol === col.id ? "#5B6EF514" : "var(--bg-2)", border: `1px solid ${overCol === col.id ? "var(--accent)" : "var(--border)"}`, borderRadius: 14, padding: 10, minHeight: 140 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 6px 10px", fontSize: 13, fontWeight: 700 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: col.hex }} /> {col.label}
              <span style={{ color: "var(--text-dimmer)", fontWeight: 500 }}>{byCol[col.id].length}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {list.length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", textAlign: "center", padding: "18px 0" }}>Glisse une tâche ici</div>}
              {list.map(t => {
                const label = LABELS.find(l => l.id === t.label) || LABELS[0];
                const prio = PRIORITIES.find(p => p.id === t.priority) || PRIORITIES[1];
                const di = dueInfo(t);
                const late = Boolean(di && di.late);
                const people = assigneeIds(t).map(id => accounts.find(a => a.id === id)).filter(Boolean);
                const editable = canEditTask(t);
                return (
                  <div key={t.id} draggable={editable} onDragStart={e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; }}
                    style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `4px solid ${label.hex}`, borderRadius: 10, padding: "10px 12px", cursor: editable ? "grab" : "default", opacity: t.done ? 0.65 : 1 }}>
                    <div onClick={() => onOpen(t.id)} style={{ fontSize: 13.5, fontWeight: 600, cursor: "pointer", wordBreak: "break-word", textDecoration: t.done ? "line-through" : "none" }}>{t.title}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11, fontWeight: 600, color: prio.hex }}><I.Flag size={10} /> {prio.label}</span>
                      {t.due && <span style={{ fontSize: 11.5, color: late ? "#FF9A8F" : "var(--text-dim)" }}>{di.label}</span>}
                      {(t.subtasks || []).length > 0 && <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>☑ {t.subtasks.filter(x => x.done).length}/{t.subtasks.length}</span>}
                      <span style={{ marginLeft: "auto" }}><AvatarStack users={people} size={20} max={3} /></span>
                    </div>
                    {editable && (
                      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                        {ci > 0 && <button type="button" onClick={() => onMove(t, COLUMNS[ci - 1].id)} style={{ ...iconBtn, padding: "2px 8px", fontSize: 11 }} title={"Déplacer vers « " + COLUMNS[ci - 1].label + " »"}>←</button>}
                        {ci < 2 && <button type="button" onClick={() => onMove(t, COLUMNS[ci + 1].id)} style={{ ...iconBtn, padding: "2px 8px", fontSize: 11, marginLeft: ci === 0 ? "auto" : 0 }} title={"Déplacer vers « " + COLUMNS[ci + 1].label + " »"}>→</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              {col.id === "done" && byCol.done.length > DONE_LIMIT && <div style={{ fontSize: 12, color: "var(--text-dimmer)", textAlign: "center" }}>+ {byCol.done.length - DONE_LIMIT} plus ancienne(s) — voir la vue Liste</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Corbeille ---------------- */
function TrashModal({ trashed, accounts, me, isAdmin, myPerms, onRestore, onPurge, onClose }) {
  const can = (t) => isAdmin || me.role === "moderator" || myPerms.deleteAnyTask || (t.created_by === me.id && myPerms.deleteOwnTask);
  const [confirmId, setConfirmId] = useState(null);
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ ...modalStyle, width: 520 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>Corbeille</h2><button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <p style={{ fontSize: 12.5, color: "var(--text-dimmer)", margin: "0 0 16px" }}>Les tâches supprimées sont conservées 30 jours, puis effacées automatiquement.</p>
        {trashed.length === 0 && <EmptyState text="La corbeille est vide." />}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {trashed.map(t => {
            const who = accounts.find(a => a.id === t.deleted_by);
            const daysLeft = Math.max(0, 30 - Math.floor((Date.now() - new Date(t.deleted_at).getTime()) / 86400000));
            return (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 10, padding: "10px 12px", flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 150 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, wordBreak: "break-word" }}>{t.title}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>Supprimée {who ? "par " + who.display_name + " " : ""}· encore {daysLeft} j</div>
                </div>
                {can(t) ? (confirmId === t.id ? (<>
                  <button type="button" onClick={() => { setConfirmId(null); onPurge(t); }} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, color: "#FF9A8F" }}>Confirmer</button>
                  <button type="button" onClick={() => setConfirmId(null)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12 }}>Non</button>
                </>) : (<>
                  <button type="button" onClick={() => onRestore(t.id)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 5 }}><I.Undo size={12} /> Restaurer</button>
                  <button type="button" onClick={() => setConfirmId(t.id)} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer définitivement"><I.Trash size={13} /></button>
                </>)) : <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>Pas les droits</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/** « Mes serveurs » : changer de serveur avec le même compte, en créer un nouveau, ou en rejoindre un autre. */
function ServersModal({ me, session, notify, onClose, initialCode = "" }) {
  const [list, setList] = useState(null);
  const [mode, setMode] = useState(initialCode ? "join" : "list");   // list | create | join
  const [busy, setBusy] = useState(false);
  const [f, setF] = useState({ serverName: "", code: initialCode, username: "", displayName: me.display_name || "" });
  const set = (k) => (e) => setF(v => ({ ...v, [k]: e.target.value }));
  const load = async () => { try { const r = await callApi('/api/manage-account', { action: 'servers-list' }, session); setList(r.servers); } catch (e) { notify(e.message, "err"); setList([]); } };
  useEffect(() => { load(); }, []);
  const switchTo = async (userId) => {
    setBusy(true);
    try {
      const r = await callApi('/api/manage-account', { action: 'servers-switch', userId }, session);
      let { error } = await supabase.auth.verifyOtp({ token_hash: r.tokenHash, type: 'magiclink' });
      if (error) ({ error } = await supabase.auth.verifyOtp({ token_hash: r.tokenHash, type: 'email' }));
      if (error) throw error;
      window.location.reload();
    } catch (e) { notify(e.message, "err"); setBusy(false); }
  };
  const submit = async () => {
    if (busy) return;
    setBusy(true);
    try {
      const body = mode === "create" ? { action: 'servers-create', serverName: f.serverName, username: f.username, displayName: f.displayName } : { action: 'servers-join', code: f.code, username: f.username, displayName: f.displayName };
      const r = await callApi('/api/manage-account', body, session);
      if (r.status === "approved") { await switchTo(r.userId); return; }
      notify("Demande envoyée : l'administrateur de ce serveur doit l'approuver.");
      setMode("list"); setF(v => ({ ...v, serverName: "", code: "", username: "" })); await load();
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const roleLabel = (r) => (ROLES.find(x => x.id === r) || {}).label || r;
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" data-servers-modal style={{ ...modalStyle, width: 460, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>{mode === "create" ? "Créer un serveur" : mode === "join" ? "Rejoindre un serveur" : "Mes serveurs"}</h2>
          <button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }} aria-label="Fermer"><I.X size={18} /></button>
        </div>
        <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 14px" }}>{mode === "list" ? "Un seul compte, plusieurs serveurs : chaque serveur reste un espace séparé, avec son propre profil." : "Votre adresse email et votre mot de passe sont les mêmes ; seuls l'identifiant et le nom affiché sont propres à ce serveur."}</p>
        {mode === "list" ? (<>
          {!list && <div style={{ display: "grid", placeItems: "center", padding: 20 }}><Spinner /></div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {(list || []).map(s => (
              <button key={s.userId} type="button" data-server-row={s.userId} disabled={busy || s.current} onClick={() => switchTo(s.userId)} style={{ display: "flex", alignItems: "center", gap: 10, textAlign: "left", background: s.current ? "var(--panel)" : "var(--bg)", border: `1px solid ${s.current ? "var(--accent)" : "var(--border-soft)"}`, borderRadius: 10, padding: "11px 14px", cursor: s.current ? "default" : "pointer", color: "var(--text)" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{s.serverName}</div>
                  <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>{s.displayName} · {roleLabel(s.role)}{s.status === "pending" ? " · en attente d'approbation" : ""}</div>
                </div>
                {s.current ? <span style={{ fontSize: 11.5, fontWeight: 700, color: "var(--accent-2)" }}>ICI</span> : <span style={{ color: "var(--text-dimmer)" }}>→</span>}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button type="button" data-servers-create onClick={() => setMode("create")} style={{ ...primaryBtn, flex: 1 }}>＋ Créer un serveur</button>
            <button type="button" data-servers-join onClick={() => setMode("join")} style={{ ...secondaryBtn, flex: 1 }}>Rejoindre un serveur</button>
          </div>
        </>) : (<>
          {mode === "create" && <Field label="Nom du serveur"><input autoFocus data-f-server value={f.serverName} maxLength={60} onChange={set("serverName")} placeholder="Famille, Travail, Association…" style={inputStyle} /></Field>}
          {mode === "join" && <Field label="Code du serveur ou lien d'invitation"><input autoFocus data-f-code value={f.code} onChange={set("code")} placeholder="abcd1234 ou https://…/app/?invite=…" style={inputStyle} /></Field>}
          <Field label="Identifiant dans ce serveur (pour les mentions)"><input data-f-username value={f.username} onChange={set("username")} placeholder="3 à 30 caractères, unique" style={inputStyle} /></Field>
          <Field label="Nom affiché dans ce serveur"><input data-f-display value={f.displayName} onChange={set("displayName")} style={inputStyle} /></Field>
          <div style={{ display: "flex", gap: 10 }}>
            <button type="button" onClick={() => setMode("list")} style={{ ...secondaryBtn, flex: 1 }}>Retour</button>
            <button type="button" data-servers-submit onClick={submit} disabled={busy || !f.username.trim() || !f.displayName.trim() || (mode === "create" ? !f.serverName.trim() : !f.code.trim())} style={{ ...primaryBtn, flex: 1, opacity: busy ? 0.6 : 1 }}>{busy ? "…" : mode === "create" ? "Créer et y aller" : "Rejoindre"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function ProjectChip({ project }) {
  if (!project) return null;
  const l = LABELS.find(x => x.id === project.color) || LABELS[0];
  return <span data-project-chip title={project.is_private ? "Projet privé" : "Projet"} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 600, color: "var(--text-dim)", background: l.hex + "1F", border: `1px solid ${l.hex}55`, padding: "1px 8px", borderRadius: 6 }}><span style={{ width: 7, height: 7, borderRadius: "50%", background: l.hex }} />{project.is_private ? "🔒 " : ""}{project.name}</span>;
}

/** Gestion des projets : création, accès (public ou privé + membres), suppression. */
function ProjectsModal({ projects, members, accounts, me, isAdmin, canCreate, notify, onClose }) {
  const [form, setForm] = useState(null);   // null | { id?, name, color, is_private, ids:[] }
  const [busy, setBusy] = useState(false);
  const canManage = (p) => isAdmin || p.created_by === me.id || members.some(m => m.project_id === p.id && m.user_id === me.id && m.is_manager);
  const open = (p) => setForm(p ? { id: p.id, name: p.name, color: p.color, is_private: p.is_private, created_by: p.created_by, ids: members.filter(m => m.project_id === p.id).map(m => m.user_id) } : { name: "", color: LABELS[3].id, is_private: false, ids: [me.id], created_by: me.id });
  const toggle = (id) => setForm(f => ({ ...f, ids: f.ids.includes(id) ? f.ids.filter(x => x !== id) : [...f.ids, id] }));
  const save = async () => {
    if (busy || !form.name.trim()) return;
    setBusy(true);
    try {
      let pid = form.id;
      const base = { name: form.name.trim().slice(0, 60), color: form.color, is_private: form.is_private };
      if (pid) {
        const { error } = await supabase.from('projects').update(base).eq('id', pid);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from('projects').insert({ ...base, server_id: me.server_id, created_by: me.id }).select().single();
        if (error) throw error;
        pid = data.id;
      }
      const current = members.filter(m => m.project_id === pid).map(m => m.user_id);
      const keep = new Set([...form.ids, form.created_by || me.id]);
      const removed = current.filter(id => !keep.has(id));
      const added = [...keep].filter(id => !current.includes(id) && id !== (form.id ? null : me.id));
      if (removed.length) { const { error } = await supabase.from('project_members').delete().eq('project_id', pid).in('user_id', removed); if (error) throw error; }
      if (added.length) { const { error } = await supabase.from('project_members').insert(added.map(user_id => ({ project_id: pid, user_id }))); if (error) throw error; }
      notify(form.id ? "Projet mis à jour." : "Projet créé.");
      setForm(null);
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const remove = async (p) => {
    if (!window.confirm(`Supprimer le projet « ${p.name} » ? Ses tâches ne sont pas supprimées : elles n'auront simplement plus de projet.`)) return;
    const { error } = await supabase.from('projects').delete().eq('id', p.id);
    notify(error ? error.message : "Projet supprimé.", error ? "err" : "ok");
  };
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" data-projects-modal style={{ ...modalStyle, width: 520, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>{form ? (form.id ? "Modifier le projet" : "Nouveau projet") : "Projets"}</h2>
          <button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }} aria-label="Fermer"><I.X size={18} /></button>
        </div>
        {!form ? (<>
          {projects.length === 0 && <div style={{ fontSize: 13.5, color: "var(--text-dimmer)", marginBottom: 14 }}>Aucun projet pour l'instant. Un projet regroupe des tâches (« Maison », « Travail »…) et peut être privé : seuls ses membres et l'administrateur le voient.</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {projects.map(p => { const n = members.filter(m => m.project_id === p.id).length; return (
              <div key={p.id} data-project-row style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 10, padding: "10px 12px", flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 130 }}><ProjectChip project={p} /><div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 4 }}>{p.is_private ? `Privé · ${n} membre(s)` : "Visible par toute l'équipe"}</div></div>
                {canManage(p) && <button type="button" onClick={() => open(p)} style={chipBtn}>Modifier</button>}
                {canManage(p) && <button type="button" onClick={() => remove(p)} style={{ ...chipBtn, color: "#FF9A8F" }}>Supprimer</button>}
              </div>
            ); })}
          </div>
          {canCreate && <button type="button" onClick={() => open(null)} style={{ ...primaryBtn, display: "flex", alignItems: "center", justifyContent: "center", gap: 7 }}><I.Plus size={15} /> Nouveau projet</button>}
        </>) : (<>
          <Field label="Nom"><input autoFocus data-project-name value={form.name} maxLength={60} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Maison, Travail, Vacances…" style={inputStyle} /></Field>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur</div>
            <div style={{ display: "flex", gap: 8 }}>{LABELS.map(l => <button key={l.id} type="button" title={l.name} onClick={() => setForm(f => ({ ...f, color: l.id }))} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: form.color === l.id ? "3px solid var(--text)" : "3px solid transparent" }} />)}</div>
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Qui voit ce projet ?</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {[[false, "Toute l'équipe"], [true, "🔒 Seulement certaines personnes"]].map(([v, lab]) => (
                <button key={lab} type="button" data-private={v ? "1" : "0"} onClick={() => setForm(f => ({ ...f, is_private: v }))} style={{ padding: "8px 12px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${form.is_private === v ? "var(--accent)" : "var(--border-soft)"}`, background: form.is_private === v ? "#5B6EF51A" : "transparent", color: form.is_private === v ? "var(--accent-2)" : "var(--text-dim)" }}>{lab}</button>
              ))}
            </div>
            <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>{form.is_private ? "Les tâches, commentaires et pièces jointes du projet ne sont visibles que par les membres choisis et l'administrateur." : "Tout le monde voit les tâches du projet ; les membres servent à les retrouver facilement."}</div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Membres ({form.ids.length})</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {accounts.map(a => { const on = form.ids.includes(a.id) || a.id === form.created_by; return (
                <button key={a.id} type="button" data-member={a.id} disabled={a.id === form.created_by} onClick={() => toggle(a.id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "5px 11px 5px 6px", borderRadius: 20, cursor: a.id === form.created_by ? "default" : "pointer", fontSize: 13, border: `1.5px solid ${on ? a.color : "var(--border-soft)"}`, background: on ? `${a.color}22` : "transparent", color: on ? "var(--text)" : "var(--text-dim)" }}><Avatar user={a} size={20} /> {a.display_name}</button>
              ); })}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button type="button" onClick={() => setForm(null)} style={{ ...secondaryBtn, flex: 1 }}>Retour</button>
            <button type="button" data-project-save onClick={save} disabled={busy || !form.name.trim()} style={{ ...primaryBtn, flex: 1, opacity: busy || !form.name.trim() ? 0.6 : 1 }}>{form.id ? "Enregistrer" : "Créer le projet"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function TaskCard({ task, project, accounts, me, isAdmin, myPerms, commentCount, attachCount, onOpen, onTagClick, onToggle, onEdit, onDelete }) {
  const label = LABELS.find(l => l.id === task.label) || LABELS[0];
  const prio = PRIORITIES.find(p => p.id === task.priority) || PRIORITIES[1];
  const people = assigneeIds(task).map(id => accounts.find(a => a.id === id)).filter(Boolean);
  const di = dueInfo(task);
  const late = Boolean(di && di.late);
  const soon = Boolean(di && di.soon);
  const own = task.created_by === me.id;
  const canEdit = isAdmin || myPerms.editAnyTask || (own && myPerms.editOwnTask);
  const canDelete = isAdmin || myPerms.deleteAnyTask || (own && myPerms.deleteOwnTask);
  const hasMeta = (task.tags || []).length > 0 || (task.subtasks || []).length > 0 || task.recurrence || commentCount > 0 || attachCount > 0 || task.doing || Boolean(project);
  return (
    <div className="fade-in" style={{ display: "flex", alignItems: "stretch", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden", opacity: task.done ? 0.55 : 1 }}>
      <div style={{ width: 5, background: label.hex, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 14, padding: "13px 16px", flexWrap: "wrap" }}>
        <button onClick={onToggle} style={{ background: "none", border: "none", cursor: "pointer", color: task.done ? "#5FBF8B" : "var(--text-dimmer)", flexShrink: 0 }}>{task.done ? <I.Check size={20} /> : <I.Circle size={20} />}</button>
        <div style={{ flex: 1, minWidth: 140 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, flexWrap: "wrap" }}><span onClick={onOpen} style={{ cursor: "pointer", fontSize: 14.5, fontWeight: 600, textDecoration: task.done ? "line-through" : "none", color: task.done ? "#7A8190" : "var(--text)" }}>{task.title}</span><span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600, color: prio.hex, background: `${prio.hex}1A`, padding: "2px 7px", borderRadius: 6 }}><I.Flag size={10} /> {prio.label}</span></div>
          {task.notes && <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginTop: 3 }}>{task.notes}</div>}
          {hasMeta && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
              {project && <ProjectChip project={project} />}
              {task.doing && !task.done && <span style={{ fontSize: 11, fontWeight: 600, color: "#FFB648", background: "#FFB6481A", padding: "1px 7px", borderRadius: 6 }}>En cours</span>}
              {(task.tags || []).map(tag => <button key={tag} type="button" onClick={() => onTagClick(tag)} style={{ background: "var(--bg-2)", border: "1px solid var(--border-soft)", color: "var(--text-dim)", fontSize: 11, padding: "1px 7px", borderRadius: 6, cursor: "pointer" }}>#{tag}</button>)}
              {(task.subtasks || []).length > 0 && <span onClick={onOpen} style={{ cursor: "pointer", fontSize: 11.5, color: "var(--text-dim)" }}>☑ {(task.subtasks || []).filter(x => x.done).length}/{(task.subtasks || []).length}</span>}
              {task.recurrence && <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>↻ {(RECURRENCES.find(r => r.value === task.recurrence) || {}).label}</span>}
              {commentCount > 0 && <span onClick={onOpen} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--text-dim)" }}><I.Message size={11} /> {commentCount}</span>}
              {attachCount > 0 && <span onClick={onOpen} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--text-dim)" }}><I.Paperclip size={11} /> {attachCount}</span>}
            </div>
          )}
        </div>
        {task.due && (<div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, flexShrink: 0, color: late ? "#FF9A8F" : soon ? "#FFC97A" : "var(--text-dim)" }}>{late ? <I.Alert size={13} /> : di.timed ? <I.Clock size={13} /> : <I.Calendar size={13} />}{di.label}</div>)}
        {people.length > 0 && <AvatarStack users={people} size={26} max={3} />}
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {canEdit && <button onClick={onEdit} style={iconBtn} title="Modifier"><I.Settings size={14} /></button>}
          {canDelete && <button onClick={onDelete} style={{ ...iconBtn, color: "#FF9A8F" }} title="Mettre à la corbeille"><I.Trash size={14} /></button>}
        </div>
      </div>
    </div>
  );
}
function TaskForm({ initial, meId, accounts, templates, tasks: allTasks = [], onDeleteTemplate, onCancel, onSave, projects = [], projectMembers = [], defaultProject = "" }) {
  const [pendingFiles, setPendingFiles] = useState([]);
  const [title, setTitle] = useState(initial?.title || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [label, setLabel] = useState(initial?.label || LABELS[0].id);
  const [priority, setPriority] = useState(initial?.priority || 2);
  const [due, setDue] = useState(initial?.due || "");
  const [startDate, setStartDate] = useState(initial?.start_date || "");
  const [timed, setTimed] = useState(Boolean(initial?.due_time));
  const [dueTime, setDueTime] = useState(initial?.due_time ? hhmm(initial.due_time) : "");
  const [assignees, setAssignees] = useState(() => initial ? assigneeIds(initial) : (accounts.some(a => a.id === meId) ? [meId] : []));
  const [projectId, setProjectId] = useState(initial ? (initial.project_id || "") : defaultProject);
  const [tagsText, setTagsText] = useState((initial?.tags || []).join(", "));
  const [subtasks, setSubtasks] = useState(initial?.subtasks || []);
  const [newSub, setNewSub] = useState("");
  const [recurrence, setRecurrence] = useState(initial?.recurrence || "");
  const [tplId, setTplId] = useState("");
  const [asTemplate, setAsTemplate] = useState(false);
  const [tplName, setTplName] = useState("");
  const proj = projects.find(p => p.id === projectId);
  const eligible = (a) => !proj || !proj.is_private || a.role === "admin" || projectMembers.some(m => m.project_id === proj.id && m.user_id === a.id);
  const pickProject = (id) => {
    setProjectId(id);
    const p = projects.find(x => x.id === id);
    if (p && p.is_private) setAssignees(l => l.filter(uid2 => { const a = accounts.find(x => x.id === uid2); return a && (a.role === "admin" || projectMembers.some(m => m.project_id === p.id && m.user_id === uid2)); }));
  };
  const toggleAssignee = (id) => setAssignees(l => l.includes(id) ? l.filter(x => x !== id) : [...l, id]);
  const addSub = () => { const v = newSub.trim(); if (!v) return; setSubtasks(l => [...l, { id: uid(), text: v.slice(0, 120), done: false }]); setNewSub(""); };
  const applyTemplate = (id) => {
    setTplId(id);
    const t = (templates || []).find(x => x.id === id);
    if (!t) return;
    setTitle(t.title); setNotes(t.notes || ""); setLabel(t.label || LABELS[0].id); setPriority(t.priority || 2);
    setTagsText((t.tags || []).join(", ")); setRecurrence(t.recurrence || "");
    setSubtasks((t.subtasks || []).map(x => ({ ...x, id: uid(), done: false })));
  };
  const [saving, setSaving] = useState(false);
  const submit = async () => {
    if (saving || !title.trim()) return;
    const pendingSub = newSub.trim() ? [...subtasks, { id: uid(), text: newSub.trim().slice(0, 120), done: false }] : subtasks;
    setSaving(true);
    try { await onSave({
      ...(initial?.id ? { id: initial.id } : {}),
      title: title.trim(), notes: notes.trim(), label, priority: Number(priority), due: due || null, start_date: due && startDate && startDate <= due ? startDate : null, due_time: due && timed && dueTime ? dueTime : null,
      assignees, assignee: assignees[0] || null, project_id: projectId || null,
      tags: parseTags(tagsText), subtasks: pendingSub, recurrence: recurrence || null,
      saveAsTemplate: asTemplate ? (tplName.trim() || title.trim()) : null,
      __files: pendingFiles,
    }); } finally { setSaving(false); }
  };
  const selectedTpl = (templates || []).find(x => x.id === tplId);
  const allDayDue = !(timed && dueTime);
  const dueS = due ? (allDayDue ? parisInstant(due) : parisInstant(due, dueTime)) : 0;
  const dueE = due ? (allDayDue ? parisInstant(shiftDay(due, 1)) : dueS) : 0;
  const busyRows = useBusy(due && assignees.length ? assignees : [], dueS, allDayDue ? dueE : dueS + 60000, null);
  const dueLines = useMemo(() => {
    if (!due || !assignees.length) return [];
    const out = [];
    for (const id of assignees) {
      const u = accounts.find(a => a.id === id); if (!u) continue;
      for (const r of conflictsC({ s: dueS, e: dueE, user: u, busy: busyRows.filter(b => b.user_id === id), tasks: allTasks, allDay: allDayDue, ignoreTaskId: initial && initial.id })) out.push(reasonLine(r, u.display_name, id === meId));
    }
    return out;
  }, [due, dueS, dueE, allDayDue, busyRows, JSON.stringify(assignees), allTasks]);
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-card" style={{ ...modalStyle, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier la tâche" : "Nouvelle tâche"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        {!initial && (templates || []).length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <select value={tplId} onChange={e => applyTemplate(e.target.value)} style={inputStyle}>

            </select>
            {selectedTpl && <button type="button" onClick={() => { onDeleteTemplate(selectedTpl.id); setTplId(""); }} style={{ background: "none", border: "none", color: "#FF9A8F", fontSize: 12, cursor: "pointer", padding: "6px 0 0" }}>Supprimer le modèle « {selectedTpl.name} »</button>}
          </div>
        )}
        <Field label="Titre"><input autoFocus value={title} onChange={e => setTitle(e.target.value)} style={inputStyle} /></Field>
        <Field label="Notes (optionnel)"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}><Field label="Échéance"><input type="date" value={due} onChange={e => setDue(e.target.value)} style={inputStyle} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Répétition"><select value={recurrence} onChange={e => setRecurrence(e.target.value)} style={inputStyle}>{RECURRENCES.map(r => <option key={r.value} value={r.value} style={{ background: "var(--bg-2)" }}>{r.label}</option>)}</select></Field></div>
        </div>
        {due && (
          <div style={{ marginBottom: 14, marginTop: -4 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
              <label style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 500 }} htmlFor="task-start">Début (facultatif, pour la vue Chronologie)</label>
              <input id="task-start" data-start-date type="date" value={startDate} max={due} onChange={e => setStartDate(e.target.value)} style={{ ...inputStyle, width: "auto", padding: "6px 10px" }} />
              {startDate && <button type="button" onClick={() => setStartDate("")} style={{ ...chipBtn, fontSize: 12 }}>Effacer</button>}
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              {[[false, "Toute la journée"], [true, "À une heure précise"]].map(([val, lab]) => (
                <button key={lab} type="button" onClick={() => { setTimed(val); if (val && !dueTime) setDueTime("18:00"); }} style={{ padding: "7px 12px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${timed === val ? "var(--accent)" : "var(--border-soft)"}`, background: timed === val ? "#5B6EF51A" : "transparent", color: timed === val ? "var(--accent-2)" : "var(--text-dim)" }}>{lab}</button>
              ))}
              {timed && <input type="time" value={dueTime} onChange={e => setDueTime(e.target.value)} aria-label="Heure limite" style={{ ...inputStyle, width: 120 }} />}
            </div>
            <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>{timed ? "Les personnes assignées sont prévenues par email avant l'heure limite." : "La tâche est à terminer avant la fin de la journée."}</div>
          </div>
        )}
        {(projects.length > 0 || projectId) && (
          <Field label="Projet"><select data-project-select value={projectId} onChange={e => pickProject(e.target.value)} style={inputStyle}>
            <option value="">Aucun projet</option>
            {projects.map(p => <option key={p.id} value={p.id}>{(p.is_private ? "🔒 " : "") + p.name}</option>)}
          </select>{proj && proj.is_private && <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>Projet privé : seuls ses membres peuvent être assignés.</div>}</Field>
        )}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Assignée à {assignees.length > 1 ? `(${assignees.length} personnes)` : ""}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {accounts.filter(eligible).map(a => { const on = assignees.includes(a.id); return (
              <button key={a.id} type="button" onClick={() => toggleAssignee(a.id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "5px 11px 5px 6px", borderRadius: 20, cursor: "pointer", fontSize: 13, border: `1.5px solid ${on ? a.color : "var(--border-soft)"}`, background: on ? `${a.color}22` : "transparent", color: on ? "var(--text)" : "var(--text-dim)" }}><Avatar user={a} size={20} /> {a.display_name}</button>
            ); })}
          </div>
        </div>
        <ConflictBox lines={dueLines} />
        <Field label="Étiquettes (séparées par des virgules)"><input value={tagsText} onChange={e => setTagsText(e.target.value)} placeholder="maison, courses" style={inputStyle} /></Field>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Sous-tâches</div>
          {subtasks.map(st => (
            <div key={st.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <span style={{ flex: 1, fontSize: 13.5, color: st.done ? "var(--text-dimmer)" : "var(--text)", textDecoration: st.done ? "line-through" : "none" }}>{st.text}</span>
              <button type="button" onClick={() => setSubtasks(l => l.filter(x => x.id !== st.id))} style={{ ...iconBtn, padding: 4 }}><I.X size={13} /></button>

          <div style={{ display: "flex", gap: 8 }}>
            <input value={newSub} onChange={e => setNewSub(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addSub(); } }} placeholder="Ajouter une sous-tâche…" style={inputStyle} />

        </div>
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500, display: "flex", alignItems: "center", gap: 6 }}><I.Palette size={13} /> Étiquette de couleur</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" title={l.name} onClick={() => setLabel(l.id)} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: label === l.id ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Pièces jointes</div>
          <PendingFiles files={pendingFiles} setFiles={setPendingFiles} />

        <div style={{ marginBottom: 22, background: "var(--bg)", borderRadius: 10, padding: "10px 12px" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13, cursor: "pointer" }}><input type="checkbox" checked={asTemplate} onChange={e => setAsTemplate(e.target.checked)} style={{ width: 15, height: 15, accentColor: "var(--accent)" }} /> Enregistrer aussi comme modèle réutilisable</label>
          {asTemplate && <input value={tplName} onChange={e => setTplName(e.target.value)} placeholder={"Nom du modèle (par défaut : " + (title.trim() || "titre") + ")"} style={{ ...inputStyle, marginTop: 10 }} />}
        </div>
        <div style={{ display: "flex", gap: 10 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={submit} disabled={saving} style={{ ...primaryBtn, flex: 1, opacity: saving ? 0.6 : 1 }}>{initial ? "Enregistrer" : "Créer la tâche"}</button></div>
      </div>
    </div>
  );
}
