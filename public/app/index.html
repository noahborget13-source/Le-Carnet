                  <button type="button" onClick={() => setConfirmId(t.id)} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer définitivement"><I.Trash size={13} /></button>
                </>)) : <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>Pas les droits</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/** « Mes serveurs » : changer de serveur avec le même compte, en créer un nouveau, ou en rejoindre un autre. */
function ServersModal({ me, session, notify, onClose, initialCode = "" }) {
  const [list, setList] = useState(null);
  const [mode, setMode] = useState(initialCode ? "join" : "list");   // list | create | join
  const [busy, setBusy] = useState(false);
  const [f, setF] = useState({ serverName: "", code: initialCode, username: "", displayName: me.display_name || "" });
  const set = (k) => (e) => setF(v => ({ ...v, [k]: e.target.value }));
  const load = async () => { try { const r = await callApi('/api/manage-account', { action: 'servers-list' }, session); setList(r.servers); } catch (e) { notify(e.message, "err"); setList([]); } };
  useEffect(() => { load(); }, []);
  const switchTo = async (userId) => {
    setBusy(true);
    try {
      const r = await callApi('/api/manage-account', { action: 'servers-switch', userId }, session);
      let { error } = await supabase.auth.verifyOtp({ token_hash: r.tokenHash, type: 'magiclink' });
      if (error) ({ error } = await supabase.auth.verifyOtp({ token_hash: r.tokenHash, type: 'email' }));
      if (error) throw error;
      window.location.reload();
    } catch (e) { notify(e.message, "err"); setBusy(false); }
  };
  const submit = async () => {
    if (busy) return;
    setBusy(true);
    try {
      const body = mode === "create" ? { action: 'servers-create', serverName: f.serverName, username: f.username, displayName: f.displayName } : { action: 'servers-join', code: f.code, username: f.username, displayName: f.displayName };
      const r = await callApi('/api/manage-account', body, session);
      if (r.status === "approved") { await switchTo(r.userId); return; }
      notify("Demande envoyée : l'administrateur de ce serveur doit l'approuver.");
      setMode("list"); setF(v => ({ ...v, serverName: "", code: "", username: "" })); await load();
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const roleLabel = (r) => (ROLES.find(x => x.id === r) || {}).label || r;
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" data-servers-modal style={{ ...modalStyle, width: 460, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>{mode === "create" ? "Créer un serveur" : mode === "join" ? "Rejoindre un serveur" : "Mes serveurs"}</h2>
          <button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }} aria-label="Fermer"><I.X size={18} /></button>
        </div>
        <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 14px" }}>{mode === "list" ? "Un seul compte, plusieurs serveurs : chaque serveur reste un espace séparé, avec son propre profil." : "Ton adresse email et ton mot de passe sont les mêmes ; seuls l'identifiant et le nom affiché sont propres à ce serveur."}</p>
        {mode === "list" ? (<>
          {!list && <div style={{ display: "grid", placeItems: "center", padding: 20 }}><Spinner /></div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {(list || []).map(s => (
              <button key={s.userId} type="button" data-server-row={s.userId} disabled={busy || s.current} onClick={() => switchTo(s.userId)} style={{ display: "flex", alignItems: "center", gap: 10, textAlign: "left", background: s.current ? "var(--panel)" : "var(--bg)", border: `1px solid ${s.current ? "var(--accent)" : "var(--border-soft)"}`, borderRadius: 10, padding: "11px 14px", cursor: s.current ? "default" : "pointer", color: "var(--text)" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{s.serverName}</div>
                  <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>{s.displayName} · {roleLabel(s.role)}{s.status === "pending" ? " · en attente d'approbation" : ""}</div>
                </div>
                {s.current ? <span style={{ fontSize: 11.5, fontWeight: 700, color: "var(--accent-2)" }}>ICI</span> : <span style={{ color: "var(--text-dimmer)" }}>→</span>}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button type="button" data-servers-create onClick={() => setMode("create")} style={{ ...primaryBtn, flex: 1 }}>＋ Créer un serveur</button>
            <button type="button" data-servers-join onClick={() => setMode("join")} style={{ ...secondaryBtn, flex: 1 }}>Rejoindre un serveur</button>
          </div>
        </>) : (<>
          {mode === "create" && <Field label="Nom du serveur"><input autoFocus data-f-server value={f.serverName} maxLength={60} onChange={set("serverName")} placeholder="Famille, Travail, Association…" style={inputStyle} /></Field>}
          {mode === "join" && <Field label="Code du serveur ou lien d'invitation"><input autoFocus data-f-code value={f.code} onChange={set("code")} placeholder="abcd1234 ou https://…/app/?invite=…" style={inputStyle} /></Field>}
          <Field label="Identifiant dans ce serveur (pour les mentions)"><input data-f-username value={f.username} onChange={set("username")} placeholder="3 à 30 caractères, unique" style={inputStyle} /></Field>
          <Field label="Nom affiché dans ce serveur"><input data-f-display value={f.displayName} onChange={set("displayName")} style={inputStyle} /></Field>
          <div style={{ display: "flex", gap: 10 }}>
            <button type="button" onClick={() => setMode("list")} style={{ ...secondaryBtn, flex: 1 }}>Retour</button>
            <button type="button" data-servers-submit onClick={submit} disabled={busy || !f.username.trim() || !f.displayName.trim() || (mode === "create" ? !f.serverName.trim() : !f.code.trim())} style={{ ...primaryBtn, flex: 1, opacity: busy ? 0.6 : 1 }}>{busy ? "…" : mode === "create" ? "Créer et y aller" : "Rejoindre"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function ProjectChip({ project }) {
  if (!project) return null;
  const l = LABELS.find(x => x.id === project.color) || LABELS[0];
  return <span data-project-chip title={project.is_private ? "Projet privé" : "Projet"} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 600, color: "var(--text-dim)", background: l.hex + "1F", border: `1px solid ${l.hex}55`, padding: "1px 8px", borderRadius: 6 }}><span style={{ width: 7, height: 7, borderRadius: "50%", background: l.hex }} />{project.is_private ? "🔒 " : ""}{project.name}</span>;
}

/** Gestion des projets : création, accès (public ou privé + membres), suppression. */
function ProjectsModal({ projects, members, accounts, me, isAdmin, canCreate, notify, onClose }) {
  const [form, setForm] = useState(null);   // null | { id?, name, color, is_private, ids:[] }
  const [busy, setBusy] = useState(false);
  const canManage = (p) => isAdmin || p.created_by === me.id || members.some(m => m.project_id === p.id && m.user_id === me.id && m.is_manager);
  const open = (p) => setForm(p ? { id: p.id, name: p.name, color: p.color, is_private: p.is_private, created_by: p.created_by, ids: members.filter(m => m.project_id === p.id).map(m => m.user_id) } : { name: "", color: LABELS[3].id, is_private: false, ids: [me.id], created_by: me.id });
  const toggle = (id) => setForm(f => ({ ...f, ids: f.ids.includes(id) ? f.ids.filter(x => x !== id) : [...f.ids, id] }));
  const save = async () => {
    if (busy || !form.name.trim()) return;
    setBusy(true);
    try {
      let pid = form.id;
      const base = { name: form.name.trim().slice(0, 60), color: form.color, is_private: form.is_private };
      if (pid) {
        const { error } = await supabase.from('projects').update(base).eq('id', pid);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from('projects').insert({ ...base, server_id: me.server_id, created_by: me.id }).select().single();
        if (error) throw error;
        pid = data.id;
      }
      const current = members.filter(m => m.project_id === pid).map(m => m.user_id);
      const keep = new Set([...form.ids, form.created_by || me.id]);
      const removed = current.filter(id => !keep.has(id));
      const added = [...keep].filter(id => !current.includes(id) && id !== (form.id ? null : me.id));
      if (removed.length) { const { error } = await supabase.from('project_members').delete().eq('project_id', pid).in('user_id', removed); if (error) throw error; }
      if (added.length) { const { error } = await supabase.from('project_members').insert(added.map(user_id => ({ project_id: pid, user_id }))); if (error) throw error; }
      notify(form.id ? "Projet mis à jour." : "Projet créé.");
      setForm(null);
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const remove = async (p) => {
    if (!window.confirm(`Supprimer le projet « ${p.name} » ? Ses tâches ne sont pas supprimées : elles n'auront simplement plus de projet.`)) return;
    const { error } = await supabase.from('projects').delete().eq('id', p.id);
    notify(error ? error.message : "Projet supprimé.", error ? "err" : "ok");
  };
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" data-projects-modal style={{ ...modalStyle, width: 520, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>{form ? (form.id ? "Modifier le projet" : "Nouveau projet") : "Projets"}</h2>
          <button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }} aria-label="Fermer"><I.X size={18} /></button>
        </div>
        {!form ? (<>
          {projects.length === 0 && <div style={{ fontSize: 13.5, color: "var(--text-dimmer)", marginBottom: 14 }}>Aucun projet pour l'instant. Un projet regroupe des tâches (« Maison », « Travail »…) et peut être privé : seuls ses membres et l'administrateur le voient.</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {projects.map(p => { const n = members.filter(m => m.project_id === p.id).length; return (
              <div key={p.id} data-project-row style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 10, padding: "10px 12px", flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 130 }}><ProjectChip project={p} /><div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 4 }}>{p.is_private ? `Privé · ${n} membre(s)` : "Visible par toute l'équipe"}</div></div>
                {canManage(p) && <button type="button" onClick={() => open(p)} style={chipBtn}>Modifier</button>}
                {canManage(p) && <button type="button" onClick={() => remove(p)} style={{ ...chipBtn, color: "#FF9A8F" }}>Supprimer</button>}
              </div>
            ); })}
          </div>
          {canCreate && <button type="button" onClick={() => open(null)} style={{ ...primaryBtn, display: "flex", alignItems: "center", justifyContent: "center", gap: 7 }}><I.Plus size={15} /> Nouveau projet</button>}
        </>) : (<>
          <Field label="Nom"><input autoFocus data-project-name value={form.name} maxLength={60} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Maison, Travail, Vacances…" style={inputStyle} /></Field>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur</div>
            <div style={{ display: "flex", gap: 8 }}>{LABELS.map(l => <button key={l.id} type="button" title={l.name} onClick={() => setForm(f => ({ ...f, color: l.id }))} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: form.color === l.id ? "3px solid var(--text)" : "3px solid transparent" }} />)}</div>
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Qui voit ce projet ?</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {[[false, "Toute l'équipe"], [true, "🔒 Seulement certaines personnes"]].map(([v, lab]) => (
                <button key={lab} type="button" data-private={v ? "1" : "0"} onClick={() => setForm(f => ({ ...f, is_private: v }))} style={{ padding: "8px 12px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${form.is_private === v ? "var(--accent)" : "var(--border-soft)"}`, background: form.is_private === v ? "#5B6EF51A" : "transparent", color: form.is_private === v ? "var(--accent-2)" : "var(--text-dim)" }}>{lab}</button>
              ))}
            </div>
            <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>{form.is_private ? "Les tâches, commentaires et pièces jointes du projet ne sont visibles que par les membres choisis et l'administrateur." : "Tout le monde voit les tâches du projet ; les membres servent à les retrouver facilement."}</div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Membres ({form.ids.length})</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {accounts.map(a => { const on = form.ids.includes(a.id) || a.id === form.created_by; return (
                <button key={a.id} type="button" data-member={a.id} disabled={a.id === form.created_by} onClick={() => toggle(a.id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "5px 11px 5px 6px", borderRadius: 20, cursor: a.id === form.created_by ? "default" : "pointer", fontSize: 13, border: `1.5px solid ${on ? a.color : "var(--border-soft)"}`, background: on ? `${a.color}22` : "transparent", color: on ? "var(--text)" : "var(--text-dim)" }}><Avatar user={a} size={20} /> {a.display_name}</button>
              ); })}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button type="button" onClick={() => setForm(null)} style={{ ...secondaryBtn, flex: 1 }}>Retour</button>
            <button type="button" data-project-save onClick={save} disabled={busy || !form.name.trim()} style={{ ...primaryBtn, flex: 1, opacity: busy || !form.name.trim() ? 0.6 : 1 }}>{form.id ? "Enregistrer" : "Créer le projet"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

function TaskCard({ task, project, accounts, me, isAdmin, myPerms, commentCount, attachCount, onOpen, onTagClick, onToggle, onEdit, onDelete }) {
  const label = LABELS.find(l => l.id === task.label) || LABELS[0];
  const prio = PRIORITIES.find(p => p.id === task.priority) || PRIORITIES[1];
  const people = assigneeIds(task).map(id => accounts.find(a => a.id === id)).filter(Boolean);
  const di = dueInfo(task);
  const late = Boolean(di && di.late);
  const soon = Boolean(di && di.soon);
  const own = task.created_by === me.id;
  const canEdit = isAdmin || myPerms.editAnyTask || (own && myPerms.editOwnTask);
  const canDelete = isAdmin || myPerms.deleteAnyTask || (own && myPerms.deleteOwnTask);
  const hasMeta = (task.tags || []).length > 0 || (task.subtasks || []).length > 0 || task.recurrence || commentCount > 0 || attachCount > 0 || task.doing || Boolean(project);
  return (
    <div className="fade-in" style={{ display: "flex", alignItems: "stretch", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden", opacity: task.done ? 0.55 : 1 }}>
      <div style={{ width: 5, background: label.hex, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 14, padding: "13px 16px", flexWrap: "wrap" }}>
        <button onClick={onToggle} style={{ background: "none", border: "none", cursor: "pointer", color: task.done ? "#5FBF8B" : "var(--text-dimmer)", flexShrink: 0 }}>{task.done ? <I.Check size={20} /> : <I.Circle size={20} />}</button>
        <div style={{ flex: 1, minWidth: 140 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, flexWrap: "wrap" }}><span onClick={onOpen} style={{ cursor: "pointer", fontSize: 14.5, fontWeight: 600, textDecoration: task.done ? "line-through" : "none", color: task.done ? "#7A8190" : "var(--text)" }}>{task.title}</span><span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600, color: prio.hex, background: `${prio.hex}1A`, padding: "2px 7px", borderRadius: 6 }}><I.Flag size={10} /> {prio.label}</span></div>
          {task.notes && <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginTop: 3 }}>{task.notes}</div>}
          {hasMeta && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
              {project && <ProjectChip project={project} />}
              {task.doing && !task.done && <span style={{ fontSize: 11, fontWeight: 600, color: "#FFB648", background: "#FFB6481A", padding: "1px 7px", borderRadius: 6 }}>En cours</span>}
              {(task.tags || []).map(tag => <button key={tag} type="button" onClick={() => onTagClick(tag)} style={{ background: "var(--bg-2)", border: "1px solid var(--border-soft)", color: "var(--text-dim)", fontSize: 11, padding: "1px 7px", borderRadius: 6, cursor: "pointer" }}>#{tag}</button>)}
              {(task.subtasks || []).length > 0 && <span onClick={onOpen} style={{ cursor: "pointer", fontSize: 11.5, color: "var(--text-dim)" }}>☑ {(task.subtasks || []).filter(x => x.done).length}/{(task.subtasks || []).length}</span>}
              {task.recurrence && <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>↻ {(RECURRENCES.find(r => r.value === task.recurrence) || {}).label}</span>}
              {commentCount > 0 && <span onClick={onOpen} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--text-dim)" }}><I.Message size={11} /> {commentCount}</span>}
              {attachCount > 0 && <span onClick={onOpen} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--text-dim)" }}><I.Paperclip size={11} /> {attachCount}</span>}
            </div>
          )}
        </div>
        {task.due && (<div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, flexShrink: 0, color: late ? "#FF9A8F" : soon ? "#FFC97A" : "var(--text-dim)" }}>{late ? <I.Alert size={13} /> : di.timed ? <I.Clock size={13} /> : <I.Calendar size={13} />}{di.label}</div>)}
        {people.length > 0 && <AvatarStack users={people} size={26} max={3} />}
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {canEdit && <button onClick={onEdit} style={iconBtn} title="Modifier"><I.Settings size={14} /></button>}
          {canDelete && <button onClick={onDelete} style={{ ...iconBtn, color: "#FF9A8F" }} title="Mettre à la corbeille"><I.Trash size={14} /></button>}
        </div>
      </div>
    </div>
  );
}
function TaskForm({ initial, meId, accounts, templates, tasks: allTasks = [], onDeleteTemplate, onCancel, onSave, projects = [], projectMembers = [], defaultProject = "" }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [label, setLabel] = useState(initial?.label || LABELS[0].id);
  const [priority, setPriority] = useState(initial?.priority || 2);
  const [due, setDue] = useState(initial?.due || "");
  const [timed, setTimed] = useState(Boolean(initial?.due_time));
  const [dueTime, setDueTime] = useState(initial?.due_time ? hhmm(initial.due_time) : "");
  const [assignees, setAssignees] = useState(() => initial ? assigneeIds(initial) : (accounts.some(a => a.id === meId) ? [meId] : []));
  const [projectId, setProjectId] = useState(initial ? (initial.project_id || "") : defaultProject);
  const [tagsText, setTagsText] = useState((initial?.tags || []).join(", "));
  const [subtasks, setSubtasks] = useState(initial?.subtasks || []);
  const [newSub, setNewSub] = useState("");
  const [recurrence, setRecurrence] = useState(initial?.recurrence || "");
  const [tplId, setTplId] = useState("");
  const [asTemplate, setAsTemplate] = useState(false);
  const [tplName, setTplName] = useState("");
  const proj = projects.find(p => p.id === projectId);
  const eligible = (a) => !proj || !proj.is_private || a.role === "admin" || projectMembers.some(m => m.project_id === proj.id && m.user_id === a.id);
  const pickProject = (id) => {
    setProjectId(id);
    const p = projects.find(x => x.id === id);
    if (p && p.is_private) setAssignees(l => l.filter(uid2 => { const a = accounts.find(x => x.id === uid2); return a && (a.role === "admin" || projectMembers.some(m => m.project_id === p.id && m.user_id === uid2)); }));
  };
  const toggleAssignee = (id) => setAssignees(l => l.includes(id) ? l.filter(x => x !== id) : [...l, id]);
  const addSub = () => { const v = newSub.trim(); if (!v) return; setSubtasks(l => [...l, { id: uid(), text: v.slice(0, 120), done: false }]); setNewSub(""); };
  const applyTemplate = (id) => {
    setTplId(id);
    const t = (templates || []).find(x => x.id === id);
    if (!t) return;
    setTitle(t.title); setNotes(t.notes || ""); setLabel(t.label || LABELS[0].id); setPriority(t.priority || 2);
    setTagsText((t.tags || []).join(", ")); setRecurrence(t.recurrence || "");
    setSubtasks((t.subtasks || []).map(x => ({ ...x, id: uid(), done: false })));
  };
  const submit = () => {
    if (!title.trim()) return;
    const pendingSub = newSub.trim() ? [...subtasks, { id: uid(), text: newSub.trim().slice(0, 120), done: false }] : subtasks;
    onSave({
      ...(initial?.id ? { id: initial.id } : {}),
      title: title.trim(), notes: notes.trim(), label, priority: Number(priority), due: due || null, due_time: due && timed && dueTime ? dueTime : null,
      assignees, assignee: assignees[0] || null, project_id: projectId || null,
      tags: parseTags(tagsText), subtasks: pendingSub, recurrence: recurrence || null,
      saveAsTemplate: asTemplate ? (tplName.trim() || title.trim()) : null,
    });
  };
  const selectedTpl = (templates || []).find(x => x.id === tplId);
  const allDayDue = !(timed && dueTime);
  const dueS = due ? (allDayDue ? parisInstant(due) : parisInstant(due, dueTime)) : 0;
  const dueE = due ? (allDayDue ? parisInstant(shiftDay(due, 1)) : dueS) : 0;
  const busyRows = useBusy(due && assignees.length ? assignees : [], dueS, allDayDue ? dueE : dueS + 60000, null);
  const dueLines = useMemo(() => {
    if (!due || !assignees.length) return [];
    const out = [];
    for (const id of assignees) {
      const u = accounts.find(a => a.id === id); if (!u) continue;
      for (const r of conflictsC({ s: dueS, e: dueE, user: u, busy: busyRows.filter(b => b.user_id === id), tasks: allTasks, allDay: allDayDue, ignoreTaskId: initial && initial.id })) out.push(reasonLine(r, u.display_name, id === meId));
    }
    return out;
  }, [due, dueS, dueE, allDayDue, busyRows, JSON.stringify(assignees), allTasks]);
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-card" style={{ ...modalStyle, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier la tâche" : "Nouvelle tâche"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        {!initial && (templates || []).length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <select value={tplId} onChange={e => applyTemplate(e.target.value)} style={inputStyle}>
              <option value="">Partir d'un modèle…</option>
              {templates.map(t => <option key={t.id} value={t.id} style={{ background: "var(--bg-2)" }}>{t.name}</option>)}
            </select>
            {selectedTpl && <button type="button" onClick={() => { onDeleteTemplate(selectedTpl.id); setTplId(""); }} style={{ background: "none", border: "none", color: "#FF9A8F", fontSize: 12, cursor: "pointer", padding: "6px 0 0" }}>Supprimer le modèle « {selectedTpl.name} »</button>}
          </div>
        )}
        <Field label="Titre"><input autoFocus value={title} onChange={e => setTitle(e.target.value)} style={inputStyle} /></Field>
        <Field label="Notes (optionnel)"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}><Field label="Échéance"><input type="date" value={due} onChange={e => setDue(e.target.value)} style={inputStyle} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Répétition"><select value={recurrence} onChange={e => setRecurrence(e.target.value)} style={inputStyle}>{RECURRENCES.map(r => <option key={r.value} value={r.value} style={{ background: "var(--bg-2)" }}>{r.label}</option>)}</select></Field></div>
        </div>
        {due && (
          <div style={{ marginBottom: 14, marginTop: -4 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              {[[false, "Toute la journée"], [true, "À une heure précise"]].map(([val, lab]) => (
                <button key={lab} type="button" onClick={() => { setTimed(val); if (val && !dueTime) setDueTime("18:00"); }} style={{ padding: "7px 12px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${timed === val ? "var(--accent)" : "var(--border-soft)"}`, background: timed === val ? "#5B6EF51A" : "transparent", color: timed === val ? "var(--accent-2)" : "var(--text-dim)" }}>{lab}</button>
              ))}
              {timed && <input type="time" value={dueTime} onChange={e => setDueTime(e.target.value)} aria-label="Heure limite" style={{ ...inputStyle, width: 120 }} />}
            </div>
            <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>{timed ? "Les personnes assignées sont prévenues par email avant l'heure limite." : "La tâche est à terminer avant la fin de la journée."}</div>
          </div>
        )}
        {(projects.length > 0 || projectId) && (
          <Field label="Projet"><select data-project-select value={projectId} onChange={e => pickProject(e.target.value)} style={inputStyle}>
            <option value="">Aucun projet</option>
            {projects.map(p => <option key={p.id} value={p.id}>{(p.is_private ? "🔒 " : "") + p.name}</option>)}
          </select>{proj && proj.is_private && <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginTop: 6 }}>Projet privé : seuls ses membres peuvent être assignés.</div>}</Field>
        )}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Assignée à {assignees.length > 1 ? `(${assignees.length} personnes)` : ""}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {accounts.filter(eligible).map(a => { const on = assignees.includes(a.id); return (
              <button key={a.id} type="button" onClick={() => toggleAssignee(a.id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "5px 11px 5px 6px", borderRadius: 20, cursor: "pointer", fontSize: 13, border: `1.5px solid ${on ? a.color : "var(--border-soft)"}`, background: on ? `${a.color}22` : "transparent", color: on ? "var(--text)" : "var(--text-dim)" }}><Avatar user={a} size={20} /> {a.display_name}</button>
            ); })}
          </div>
        </div>
        <ConflictBox lines={dueLines} />
        <Field label="Étiquettes (séparées par des virgules)"><input value={tagsText} onChange={e => setTagsText(e.target.value)} placeholder="maison, courses" style={inputStyle} /></Field>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Sous-tâches</div>
          {subtasks.map(st => (
            <div key={st.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <span style={{ flex: 1, fontSize: 13.5, color: st.done ? "var(--text-dimmer)" : "var(--text)", textDecoration: st.done ? "line-through" : "none" }}>{st.text}</span>
              <button type="button" onClick={() => setSubtasks(l => l.filter(x => x.id !== st.id))} style={{ ...iconBtn, padding: 4 }}><I.X size={13} /></button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <input value={newSub} onChange={e => setNewSub(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addSub(); } }} placeholder="Ajouter une sous-tâche…" style={inputStyle} />
            <button type="button" onClick={addSub} style={{ ...secondaryBtn, width: "auto", padding: "0 14px" }}><I.Plus size={15} /></button>
          </div>
        </div>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Priorité</div>
          <div style={{ display: "flex", gap: 8 }}>{PRIORITIES.map(p => (<button key={p.id} type="button" onClick={() => setPriority(p.id)} style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${priority === p.id ? p.hex : "var(--border-soft)"}`, background: priority === p.id ? `${p.hex}1A` : "transparent", color: priority === p.id ? p.hex : "var(--text-dim)" }}>{p.label}</button>))}</div>
        </div>
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500, display: "flex", alignItems: "center", gap: 6 }}><I.Palette size={13} /> Étiquette de couleur</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" title={l.name} onClick={() => setLabel(l.id)} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: label === l.id ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <div style={{ marginBottom: 22, background: "var(--bg)", borderRadius: 10, padding: "10px 12px" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13, cursor: "pointer" }}><input type="checkbox" checked={asTemplate} onChange={e => setAsTemplate(e.target.checked)} style={{ width: 15, height: 15, accentColor: "var(--accent)" }} /> Enregistrer aussi comme modèle réutilisable</label>
          {asTemplate && <input value={tplName} onChange={e => setTplName(e.target.value)} placeholder={"Nom du modèle (par défaut : " + (title.trim() || "titre") + ")"} style={{ ...inputStyle, marginTop: 10 }} />}
        </div>
        <div style={{ display: "flex", gap: 10 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={submit} style={{ ...primaryBtn, flex: 1 }}>{initial ? "Enregistrer" : "Créer la tâche"}</button></div>
      </div>
    </div>
  );
}

/* ============================================================
   Détail d'une tâche : sous-tâches + pièces jointes + commentaires
   ============================================================ */
function AttachmentRow({ att, canDelete, onDelete, notify }) {
  const [thumb, setThumb] = useState(null);
  const isImage = (att.mime || "").startsWith("image/");
  useEffect(() => {
    let alive = true;
    if (isImage) supabase.storage.from('task-files').createSignedUrl(att.path, 3600).then(({ data }) => { if (alive && data) setThumb(data.signedUrl); });
    return () => { alive = false; };
  }, [att.path]);
  const open = async () => {
    const { data, error } = await supabase.storage.from('task-files').createSignedUrl(att.path, 120, { download: isImage ? undefined : att.filename });
    if (error || !data) { notify("Impossible d'ouvrir ce fichier.", "err"); return; }
    const a = document.createElement("a");
    a.href = data.signedUrl; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--bg-2)", border: "1px solid var(--border)", borderRadius: 9, padding: "7px 10px" }}>
      {isImage && thumb ? <img src={thumb} alt="" onClick={open} style={{ width: 38, height: 38, objectFit: "cover", borderRadius: 6, cursor: "pointer", flexShrink: 0 }} /> : <div style={{ width: 38, height: 38, borderRadius: 6, background: "var(--panel-2)", display: "grid", placeItems: "center", color: "var(--text-dim)", flexShrink: 0 }}><I.Paperclip size={16} /></div>}
      <button type="button" onClick={open} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", color: "var(--text)", cursor: "pointer", padding: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{att.filename}</div>
        <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>{fileSizeLabel(att.size || 0)}</div>
      </button>
      <button type="button" onClick={open} style={{ ...iconBtn, border: "none" }} title="Télécharger"><I.Download size={14} /></button>
      {canDelete && <button type="button" onClick={onDelete} style={{ ...iconBtn, border: "none", color: "#FF9A8F" }} title="Retirer"><I.Trash size={14} /></button>}
    </div>
  );
}
function TaskDetail({ task, accounts, me, session, isAdmin, myPerms, comments, attachments, onAttachmentsChanged, notify, onClose, reactions = [] }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef(null);
  const camRef = useRef(null);
  const label = LABELS.find(l => l.id === task.label) || LABELS[0];
  const prio = PRIORITIES.find(p => p.id === task.priority) || PRIORITIES[1];
  const people = assigneeIds(task).map(id => accounts.find(a => a.id === id)).filter(Boolean);
  const own = task.created_by === me.id;
  const canEdit = isAdmin || myPerms.editAnyTask || (own && myPerms.editOwnTask);
  const canComment = isAdmin || myPerms.sendMessages;
  const subtasks = task.subtasks || [];
  const sorted = [...comments].sort((a, b) => a.created_at.localeCompare(b.created_at));

  const [newSub, setNewSub] = useState("");
  const saveSubs = async (next) => {
    const { error } = await supabase.from('tasks').update({ subtasks: next }).eq('id', task.id);
    if (error) { notify("Tu n'as pas le droit de modifier cette tâche.", "err"); return false; }
    return true;
  };
  const addSubtask = async () => { const v = newSub.trim(); if (!v || subtasks.length >= 40) return; if (await saveSubs([...subtasks, { id: uid(), text: v.slice(0, 120), done: false }])) setNewSub(""); };
  const delSubtask = (id) => saveSubs(subtasks.filter(x => x.id !== id));
  const toggleSub = async (id) => {
    const next = subtasks.map(x => x.id === id ? { ...x, done: !x.done } : x);
    const { error } = await supabase.from('tasks').update({ subtasks: next }).eq('id', task.id);
    if (error) notify("Tu n'as pas le droit de modifier cette tâche.", "err");
  };
  const send = async () => {
    const v = text.trim();
    if (!v || busy) return;
    setBusy(true);
    const { data, error } = await supabase.from('task_comments').insert({ task_id: task.id, server_id: me.server_id, author_id: me.id, text: v.slice(0, 2000) }).select().single();
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setText("");
    if (data && v.includes("@")) notifyMention('comment', data.id, session);
  };
  const del = async (id) => { const { error } = await supabase.from('task_comments').delete().eq('id', id); if (error) notify(error.message, "err"); };

  const upload = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length || uploading) return;
    setUploading(true);
    let count = attachments.length;
    for (const f0 of files) {
      const f = await shrinkImage(f0);
      if (count >= MAX_FILES_PER_TASK) { notify(`Maximum ${MAX_FILES_PER_TASK} fichiers par tâche.`, "err"); break; }
      if (f.size > MAX_FILE_BYTES) { notify(`« ${f.name} » dépasse 5 Mo.`, "err"); continue; }
      const safe = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80) || "fichier";
      const path = `${me.server_id}/${task.id}/${uid()}-${safe}`;
      const up = await supabase.storage.from('task-files').upload(path, f, { contentType: f.type || undefined, upsert: false });
      if (up.error) { notify(up.error.message, "err"); continue; }
      const { error } = await supabase.from('task_attachments').insert({ task_id: task.id, server_id: me.server_id, uploader_id: me.id, path, filename: f.name, size: f.size, mime: f.type || null });
      if (error) { await supabase.storage.from('task-files').remove([path]); notify(error.message, "err"); continue; }
      count++;
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = "";
    if (camRef.current) camRef.current.value = "";
    onAttachmentsChanged();
  };
  const removeAttachment = async (att) => {
    const { error } = await supabase.from('task_attachments').delete().eq('id', att.id);
    if (error) { notify(error.message, "err"); return; }
    await supabase.storage.from('task-files').remove([att.path]);
    onAttachmentsChanged();
  };

  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ ...modalStyle, width: 520, maxHeight: "92vh", overflowY: "auto", borderTop: `4px solid ${label.hex}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, marginBottom: 10 }}>
          <h2 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 600, margin: 0, wordBreak: "break-word" }}>{task.title}</h2>
          <button type="button" data-copy-task-link title="Copier le lien de cette tâche" aria-label="Copier le lien de cette tâche" onClick={async () => { const url = `${window.location.origin}/app/?task=${task.id}`; notify((await copyText(url)) ? "Lien de la tâche copié." : url); }} style={{ ...iconBtn, border: "none", marginLeft: "auto" }}>🔗</button>
          <button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", fontSize: 12.5, color: "var(--text-dim)", marginBottom: 12 }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontWeight: 600, color: prio.hex }}><I.Flag size={11} /> {prio.label}</span>
          {task.due && <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>{dueInfo(task).timed ? <I.Clock size={12} /> : <I.Calendar size={12} />} {dueInfo(task).label}{!dueInfo(task).timed && <span style={{ color: "var(--text-dimmer)" }}> · toute la journée</span>}</span>}
          {task.recurrence && <span>↻ {(RECURRENCES.find(r => r.value === task.recurrence) || {}).label}</span>}
          {task.doing && !task.done && <span style={{ color: "#FFB648", fontWeight: 600 }}>En cours</span>}
          {task.done && <span style={{ color: "#5FBF8B", fontWeight: 600 }}>Terminée</span>}
        </div>
        {people.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
            {people.map(p => <span key={p.id} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, background: "var(--bg-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "3px 10px 3px 4px" }}><Avatar user={p} size={20} /> {p.display_name}</span>)}
          </div>
        )}
        {task.notes && <p style={{ fontSize: 13.5, lineHeight: 1.55, margin: "0 0 12px", whiteSpace: "pre-wrap" }}>{task.notes}</p>}
        {(task.tags || []).length > 0 && <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>{task.tags.map(t => <span key={t} style={{ background: "var(--bg-2)", border: "1px solid var(--border-soft)", color: "var(--text-dim)", fontSize: 11.5, padding: "1px 8px", borderRadius: 6 }}>#{t}</span>)}</div>}

        {(subtasks.length > 0 || canEdit) && (
          <div style={{ marginBottom: 16 }} data-testid="subtasks">
            {subtasks.length > 0 && (<>
              <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600, marginBottom: 6 }}>Sous-tâches · {subtasks.filter(x => x.done).length}/{subtasks.length}</div>
              <div style={{ height: 4, background: "var(--bg-2)", borderRadius: 4, marginBottom: 8, overflow: "hidden" }}><div style={{ width: `${(subtasks.filter(x => x.done).length / subtasks.length) * 100}%`, height: "100%", background: label.hex }} /></div>
            </>)}
            {subtasks.map(st => (
              <div key={st.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <label style={{ flex: 1, display: "flex", alignItems: "center", gap: 9, padding: "4px 0", fontSize: 13.5, cursor: canEdit ? "pointer" : "default", color: st.done ? "var(--text-dimmer)" : "var(--text)", textDecoration: st.done ? "line-through" : "none" }}>
                  <input type="checkbox" checked={!!st.done} disabled={!canEdit} onChange={() => toggleSub(st.id)} /> {st.text}
                </label>
                {canEdit && <button type="button" onClick={() => delSubtask(st.id)} aria-label={"Supprimer la sous-tâche " + st.text} title="Supprimer" style={{ ...iconBtn, border: "none", color: "var(--text-dimmer)", padding: 4 }}><I.X size={13} /></button>}
              </div>
            ))}
            {canEdit && (
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <input value={newSub} onChange={e => setNewSub(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addSubtask(); } }} maxLength={120} placeholder="Ajouter une sous-tâche…" aria-label="Nouvelle sous-tâche" style={{ ...inputStyle, padding: "7px 10px", fontSize: 13 }} />
                <button type="button" onClick={addSubtask} disabled={!newSub.trim()} style={{ ...chipBtn, opacity: newSub.trim() ? 1 : 0.5 }}>Ajouter</button>
              </div>
            )}
          </div>
        )}

        <div style={{ borderTop: "1px solid var(--border)", paddingTop: 14, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600 }}>Pièces jointes · {attachments.length}</div>
            {canEdit && (<>
              <input ref={fileRef} type="file" multiple onChange={e => upload(e.target.files)} style={{ display: "none" }} />
              <input ref={camRef} type="file" accept="image/*" capture="environment" aria-label="Prendre une photo" onChange={e => upload(e.target.files)} style={{ display: "none" }} />
              <span style={{ display: "inline-flex", gap: 6 }}>
              <button type="button" onClick={() => camRef.current && camRef.current.click()} disabled={uploading} style={{ ...secondaryBtn, width: "auto", padding: "5px 11px", fontSize: 12, opacity: uploading ? 0.6 : 1 }}>📷 Photo</button>
              <button type="button" onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading} style={{ ...secondaryBtn, width: "auto", padding: "5px 11px", fontSize: 12, display: "flex", alignItems: "center", gap: 6, opacity: uploading ? 0.6 : 1 }}><I.Paperclip size={12} /> {uploading ? "Envoi…" : "Ajouter"}</button>
              </span>
            </>)}
          </div>
          {attachments.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>{canEdit ? "Aucun fichier. Photos, PDF, documents… (5 Mo max chacun)" : "Aucun fichier."}</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {attachments.map(a => <AttachmentRow key={a.id} att={a} notify={notify} canDelete={a.uploader_id === me.id || isAdmin} onDelete={() => removeAttachment(a)} />)}
          </div>
        </div>

        {isAdmin && <TaskHistory taskId={task.id} accounts={accounts} />}
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600, marginBottom: 8, borderTop: "1px solid var(--border)", paddingTop: 14 }}>Commentaires · {sorted.length}</div>
        {sorted.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)", marginBottom: 10 }}>Aucun commentaire pour l'instant. Tape @ pour mentionner quelqu'un.</div>}
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
          {sorted.map(c => {
            const author = accounts.find(a => a.id === c.author_id);
            return (
              <div key={c.id} style={{ display: "flex", gap: 9 }}>
                <Avatar user={author} size={26} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}><strong style={{ color: "var(--text)" }}>{author ? author.display_name : "Ancien membre"}</strong> · {new Date(c.created_at).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</div>
                  <div style={{ fontSize: 13.5, whiteSpace: "pre-wrap", wordBreak: "break-word" }}><RichText text={c.text} accounts={accounts} /></div>
                  <ReactionBar kind="comment" targetId={c.id} reactions={reactions} me={me} accounts={accounts} notify={notify} />
                </div>
                {(c.author_id === me.id || isAdmin) && <button type="button" onClick={() => del(c.id)} title="Supprimer" style={{ ...iconBtn, padding: 4, alignSelf: "flex-start", border: "none", color: "var(--text-dimmer)" }}><I.Trash size={13} /></button>}
              </div>
            );
          })}
        </div>
        {canComment ? (
          <div style={{ display: "flex", gap: 8 }}>
            <MentionInput value={text} onChange={setText} onSubmit={send} people={accounts.filter(a => a.id !== me.id)} placeholder="Écrire un commentaire… (@ pour mentionner)" />
            <button type="button" onClick={send} disabled={busy} style={{ ...primaryBtn, width: "auto", padding: "0 14px", opacity: busy ? 0.6 : 1 }}><I.Send size={15} /></button>
          </div>
        ) : <div style={{ fontSize: 12.5, color: "var(--text-dimmer)" }}>Tu n'as pas le droit de commenter.</div>}
      </div>
    </div>
  );
}

/* ============================================================
   Calendrier des échéances
   ============================================================ */
function CalendarView({ tasks, accounts, meetings = [], attendees = [], leaves = [], events = [], isAdmin = false, notify = () => {}, me, onOpen }) {
  const [evForm, setEvForm] = useState(false);
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [selected, setSelected] = useState(todayISO());
  const today = todayISO();
  const first = month;
  const offset = (first.getDay() + 6) % 7; // semaine commençant le lundi
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(isoLocal(new Date(first.getFullYear(), first.getMonth(), d)));
  const byDay = {};
  for (const t of tasks) if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t);
  const noDue = tasks.filter(t => !t.due && !t.done).length;
  const myMeetings = meetings.filter(m => me && (m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined")));
  const meetByDay = {};
  for (const m of myMeetings) (meetByDay[parisDay(Date.parse(m.starts_at))] = meetByDay[parisDay(Date.parse(m.starts_at))] || []).push(m);
  const leaveOn = (iso) => leaves.filter(l => l.status === "approved" && l.start_date <= iso && l.end_date >= iso);
  // Mes créneaux « occupé » venant de mon agenda externe (sans titre), visibles par moi seul
  const rangeFrom = parisInstant(shiftDay(isoLocal(first), -1), "00:00"), rangeTo = parisInstant(shiftDay(isoLocal(new Date(first.getFullYear(), first.getMonth() + 1, 1)), 1), "00:00");
  const busyRows = useBusy(me ? [me.id] : [], rangeFrom, rangeTo).filter(r => r.kind === "google");
  const busyOn = (iso) => {
    const d0 = parisInstant(iso, "00:00"), d1 = parisInstant(shiftDay(iso, 1), "00:00");
    const sl = busyRows.map(r => [Math.max(Date.parse(r.starts_at), d0), Math.min(Date.parse(r.ends_at), d1)]).filter(x => x[0] < x[1]).sort((x, y) => x[0] - y[0]);
    const out = [];
    for (const x of sl) { const last = out[out.length - 1]; if (last && x[0] <= last[1]) last[1] = Math.max(last[1], x[1]); else out.push([x[0], x[1]]); }
    return out.map(([f, t]) => ({ from: f, to: t, all: f <= d0 && t >= d1 }));
  };
  const dayBusy = busyOn(selected);
  const dayX = dayExtras(selected, events, accounts);
  const dayMeetings = (meetByDay[selected] || []).slice().sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const dayLeaves = leaveOn(selected);
  const dayTasks = (byDay[selected] || []).slice().sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
  const title = first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const go = (n) => setMonth(m => new Date(m.getFullYear(), m.getMonth() + n, 1));

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Calendrier</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>Les échéances de ton serveur{noDue > 0 ? ` · ${noDue} tâche(s) sans date` : ""}</p></div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button type="button" onClick={() => go(-1)} style={{ ...iconBtn, transform: "rotate(90deg)" }} title="Mois précédent"><I.Chevron size={15} /></button>
          <div style={{ minWidth: 140, textAlign: "center", fontWeight: 600, textTransform: "capitalize" }}>{title}</div>
          <button type="button" onClick={() => go(1)} style={{ ...iconBtn, transform: "rotate(-90deg)" }} title="Mois suivant"><I.Chevron size={15} /></button>
          <button type="button" onClick={() => { const d = new Date(); setMonth(new Date(d.getFullYear(), d.getMonth(), 1)); setSelected(todayISO()); }} style={{ ...chipBtn }}>Aujourd'hui</button>
          {isAdmin && <button type="button" onClick={() => setEvForm(true)} style={{ ...chipBtn, color: "var(--accent-2)" }}>+ Événement</button>}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
        {["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map(d => <div key={d} style={{ textAlign: "center", fontSize: 11.5, color: "var(--text-dimmer)", fontWeight: 600 }}>{d}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
        {cells.map((iso, i) => {
          if (!iso) return <div key={"b" + i} />;
          const list = byDay[iso] || [];
          const open = list.filter(t => !t.done);
          const isSel = iso === selected;
          return (
            <button key={iso} type="button" onClick={() => setSelected(iso)} style={{ minHeight: 62, padding: "6px 4px", borderRadius: 9, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 5, background: isSel ? "var(--panel-2)" : "var(--panel)", border: `1px solid ${isSel ? "var(--accent)" : iso === today ? "var(--accent-2)" : "var(--border)"}`, color: "var(--text)" }}>
              <span style={{ fontSize: 13, fontWeight: iso === today ? 700 : 500, color: iso === today ? "var(--accent-2)" : "var(--text)" }}>{Number(iso.slice(8))}</span>
              <span style={{ display: "flex", flexWrap: "wrap", gap: 3, justifyContent: "center" }}>
                {(meetByDay[iso] || []).slice(0, 2).map(m => <span key={m.id} title={m.title} style={{ width: 7, height: 7, borderRadius: 2, background: "#5B9EF5" }} />)}
                {dayExtras(iso, events, accounts).events.length > 0 && <span title="Événement d'équipe" style={{ width: 7, height: 7, borderRadius: 2, background: "#FFB648", transform: "rotate(45deg)" }} />}
                {dayExtras(iso, events, accounts).birthdays.length > 0 && <span title="Anniversaire" style={{ fontSize: 9, lineHeight: "7px" }}>🎂</span>}
                {busyOn(iso).length > 0 && <span title="Indisponible (agenda externe)" style={{ width: 7, height: 7, borderRadius: 2, background: "#6B7280" }} />}
                {leaveOn(iso).length > 0 && <span title="Congé" style={{ fontSize: 9, lineHeight: "7px" }}>🌴</span>}
                {list.slice(0, 4).map(t => <span key={t.id} style={{ width: 7, height: 7, borderRadius: "50%", background: (LABELS.find(l => l.id === t.label) || LABELS[0]).hex, opacity: t.done ? 0.35 : 1 }} />)}
              </span>
              {list.length > 4 && <span style={{ fontSize: 10, color: "var(--text-dimmer)" }}>+{list.length - 4}</span>}
              {open.length === 0 && list.length > 0 && <span style={{ fontSize: 10, color: "#5FBF8B" }}>✓</span>}
            </button>
          );
        })}
      </div>
      <div style={{ marginTop: 22 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10, textTransform: "capitalize" }}>{new Date(selected + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}</div>
        {(dayX.events.length > 0 || dayX.birthdays.length > 0) && <div data-testid="day-x" style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {dayX.events.map(ev => <div key={ev.id} style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--panel)", border: "1px solid var(--border)", borderLeft: "5px solid #FFB648", borderRadius: 10, padding: "9px 14px", fontSize: 14 }}><span style={{ flex: 1 }}>🎉 <strong>{ev.title}</strong>{ev.end_date !== ev.start_date ? <span style={{ color: "var(--text-dimmer)", fontSize: 12.5 }}> · {fmtDay(ev.start_date, { day: "numeric", month: "short" })} → {fmtDay(ev.end_date, { day: "numeric", month: "short" })}</span> : null}</span>{isAdmin && <button type="button" aria-label={"Supprimer l'événement " + ev.title} title="Supprimer" onClick={async () => { if (!window.confirm(`Supprimer l'événement « ${ev.title} » ?`)) return; const { error } = await supabase.from("team_events").delete().eq("id", ev.id); notify(error ? error.message : "Événement supprimé.", error ? "err" : "ok"); }} style={{ ...iconBtn, border: "none", color: "#FF9A8F" }}><I.Trash size={14} /></button>}</div>)}
          {dayX.birthdays.map(a => <div key={a.id} style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: "5px solid #F56BA8", borderRadius: 10, padding: "9px 14px", fontSize: 14 }}>🎂 Anniversaire de <strong>{a.id === (me && me.id) ? "toi" : a.display_name}</strong></div>)}
        </div>}
        {dayBusy.length > 0 && <div data-testid="day-busy" style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>{dayBusy.map((b, i) => <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--panel)", border: "1px dashed var(--border)", borderLeft: "5px solid #6B7280", borderRadius: 10, padding: "8px 14px", color: "var(--text-dim)" }}><span style={{ minWidth: 48, fontSize: 12, fontWeight: 600 }}>{b.all ? "Journée" : fmtHM(b.from)}</span><span style={{ flex: 1, fontSize: 13.5 }}>⛔ Indisponible{b.all ? "" : ` jusqu'à ${fmtHM(b.to)}`} <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>· agenda externe</span></span></div>)}</div>}
        {dayLeaves.length > 0 && <div style={{ marginBottom: 10, fontSize: 13, color: "#8FD6AE", background: "#16281F", border: "1px solid #234B36", borderRadius: 10, padding: "8px 12px" }}>🌴 En congé : {dayLeaves.map(l => (accounts.find(a => a.id === l.user_id) || {}).display_name || "?").join(", ")}</div>}
        {dayMeetings.length > 0 && <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>{dayMeetings.map(m => <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--panel)", border: "1px solid var(--border)", borderLeft: "5px solid #5B9EF5", borderRadius: 10, padding: "10px 14px" }}><span style={{ minWidth: 48, fontSize: 12, fontWeight: 600, color: "#7DB4FF" }}>{fmtHM(Date.parse(m.starts_at))}</span><span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>📹 {m.title}</span><a href={meetJoin(m, me && me.display_name)} target="_blank" rel="noopener noreferrer" style={{ ...chipBtn, textDecoration: "none" }}>Rejoindre</a></div>)}</div>}
        {dayTasks.length === 0 && dayMeetings.length === 0 && dayLeaves.length === 0 && dayBusy.length === 0 && dayX.events.length === 0 && dayX.birthdays.length === 0 && <EmptyState text="Rien de prévu ce jour-là." />}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {dayTasks.map(t => {
            const label = LABELS.find(l => l.id === t.label) || LABELS[0];
            const who = assigneeIds(t).map(id => accounts.find(x => x.id === id)).filter(Boolean);
            return (
              <button key={t.id} type="button" onClick={() => onOpen(t.id)} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `5px solid ${label.hex}`, borderRadius: 10, padding: "10px 14px", cursor: "pointer", color: "var(--text)", opacity: t.done ? 0.55 : 1 }}>
                <span style={{ minWidth: 48, fontSize: 12, fontWeight: 600, color: t.due_time ? "var(--accent-2)" : "var(--text-dimmer)" }}>{t.due_time ? timeLabel(t.due_time) : "Journée"}</span>
                <span style={{ flex: 1, fontSize: 14, fontWeight: 600, textDecoration: t.done ? "line-through" : "none" }}>{t.title}</span>
                {who.length > 0 && <AvatarStack users={who} size={24} max={3} />}
              </button>
            );
          })}
        </div>
      </div>
      {evForm && <EventForm me={me} day={selected} notify={notify} onCancel={() => setEvForm(false)} onSaved={() => setEvForm(false)} />}
    </div>
  );
}

/* ============================================================
   Sondages dans la messagerie
   ============================================================ */
function PollForm({ onCancel, onSubmit }) {
  const [question, setQuestion] = useState("");
  const [options, setOptions] = useState(["", ""]);
  const [multiple, setMultiple] = useState(false);
  const [busy, setBusy] = useState(false);
  const clean = options.map(o => o.trim()).filter(Boolean);
  const valid = question.trim().length > 0 && clean.length >= 2;
  const setOpt = (i, v) => setOptions(l => l.map((x, k) => k === i ? v : x));
  const submit = async () => {
    if (!valid || busy) return;
    setBusy(true);
    const ok = await onSubmit({ question: question.trim().slice(0, 200), options: clean.slice(0, 8).map(o => o.slice(0, 80)), multiple });
    if (!ok) setBusy(false);
  };
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-card" style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0, display: "flex", alignItems: "center", gap: 8 }}><I.Poll size={18} /> Nouveau sondage</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }} aria-label="Fermer"><I.X size={18} /></button></div>
        <Field label="Question"><input autoFocus value={question} maxLength={200} onChange={e => setQuestion(e.target.value)} placeholder="Réunion mardi ou jeudi ?" style={inputStyle} /></Field>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 6, fontWeight: 500 }}>Réponses (2 à 8)</div>
        {options.map((o, i) => (
          <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={o} maxLength={80} onChange={e => setOpt(i, e.target.value)} placeholder={"Réponse " + (i + 1)} style={inputStyle} />
            {options.length > 2 && <button type="button" onClick={() => setOptions(l => l.filter((_, k) => k !== i))} style={{ ...iconBtn, flexShrink: 0 }} aria-label="Retirer cette réponse"><I.X size={14} /></button>}
          </div>
        ))}
        {options.length < 8 && <button type="button" onClick={() => setOptions(l => [...l, ""])} style={{ background: "none", border: "none", color: "var(--accent-2)", fontSize: 13, cursor: "pointer", padding: "2px 0 12px" }}>+ Ajouter une réponse</button>}
        <label style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13.5, cursor: "pointer", marginBottom: 20 }}><input type="checkbox" checked={multiple} onChange={e => setMultiple(e.target.checked)} style={{ width: 15, height: 15, accentColor: "var(--accent)" }} /> Autoriser plusieurs réponses</label>
        <div style={{ display: "flex", gap: 10 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={submit} disabled={!valid || busy} style={{ ...primaryBtn, flex: 1, opacity: valid && !busy ? 1 : 0.5 }}>{busy ? "Envoi…" : "Publier"}</button></div>
      </div>
    </div>
  );
}
function PollCard({ kind, msg, me, isAdmin, accounts, votes, onChanged, notify }) {
  const poll = msg.poll;
  const options = poll.options || [];
  const closed = Boolean(poll.closed);
  const mine = votes.filter(v => v.user_id === me.id).map(v => v.option_idx);
  const voters = new Set(votes.map(v => v.user_id)).size;
  const canClose = !closed && (msg.from_id === me.id || isAdmin);
  const [busy, setBusy] = useState(false);
  const toggle = async (i) => {
    if (closed || busy) return;
    setBusy(true);
    const { error } = mine.includes(i)
      ? await supabase.from('poll_votes').delete().eq('msg_kind', kind).eq('msg_id', msg.id).eq('user_id', me.id).eq('option_idx', i)
      : await supabase.from('poll_votes').insert({ msg_kind: kind, msg_id: msg.id, option_idx: i, server_id: me.server_id });
    if (error) notify(error.message, "err");
    if (onChanged) await onChanged();
    setBusy(false);
  };
  const close = async () => {
    const { error } = await supabase.rpc('close_poll', { p_kind: kind, p_id: msg.id });
    if (error) notify(error.message, "err"); else notify("Sondage terminé.");
  };
  return (
    <div style={{ background: "var(--panel)", border: "1px solid var(--border-soft)", borderRadius: 12, padding: "12px 14px", color: "var(--text)" }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 4 }}>
        <I.Poll size={15} style={{ marginTop: 3, color: "var(--accent-2)", flexShrink: 0 }} />
        <div style={{ fontSize: 14, fontWeight: 600, wordBreak: "break-word" }}>{poll.question}</div>
      </div>
      <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", marginBottom: 10 }}>{closed ? "Sondage terminé" : poll.multiple ? "Plusieurs réponses possibles" : "Une seule réponse"} · {voters} vote{voters > 1 ? "s" : ""}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
        {options.map((label, i) => {
          const who = votes.filter(v => v.option_idx === i).map(v => accounts.find(a => a.id === v.user_id)).filter(Boolean);
          const n = votes.filter(v => v.option_idx === i).length;
          const pct = voters ? Math.round((n / voters) * 100) : 0;
          const on = mine.includes(i);
          return (
            <button key={i} type="button" onClick={() => toggle(i)} disabled={closed} aria-pressed={on} style={{ position: "relative", overflow: "hidden", textAlign: "left", padding: "8px 11px", borderRadius: 9, border: `1.5px solid ${on ? "var(--accent)" : "var(--border-soft)"}`, background: "var(--bg-2)", color: "var(--text)", cursor: closed ? "default" : "pointer", fontSize: 13.5 }}>
              <span aria-hidden="true" style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: pct + "%", background: on ? "#5B6EF53D" : "#5B6EF51F", transition: "width .25s" }} />
              <span style={{ position: "relative", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ width: 16, height: 16, borderRadius: poll.multiple ? 4 : "50%", border: `2px solid ${on ? "var(--accent)" : "var(--text-dimmer)"}`, background: on ? "var(--accent)" : "transparent", flexShrink: 0, display: "grid", placeItems: "center", color: "#fff", fontSize: 10, lineHeight: 1 }}>{on ? "✓" : ""}</span>
                <span style={{ flex: 1, minWidth: 0, wordBreak: "break-word" }}>{label}</span>
                <span style={{ fontSize: 12, color: "var(--text-dim)", whiteSpace: "nowrap" }}>{n}{voters ? ` · ${pct} %` : ""}</span>
              </span>
              {who.length > 0 && <span style={{ position: "relative", display: "flex", gap: 3, marginTop: 6, flexWrap: "wrap" }}>{who.slice(0, 8).map(u => <span key={u.id} title={u.display_name}><Avatar user={u} size={17} /></span>)}{who.length > 8 && <span style={{ fontSize: 11, color: "var(--text-dimmer)" }}>+{who.length - 8}</span>}</span>}
            </button>
          );
        })}
      </div>
      {canClose && <button type="button" onClick={close} style={{ background: "none", border: "none", color: "var(--text-dim)", fontSize: 12, cursor: "pointer", padding: "10px 0 0", textDecoration: "underline" }}>Terminer le sondage</button>}
    </div>
  );
}

/* ============================================================
   Messages : salon du serveur + conversations privées
   ============================================================ */
function MessagesView({ me, session, isAdmin, myPerms, accounts, messages, channelMsgs, pollVotes, reloadVotes, notify, reactions = [] }) {
  const contacts = useMemo(() => accounts.filter(a => a.id !== me.id), [accounts, me.id]);
  const [activeId, setActiveId] = useState("channel");
  const [draft, setDraft] = useState("");
  const [open, setOpen] = useState(false);          // mobile : conversation ouverte en plein écran
  const [showPoll, setShowPoll] = useState(false);
  const scrollRef = useRef(null);
  const isChannel = activeId === "channel";
  useEffect(() => { document.body.classList.toggle("chat-open", open); return () => document.body.classList.remove("chat-open"); }, [open]);
  const pick = (id) => { setActiveId(id); setOpen(true); };
  const canSend = isAdmin || myPerms.sendMessages;
  const thread = messages.filter(m => (m.from_id === me.id && m.to_id === activeId) || (m.from_id === activeId && m.to_id === me.id)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const channel = useMemo(() => [...channelMsgs].sort((a, b) => new Date(a.ts) - new Date(b.ts)), [channelMsgs]);
  const shownLen = isChannel ? channel.length : thread.length;
  useEffect(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }, [shownLen, activeId, open]);
  const lastMsgFor = (id) => messages.filter(m => (m.from_id === me.id && m.to_id === id) || (m.from_id === id && m.to_id === me.id)).sort((a, b) => new Date(b.ts) - new Date(a.ts))[0];
  const lastChannel = channel[channel.length - 1];

  const send = async () => {
    const text = draft.trim();
    if (!text || !canSend) return;
    setDraft("");
    if (isChannel) {
      const { data, error } = await supabase.from('channel_messages').insert({ server_id: me.server_id, from_id: me.id, text: text.slice(0, 2000) }).select().single();
      if (error) { notify(error.message, "err"); setDraft(text); return; }
      if (data && text.includes("@")) notifyMention('channel', data.id, session);
    } else {
      const { data, error } = await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text, server_id: me.server_id }).select().single();
      if (error) { notify(error.message, "err"); setDraft(text); return; }
      if (data) callApi('/api/notify-dm', { messageId: data.id }, session).catch(() => {});
    }
  };
  const startCall = async () => {
    if (!canSend || (!isChannel && !activeUser)) return;
    const url = callLink("msg" + uid() + uid() + uid());
    const text = `📞 ${me.display_name} lance un appel vidéo : ${url}`;
    const { error } = isChannel
      ? await supabase.from('channel_messages').insert({ server_id: me.server_id, from_id: me.id, text })
      : await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text, server_id: me.server_id });
    if (error) { notify(error.message, "err"); return; }
    window.open(joinLink(url.slice(JITSI.length), me.display_name), "_blank", "noopener,noreferrer");
  };
  const sendPoll = async ({ question, options, multiple }) => {
    const text = ("📊 " + question).slice(0, 2000);
    const poll = { question, options, multiple, closed: false };
    const { error } = isChannel
      ? await supabase.from('channel_messages').insert({ server_id: me.server_id, from_id: me.id, text, poll })
      : await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text, server_id: me.server_id, poll });
    if (error) { notify(error.message, "err"); return false; }
    setShowPoll(false);
    return true;
  };
  const votesFor = (kind, id) => (pollVotes || []).filter(v => v.msg_kind === kind && v.msg_id === id);
  const delChannel = async (id) => { const { error } = await supabase.from('channel_messages').delete().eq('id', id); if (error) notify(error.message, "err"); };
  const activeUser = accounts.find(a => a.id === activeId);
  const fmt = (ts) => new Date(ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const listBtn = (selected) => ({ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "12px 14px", background: selected ? "var(--panel-2)" : "transparent", border: "none", borderBottom: "1px solid #21252d", cursor: "pointer", textAlign: "left" });

  return (
    <div>
      <h1 className="chat-title" style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: "0 0 20px" }}>Messagerie</h1>
      {showPoll && <PollForm onCancel={() => setShowPoll(false)} onSubmit={sendPoll} />}
      <div className={"chat-wrap" + (open ? " is-open" : "")} style={{ display: "flex", height: "calc(100vh - 150px)", border: "1px solid var(--border)", borderRadius: 14, overflow: "hidden" }}>
        <div className="paper chat-list" style={{ width: 250, flexShrink: 0, borderRight: "1px solid var(--border)", overflowY: "auto" }}>
          <button onClick={() => pick("channel")} style={listBtn(isChannel)}>
            <div style={{ width: 32, height: 32, borderRadius: 10, background: "#5B6EF526", color: "var(--accent-2)", display: "grid", placeItems: "center", flexShrink: 0 }}><I.Hash size={16} /></div>
            <div style={{ minWidth: 0, flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)" }}>Général</div><div style={{ fontSize: 11.5, color: "var(--text-dimmer)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{lastChannel ? lastChannel.text : "Salon de tout le serveur"}</div></div>
          </button>
          {contacts.map(u => { const last = lastMsgFor(u.id); return (
            <button key={u.id} onClick={() => pick(u.id)} style={listBtn(activeId === u.id)}>
              <Avatar user={u} size={32} />
              <div style={{ minWidth: 0, flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)" }}>{u.display_name}</div><div style={{ fontSize: 11.5, color: "var(--text-dimmer)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last ? last.text : "Aucun message"}</div></div>
            </button>
          );})}
        </div>
        <div className="chat-pane" style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, minHeight: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px", borderBottom: "1px solid var(--border)" }}>
            <button type="button" className="show-mobile" onClick={() => setOpen(false)} style={{ ...iconBtn, border: "none", padding: "4px 8px 4px 0", transform: "rotate(90deg)" }} aria-label="Retour aux conversations"><I.Chevron size={20} /></button>
            {isChannel ? (<><I.Hash size={18} color="var(--accent-2)" /><span style={{ fontWeight: 600, fontSize: 14 }}>Général</span><span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>· tout le serveur</span></>)
              : activeUser ? (<><Avatar user={activeUser} size={28} /><span style={{ fontWeight: 600, fontSize: 14 }}>{activeUser.display_name}</span></>) : null}
          </div>
          <div ref={scrollRef} style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: isChannel ? 12 : 8 }}>
            {isChannel ? (<>
              {channel.length === 0 && <EmptyState text="Aucun message dans le salon. Lance la discussion !" />}
              {channel.map(m => {
                const author = accounts.find(a => a.id === m.from_id);
                const mentionsMe = new RegExp("(^|[^A-Za-z0-9._-])@" + (me.username || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z0-9_-])", "i").test(m.text);
                return (
                  <div key={m.id} style={{ display: "flex", gap: 10, padding: mentionsMe ? "6px 8px" : 0, margin: mentionsMe ? "0 -8px" : 0, background: mentionsMe ? "#5B6EF514" : "transparent", borderRadius: 8 }}>
                    <Avatar user={author} size={30} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}><strong style={{ color: "var(--text)", fontSize: 13 }}>{author ? author.display_name : "Ancien membre"}</strong> · {fmt(m.ts)}</div>
                      {m.poll
                        ? <PollCard kind="channel" msg={m} me={me} isAdmin={isAdmin} accounts={accounts} votes={votesFor("channel", m.id)} onChanged={reloadVotes} notify={notify} />
                        : <div style={{ fontSize: 13.5, whiteSpace: "pre-wrap", wordBreak: "break-word" }}><RichText text={m.text} accounts={accounts} /></div>}
                      <ReactionBar kind="channel" targetId={m.id} reactions={reactions} me={me} accounts={accounts} notify={notify} />
                    </div>
                    {(m.from_id === me.id || isAdmin) && <button type="button" onClick={() => delChannel(m.id)} title="Supprimer" style={{ ...iconBtn, padding: 4, alignSelf: "flex-start", border: "none", color: "var(--text-dimmer)" }}><I.Trash size={13} /></button>}
                  </div>
                );
              })}
            </>) : activeUser ? (<>
              {thread.length === 0 && <EmptyState text="Aucun message. Dites bonjour !" />}
              {thread.map(m => m.poll ? (<div key={m.id} style={{ alignSelf: m.from_id === me.id ? "flex-end" : "flex-start", width: "min(400px, 94%)" }}><div style={{ fontSize: 10.5, color: "var(--text-dimmer)", margin: "0 0 3px 4px", textAlign: m.from_id === me.id ? "right" : "left" }}>{fmt(m.ts)}</div><PollCard kind="dm" msg={m} me={me} isAdmin={isAdmin} accounts={accounts} votes={votesFor("dm", m.id)} onChanged={reloadVotes} notify={notify} /></div>) : (<div key={m.id} style={{ alignSelf: m.from_id === me.id ? "flex-end" : "flex-start", maxWidth: "70%", background: m.from_id === me.id ? "linear-gradient(135deg,var(--accent),var(--accent-2))" : "var(--panel-2)", color: m.from_id === me.id ? "#fff" : "var(--text)", padding: "9px 13px", borderRadius: 12, borderBottomRightRadius: m.from_id === me.id ? 3 : 12, borderBottomLeftRadius: m.from_id === me.id ? 12 : 3, fontSize: 13.5, wordBreak: "break-word" }}><RichText text={m.text} accounts={accounts} /><div style={{ fontSize: 10, opacity: 0.6, marginTop: 3 }}>{fmt(m.ts)}</div></div>))}
            </>) : <EmptyState text="Choisis une conversation." />}
          </div>
          <div style={{ display: "flex", gap: 10, padding: 14, borderTop: "1px solid var(--border)", flexShrink: 0 }}>
            {isChannel
              ? <MentionInput value={draft} onChange={setDraft} onSubmit={send} disabled={!canSend} people={contacts} placeholder={canSend ? "Écrire dans le salon… (@ pour mentionner)" : "Ton rôle ne permet pas d'envoyer de messages"} style={{ ...inputStyle, background: "var(--bg)", opacity: canSend ? 1 : 0.5 }} />
              : <input value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => { if (e.key === "Enter") send(); }} disabled={!canSend || !activeUser} placeholder={canSend ? "Écrire un message…" : "Ton rôle ne permet pas d'envoyer de messages"} style={{ ...inputStyle, flex: 1, background: "var(--bg)", opacity: canSend ? 1 : 0.5 }} />}
            {canSend && (isChannel || activeUser) && <button type="button" onClick={startCall} title="Lancer un appel vidéo" aria-label="Lancer un appel vidéo" style={{ ...iconBtn, padding: "0 12px" }}><I.Video size={16} /></button>}
            {canSend && (isChannel || activeUser) && <button type="button" onClick={() => setShowPoll(true)} title="Créer un sondage" aria-label="Créer un sondage" style={{ ...iconBtn, padding: "0 12px" }}><I.Poll size={16} /></button>}
            <button type="button" onClick={send} disabled={!canSend} style={{ background: "linear-gradient(135deg,var(--accent),var(--accent-2))", border: "none", color: "#fff", borderRadius: 9, padding: "0 16px", cursor: canSend ? "pointer" : "not-allowed", opacity: canSend ? 1 : 0.5, display: "grid", placeItems: "center" }}><I.Send size={16} /></button>
          </div>
        </div>
      </div>
    </div>
  );
}
