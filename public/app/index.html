/** Durée d'une entrée de temps en millisecondes (une minuterie en cours compte jusqu'à maintenant, 24 h au plus). */
const entryMs = (e, now = Date.now()) => Math.max(0, Math.min((e.ended_at ? Date.parse(e.ended_at) : now) - Date.parse(e.started_at), 24 * 3600e3));
const fmtDur = (ms) => {
  const m = Math.round(ms / 60000);
  if (m < 1) return ms >= 1000 ? "< 1 min" : "0 min";
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " h" + (r ? " " + String(r).padStart(2, "0") : "");
};
const fmtClock = (ms) => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60; return [h, m, sec].map(x => String(x).padStart(2, "0")).join(":"); };
/** « 45 », « 1h30 », « 1:30 », « 2 h », « 1,5 » (heures si virgule) → minutes, ou null. */
function parseMinutes(txt) {
  const t = String(txt || "").trim().toLowerCase().replace(",", ".");
  let m;
  if ((m = t.match(/^(\d+)\s*(?:h|:)\s*(\d{1,2})?\s*(?:min|m)?$/))) return Number(m[1]) * 60 + Number(m[2] || 0);
  if ((m = t.match(/^(\d+(?:\.\d+)?)\s*h$/))) return Math.round(Number(m[1]) * 60);
  if ((m = t.match(/^(\d+)\s*(?:min|m)?$/))) return Number(m[1]);
  if ((m = t.match(/^(\d+\.\d+)$/))) return Math.round(Number(m[1]) * 60);
  return null;
}
async function stopEntry(e) {
  const end = new Date(Math.min(Math.max(Date.now(), Date.parse(e.started_at) + 1000), Date.parse(e.started_at) + 24 * 3600e3)).toISOString();
  return supabase.from("time_entries").update({ ended_at: end }).eq("id", e.id);
}

function TimeTracker({ task, me, isAdmin, entries, accounts, notify, onFocus }) {
  const [, tick] = useState(0);
  const [minutes, setMinutes] = useState("");
  const [day, setDay] = useState(parisDay());
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const mine = entries.find(e => e.user_id === me.id && !e.ended_at);
  const canTrack = me.role !== "guest";
  useEffect(() => { if (!entries.some(e => !e.ended_at)) return; const id = setInterval(() => tick(n => n + 1), 1000); return () => clearInterval(id); }, [entries]);
  const total = entries.reduce((n, e) => n + entryMs(e), 0);
  const perPerson = accounts.map(a => ({ a, ms: entries.filter(e => e.user_id === a.id).reduce((n, e) => n + entryMs(e), 0) })).filter(x => x.ms > 0).sort((x, y) => y.ms - x.ms);
  const start = async () => {
    if (busy) return; setBusy(true);
    // une seule minuterie à la fois : on arrête celle d'une autre tâche
    const { data: running } = await supabase.from("time_entries").select("*").eq("user_id", me.id).is("ended_at", null);
    for (const r of running || []) await stopEntry(r);
    const { error } = await supabase.from("time_entries").insert({ server_id: me.server_id, task_id: task.id, user_id: me.id, started_at: new Date().toISOString() });
    setBusy(false);
    if (error) notify(error.message, "err"); else notify("Chrono démarré.");
  };
  const stop = async () => { if (!mine || busy) return; setBusy(true); const { error } = await stopEntry(mine); setBusy(false); notify(error ? error.message : "Chrono arrêté : " + fmtDur(entryMs({ ...mine, ended_at: new Date().toISOString() })) + " enregistrés."); };
  const addManual = async () => {
    const m = parseMinutes(minutes);
    if (!m || m < 1 || m > 24 * 60) { notify("Indiquez une durée, par exemple 45, 1h30 ou 2 h (24 h au maximum).", "err"); return; }
    if (busy) return; setBusy(true);
    const startMs = parisInstant(day || parisDay(), "09:00");
    const { error } = await supabase.from("time_entries").insert({ server_id: me.server_id, task_id: task.id, user_id: me.id, started_at: new Date(startMs).toISOString(), ended_at: new Date(startMs + m * 60000).toISOString(), note: note.trim().slice(0, 200) });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setMinutes(""); setNote(""); notify(fmtDur(m * 60000) + " ajoutés.");
  };
  const remove = async (e) => { const { error } = await supabase.from("time_entries").delete().eq("id", e.id); if (error) notify(error.message, "err"); };
  const list = entries.filter(e => e.ended_at).sort((a, b) => b.started_at.localeCompare(a.started_at)).slice(0, 8);
  return (
    <div data-time-tracker style={{ borderTop: "1px solid var(--border)", paddingTop: 14, marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 8 }}>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600 }}>⏱ Temps passé</div>
        <strong data-time-total style={{ fontSize: 13 }}>{total ? fmtDur(total) : "—"}</strong>
        {canTrack && (mine
          ? <button key="stop" type="button" data-timer-stop onClick={stop} disabled={busy} style={{ ...chipBtn, marginLeft: "auto", color: "var(--late)", borderColor: "#FF6B5E" }}>■ Arrêter · <span data-timer-clock>{fmtClock(entryMs(mine))}</span></button>
          : <button key="start" type="button" data-timer-start onClick={start} disabled={busy} style={{ ...chipBtn, marginLeft: "auto" }}>▶ Démarrer le chrono</button>)}
        {canTrack && onFocus && !task.done && <span style={{ display: "inline-flex", gap: 6 }}><button type="button" data-focus-start="25" onClick={() => onFocus(task, 25, 5)} title="25 minutes de concentration, puis 5 minutes de pause" style={chipBtn}>🎯 25 min</button><button type="button" data-focus-start="50" onClick={() => onFocus(task, 50, 10)} title="50 minutes de concentration, puis 10 minutes de pause" style={chipBtn}>🎯 50 min</button></span>}
      </div>
      {perPerson.length > 1 && <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginBottom: 8 }}>{perPerson.map(x => `${x.a.display_name} : ${fmtDur(x.ms)}`).join(" · ")}</div>}
      {canTrack && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
          <input data-time-minutes value={minutes} onChange={e => setMinutes(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addManual(); } }} placeholder="Durée : 45, 1h30…" aria-label="Durée à ajouter" style={{ ...inputStyle, width: 130, padding: "6px 10px" }} />
          <input type="date" value={day} max={parisDay()} onChange={e => setDay(e.target.value)} aria-label="Jour" style={{ ...inputStyle, width: "auto", padding: "6px 10px" }} />
          <input value={note} onChange={e => setNote(e.target.value)} maxLength={200} placeholder="Note (facultatif)" aria-label="Note" style={{ ...inputStyle, flex: "1 1 120px", width: "auto", padding: "6px 10px" }} />
          <button type="button" data-time-add onClick={addManual} disabled={busy} style={chipBtn}>Ajouter</button>
        </div>
      )}
      {list.map(e => { const u = accounts.find(a => a.id === e.user_id); return (
        <div key={e.id} data-time-entry style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 12.5, color: "var(--text-dim)", padding: "3px 0" }}>
          <span style={{ minWidth: 70 }}>{fmtDay(parisDay(Date.parse(e.started_at)), { day: "numeric", month: "short" })}</span>
          <strong style={{ color: "var(--text)", minWidth: 56 }}>{fmtDur(entryMs(e))}</strong>
          <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{u ? u.display_name : "?"}{e.note ? " · " + e.note : ""}</span>
          {(e.user_id === me.id || isAdmin) && <button type="button" data-time-delete onClick={() => remove(e)} aria-label="Supprimer cette entrée" style={{ background: "none", border: "none", color: "var(--text-dimmer)", cursor: "pointer" }}>✕</button>}
        </div>); })}
    </div>
  );
}

/** Recherche globale (Ctrl K) : pages, tâches, réunions, notes. */
const normSearch = (x) => String(x || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function CommandPalette({ tasks, meetings, notes, accounts, tabs, onClose, onTab, onTask, onNote, onNewTask, canCreate, onReview, recents = [], actions = [] }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  const needle = normSearch(q.trim());
  const items = useMemo(() => {
    const out = [];
    const pages = tabs.map(t => ({ k: "tab-" + t.id, kind: "Page", label: t.label, hint: "Aller à cette page", run: () => onTab(t.id) }));
    if (canCreate) pages.unshift({ k: "new-task", kind: "Action", label: "Nouvelle tâche", hint: "Créer une tâche", run: onNewTask });
    if (onReview) pages.push({ k: "review", kind: "Action", label: "Revue de la semaine", hint: "Faire le point guidé", run: onReview });
    actions.forEach(a => pages.push({ k: "act-" + a.k, kind: "Action", label: a.label, hint: a.hint, run: a.run }));
    const match = (txt) => !needle || normSearch(txt).includes(needle);
    if (!needle) {
      for (const r of recents.slice(0, 5)) {
        if (r.k === "task") { const t = tasks.find(x => x.id === r.id); if (t) out.push({ k: "rec-t-" + t.id, kind: "Récent", label: t.title, hint: "Rouvrir la tâche", run: () => onTask(t.id) }); }
        else { const n = notes.find(x => x.id === r.id); if (n) out.push({ k: "rec-n-" + n.id, kind: "Récent", label: n.title, hint: "Rouvrir la note", run: () => onNote(n.id) }); }
      }
    }
    out.push(...pages.filter(p => match(p.label)).slice(0, needle ? 4 : 20));
    if (needle) {
      out.push(...tasks.filter(t => match(t.title) || match((t.tags || []).join(" "))).slice(0, 6).map(t => ({ k: "task-" + t.id, kind: t.done ? "Tâche terminée" : "Tâche", label: t.title, hint: t.due ? "Échéance " + formatDue(t.due, daysUntil(t.due)).toLowerCase() : "Sans échéance", run: () => onTask(t.id) })));
      out.push(...notes.filter(n => match(n.title) || match(n.body)).slice(0, 4).map(n => ({ k: "note-" + n.id, kind: "Note", label: n.title, hint: "Ouvrir la note", run: () => onNote(n.id) })));
      out.push(...meetings.filter(m => match(m.title) && Date.parse(m.ends_at) > Date.now() - 7 * 864e5).slice(0, 3).map(m => ({ k: "meet-" + m.id, kind: "Réunion", label: m.title, hint: fmtWhen(m), run: () => onTab("meetings") })));
      out.push(...accounts.filter(a => match(a.display_name) || match(a.username)).slice(0, 3).map(a => ({ k: "user-" + a.id, kind: "Personne", label: a.display_name, hint: "Écrire un message", run: () => onTab("messages") })));
    }
    return out;
  }, [needle, tasks, meetings, notes, accounts, tabs, recents]);
  useEffect(() => { setSel(0); }, [needle]);
  const key = (e) => {
    if (e.key === "Escape") { e.preventDefault(); onClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setSel(i => Math.min(items.length - 1, i + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel(i => Math.max(0, i - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); const it = items[sel]; if (it) it.run(); }
  };
  return (
    <div style={{ ...overlayStyle, placeItems: "start center", paddingTop: "12vh" }} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" data-palette style={{ ...modalStyle, width: 560, padding: 0, overflow: "hidden" }}>

          {items.map((it, i) => (

              <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.label}</span>
              <span style={{ fontSize: 11.5, color: "var(--text-dimmer)", flexShrink: 0 }}>{it.hint}</span>
            </button>
          ))}
        </div>
        <div style={{ borderTop: "1px solid var(--border)", padding: "8px 14px", fontSize: 11.5, color: "var(--text-dimmer)", display: "flex", gap: 14 }}><span>↑↓ naviguer</span><span>↵ ouvrir</span><span>Échap fermer</span></div>
      </div>
    </div>
  );
}

/** Mini mise en forme des notes : titres (#), listes (-), cases à cocher (- [ ]), **gras**, liens https. */
function renderInline(text, key) {
  const parts = []; const re = /(\*\*[^*]+\*\*|https:\/\/[^\s<]+)/g; let last = 0, m, i = 0;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    const tok = m[0];
    parts.push(tok.startsWith("**") ? <strong key={key + "-" + i++}>{tok.slice(2, -2)}</strong> : <a key={key + "-" + i++} href={tok} target="_blank" rel="noopener noreferrer" style={{ color: "var(--accent-2)" }}>{tok}</a>);
    last = m.index + tok.length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}
function NoteBody({ body, onToggle }) {
  const lines = String(body || "").split("\n");
  return (
    <div data-note-body style={{ fontSize: 14, lineHeight: 1.65 }}>
      {lines.map((l, i) => {
        let m;
        if ((m = l.match(/^(#{1,3})\s+(.*)$/))) return <div key={i} style={{ fontFamily: "Literata, serif", fontWeight: 600, fontSize: m[1].length === 1 ? 22 : m[1].length === 2 ? 18 : 15.5, margin: "14px 0 4px" }}>{renderInline(m[2], i)}</div>;
        if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))) { const on = m[1] !== " "; return <label key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", cursor: onToggle ? "pointer" : "default" }}><input type="checkbox" data-note-check checked={on} disabled={!onToggle} onChange={() => onToggle && onToggle(i)} style={{ marginTop: 5 }} /><span style={{ textDecoration: on ? "line-through" : "none", opacity: on ? 0.6 : 1 }}>{renderInline(m[2], i)}</span></label>; }
        if ((m = l.match(/^\s*[-*]\s+(.*)$/))) return <div key={i} style={{ display: "flex", gap: 8 }}><span aria-hidden="true">•</span><span>{renderInline(m[1], i)}</span></div>;
        if (!l.trim()) return <div key={i} style={{ height: 8 }} />;
        return <div key={i}>{renderInline(l, i)}</div>;
      })}
    </div>
  );
}

const STATUS_PRESETS = [

  { emoji: "🚆", text: "En déplacement", hours: 8 },
  { emoji: "🏠", text: "En télétravail", hours: 10 },
  { emoji: "📞", text: "Au téléphone", hours: 1 },
];
const statusActive = (p, now) => Boolean(p.status_text) && (!p.status_until || Date.parse(p.status_until) > now);
/** Disponibilité d'une personne à l'instant `now` : { kind, label, color }. */
function presenceOf(p, { leaves, meetings, attendees, now }) {
  const day = parisDay(now);
  if (leaves.some(l => l.user_id === p.id && l.status === "approved" && l.start_date <= day && l.end_date >= day)) return { kind: "leave", label: "En congé", color: "#B07BE8" };
  const inMeet = meetings.some(m => Date.parse(m.starts_at) <= now && now < Date.parse(m.ends_at) && (m.created_by === p.id || attendees.some(a => a.meeting_id === m.id && a.user_id === p.id && a.response !== "declined")));
  if (inMeet) return { kind: "meeting", label: "En réunion", color: "#FF6B5E" };
  if (outsideHoursC(p.work_hours, now, now)) return { kind: "hours", label: "Hors horaires", color: "#8A8F98" };
  return { kind: "free", label: "Disponible", color: "#3FB68B" };
}

function krProgress(kr, taskById) {
  if (kr.kind === "tasks") {
    const ts = (kr.task_ids || []).map(id => taskById.get(id)).filter(Boolean);
    if (!ts.length) return { ratio: 0, label: "Aucune tâche liée", done: 0, total: 0 };
    const done = ts.filter(t => t.done).length;
    return { ratio: done / ts.length, label: done + " / " + ts.length + " tâche" + (ts.length > 1 ? "s" : "") + " terminée" + (done > 1 ? "s" : ""), done, total: ts.length };
  }
  const target = Number(kr.target) || 1, cur = Number(kr.current) || 0;
  const u = kr.unit ? " " + kr.unit : "";
  return { ratio: Math.min(1, cur / target), label: cur + " / " + target + u };
}
function objProgress(krs, taskById) {
  if (!krs.length) return 0;
  return krs.reduce((s, k) => s + krProgress(k, taskById).ratio, 0) / krs.length;
}
function ProgressBar({ ratio, color, height = 8, label }) {
  const pct = Math.round(Math.max(0, Math.min(1, ratio)) * 100);
  return <div role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={label || "Progression"} data-pct={pct} style={{ height, borderRadius: height, background: "var(--bg-2)", overflow: "hidden", border: "1px solid var(--border-soft)" }}><div style={{ width: pct + "%", height: "100%", background: color || (pct >= 100 ? "#3FB68B" : "var(--accent)"), transition: "width .3s" }} /></div>;
}

  const [busy, setBusy] = useState(false);
  const needle = normSearch(q.trim());
  const shown = tasks.filter(t => picked.has(t.id) || !needle || normSearch(t.title).includes(needle)).slice(0, 60);
  const toggle = (id) => setPicked(prev => { const n = new Set(prev); if (n.has(id)) n.delete(id); else if (n.size < 100) n.add(id); return n; });
  const save = async (ev) => {
    ev.preventDefault();
    if (busy) return;
    if (!title.trim()) { notify("Donnez un titre au résultat clé.", "err"); return; }
    let row = { title: title.trim().slice(0, 120), kind };
    if (kind === "manual") {
      const t = Number(String(target).replace(",", ".")), c = Number(String(current).replace(",", "."));
      if (!(t > 0) || !(c >= 0)) { notify("La valeur à atteindre doit être supérieure à 0, et la valeur actuelle ne peut pas être négative.", "err"); return; }
      row = { ...row, target: t, current: c, unit: unit.trim().slice(0, 12), task_ids: [] };
    } else {
      if (!picked.size) { notify("Choisissez au moins une tâche à suivre.", "err"); return; }
      row = { ...row, task_ids: [...picked], target: 100, current: 0, unit: "" };
    }
    setBusy(true);
    const { error } = initial
      ? await supabase.from("key_results").update(row).eq("id", initial.id)
      : await supabase.from("key_results").insert({ ...row, objective_id: objective.id, server_id: me.server_id, position });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    notify(initial ? "Résultat clé modifié." : "Résultat clé ajouté.");
    onClose();
  };
  const kindBtn = (id, label, hint) => (<button type="button" data-kr-kind={id} aria-pressed={kind === id} onClick={() => setKind(id)} style={{ flex: 1, textAlign: "left", padding: "10px 12px", borderRadius: 10, cursor: "pointer", background: kind === id ? "var(--panel)" : "transparent", border: "1px solid " + (kind === id ? "var(--accent)" : "var(--border-soft)"), color: "var(--text)" }}><div style={{ fontWeight: 600, fontSize: 13.5 }}>{label}</div><div style={{ fontSize: 12, color: "var(--text-dim)", marginTop: 2 }}>{hint}</div></button>);
  return (
    <div style={overlayStyle} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) onClose(); }}>
      <form className="modal-card" data-kr-form onSubmit={save} style={modalStyle}>
        <h2 style={{ fontFamily: "Literata, serif", fontSize: 20, fontWeight: 600, margin: "0 0 4px" }}>{initial ? "Modifier le résultat clé" : "Nouveau résultat clé"}</h2>
        <p style={{ color: "var(--text-dim)", fontSize: 13, margin: "0 0 14px" }}>Pour l'objectif « {objective.title} ».</p>
        <Field label="Résultat à obtenir"><input autoFocus data-kr-title value={title} onChange={e => setTitle(e.target.value)} maxLength={120} placeholder="Par exemple : Signer 20 clients" style={inputStyle} /></Field>
        <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
          {kindBtn("manual", "Une valeur à atteindre", "Vous mettez à jour le chiffre vous-même.")}
          {kindBtn("tasks", "Des tâches à terminer", "L'avancement suit vos tâches.")}
        </div>
        {kind === "manual" ? (
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 90px" }}><Field label="Valeur actuelle"><input data-kr-current-input inputMode="decimal" value={current} onChange={e => setCurrent(e.target.value)} style={inputStyle} /></Field></div>
            <div style={{ flex: "1 1 90px" }}><Field label="À atteindre"><input data-kr-target-input inputMode="decimal" value={target} onChange={e => setTarget(e.target.value)} style={inputStyle} /></Field></div>
            <div style={{ flex: "1 1 90px" }}><Field label="Unité (optionnel)"><input value={unit} onChange={e => setUnit(e.target.value)} maxLength={12} placeholder="clients, %, €…" style={inputStyle} /></Field></div>
          </div>
        ) : (
          <div>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Chercher une tâche…" aria-label="Chercher une tâche" style={{ ...inputStyle, marginBottom: 8 }} />
            <div data-kr-tasks style={{ maxHeight: 220, overflowY: "auto", border: "1px solid var(--border-soft)", borderRadius: 10, padding: 4 }}>
              {shown.length === 0 && <div style={{ padding: 12, fontSize: 13, color: "var(--text-dimmer)" }}>Aucune tâche trouvée.</div>}
              {shown.map(t => (<label key={t.id} style={{ display: "flex", alignItems: "center", gap: 9, padding: "7px 9px", borderRadius: 7, cursor: "pointer", fontSize: 13.5 }}><input type="checkbox" data-kr-task={t.title} checked={picked.has(t.id)} onChange={() => toggle(t.id)} /><span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", textDecoration: t.done ? "line-through" : "none", color: t.done ? "var(--text-dimmer)" : "var(--text)" }}>{t.title}</span></label>))}
            </div>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 6 }}>{picked.size} tâche{picked.size > 1 ? "s" : ""} suivie{picked.size > 1 ? "s" : ""} (100 au maximum).</div>
          </div>
        )}
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 14 }}>
          <button type="button" onClick={onClose} style={secondaryBtn}>Annuler</button>
          <button type="submit" data-kr-save disabled={busy} style={primaryBtn}>{initial ? "Enregistrer" : "Ajouter"}</button>
        </div>
      </form>
    </div>
  );
}

function KeyResultRow({ kr, taskById, canManage, onEdit, onDelete, notify, onOpenTask }) {
  const pr = krProgress(kr, taskById);
  const [val, setVal] = useState(String(kr.current));
  useEffect(() => { setVal(String(kr.current)); }, [kr.current]);
  const commit = async () => {
    const n = Number(String(val).replace(",", "."));
    if (!(n >= 0) || n === Number(kr.current)) { setVal(String(kr.current)); return; }
    const { error } = await supabase.from("key_results").update({ current: n }).eq("id", kr.id);
    if (error) { notify(error.message, "err"); setVal(String(kr.current)); }
  };
  const linked = kr.kind === "tasks" ? (kr.task_ids || []).map(id => taskById.get(id)).filter(Boolean) : [];
  return (
    <div data-kr data-kr-kind-row={kr.kind} style={{ padding: "12px 0", borderTop: "1px solid var(--border-soft)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 7 }}>
        <div style={{ flex: "1 1 200px", minWidth: 0, fontSize: 14, fontWeight: 600 }}>{kr.title}</div>
        <div data-kr-label style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{pr.label} · {Math.round(pr.ratio * 100)} %</div>
        {canManage && kr.kind === "manual" && (
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
            <input data-kr-current value={val} onChange={e => setVal(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } }} inputMode="decimal" aria-label={"Valeur actuelle : " + kr.title} style={{ ...inputStyle, width: 74, padding: "5px 8px", fontSize: 13 }} />
          </span>
        )}
        {canManage && <button type="button" data-kr-edit onClick={() => onEdit(kr)} style={chipBtn}>Modifier</button>}
        {canManage && <button type="button" data-kr-delete onClick={() => onDelete(kr)} aria-label={"Supprimer " + kr.title} style={{ ...iconBtn, border: "none" }}><I.Trash size={14} /></button>}
      </div>
      <ProgressBar ratio={pr.ratio} label={kr.title} />
      {linked.length > 0 && <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>{linked.slice(0, 8).map(t => (<button key={t.id} type="button" onClick={() => onOpenTask(t.id)} style={{ ...chipBtn, fontSize: 11.5, textDecoration: t.done ? "line-through" : "none", opacity: t.done ? 0.7 : 1 }}>{t.title.length > 34 ? t.title.slice(0, 33) + "…" : t.title}</button>))}{linked.length > 8 && <span style={{ fontSize: 12, color: "var(--text-dimmer)", alignSelf: "center" }}>+ {linked.length - 8}</span>}</div>}
    </div>
  );
}

function ObjectivesView({ me, accounts, objectives, keyResults, tasks, projects, onOpen, notify }) {
  const [filter, setFilter] = useState("active");
  const [openIds, setOpenIds] = useState(() => new Set());
  const [objModal, setObjModal] = useState(null);   // { initial } | null
  const [krModal, setKrModal] = useState(null);     // { objective, initial } | null
  const isAdmin = me.role === "admin";
  const canCreate = me.role !== "guest";
  const taskById = useMemo(() => new Map(tasks.map(t => [t.id, t])), [tasks]);
  const krsOf = useMemo(() => { const m = new Map(); for (const k of keyResults) { if (!m.has(k.objective_id)) m.set(k.objective_id, []); m.get(k.objective_id).push(k); } for (const arr of m.values()) arr.sort((a, b) => (a.position - b.position) || a.created_at.localeCompare(b.created_at)); return m; }, [keyResults]);
  const counts = useMemo(() => ({ active: objectives.filter(o => o.status === "active").length, done: objectives.filter(o => o.status === "done").length, archived: objectives.filter(o => o.status === "archived").length }), [objectives]);
  const list = useMemo(() => objectives.filter(o => o.status === filter).sort((a, b) => ((a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : b.created_at.localeCompare(a.created_at))), [objectives, filter]);
  const who = (id) => accounts.find(a => a.id === id);
  const canManage = (o) => isAdmin || o.owner_id === me.id || o.created_by === me.id;
  const toggleOpen = (id) => setOpenIds(prev => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const setStatus = async (o, status) => { const { error } = await supabase.from("objectives").update({ status }).eq("id", o.id); if (error) notify(error.message, "err"); else notify(status === "done" ? "Objectif marqué comme atteint. Bravo !" : status === "archived" ? "Objectif archivé." : "Objectif réactivé."); };
  const removeObj = async (o) => {
    if (!window.confirm(`Supprimer l'objectif « ${o.title} » et ses résultats clés ? Cette action est définitive.`)) return;
    const { error } = await supabase.from("objectives").delete().eq("id", o.id);
    if (error) notify(error.message, "err"); else notify("Objectif supprimé.");
  };
  const removeKr = async (kr) => {
    if (!window.confirm(`Supprimer le résultat clé « ${kr.title} » ?`)) return;
    const { error } = await supabase.from("key_results").delete().eq("id", kr.id);
    if (error) notify(error.message, "err");
  };
  const today = parisDay();
  const tabBtn = (id, label) => (<button key={id} type="button" data-obj-filter={id} aria-pressed={filter === id} onClick={() => setFilter(id)} style={{ ...chipBtn, background: filter === id ? "var(--panel-2)" : "transparent", color: filter === id ? "var(--text)" : "var(--text-dim)", fontWeight: filter === id ? 600 : 500 }}>{label} · {counts[id]}</button>);
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 18, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Objectifs</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0", maxWidth: 560 }}>Fixez un cap à l'équipe, puis mesurez l'avancement avec des résultats clés : un chiffre à atteindre, ou un groupe de tâches à terminer.</p></div>
        {canCreate && <button type="button" data-obj-new onClick={() => setObjModal({ initial: null })} style={{ ...primaryBtn, padding: "10px 18px", display: "flex", alignItems: "center", gap: 7 }}><I.Plus size={15} /> Nouvel objectif</button>}
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>{tabBtn("active", "En cours")}{tabBtn("done", "Atteints")}{tabBtn("archived", "Archivés")}</div>
      {list.length === 0 && (
        <div data-obj-empty className="paper" style={{ border: "1px dashed var(--border-soft)", borderRadius: 14, padding: "34px 22px", textAlign: "center", color: "var(--text-dim)", fontSize: 14 }}>
          {filter === "active" ? (canCreate ? "Aucun objectif en cours. Créez le premier pour donner un cap à l'équipe." : "Aucun objectif en cours pour le moment.") : filter === "done" ? "Aucun objectif atteint pour l'instant." : "Aucun objectif archivé."}
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {list.map(o => {
          const krs = krsOf.get(o.id) || [];
          const ratio = objProgress(krs, taskById);
          const owner = who(o.owner_id);
          const open = openIds.has(o.id);
          const late = o.due && o.status === "active" && o.due < today;
          const manage = canManage(o);
          const proj = o.project_id && projects.find(p => p.id === o.project_id);
          return (
            <section key={o.id} data-objective={o.title} data-status={o.status} className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 14, padding: "16px 18px" }}>
              <button type="button" data-obj-toggle aria-expanded={open} onClick={() => toggleOpen(o.id)} style={{ display: "block", width: "100%", textAlign: "left", background: "none", border: "none", padding: 0, color: "inherit", cursor: "pointer", font: "inherit" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <div style={{ flex: "1 1 240px", minWidth: 0, fontFamily: "Literata, serif", fontSize: 18, fontWeight: 600 }}>{o.title}</div>
                  <div data-obj-pct style={{ fontSize: 22, fontWeight: 700, fontFamily: "Literata, serif", color: ratio >= 1 ? "#3FB68B" : "var(--text)" }}>{Math.round(ratio * 100)} %</div>
                  <span style={{ color: "var(--text-dimmer)", transform: open ? "rotate(180deg)" : "none", display: "inline-flex" }}><I.Chevron size={16} /></span>
                </div>
                <div style={{ margin: "10px 0 8px" }}><ProgressBar ratio={ratio} height={10} label={"Progression de l'objectif " + o.title} /></div>
                <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12.5, color: "var(--text-dim)", alignItems: "center" }}>
                  {owner && <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><Avatar user={owner} size={18} /> {owner.display_name}</span>}
                  {o.due && <span style={{ color: late ? "#FF6B5E" : "var(--text-dim)" }}>{late ? "En retard · " : "Pour le "}{fmtDay(o.due, { day: "numeric", month: "long", year: "numeric" })}</span>}
                  <span>{krs.length} résultat{krs.length > 1 ? "s" : ""} clé{krs.length > 1 ? "s" : ""}</span>
                  {proj && <span>Projet : {proj.name}</span>}
                </div>
              </button>
              {open && (
                <div data-obj-detail style={{ marginTop: 12 }}>
                  {o.description && <p style={{ margin: "0 0 8px", fontSize: 13.5, color: "var(--text-dim)", whiteSpace: "pre-wrap" }}>{o.description}</p>}
                  {krs.length === 0 && <div style={{ padding: "12px 0", borderTop: "1px solid var(--border-soft)", fontSize: 13.5, color: "var(--text-dimmer)" }}>Aucun résultat clé. Ajoutez-en un pour commencer à mesurer l'avancement.</div>}
                  {krs.map(kr => <KeyResultRow key={kr.id} kr={kr} taskById={taskById} canManage={manage} notify={notify} onOpenTask={onOpen} onEdit={(k) => setKrModal({ objective: o, initial: k })} onDelete={removeKr} />)}
                  {manage && (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--border-soft)" }}>
                      {o.status === "active" && krs.length < 12 && <button type="button" data-kr-new onClick={() => setKrModal({ objective: o, initial: null })} style={chipBtn}>+ Résultat clé</button>}
                      <button type="button" data-obj-edit onClick={() => setObjModal({ initial: o })} style={chipBtn}>Modifier</button>
                      {o.status === "active" && <button type="button" data-obj-done onClick={() => setStatus(o, "done")} style={chipBtn}>Marquer comme atteint</button>}
                      {o.status !== "active" && <button type="button" data-obj-reopen onClick={() => setStatus(o, "active")} style={chipBtn}>Réactiver</button>}
                      {o.status !== "archived" && <button type="button" data-obj-archive onClick={() => setStatus(o, "archived")} style={chipBtn}>Archiver</button>}
                      {(isAdmin || o.created_by === me.id) && <button type="button" data-obj-delete onClick={() => removeObj(o)} style={{ ...chipBtn, color: "#FF6B5E", marginLeft: "auto" }}>Supprimer</button>}
                    </div>
                  )}
                </div>
              )}
            </section>
          );
        })}
      </div>
      {objModal && <ObjectiveModal me={me} accounts={accounts} projects={projects} initial={objModal.initial} onClose={() => setObjModal(null)} notify={notify} />}
      {krModal && <KeyResultModal me={me} objective={krModal.objective} tasks={tasks} initial={krModal.initial} position={(krsOf.get(krModal.objective.id) || []).length} onClose={() => setKrModal(null)} notify={notify} />}
    </div>
  );
}

function NotesView({ me, accounts, notes, projects, focusId, onFocused, notify }) {
  const [selId, setSelId] = useState(null);
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState({ title: "", body: "", project_id: "" });
  const [loadedAt, setLoadedAt] = useState(null);
  const [busy, setBusy] = useState(false);
  const canWrite = me.role !== "guest";
  const isAdmin = me.role === "admin";
  useEffect(() => { if (focusId) { setSelId(focusId); setEditing(false); onFocused(); } }, [focusId]);
  const needle = normSearch(q.trim());
  const list = useMemo(() => notes.filter(n => !needle || normSearch(n.title).includes(needle) || normSearch(n.body).includes(needle)).sort((a, b) => (b.pinned - a.pinned) || b.updated_at.localeCompare(a.updated_at)), [notes, needle]);
  const cur = notes.find(n => n.id === selId) || null;
  const who = (id) => (accounts.find(a => a.id === id) || {}).display_name || "un ancien membre";
  const startEdit = () => { setDraft({ title: cur.title, body: cur.body, project_id: cur.project_id || "" }); setLoadedAt(cur.updated_at); setEditing(true); };
  const create = async () => {
    if (busy) return; setBusy(true);
    const { data, error } = await supabase.from("notes").insert({ server_id: me.server_id, created_by: me.id, title: "Nouvelle note", body: "" }).select().single();
    setBusy(false);
    if (error || !data) { notify(error ? error.message : "Création refusée.", "err"); return; }
    setSelId(data.id); setDraft({ title: data.title, body: "", project_id: "" }); setLoadedAt(data.updated_at); setEditing(true);
  };
  const save = async () => {
    if (!cur || busy) return;
    if (!draft.title.trim()) { notify("Donnez un titre à la note.", "err"); return; }
    setBusy(true);
    let q2 = supabase.from("notes").update({ title: draft.title.trim().slice(0, 120), body: draft.body.slice(0, 20000), project_id: draft.project_id || null }).eq("id", cur.id);
    if (loadedAt) q2 = q2.eq("updated_at", loadedAt);
    const { data, error } = await q2.select();
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    if (!data || !data.length) { notify("Cette note a été modifiée par quelqu'un d'autre pendant votre édition. Copiez votre texte, fermez l'édition puis reprenez la dernière version.", "err"); return; }
    setEditing(false); notify("Note enregistrée.");
  };
  const togglePin = async () => { const { error } = await supabase.from("notes").update({ pinned: !cur.pinned }).eq("id", cur.id); if (error) notify(error.message, "err"); };
  const remove = async () => {
    if (!window.confirm(`Supprimer la note « ${cur.title} » ? Cette action est définitive.`)) return;
    const { error } = await supabase.from("notes").delete().eq("id", cur.id);
    if (error) { notify(error.message, "err"); return; }
    setSelId(null); setEditing(false); notify("Note supprimée.");
  };
  const toggleCheck = async (lineIdx) => {
    const lines = cur.body.split("\n"); lines[lineIdx] = lines[lineIdx].replace(/\[( |x|X)\]/, (m, c) => (c === " " ? "[x]" : "[ ]"));
    const { error } = await supabase.from("notes").update({ body: lines.join("\n") }).eq("id", cur.id);
    if (error) notify(error.message, "err");
  };
  const proj = cur && projects.find(p => p.id === cur.project_id);
  const dt = (iso) => fmtDay(parisDay(Date.parse(iso)), { day: "numeric", month: "long" }) + " à " + hhmm(new Date(iso).toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" }));
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Notes</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>Pages partagées de l'équipe : comptes rendus, procédures, idées, listes à cocher.</p></div>
        {canWrite && <button type="button" data-note-new onClick={create} disabled={busy} style={{ ...primaryBtn, padding: "10px 18px", display: "flex", alignItems: "center", gap: 7 }}><I.Plus size={15} /> Nouvelle note</button>}
      </div>
      <div style={{ display: "flex", gap: 18, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 260px", maxWidth: 340, minWidth: 0 }}>
          <input data-note-search value={q} onChange={e => setQ(e.target.value)} placeholder="Rechercher dans les notes…" aria-label="Rechercher dans les notes" style={{ ...inputStyle, marginBottom: 10 }} />
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {list.length === 0 && <EmptyState text={notes.length ? "Aucune note ne correspond." : "Aucune note pour l'instant."} />}
            {list.map(n => (
              <button key={n.id} type="button" data-note={n.title} aria-current={n.id === selId ? "true" : undefined} onClick={() => { setSelId(n.id); setEditing(false); }} style={{ textAlign: "left", background: n.id === selId ? "var(--panel-2)" : "var(--panel)", border: `1px solid ${n.id === selId ? "var(--accent)" : "var(--border)"}`, borderRadius: 10, padding: "10px 12px", cursor: "pointer", color: "var(--text)", font: "inherit" }}>
                <div style={{ fontWeight: 600, fontSize: 14, display: "flex", gap: 6 }}>{n.pinned && <span title="Épinglée">📌</span>}<span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{n.title}</span></div>
                <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(n.body || "").replace(/[#*\-\[\]]/g, "").trim().slice(0, 70) || "Note vide"}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{ flex: "3 1 380px", minWidth: 0 }}>
          {!cur && <div style={{ background: "var(--panel)", border: "1px dashed var(--border)", borderRadius: 12, padding: "40px 20px", textAlign: "center", color: "var(--text-dimmer)", fontSize: 13.5 }}>Choisissez une note à gauche{canWrite ? " ou créez-en une" : ""}.</div>}
          {cur && (
            <div data-note-view style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "18px 22px" }}>
              {editing ? (<>
                <input data-note-title value={draft.title} onChange={e => setDraft(d => ({ ...d, title: e.target.value }))} maxLength={120} aria-label="Titre de la note" style={{ ...inputStyle, fontFamily: "Literata, serif", fontSize: 20, fontWeight: 600, marginBottom: 10 }} />
                <textarea data-note-text value={draft.body} onChange={e => setDraft(d => ({ ...d, body: e.target.value }))} rows={16} maxLength={20000} aria-label="Contenu de la note" placeholder={"# Titre\n- point\n- [ ] à faire\n**gras**, liens https://…"} style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit", lineHeight: 1.6 }} />
                {projects.length > 0 && <select data-note-project value={draft.project_id} onChange={e => setDraft(d => ({ ...d, project_id: e.target.value }))} aria-label="Projet lié" style={{ ...inputStyle, width: "auto", marginTop: 10 }}><option value="">Aucun projet</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
                <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                  <button type="button" onClick={() => setEditing(false)} style={{ ...secondaryBtn, width: "auto", padding: "9px 18px" }}>Annuler</button>
                  <button type="button" data-note-save onClick={save} disabled={busy} style={{ ...primaryBtn, width: "auto", padding: "9px 22px", opacity: busy ? 0.6 : 1 }}>{busy ? "Enregistrement…" : "Enregistrer"}</button>
                </div>
              </>) : (<>
                <div style={{ display: "flex", gap: 10, alignItems: "flex-start", flexWrap: "wrap" }}>
                  <h2 style={{ fontFamily: "Literata, serif", fontSize: 24, fontWeight: 600, margin: 0, flex: 1, minWidth: 180 }}>{cur.pinned ? "📌 " : ""}{cur.title}</h2>
                  {canWrite && <button type="button" data-note-edit onClick={startEdit} style={chipBtn}>✎ Modifier</button>}
                  <button type="button" data-note-md onClick={() => downloadFile(slugName(cur.title) + ".md", "text/markdown;charset=utf-8", "# " + cur.title + "\n\n" + cur.body + "\n")} style={chipBtn}>⬇ Markdown</button>
                  <button type="button" data-note-print onClick={() => printNote(cur)} style={chipBtn}>🖨 Imprimer</button>
                  {canWrite && <button type="button" data-note-pin onClick={togglePin} style={chipBtn}>{cur.pinned ? "Désépingler" : "📌 Épingler"}</button>}
                  {(cur.created_by === me.id || isAdmin) && <button type="button" data-note-delete onClick={remove} style={{ ...chipBtn, color: "var(--late)" }}>Supprimer</button>}
                </div>
                <div style={{ fontSize: 12, color: "var(--text-dimmer)", margin: "6px 0 14px" }}>Créée par {who(cur.created_by)} · modifiée le {dt(cur.updated_at)}{cur.updated_by && cur.updated_by !== cur.created_by ? " par " + who(cur.updated_by) : ""}{proj ? " · 📁 " + proj.name : ""}</div>
                {cur.body.trim() ? <NoteBody body={cur.body} onToggle={canWrite ? toggleCheck : null} /> : <div style={{ color: "var(--text-dimmer)", fontSize: 13.5 }}>Cette note est vide.{canWrite ? " Cliquez sur « Modifier » pour écrire." : ""}</div>}
              </>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Rapports ---------------- */
const REPORT_PERIODS = [[7, "7 jours"], [30, "30 jours"], [90, "90 jours"]];
/** Calcule tous les indicateurs d'un rapport (fonction pure, testable). */
function computeReport({ tasks, meetings, attendees, accounts, projects, days, projectId, today, timeEntries = [] }) {
  const from = shiftDay(today, -(days - 1));
  const dayOf = (iso) => (iso ? parisDay(Date.parse(iso)) : null);
  const inRange = (d) => d && d >= from && d <= today;
  const list = tasks.filter(t => !t.deleted_at && (!projectId || (projectId === "none" ? !t.project_id : t.project_id === projectId)));
  const created = list.filter(t => inRange(dayOf(t.created_at)));
  const done = list.filter(t => t.done && inRange(dayOf(t.done_at)));
  const open = list.filter(t => !t.done);
  const late = open.filter(t => t.due && t.due < today);
  const dueIn = list.filter(t => t.due && t.due >= from && t.due <= today);
  const onTime = dueIn.filter(t => t.done && dayOf(t.done_at) && dayOf(t.done_at) <= t.due);
  const lead = done.map(t => daysBetween(dayOf(t.created_at), dayOf(t.done_at))).filter(n => n >= 0);
  const avgLead = lead.length ? lead.reduce((a, b) => a + b, 0) / lead.length : null;
  // Série temporelle : un point par jour (jusqu'à 30 jours), sinon par semaine
  const step = days > 31 ? 7 : 1;
  const series = [];
  for (let d = from; d <= today; d = shiftDay(d, step)) {
    const end = shiftDay(d, step - 1);
    series.push({ day: d, created: created.filter(t => { const x = dayOf(t.created_at); return x >= d && x <= end; }).length, done: done.filter(t => { const x = dayOf(t.done_at); return x >= d && x <= end; }).length });
  }
  const people = accounts.filter(a => a.status !== "pending").map(a => {
    const mine = list.filter(t => assigneeIds(t).includes(a.id));
    return { user: a, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length, late: mine.filter(t => !t.done && t.due && t.due < today).length };
  }).filter(r => r.done || r.open).sort((a, b) => b.done - a.done || b.open - a.open);
  const byProject = [...projects.map(p => ({ id: p.id, name: p.name })), { id: "none", name: "Sans projet" }].map(p => {
    const mine = list.filter(t => (p.id === "none" ? !t.project_id : t.project_id === p.id));
    return { ...p, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length };
  }).filter(r => r.done || r.open);
  const byLabel = LABELS.map(l => ({ ...l, done: done.filter(t => t.label === l.id).length, open: open.filter(t => t.label === l.id).length })).filter(r => r.done || r.open);
  const mts = meetings.filter(m => inRange(parisDay(Date.parse(m.starts_at))));
  const hours = mts.reduce((a, m) => a + (Date.parse(m.ends_at) - Date.parse(m.starts_at)) / 3600e3, 0);
  // Temps suivi : entrées commencées pendant la période, sur les tâches du filtre
  const listIds = new Set(list.map(t => t.id));
  const tEntries = timeEntries.filter(e => listIds.has(e.task_id) && inRange(dayOf(e.started_at)));
  const timeByPerson = accounts.map(a => ({ user: a, ms: tEntries.filter(e => e.user_id === a.id).reduce((n, e) => n + entryMs(e), 0) })).filter(x => x.ms > 0).sort((a, b) => b.ms - a.ms);
  const timeMs = timeByPerson.reduce((n, x) => n + x.ms, 0);
  return { timeMs, timeByPerson, from, created: created.length, done: done.length, open: open.length, late: late.length, lateTasks: late, dueCount: dueIn.length, onTimeRate: dueIn.length ? Math.round(onTime.length / dueIn.length * 100) : null, avgLead, series, people, byProject, byLabel, meetings: mts.length, meetingHours: hours };
}
function BarRow({ label, value, max, color, extra, avatar }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13, marginBottom: 7 }}>
      <div style={{ width: 150, flexShrink: 0, display: "flex", alignItems: "center", gap: 6, overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis" }}>{avatar}{label}</div>
      <div style={{ flex: 1, background: "var(--bg)", borderRadius: 6, height: 14, overflow: "hidden" }}><div style={{ width: (max ? Math.max(value / max * 100, value ? 3 : 0) : 0) + "%", height: "100%", background: color || "var(--accent)", borderRadius: 6 }} /></div>
      <div style={{ width: 120, flexShrink: 0, color: "var(--text-dim)", fontSize: 12 }}><strong style={{ color: "var(--text)" }}>{value}</strong>{extra}</div>
    </div>
  );
}
function ReportsView({ me, accounts, tasks, projects, meetings, attendees, timeEntries = [], onOpen, notify }) {
  const [days, setDays] = useState(30);
  const [projectId, setProjectId] = useState("");
  const today = parisDay();
  const r = useMemo(() => computeReport({ tasks, meetings, attendees, accounts, projects, days, projectId, today, timeEntries }), [tasks, meetings, attendees, accounts, projects, days, projectId, today, timeEntries]);
  const maxSeries = Math.max(1, ...r.series.map(x => Math.max(x.created, x.done)));
  const kpi = (id, value, label, hint, color) => (
    <div data-kpi={id} style={{ flex: "1 1 150px", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 16px" }}>

    const rows = r.people.map(x => [x.user.display_name, x.done, x.open, x.late]);
    downloadText(`rapport-${today}.csv`, "text/csv", "\ufeff" + [head, ...rows].map(l => l.map(csvCell).join(";")).join("\r\n") + "\r\n");
    notify("Rapport exporté.");
  };
  const maxP = Math.max(1, ...r.people.map(x => x.done + x.open)), maxPr = Math.max(1, ...r.byProject.map(x => x.done + x.open)), maxL = Math.max(1, ...r.byLabel.map(x => x.done + x.open));

        <div><h1 style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Rapports</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>Suivez l'avancement de l'équipe : tâches terminées, retards, charge par personne et par projet.</p></div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          {REPORT_PERIODS.map(([n, l]) => <button key={n} type="button" data-report-days={n} aria-pressed={days === n} onClick={() => setDays(n)} style={{ ...chipBtn, borderColor: days === n ? "var(--accent)" : "var(--border-soft)", color: days === n ? "var(--text)" : "var(--text-dim)" }}>{l}</button>)}
          {projects.length > 0 && <select data-report-project value={projectId} onChange={e => setProjectId(e.target.value)} aria-label="Projet" style={{ ...inputStyle, width: "auto", padding: "7px 10px" }}><option value="">Tous les projets</option><option value="none">Sans projet</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
          <button type="button" data-report-export onClick={exportCsv} style={chipBtn}>⬇ Exporter (CSV)</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
        {kpi("done", r.done, "Terminées", `sur les ${days} derniers jours`, "#5FBF8B")}
        {kpi("created", r.created, "Créées", `sur les ${days} derniers jours`)}
        {kpi("open", r.open, "En cours", "à ce jour")}
        {kpi("late", r.late, "En retard", "à ce jour", r.late ? "#FF6B5E" : undefined)}
        {kpi("ontime", r.onTimeRate === null ? "—" : r.onTimeRate + " %", "Ponctualité", r.dueCount ? `${r.dueCount} échéance(s) dans la période` : "aucune échéance dans la période")}
        {kpi("lead", r.avgLead === null ? "—" : (r.avgLead < 1 ? "< 1 j" : Math.round(r.avgLead * 10) / 10 + " j"), "Délai moyen", "de la création à la fin")}
        {kpi("time", r.timeMs ? fmtDur(r.timeMs) : "—", "Temps suivi", r.timeMs ? "chronos et saisies sur la période" : "aucun temps saisi")}
      </div>
      {card(days > 31 ? "Activité par semaine" : "Activité par jour", (<>
        <div style={{ display: "flex", gap: 14, fontSize: 12, color: "var(--text-dim)", marginBottom: 8 }}><span><span style={{ display: "inline-block", width: 10, height: 10, background: "#5FBF8B", borderRadius: 2, marginRight: 5 }} />Terminées</span><span><span style={{ display: "inline-block", width: 10, height: 10, background: "var(--text-dimmer)", borderRadius: 2, marginRight: 5 }} />Créées</span></div>
        <svg data-report-chart viewBox="0 0 100 40" preserveAspectRatio="none" style={{ width: "100%", height: 150, display: "block" }} role="img" aria-label="Tâches créées et terminées">
          {r.series.map((x, i) => (<g key={x.day}>
            <rect data-bar-created={x.created} x={i * w + w * 0.1} width={w * 0.38} y={40 - x.created / maxSeries * 38} height={x.created / maxSeries * 38} fill="var(--text-dimmer)" opacity="0.7"><title>{`${fmtDay(x.day, { day: "numeric", month: "short" })} : ${x.created} créée(s)`}</title></rect>
            <rect data-bar-done={x.done} x={i * w + w * 0.5} width={w * 0.38} y={40 - x.done / maxSeries * 38} height={x.done / maxSeries * 38} fill="#5FBF8B"><title>{`${fmtDay(x.day, { day: "numeric", month: "short" })} : ${x.done} terminée(s)`}</title></rect>
          </g>))}

      </>), "chart")}

        </div>
        <div style={{ flex: "1 1 380px", minWidth: 0 }}>
          {card("Par projet", r.byProject.length === 0 ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune tâche.</div> : r.byProject.map(x => <BarRow key={x.id} label={x.name} value={x.done} max={maxPr} color="#5B9EF5" extra={` terminée${x.done > 1 ? "s" : ""} · ${x.open} en cours`} />), "projects")}
          {card("Par étiquette", r.byLabel.length === 0 ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune tâche.</div> : r.byLabel.map(x => <BarRow key={x.id} label={x.name} value={x.done} max={maxL} color={x.hex} extra={` terminée${x.done > 1 ? "s" : ""} · ${x.open} en cours`} />), "labels")}
        </div>
      </div>
      {r.timeByPerson.length > 0 && card("Temps suivi par personne", r.timeByPerson.map(x => <BarRow key={x.user.id} avatar={<Avatar user={x.user} size={18} />} label={x.user.display_name} value={Math.round(x.ms / 60000)} max={Math.max(1, ...r.timeByPerson.map(y => Math.round(y.ms / 60000)))} color="var(--admin)" extra={" min · " + fmtDur(x.ms)} />), "time")}
      {card("Réunions", <div data-report-meetings style={{ fontSize: 13.5 }}><strong>{r.meetings}</strong> réunion{r.meetings > 1 ? "s" : ""} sur la période, soit <strong>{Math.round(r.meetingHours * 10) / 10} h</strong> au total.</div>, "meetings")}
      {r.lateTasks.length > 0 && card(`Tâches en retard (${r.lateTasks.length})`, (<div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {r.lateTasks.slice().sort((a, b) => a.due.localeCompare(b.due)).slice(0, 10).map(t => <button key={t.id} type="button" data-late-task={t.id} onClick={() => onOpen(t.id)} style={{ ...chipBtn, justifyContent: "flex-start", textAlign: "left" }}>{t.title} <span style={{ color: "var(--late)", marginLeft: "auto" }}>{formatDue(t.due, daysUntil(t.due))}</span></button>)}
      </div>), "late")}
    </div>
  );
}

/* ---------------- Chronologie (Gantt) ---------------- */
const GANTT_SPANS = [[14, "2 semaines"], [28, "4 semaines"], [84, "12 semaines"]];
function GanttBoard({ tasks, accounts, onOpen }) {
  const [span, setSpan] = useState(28);
  const [offset, setOffset] = useState(0);                       // décalage en jours depuis le lundi de la semaine courante
  const today = parisDay();
  const first = shiftDay(today, -(isoWd(today) - 1) + offset);
  const last = shiftDay(first, span - 1);
  const days = Array.from({ length: span }, (_, i) => shiftDay(first, i));
  const dated = tasks.filter(t => t.due);
  const rows = dated.map(t => ({ t, a: t.start_date && t.start_date <= t.due ? t.start_date : t.due, b: t.due }))
    .filter(r => r.b >= first && r.a <= last)
    .sort((x, y) => x.a.localeCompare(y.a) || x.b.localeCompare(y.b) || y.t.priority - x.t.priority);
  const undated = tasks.filter(t => !t.due && !t.done).length;
  const pct = (d) => (daysBetween(first, d) / span) * 100;
  const todayPct = today >= first && today <= last ? pct(today) + 50 / span : null;
  const nav = (n) => setOffset(o => o + n);
  const headDay = (d) => span <= 28 ? fmtDay(d, { day: "numeric" }) : (d.slice(8) === "01" || isoWd(d) === 1 ? fmtDay(d, { day: "numeric", month: "short" }) : "");
  return (
    <div data-gantt>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
        <button type="button" data-gantt-prev onClick={() => nav(-Math.max(7, span / 2))} style={chipBtn} aria-label="Période précédente">◀</button>
        <button type="button" data-gantt-today onClick={() => setOffset(0)} style={chipBtn}>Aujourd'hui</button>
        <button type="button" data-gantt-next onClick={() => nav(Math.max(7, span / 2))} style={chipBtn} aria-label="Période suivante">▶</button>
        <span style={{ fontSize: 13, color: "var(--text-dim)", textTransform: "capitalize" }}>{fmtDay(first, { day: "numeric", month: "long" })} → {fmtDay(last, { day: "numeric", month: "long", year: "numeric" })}</span>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>{GANTT_SPANS.map(([n, l]) => <button key={n} type="button" data-gantt-span={n} aria-pressed={span === n} onClick={() => setSpan(n)} style={{ ...chipBtn, borderColor: span === n ? "var(--accent)" : "var(--border-soft)", color: span === n ? "var(--text)" : "var(--text-dim)" }}>{l}</button>)}</div>
      </div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflowX: "auto" }}>
        <div style={{ minWidth: 720 }}>
          <div style={{ display: "flex", borderBottom: "1px solid var(--border)" }}>
            <div style={{ width: 200, flexShrink: 0, padding: "8px 12px", fontSize: 12, color: "var(--text-dimmer)", fontWeight: 600 }}>Tâche</div>
            <div style={{ flex: 1, position: "relative", display: "flex" }}>
              {days.map(d => <div key={d} style={{ flex: 1, textAlign: "center", fontSize: 10.5, padding: "8px 0", color: d === today ? "var(--accent)" : "var(--text-dimmer)", fontWeight: d === today ? 700 : 500, background: isoWd(d) >= 6 ? "var(--bg)" : "transparent", overflow: "hidden" }}>{headDay(d)}</div>)}
            </div>
          </div>
          {rows.length === 0 && <div style={{ padding: "26px 16px", fontSize: 13.5, color: "var(--text-dimmer)", textAlign: "center" }}>Aucune tâche avec une échéance sur cette période.</div>}
          {rows.map(({ t, a, b }) => {
            const label = LABELS.find(l => l.id === t.label) || LABELS[0];
            const left = Math.max(0, pct(a)), right = Math.min(100, pct(b) + 100 / span);
            const late = !t.done && t.due < today;
            const who = assigneeIds(t).map(id => accounts.find(x => x.id === id)).filter(Boolean);
            return (
              <div key={t.id} data-gantt-row={t.title} style={{ display: "flex", alignItems: "center", borderBottom: "1px solid var(--border-soft)", minHeight: 38 }}>
                <div onClick={() => onOpen(t.id)} title={t.title} style={{ width: 200, flexShrink: 0, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textDecoration: t.done ? "line-through" : "none", opacity: t.done ? 0.6 : 1 }}>{t.title}</div>
                <div style={{ flex: 1, position: "relative", height: 38 }}>
                  {todayPct !== null && <div style={{ position: "absolute", left: todayPct + "%", top: 0, bottom: 0, width: 2, background: "var(--accent)", opacity: 0.45 }} />}
                  <button type="button" data-gantt-bar={t.id} onClick={() => onOpen(t.id)} title={`${t.title} · ${a === b ? fmtDay(b, { day: "numeric", month: "short" }) : fmtDay(a, { day: "numeric", month: "short" }) + " → " + fmtDay(b, { day: "numeric", month: "short" })}`}
                    style={{ position: "absolute", top: 7, height: 24, left: left + "%", width: Math.max(right - left, 1.2) + "%", background: label.hex, opacity: t.done ? 0.35 : 0.9, border: late ? "2px solid #FF6B5E" : "none", borderRadius: 6, cursor: "pointer", padding: "0 6px", color: "#fff", fontSize: 11, fontWeight: 600, textAlign: "left", overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis", display: "flex", alignItems: "center", gap: 4 }}>
                    {who.length > 0 && <AvatarStack users={who} size={14} max={2} />}{right - left > 14 ? t.title : ""}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 10, lineHeight: 1.6 }}>Une barre va du début à l'échéance de la tâche (une tâche sans début n'occupe que son jour d'échéance). Renseignez le début dans la fiche de la tâche. Contour rouge : en retard.{undated > 0 ? ` ${undated} tâche${undated > 1 ? "s" : ""} sans échéance ne figure${undated > 1 ? "nt" : ""} pas ici.` : ""}</div>
    </div>
  );
}

function WeekBoard({ tasks, accounts, canEditTask, onOpen, onMoveDue }) {
  const [wk, setWk] = useState(0);
  const [over, setOver] = useState(null);
  const today = parisDay();
  const monday = shiftDay(today, -(isoWd(today) - 1) + wk * 7);
  const days = Array.from({ length: 7 }, (_, i) => shiftDay(monday, i));
  const byDay = (d) => tasks.filter(t => t.due === d).sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
  const noDate = tasks.filter(t => !t.due && !t.done);
  const late = tasks.filter(t => t.due && t.due < today && !t.done);
  const drop = (e, day) => { e.preventDefault(); setOver(null); const id = e.dataTransfer.getData("text/plain"); const t = tasks.find(x => x.id === id); if (t && t.due !== day) onMoveDue(t, day); };
  const card = (t) => {
    const label = LABELS.find(l => l.id === t.label) || LABELS[0];
    const can = canEditTask(t);

            <option value="">Déplacer…</option>

    <div key={key} data-week-col={key} onDragOver={droppable ? (e => { e.preventDefault(); if (over !== key) setOver(key); }) : undefined} onDragLeave={droppable ? (e => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }) : undefined} onDrop={droppable ? (e => drop(e, key === "none" ? null : key)) : undefined}
      style={{ background: over === key ? "color-mix(in srgb, var(--accent) 8%, transparent)" : "var(--bg-2)", border: `1px solid ${over === key ? "var(--accent)" : key === today ? "var(--accent-2)" : "var(--border)"}`, borderRadius: 12, padding: 8, minHeight: 110, minWidth: 0 }}>

/* ---------------- Photos : réduction avant envoi (limite de 5 Mo) ---------------- */
async function shrinkImage(file, maxSide = 1600) {
  if (!file || !(file.type || "").startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    URL.revokeObjectURL(url);
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    if (scale === 1 && file.size <= 1.5 * 1024 * 1024) return file;
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    if (!blob || blob.size >= file.size) return file;
    const base = (file.name || "photo").replace(/\.[^.]+$/, "");
    return new File([blob], base + ".jpg", { type: "image/jpeg", lastModified: Date.now() });
  } catch (_) { return file; }
}

/** Calcule mes statistiques personnelles à partir des tâches qui me sont assignées. */
function computeStats(tasks, meId, now = Date.now()) {
  const today = parisDay(now);
  const monday = shiftDay(today, -(isoWd(today) - 1)), lastMonday = shiftDay(monday, -7);
  const mine = tasks.filter(t => assigneeIds(t).includes(meId));
  const done = mine.filter(t => t.done && t.done_at).map(t => ({ t, day: parisDay(Date.parse(t.done_at)) }));
  const thisWeek = done.filter(x => x.day >= monday && x.day <= today);
  const lastWeek = done.filter(x => x.day >= lastMonday && x.day < monday);
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = shiftDay(today, -i); days.push({ day: d, n: done.filter(x => x.day === d).length }); }
  const since30 = shiftDay(today, -29);
  const dueDone = done.filter(x => x.day >= since30 && x.t.due);
  const onTime = dueDone.filter(x => x.day <= x.t.due).length;
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = shiftDay(today, -i);
    if (done.some(x => x.day === d)) streak++; else if (i > 0) break;
  }
  const overdue = mine.filter(t => !t.done && t.due && t.due < today).length;
  const perProject = new Map();
  for (const x of thisWeek) perProject.set(x.t.project_id || "", (perProject.get(x.t.project_id || "") || 0) + 1);
  return { thisWeek: thisWeek.length, lastWeek: lastWeek.length, days, rate: dueDone.length ? Math.round(100 * onTime / dueDone.length) : null, dueDone: dueDone.length, streak, overdue, perProject: [...perProject.entries()].sort((a, b) => b[1] - a[1]) };
}
function MyStats({ me, tasks, projects }) {
  const st = useMemo(() => computeStats(tasks, me.id), [tasks, me.id]);
  const max = Math.max(1, ...st.days.map(d => d.n));
  const delta = st.thisWeek - st.lastWeek;
  const big = { fontFamily: "Literata, serif", fontSize: 24, fontWeight: 600 };
  const sub = { fontSize: 12.5, color: "var(--text-dim)" };
  return (
    <div data-my-stats style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>Mes statistiques</div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "16px 18px" }}>
        <div style={{ display: "flex", gap: 26, flexWrap: "wrap", alignItems: "flex-start" }}>
          <div><div style={big} data-stat="week">{st.thisWeek}</div><div style={sub}>terminée(s) cette semaine</div><div style={{ fontSize: 12, marginTop: 2, color: delta > 0 ? "#5FBF8B" : delta < 0 ? "#FFB648" : "var(--text-dimmer)" }}>{delta === 0 ? "comme la semaine dernière" : (delta > 0 ? "+" : "") + delta + " vs la semaine dernière (" + st.lastWeek + ")"}</div></div>
          <div><div style={big} data-stat="rate">{st.rate === null ? "—" : st.rate + " %"}</div><div style={sub}>à temps (30 derniers jours)</div><div style={{ fontSize: 12, marginTop: 2, color: "var(--text-dimmer)" }}>{st.dueDone ? `sur ${st.dueDone} tâche(s) avec échéance` : "pas encore d'échéance terminée"}</div></div>
          <div><div style={big} data-stat="streak">{st.streak}{st.streak > 0 ? " 🔥" : ""}</div><div style={sub}>jour(s) d'affilée avec une tâche terminée</div></div>
          <div><div style={{ ...big, color: st.overdue ? "var(--late)" : undefined }} data-stat="overdue">{st.overdue}</div><div style={sub}>en retard en ce moment</div></div>
        </div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 54, marginTop: 16 }} aria-label="Tâches terminées sur 14 jours">
          {st.days.map(d => (<div key={d.day} title={`${fmtDay(d.day, { day: "numeric", month: "short" })} : ${d.n}`} style={{ flex: 1, height: d.n ? Math.max(8, Math.round(54 * d.n / max)) : 3, background: d.n ? "#5FBF8B" : "var(--border-soft)", borderRadius: 3 }} />))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-dimmer)", marginTop: 4 }}><span>il y a 14 jours</span><span>aujourd'hui</span></div>
        {st.perProject.length > 0 && projects.length > 0 && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12, alignItems: "center" }}>
            <span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Cette semaine par projet :</span>
            {st.perProject.map(([pid, n]) => { const p = projects.find(x => x.id === pid); return <span key={pid || "none"} style={{ display: "inline-flex", gap: 6, alignItems: "center", fontSize: 12.5 }}>{p ? <ProjectChip project={p} /> : <span style={{ color: "var(--text-dim)" }}>Sans projet</span>}<strong>{n}</strong></span>; })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Patch notes ----------------
   Les nouveautés visibles de tous sont dans /patchnotes.json (affichées sur la page d'accueil du site).
   Ici : l'onglet « Patch notes » de l'administrateur du site, qui ajoute des détails techniques par jour. */
const frDate = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
/** Onglet réservé à l'administrateur du site : historique complet, avec les détails techniques. */
function HomeView({ me, accounts, tasks, comments, leaves = [], meetings = [], attendees = [], events = [], onOpen, goTo, projects = [], onReview, pins = [], onUnpin, notify = () => {}, notes = [], onHelp = () => {}, kudos = [] }) {
  const [hidden, setHiddenRaw] = useState(() => { const v = lsJson("carnet-home-" + me.id, []); return Array.isArray(v) ? v : []; });
  const setHidden = (h) => { setHiddenRaw(h); lsSet("carnet-home-" + me.id, JSON.stringify(h)); };
  const [showPrefs, setShowPrefs] = useState(false);
  const show = (id) => !hidden.includes(id);
  const pinned = pins.map(id => tasks.find(t => t.id === id)).filter(Boolean);
  const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id));
  const late = mine.filter(t => t.due && dueInfo(t).late);
  const today = mine.filter(t => t.due && !dueInfo(t).late && daysUntil(t.due) === 0);
  const soon = mine.filter(t => t.due && daysUntil(t.due) > 0 && daysUntil(t.due) <= 3);
  const doing = mine.filter(t => t.doing && !(t.due && daysUntil(t.due) <= 3));
  const weekAgo = Date.now() - 7 * 86400000;
  const doneWeek = tasks.filter(t => t.done && t.done_at && new Date(t.done_at).getTime() >= weekAgo);
  const myDoneWeek = doneWeek.filter(t => assigneeIds(t).includes(me.id));
  const createdWeek = tasks.filter(t => t.created_at && new Date(t.created_at).getTime() >= weekAgo);

/* ============================================================
   Mon profil : nom, couleur, mot de passe, suppression du compte
   ============================================================ */
function ProfileView({ me, session, isAdmin, myPerms, tasks, leaves = [], notify, onChanged, onLogout, accounts = [], projects = [], meetings = [], attendees = [] }) {
  const [displayName, setDisplayName] = useState(me.display_name || "");
  const [username, setUsername] = useState(me.username || "");
  const [color, setColor] = useState(me.color || LABELS[3].hex);
  const [busy, setBusy] = useState(false);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const [delBusy, setDelBusy] = useState(false);
  const dirty = displayName.trim() !== me.display_name || username.trim() !== me.username || color !== me.color;
  const preview = { ...me, display_name: displayName || me.display_name, color };
  const roleLabel = isAdmin ? "Administrateur" : (ROLES.find(r => r.id === me.role) || {}).label || "Membre";
  const mineOpen = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id)).length;
  const created = tasks.filter(t => t.created_by === me.id).length;

  const saveProfile = async () => {
    if (busy || !dirty) return;
    setBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'update-self', patch: { display_name: displayName.trim(), username: username.trim(), color } }, session);
      notify("Profil mis à jour.");
      onChanged();
    } catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const savePassword = async () => {
    if (pwBusy) return;
    if (pw.length < 8) { notify("Le mot de passe doit faire au moins 8 caractères.", "err"); return; }
    if (pw !== pw2) { notify("Les deux mots de passe sont différents.", "err"); return; }
    setPwBusy(true);
    let error = null;
    try { await callApi('/api/manage-account', { action: 'set-password', password: pw }, session); } catch (e) { error = e; }
    setPwBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setPw(""); setPw2("");
    notify("Mot de passe modifié.");
  };
  const deleteAccount = async () => {
    if (delBusy || confirmText.trim().toUpperCase() !== "SUPPRIMER") return;
    setDelBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'delete-self' }, session);
      await supabase.auth.signOut();
    } catch (e) { notify(e.message, "err"); setDelBusy(false); }
  };
  const card = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 14, padding: "20px 22px", marginBottom: 18, maxWidth: 560 };

  return (
    <div>
      <h1 style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: "0 0 20px" }}>Mon profil</h1>

      <div style={card}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
          <Avatar user={preview} size={52} />
          <div>
            <div style={{ fontWeight: 600, fontSize: 16 }}>{me.display_name}</div>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{roleLabel} · {me.email}</div>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 2 }}>{mineOpen} tâche(s) en cours · {created} créée(s)</div>
          </div>
        </div>
        <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
        <Field label="Identifiant (pour vous connecter et être mentionné avec @)"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur du profil</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" onClick={() => setColor(l.hex)} title={l.name} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: color === l.hex ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <button type="button" onClick={saveProfile} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "10px 22px", opacity: busy || !dirty ? 0.5 : 1, cursor: dirty ? "pointer" : "default" }}>{busy ? "Enregistrement…" : "Enregistrer"}</button>
      </div>

      <NotificationPrefs me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <BrowserNotifCard card={card} />

      <PersonalCard me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <AchievementsCard me={me} tasks={tasks} meetings={meetings} attendees={attendees} card={card} />

      <LeaveCard me={me} session={session} isAdmin={isAdmin} leaves={leaves} notify={notify} card={card} />

      <HoursCard me={me} session={session} notify={notify} onChanged={onChanged} card={card} />

      <CalendarFeedCard session={session} notify={notify} card={card} />

      <InstallCard card={card} />

      <ExportCard me={me} tasks={tasks} accounts={accounts} projects={projects} meetings={meetings} attendees={attendees} notify={notify} card={card} />

      <div style={card}>
        <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 12 }}>Changer de mot de passe</div>
        <Field label="Nouveau mot de passe (8 caractères minimum)"><input type="password" value={pw} onChange={e => setPw(e.target.value)} style={inputStyle} /></Field>
        <Field label="Confirmez le mot de passe"><input type="password" value={pw2} onChange={e => setPw2(e.target.value)} onKeyDown={e => { if (e.key === "Enter") savePassword(); }} style={inputStyle} /></Field>
        <button type="button" onClick={savePassword} disabled={pwBusy || !pw} style={{ ...secondaryBtn, padding: "10px 22px", opacity: pwBusy || !pw ? 0.5 : 1 }}>{pwBusy ? "…" : "Modifier le mot de passe"}</button>
      </div>

      <div style={{ ...card, borderColor: "#4A2A28" }}>
        <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 6, color: "var(--late)" }}>Supprimer mon compte</div>
        {isAdmin ? (
          <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6, margin: 0 }}>Vous êtes l'administrateur de ce serveur. Pour pouvoir supprimer votre compte, transférez d'abord l'administration à quelqu'un d'autre (onglet Admin → « Transférer l'administration »).</p>
        ) : (<>
          <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6, margin: "0 0 12px" }}>Cette action est définitive : votre compte et votre accès au serveur disparaissent. Les tâches que vous avez créées restent sur le serveur.</p>
          <Field label="Tapez SUPPRIMER pour confirmer"><input value={confirmText} onChange={e => setConfirmText(e.target.value)} style={inputStyle} /></Field>
          <button type="button" onClick={deleteAccount} disabled={delBusy || confirmText.trim().toUpperCase() !== "SUPPRIMER"} style={{ ...secondaryBtn, padding: "10px 22px", color: "var(--late)", borderColor: "#6A3532", opacity: confirmText.trim().toUpperCase() === "SUPPRIMER" ? 1 : 0.5 }}>{delBusy ? "Suppression…" : "Supprimer définitivement mon compte"}</button>
        </>)}
      </div>
    </div>
  );
}
