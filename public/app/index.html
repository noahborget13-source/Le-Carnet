function MeetingFiles({ m, me, canManage, items, notify, onChanged }) {
  const fileRef = useRef(null), camRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const canAdd = me.role !== "guest";
  const upload = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length || uploading) return;
    setUploading(true);
    let count = items.length;
    for (const f0 of files) {
      const f = await shrinkImage(f0);
      if (count >= MAX_FILES_PER_TASK) { notify(`Maximum ${MAX_FILES_PER_TASK} fichiers par réunion.`, "err"); break; }
      if (f.size > MAX_FILE_BYTES) { notify(`« ${f.name} » dépasse 5 Mo.`, "err"); continue; }
      const safe = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80) || "fichier";
      const path = `${me.server_id}/reunions/${m.id}/${uid()}-${safe}`;
      const up = await supabase.storage.from('task-files').upload(path, f, { contentType: f.type || undefined, upsert: false });
      if (up.error) { notify(up.error.message, "err"); continue; }
      const { error } = await supabase.from('meeting_attachments').insert({ meeting_id: m.id, server_id: me.server_id, uploader_id: me.id, path, filename: f.name, size: f.size, mime: f.type || null });
      if (error) { await supabase.storage.from('task-files').remove([path]); notify(error.message, "err"); continue; }
      count++;
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = "";
    if (camRef.current) camRef.current.value = "";
    onChanged();
  };
  const remove = async (att) => {
    const { error } = await supabase.from('meeting_attachments').delete().eq('id', att.id);
    if (error) { notify(error.message, "err"); return; }
    await supabase.storage.from('task-files').remove([att.path]);
    onChanged();
  };
  return (
    <div data-meeting-files style={{ marginTop: 10, background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 10, padding: "12px 14px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600 }}>Pièces jointes · {items.length}</div>
        {canAdd && (<>
          <input ref={fileRef} type="file" multiple onChange={e => upload(e.target.files)} style={{ display: "none" }} />
          <input ref={camRef} type="file" accept="image/*" capture="environment" aria-label="Prendre une photo" onChange={e => upload(e.target.files)} style={{ display: "none" }} />
          <span style={{ display: "inline-flex", gap: 6 }}>
            <button type="button" onClick={() => camRef.current && camRef.current.click()} disabled={uploading} style={{ ...secondaryBtn, width: "auto", padding: "5px 11px", fontSize: 12, opacity: uploading ? 0.6 : 1 }}>📷 Photo</button>
            <button type="button" onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading} style={{ ...secondaryBtn, width: "auto", padding: "5px 11px", fontSize: 12, display: "flex", alignItems: "center", gap: 6, opacity: uploading ? 0.6 : 1 }}><I.Paperclip size={12} /> {uploading ? "Envoi…" : "Ajouter"}</button>
          </span>
        </>)}
      </div>
      {items.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>{canAdd ? "Aucun fichier. Ordre du jour, présentation, photo du tableau… (5 Mo max chacun)" : "Aucun fichier."}</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {items.map(a => <AttachmentRow key={a.id} att={a} notify={notify} canDelete={a.uploader_id === me.id || canManage} onDelete={() => remove(a)} />)}
      </div>
    </div>
  );
}

function MeetingsView({ me, session, isAdmin, myPerms = {}, accounts, meetings, attendees, leaves, tasks, notify, meetingFiles = [], onFilesChanged = () => {} }) {
  const [form, setForm] = useState(null);       // null | "new" | meeting
  const [showPast, setShowPast] = useState(false);
  const [, tick] = useState(0);
  useEffect(() => { const id = setInterval(() => tick(n => n + 1), 30000); return () => clearInterval(id); }, []);
  const now = Date.now();
  const upcoming = meetings.filter(m => Date.parse(m.ends_at) > now).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const past = meetings.filter(m => Date.parse(m.ends_at) <= now).sort((a, b) => b.starts_at.localeCompare(a.starts_at)).slice(0, 15);
  const cancel = async (m) => {
    if (!window.confirm(`Annuler la réunion « ${m.title} » ? Les invités seront prévenus par email.`)) return;
    try { const r = await callApi("/api/notify-meeting", { action: "cancel", meetingId: m.id }, session); notify("Réunion annulée" + (r.sent ? ` · ${r.sent} email(s) envoyé(s).` : ".")); }
    catch (e) { notify(e.message, "err"); }
  };
  const instant = async () => {
    const room = "inst" + uid() + uid();
    const ok = await copyText(callLink(room));
    window.open(joinLink(room, me.display_name), "_blank", "noopener,noreferrer");
    notify(ok ? "Appel lancé · lien copié : envoie-le à qui tu veux." : "Appel lancé.");
  };
  const canCreate = me.role !== "guest";
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Réunions</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>Planifie une réunion, invite l'équipe, rejoins l'appel vidéo en un clic.</p></div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button type="button" onClick={instant} style={{ ...secondaryBtn, width: "auto", padding: "10px 16px" }}>📞 Appel immédiat</button>
          {canCreate && <button type="button" onClick={() => setForm("new")} style={{ ...primaryBtn, padding: "10px 18px", display: "flex", alignItems: "center", gap: 7 }}><I.Plus size={15} /> Nouvelle réunion</button>}
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {upcoming.length === 0 && <EmptyState text="Aucune réunion à venir. Crée-en une avec « Nouvelle réunion »." />}
        {upcoming.map(m => <MeetingCard key={m.id} m={m} me={me} isAdmin={isAdmin} accounts={accounts} attendees={attendees} onEdit={setForm} onCancel={cancel} notify={notify} session={session} canMakeTasks={isAdmin || !!myPerms.createTasks} files={meetingFiles.filter(f => f.meeting_id === m.id)} onFilesChanged={onFilesChanged} />)}
      </div>
      {past.length > 0 && (<>
        <button type="button" onClick={() => setShowPast(v => !v)} style={{ ...chipBtn, marginTop: 20 }}>{showPast ? "Masquer" : "Voir"} les réunions passées ({past.length})</button>
        {showPast && <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>{past.map(m => <MeetingCard key={m.id} m={m} me={me} isAdmin={isAdmin} accounts={accounts} attendees={attendees} onEdit={setForm} onCancel={cancel} notify={notify} session={session} canMakeTasks={isAdmin || !!myPerms.createTasks} files={meetingFiles.filter(f => f.meeting_id === m.id)} onFilesChanged={onFilesChanged} />)}</div>}
      </>)}
      {form && <MeetingForm initial={form === "new" ? null : form} me={me} accounts={accounts} attendees={attendees} leaves={leaves} tasks={tasks} session={session} notify={notify} onCancel={() => setForm(null)} onSaved={() => setForm(null)} />}
    </div>
  );
}

const THEME_KEY = "carnet-theme";
function getThemeMode() { try { const v = localStorage.getItem(THEME_KEY); return v === "light" || v === "dark" ? v : "auto"; } catch (_) { return "auto"; } }
function applyTheme(mode) {
  let t = mode;
  if (t !== "light" && t !== "dark") t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
}
const isLeapY = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
/** Événements d'équipe et anniversaires d'un jour (iso = AAAA-MM-JJ). */
function dayExtras(iso, events = [], accounts = []) {
  const md = iso.slice(5), y = Number(iso.slice(0, 4));
  return {
    events: events.filter(e => e.start_date <= iso && e.end_date >= iso),
    birthdays: accounts.filter(a => a.status !== "pending" && a.birthday && (a.birthday === md || (a.birthday === "02-29" && md === "02-28" && !isLeapY(y)))),
  };
}

const MONTHS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MONTH_DAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function PersonalCard({ me, session, notify, onChanged, card }) {
  const [mode, setMode] = useState(getThemeMode());
  const [mm, setMm] = useState(me.birthday ? Number(me.birthday.slice(0, 2)) : 0);
  const [dd, setDd] = useState(me.birthday ? Number(me.birthday.slice(3)) : 0);
  const [busy, setBusy] = useState(false);
  const pick = (m) => { setMode(m); try { localStorage.setItem(THEME_KEY, m); } catch (_) {} applyTheme(m); };
  const value = mm && dd ? String(mm).padStart(2, "0") + "-" + String(dd).padStart(2, "0") : "";
  const dirty = value !== (me.birthday || "");
  const save = async () => {
    if (busy) return;
    if ((mm && !dd) || (!mm && dd)) { notify("Choisis le jour et le mois.", "err"); return; }
    setBusy(true);
    try { await callApi("/api/manage-account", { action: "update-self", patch: { birthday: value } }, session); notify(value ? "Anniversaire enregistré." : "Anniversaire effacé."); onChanged(); }
    catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const sel = { ...inputStyle, width: "auto", minWidth: 110 };
  return (
    <div style={card} data-testid="personal-card">
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Apparence</div>
      <div style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 10 }}>Valable sur cet appareil.</div>
      <div role="group" aria-label="Thème" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 22 }}>
        {[["auto", "🖥️ Automatique"], ["dark", "🌙 Sombre"], ["light", "☀️ Clair"]].map(([k, l]) => (
          <button key={k} type="button" aria-pressed={mode === k} onClick={() => pick(k)} style={{ ...chipBtn, borderColor: mode === k ? "var(--accent)" : undefined, color: mode === k ? "var(--text)" : undefined, fontWeight: mode === k ? 600 : 500 }}>{l}</button>
        ))}
      </div>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Mon anniversaire</div>
      <div style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 10 }}>Facultatif : il s'affiche dans le calendrier de ton équipe (jour et mois, jamais l'année).</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <select aria-label="Jour de naissance" value={dd} onChange={e => setDd(Number(e.target.value))} style={sel}><option value={0}>Jour</option>{Array.from({ length: mm ? MONTH_DAYS[mm - 1] : 31 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}</select>
        <select aria-label="Mois de naissance" value={mm} onChange={e => { const v = Number(e.target.value); setMm(v); if (v && dd > MONTH_DAYS[v - 1]) setDd(0); }} style={sel}><option value={0}>Mois</option>{MONTHS_FR.map((n, i) => <option key={n} value={i + 1}>{n}</option>)}</select>
        <button type="button" onClick={save} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "10px 20px", opacity: busy || !dirty ? 0.5 : 1 }}>{busy ? "…" : "Enregistrer"}</button>
        {me.birthday && <button type="button" onClick={() => { setMm(0); setDd(0); }} style={chipBtn}>Effacer</button>}
      </div>
      <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginTop: 16 }}>Astuce : appuie sur <kbd style={{ background: "var(--bg-2)", border: "1px solid var(--border-soft)", borderRadius: 5, padding: "1px 6px", fontFamily: "inherit" }}>?</kbd> n'importe où pour voir les raccourcis clavier.</div>
    </div>
  );
}

/* ---------------- Événements d'équipe (calendrier) ---------------- */
function EventForm({ me, day, onCancel, onSaved, notify }) {
  const [title, setTitle] = useState("");
  const [start, setStart] = useState(day);
  const [end, setEnd] = useState(day);
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (busy) return;
    if (!title.trim()) { notify("Donne un nom à l'événement.", "err"); return; }
    if (!start || !end || end < start) { notify("Le dernier jour doit être après le premier.", "err"); return; }
    setBusy(true);
    const { error } = await supabase.from("team_events").insert({ server_id: me.server_id, created_by: me.id, title: title.trim().slice(0, 120), start_date: start, end_date: end });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    notify("Événement ajouté."); onSaved();
  };
  return (
    <div style={overlayStyle} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) onCancel(); }}>
      <div className="modal-card" style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>Événement d'équipe</h2><button type="button" onClick={onCancel} aria-label="Fermer" style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <Field label="Nom"><input autoFocus value={title} onChange={e => setTitle(e.target.value)} maxLength={120} style={inputStyle} aria-label="Nom de l'événement" placeholder="Repas d'équipe, séminaire, fermeture…" /></Field>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field label="Premier jour"><input type="date" value={start} onChange={e => { setStart(e.target.value); if (e.target.value > end) setEnd(e.target.value); }} style={inputStyle} aria-label="Premier jour" /></Field></div>
          <div style={{ flex: 1 }}><Field label="Dernier jour"><input type="date" value={end} min={start} onChange={e => setEnd(e.target.value)} style={inputStyle} aria-label="Dernier jour de l'événement" /></Field></div>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 6 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={save} disabled={busy} style={{ ...primaryBtn, flex: 1, opacity: busy ? 0.6 : 1 }}>{busy ? "…" : "Ajouter"}</button></div>
      </div>
    </div>
  );
}

/* ---------------- Admin : charge de travail ---------------- */
function AdminWorkload({ accounts, tasks, meetings, attendees, leaves }) {
  const [wk, setWk] = useState(0);
  const today = parisDay();
  const monday = shiftDay(today, -(isoWd(today) - 1) + wk * 7), sunday = shiftDay(monday, 6);
  const w0 = parisInstant(monday), w1 = parisInstant(shiftDay(sunday, 1));
  const rows = accounts.filter(a => a.status === "approved" && a.role !== "guest").map(u => {
    const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(u.id));
    const dueWeek = mine.filter(t => t.due && t.due >= monday && t.due <= sunday).length;
    const overdue = wk === 0 ? mine.filter(t => t.due && t.due < today).length : 0;
    const noDate = mine.filter(t => !t.due).length;
    const mine_m = meetings.filter(m => attendees.some(a => a.meeting_id === m.id && a.user_id === u.id && a.response !== "declined") && Date.parse(m.starts_at) < w1 && Date.parse(m.ends_at) > w0);
    const mins = mine_m.reduce((n, m) => n + (Math.min(Date.parse(m.ends_at), w1) - Math.max(Date.parse(m.starts_at), w0)) / 60000, 0);
    let leaveDays = 0;
    for (let d = monday; d <= sunday; d = shiftDay(d, 1)) if (leaves.some(l => l.user_id === u.id && l.status === "approved" && l.start_date <= d && l.end_date >= d) && isoWd(d) <= 5) leaveDays++;
    const score = dueWeek + overdue * 1.5 + (mins / 60) * 0.5 + noDate * 0.2;
    return { u, dueWeek, overdue, noDate, meetings: mine_m.length, hours: Math.round(mins / 6) / 10, leaveDays, score };
  }).sort((a, b) => b.score - a.score);
  const avg = rows.length ? rows.reduce((n, r) => n + r.score, 0) / rows.length : 0;
  const max = Math.max(1, ...rows.map(r => r.score));
  const level = (r) => {
    if (r.leaveDays >= 5) return ["En congé", "#8FD6AE"];
    if (r.score === 0) return ["Libre", "#7DB4FF"];
    if (rows.length > 1 && r.score >= avg * 1.5 && r.score >= 4) return ["Chargé", "#FF9A8F"];
    if (rows.length > 1 && r.score <= avg * 0.5) return ["Disponible", "#7DB4FF"];
    return ["Normal", "#9098A8"];
  };
  const fmt = (d) => fmtDay(d, { day: "numeric", month: "short" });
  return (
    <div data-testid="workload">
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        <button type="button" onClick={() => setWk(w => w - 1)} style={chipBtn} aria-label="Semaine précédente">←</button>
        <div style={{ fontWeight: 600, fontSize: 14.5 }}>Semaine du {fmt(monday)} au {fmt(sunday)}{wk === 0 ? " (cette semaine)" : ""}</div>
        <button type="button" onClick={() => setWk(w => w + 1)} style={chipBtn} aria-label="Semaine suivante">→</button>
        {wk !== 0 && <button type="button" onClick={() => setWk(0)} style={chipBtn}>Cette semaine</button>}
      </div>
      <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginBottom: 14, lineHeight: 1.5 }}>La charge compte les tâches à finir cette semaine, les tâches en retard (plus lourdes), les réunions et un peu les tâches sans date. C'est un repère pour répartir le travail, pas une mesure exacte.</div>
      {rows.length === 0 && <EmptyState text="Aucun membre à afficher." />}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.map(r => { const [lab, col] = level(r); return (
          <div key={r.u.id} data-person={r.u.display_name} style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "12px 14px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <Avatar user={r.u} size={28} />
              <div style={{ fontWeight: 600, fontSize: 14.5, minWidth: 110 }}>{r.u.display_name}</div>
              <span style={{ fontSize: 11.5, fontWeight: 700, color: col, border: `1px solid ${col}`, borderRadius: 6, padding: "1px 7px" }}>{lab}</span>
              <div style={{ flex: 1, minWidth: 140, height: 8, background: "var(--bg-2)", borderRadius: 6, overflow: "hidden" }}><div style={{ width: `${Math.round((r.score / max) * 100)}%`, height: "100%", background: col }} /></div>
            </div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12.5, color: "var(--text-dim)", marginTop: 8 }}>
              <span>📋 {r.dueWeek} à finir cette semaine</span>
              {r.overdue > 0 && <span style={{ color: "#FF9A8F" }}>⏰ {r.overdue} en retard</span>}
              {r.noDate > 0 && <span>🗂️ {r.noDate} sans date</span>}
              <span>📹 {r.meetings} réunion(s){r.hours ? ` · ${r.hours} h` : ""}</span>
              {r.leaveDays > 0 && <span>🌴 {r.leaveDays} jour(s) de congé</span>}
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}

/* ---------------- Réunions : trouver un créneau commun ---------------- */
function SlotFinder({ ids, accounts, tasks, durationMin, ignoreMeetingId, onPick }) {
  const [state, setState] = useState(null); // null | "loading" | {slots}
  const find = async () => {
    setState("loading");
    const now = Date.now(), today = parisDay(now), until = parisInstant(shiftDay(today, 15));
    const { data } = await supabase.rpc("busy_for", { p_users: ids, p_from: new Date(now).toISOString(), p_to: new Date(until).toISOString(), p_ignore_meeting: ignoreMeetingId || null });
    const busy = data || [], slots = [];
    for (let i = 0; i < 15 && slots.length < 6; i++) {
      const day = shiftDay(today, i);
      if (isoWd(day) > 5) continue;
      for (let m = 8 * 60; m + durationMin <= 20 * 60 && slots.length < 6; m += 30) {
        const hm = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
        const s = parisInstant(day, hm), e = s + durationMin * 60000;
        if (s < now + 15 * 60000) continue;
        const free = ids.every(id => { const u = accounts.find(a => a.id === id); return !u || conflictsC({ s, e, user: u, busy: busy.filter(b => b.user_id === id) }).length === 0; });
        if (free) slots.push({ day, from: hm, to: parisHM(e), s, e });
      }
    }
    setState({ slots });
  };
  return (
    <div data-testid="slot-finder" style={{ marginBottom: 14 }}>
      <button type="button" onClick={find} disabled={state === "loading"} style={{ ...chipBtn, color: "var(--accent-2)" }}>🔎 {state === "loading" ? "Recherche…" : "Trouver un créneau où tout le monde est libre"}</button>
      {state && state !== "loading" && (
        <div style={{ marginTop: 10 }}>
          {state.slots.length === 0
            ? <div style={{ fontSize: 13, color: "var(--text-dim)" }}>Aucun créneau libre pour tous dans les 15 prochains jours (heures ouvrées). Essaie avec moins de participants ou une durée plus courte.</div>
            : <>
              <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginBottom: 6 }}>Propositions ({durationMin} min) — clique pour choisir :</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {state.slots.map(x => <button key={x.s} type="button" onClick={() => onPick(x)} style={{ ...chipBtn, fontSize: 12.5, textTransform: "capitalize" }}>{fmtDay(x.day, { weekday: "short", day: "numeric", month: "short" })} · {x.from.replace(":", "h")}–{x.to.replace(":", "h")}</button>)}
              </div>
            </>}
        </div>
      )}
    </div>
  );
}

/* ---------------- Réunions : compte-rendu et tâches issues de la réunion ---------------- */
function MinutesPanel({ m, me, session, canManage, canMakeTasks, people, notify }) {
  const [text, setText] = useState(m.minutes || "");
  const [busy, setBusy] = useState(false);
  const [who, setWho] = useState("");
  const [made, setMade] = useState({});
  useEffect(() => { setText(m.minutes || ""); }, [m.minutes]);
  const dirty = text !== (m.minutes || "");
  const save = async () => {
    if (busy || !dirty) return;
    setBusy(true);
    const { error } = await supabase.from("meetings").update({ minutes: text.slice(0, 20000) }).eq("id", m.id);
    setBusy(false);
    notify(error ? error.message : "Compte-rendu enregistré.", error ? "err" : "ok");
  };
  const lines = (m.minutes || "").split("\n").map(l => l.replace(/^\s*(?:[-*•]|\d+[.)]|\[[ xX]?\])\s*/, "").trim()).filter(l => l.length >= 3);
  const makeTask = async (line, i) => {
    const assignees = who ? [who] : [];
    const { data, error } = await supabase.from("tasks").insert({ title: line.slice(0, 120), notes: `Issue de la réunion « ${m.title} ».`, label: LABELS[0].id, priority: 2, done: false, assignees, assignee: assignees[0] || null, created_by: me.id, server_id: me.server_id }).select().single();
    if (error) { notify(error.message, "err"); return; }
    setMade(x => ({ ...x, [i]: true }));
    let mail = "";
    if (data && assignees.filter(x => x !== me.id).length) { try { const r = await callApi("/api/notify-task", { taskId: data.id, userIds: assignees.filter(x => x !== me.id) }, session); if (r.sent) mail = " · email envoyé"; } catch (_) {} }
    notify("Tâche créée" + mail + ".");
  };
  return (
    <div data-testid="minutes" style={{ marginTop: 12, borderTop: "1px solid var(--border)", paddingTop: 12 }}>
      {canManage ? (<>
        <textarea aria-label="Compte-rendu" value={text} onChange={e => setText(e.target.value)} rows={6} maxLength={20000} placeholder={"Décisions, points abordés…\nUne action par ligne : tu pourras la transformer en tâche."} style={{ ...inputStyle, resize: "vertical", fontSize: 13.5 }} />
        <button type="button" onClick={save} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "8px 18px", marginTop: 8, opacity: busy || !dirty ? 0.5 : 1 }}>{busy ? "…" : "Enregistrer le compte-rendu"}</button>
      </>) : (m.minutes ? <div style={{ whiteSpace: "pre-wrap", fontSize: 13.5, color: "var(--text)" }}>{m.minutes}</div> : <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Pas encore de compte-rendu.</div>)}
      {canMakeTasks && lines.length > 0 && !dirty && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
            <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-dim)" }}>Transformer une ligne en tâche, assignée à</span>
            <select aria-label="Assigner à" value={who} onChange={e => setWho(e.target.value)} style={{ ...inputStyle, width: "auto", padding: "6px 10px", fontSize: 13 }}><option value="">Personne</option>{people.map(p => <option key={p.id} value={p.id}>{p.id === me.id ? "Moi" : p.display_name}</option>)}</select>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            {lines.slice(0, 30).map((l, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13.5, background: "var(--bg)", borderRadius: 8, padding: "6px 10px" }}>
                <span style={{ flex: 1 }}>{l}</span>
                {made[i] ? <span style={{ fontSize: 12, color: "#5FBF8B" }}>✓ créée</span> : <button type="button" data-make-task onClick={() => makeTask(l, i)} style={{ ...chipBtn, padding: "4px 10px", fontSize: 12 }}>→ tâche</button>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Réactions, historique, statut, notifications du navigateur, vue semaine
   ============================================================ */
const REACTION_EMOJIS = ["👍", "✅", "❤️", "😂", "🎉", "👀"];
function ReactionBar({ kind, targetId, reactions = [], me, accounts, notify }) {
  const [pick, setPick] = useState(false);
  const mine = reactions.filter(r => r.kind === kind && r.target_id === targetId);
  const groups = REACTION_EMOJIS.map(e => ({ e, list: mine.filter(r => r.emoji === e) })).filter(g => g.list.length);
  const canReact = me.role !== "guest";
  const toggle = async (e) => {
    setPick(false);
    const had = mine.find(r => r.emoji === e && r.user_id === me.id);
    const { error } = had
      ? await supabase.from("reactions").delete().eq("id", had.id)
      : await supabase.from("reactions").insert({ server_id: me.server_id, kind, target_id: targetId, user_id: me.id, emoji: e });
    if (error) notify(error.message, "err");
  };
  if (!groups.length && !canReact) return null;
  const nameOf = (id) => id === me.id ? "toi" : ((accounts.find(a => a.id === id) || {}).display_name || "?");
  return (
    <div data-reactions style={{ display: "flex", gap: 5, flexWrap: "wrap", alignItems: "center", marginTop: 4 }}>
      {groups.map(g => { const on = g.list.some(r => r.user_id === me.id); return (
        <button key={g.e} type="button" disabled={!canReact} aria-pressed={on} data-react={g.e} title={g.list.map(r => nameOf(r.user_id)).join(", ")} onClick={() => toggle(g.e)}
          style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12.5, padding: "1px 8px", borderRadius: 12, cursor: canReact ? "pointer" : "default", background: on ? "#5B6EF522" : "var(--bg-2)", border: `1px solid ${on ? "var(--accent)" : "var(--border-soft)"}`, color: "var(--text)" }}>{g.e} <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>{g.list.length}</span></button>
      ); })}
      {canReact && (
        <span style={{ position: "relative" }}>
          <button type="button" data-react-open aria-label="Ajouter une réaction" title="Réagir" onClick={() => setPick(v => !v)} style={{ fontSize: 12, padding: "1px 8px", borderRadius: 12, cursor: "pointer", background: "transparent", border: "1px dashed var(--border-soft)", color: "var(--text-dimmer)" }}>☺ +</button>
          {pick && (
            <span style={{ position: "absolute", left: 0, bottom: "calc(100% + 4px)", zIndex: 5, display: "flex", gap: 2, background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 10, padding: 4, boxShadow: "0 8px 24px rgba(0,0,0,.35)" }}>
              {REACTION_EMOJIS.map(e => <button key={e} type="button" data-pick={e} aria-label={"Réagir avec " + e} onClick={() => toggle(e)} style={{ fontSize: 16, background: "none", border: "none", cursor: "pointer", padding: "3px 5px", borderRadius: 6 }}>{e}</button>)}
            </span>
          )}
        </span>
      )}
    </div>
  );
}

/* ---------------- Historique d'une tâche (administrateur) ---------------- */
const HIST_LABELS = { title: "Titre", notes: "Description", label: "Étiquette", priority: "Priorité", due: "Échéance", due_time: "Heure", done: "Terminée", assignees: "Assignés", tags: "Étiquettes #", recurrence: "Répétition", deleted_at: "Corbeille", subtasks: "Sous-tâches" };
function describeChange(k, [o, n], accounts) {
  const nm = (ids) => (ids || []).map(id => (accounts.find(a => a.id === id) || {}).display_name || "?").join(", ") || "personne";
  const short = (v) => { const t = v == null || v === "" ? "—" : String(v); return t.length > 60 ? t.slice(0, 60) + "…" : t; };
  switch (k) {
    case "done": return n ? "a marqué la tâche comme terminée" : "a rouvert la tâche";
    case "deleted_at": return n ? "a mis la tâche à la corbeille" : "a restauré la tâche";
    case "assignees": return `Assignés : ${nm(o)} → ${nm(n)}`;
    case "priority": return `Priorité : ${(PRIORITIES.find(x => x.id === o) || {}).label || o} → ${(PRIORITIES.find(x => x.id === n) || {}).label || n}`;
    case "label": return `Étiquette : ${(LABELS.find(x => x.id === o) || {}).name || o} → ${(LABELS.find(x => x.id === n) || {}).name || n}`;
    case "due": return `Échéance : ${o ? fmtDay(o, { day: "numeric", month: "short" }) : "—"} → ${n ? fmtDay(n, { day: "numeric", month: "short" }) : "—"}`;
    case "due_time": return `Heure : ${o ? hhmm(o) : "toute la journée"} → ${n ? hhmm(n) : "toute la journée"}`;
    case "tags": return `Étiquettes # : ${(o || []).join(", ") || "—"} → ${(n || []).join(", ") || "—"}`;
    case "subtasks": return `Sous-tâches : ${o} → ${n}`;
    case "notes": return "Description modifiée";
    default: return `${HIST_LABELS[k] || k} : ${short(o)} → ${short(n)}`;
  }
}
function TaskHistory({ taskId, accounts }) {
  const [rows, setRows] = useState(null);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    let alive = true;
    supabase.from("task_history").select("*").eq("task_id", taskId).order("at", { ascending: false }).limit(100).then(({ data, error }) => { if (alive) setRows(error ? false : (data || [])); });
    return () => { alive = false; };
  }, [open, taskId]);

  if (m < 60) return `il y a ${m} min`;
  if (m < 1440) return `il y a ${Math.floor(m / 60)} h`;
  return `il y a ${Math.floor(m / 1440)} j`;
};

/* ---------------- Notifications du navigateur ---------------- */
const BN_KEY = "carnet-bn";
const bnSupported = () => typeof window !== "undefined" && "Notification" in window;
const bnOn = () => { try { return localStorage.getItem(BN_KEY) === "on"; } catch (_) { return false; } };
function showNotif(title, body, tag) {
  if (!bnSupported() || Notification.permission !== "granted" || !bnOn()) return;
  if (!window.__forceNotif && document.visibilityState === "visible" && document.hasFocus()) return;   // tu regardes déjà l'appli
  const opts = { body, tag, icon: "/icons/icon-192.png", badge: "/icons/icon-192.png", data: { url: "/app/" } };
  const fallback = () => { try { new Notification(title, opts); } catch (_) {} };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(reg => (reg && reg.showNotification ? reg.showNotification(title, opts) : fallback())).catch(fallback);
    else fallback();
  } catch (_) { fallback(); }
}
/** Surveille les données en direct et prévient (si autorisé) : tâche assignée, réunion qui commence, message privé, mention, congé traité. */
function useDesktopNotifications({ me, tasks, meetings, attendees, messages, channelMsgs, leaves, accounts }) {
  const [ready, setReady] = useState(false);
  const known = useRef({ tasks: new Set(), dm: new Set(), ch: new Set(), leaves: new Map(), meet: new Set() });
  useEffect(() => { const t = setTimeout(() => setReady(true), 3500); return () => clearTimeout(t); }, []);
  const nameOf = (id) => (accounts.find(a => a.id === id) || {}).display_name || "Quelqu'un";
  useEffect(() => {
    const k = known.current;
    const mineTasks = tasks.filter(t => assigneeIds(t).includes(me.id));
    const dms = messages.filter(m => m.to_id === me.id);
    const re = new RegExp("(^|[^A-Za-z0-9._-])@" + (me.username || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z0-9_-])", "i");
    const ments = channelMsgs.filter(m => m.from_id !== me.id && me.username && re.test(m.text));
    const mine = leaves.filter(l => l.user_id === me.id);
    if (!ready) {
      mineTasks.forEach(t => k.tasks.add(t.id)); dms.forEach(m => k.dm.add(m.id)); ments.forEach(m => k.ch.add(m.id)); mine.forEach(l => k.leaves.set(l.id, l.status));
      return;
    }
    for (const t of mineTasks) if (!k.tasks.has(t.id)) { k.tasks.add(t.id); if (t.created_by !== me.id) showNotif("Nouvelle tâche", `${nameOf(t.created_by)} t'a assigné « ${t.title} »`, "task-" + t.id); }
    for (const m of dms) if (!k.dm.has(m.id)) { k.dm.add(m.id); showNotif(`Message de ${nameOf(m.from_id)}`, m.poll ? "📊 Sondage" : String(m.text).slice(0, 120), "dm-" + m.id); }
    for (const m of ments) if (!k.ch.has(m.id)) { k.ch.add(m.id); showNotif(`${nameOf(m.from_id)} t'a mentionné`, String(m.text).slice(0, 120), "ch-" + m.id); }
    for (const l of mine) { const before = k.leaves.get(l.id); k.leaves.set(l.id, l.status); if (before === "pending" && l.status !== "pending") showNotif(l.status === "approved" ? "Congé accepté ✅" : "Demande de congé refusée", l.admin_note || "", "leave-" + l.id); }
  }, [ready, tasks, messages, channelMsgs, leaves, me.id]);
  useEffect(() => {
    const tick = () => {
      const now = Date.now(), k = known.current;
      for (const m of meetings) {
        const going = m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined");
        if (!going) continue;
        const dt = Date.parse(m.starts_at) - now;
        if (dt > 0 && dt <= 10 * 60000 && !k.meet.has(m.id + "s")) { k.meet.add(m.id + "s"); showNotif("Réunion dans " + Math.max(1, Math.round(dt / 60000)) + " min", m.title, "meet-" + m.id); }
        else if (dt <= 0 && dt > -5 * 60000 && !k.meet.has(m.id + "n")) { k.meet.add(m.id + "n"); showNotif("La réunion commence", m.title, "meet-" + m.id); }
      }
    };
    tick(); const id = setInterval(tick, 20000); return () => clearInterval(id);
  }, [meetings, attendees, me.id]);
}
function BrowserNotifCard({ card }) {
  const [on, setOn] = useState(bnOn());

    try { localStorage.setItem(BN_KEY, "on"); } catch (_) {}

    const prevForce = window.__forceNotif; window.__forceNotif = true; showNotif("Notifications activées ✓", "Tu seras prévenu(e) ici, même quand Le Carnet est en arrière-plan.", "bn-test"); window.__forceNotif = prevForce;
  };

      {perm === "unsupported" ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Ton navigateur ne gère pas les notifications. Sur iPhone, installe d'abord Le Carnet sur l'écran d'accueil.</div> : (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          {on && perm === "granted"
            ? <><span style={{ fontSize: 13.5, color: "#5FBF8B", fontWeight: 600 }}>✓ Activées sur cet appareil</span><button type="button" onClick={disable} style={chipBtn}>Désactiver</button></>
            : <button type="button" onClick={enable} style={{ ...primaryBtn, padding: "10px 20px" }}>Activer les notifications</button>}
        </div>
      )}
      {msg && <div role="status" style={{ fontSize: 12.5, color: "#FFC97A", marginTop: 10 }}>{msg}</div>}
    </div>
  );
}

/* ---------------- Tâches : vue Semaine (glisser-déposer pour replanifier) ---------------- */
function WeekBoard({ tasks, accounts, canEditTask, onOpen, onMoveDue }) {
  const [wk, setWk] = useState(0);
  const [over, setOver] = useState(null);
  const today = parisDay();
  const monday = shiftDay(today, -(isoWd(today) - 1) + wk * 7);
  const days = Array.from({ length: 7 }, (_, i) => shiftDay(monday, i));
  const byDay = (d) => tasks.filter(t => t.due === d).sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
  const noDate = tasks.filter(t => !t.due && !t.done);
  const late = tasks.filter(t => t.due && t.due < today && !t.done);
  const drop = (e, day) => { e.preventDefault(); setOver(null); const id = e.dataTransfer.getData("text/plain"); const t = tasks.find(x => x.id === id); if (t && t.due !== day) onMoveDue(t, day); };
  const card = (t) => {
    const label = LABELS.find(l => l.id === t.label) || LABELS[0];

    return (
      <div key={t.id} data-week-task={t.title} draggable={can} onDragStart={e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; }}
        style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `4px solid ${label.hex}`, borderRadius: 8, padding: "6px 8px", fontSize: 12.5, cursor: can ? "grab" : "pointer", opacity: t.done ? 0.5 : 1 }}>
        <div onClick={() => onOpen(t.id)} style={{ fontWeight: 600, textDecoration: t.done ? "line-through" : "none", cursor: "pointer", wordBreak: "break-word" }}>{t.title}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 3, color: "var(--text-dimmer)", fontSize: 11.5 }}>
          {t.due_time && <span>{hhmm(t.due_time)}</span>}
          {who.length > 0 && <AvatarStack users={who} size={16} max={3} />}
          {can && <select aria-label={"Déplacer « " + t.title + " »"} value="" onChange={e => { if (e.target.value) onMoveDue(t, e.target.value === "none" ? null : e.target.value); }} style={{ marginLeft: "auto", background: "transparent", border: "none", color: "var(--text-dimmer)", fontSize: 11.5, cursor: "pointer", maxWidth: 62 }}>
            <option value="">Déplacer…</option>
            {days.map(d => <option key={d} value={d} style={{ background: "var(--bg-2)" }}>{fmtDay(d, { weekday: "short", day: "numeric" })}</option>)}
            <option value="none" style={{ background: "var(--bg-2)" }}>Sans date</option>
          </select>}
        </div>
      </div>
    );
  };
  const col = (key, title, list, droppable, extra) => (
    <div key={key} data-week-col={key} onDragOver={droppable ? (e => { e.preventDefault(); if (over !== key) setOver(key); }) : undefined} onDragLeave={droppable ? (e => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }) : undefined} onDrop={droppable ? (e => drop(e, key === "none" ? null : key)) : undefined}
      style={{ background: over === key ? "#5B6EF514" : "var(--bg-2)", border: `1px solid ${over === key ? "var(--accent)" : key === today ? "var(--accent-2)" : "var(--border)"}`, borderRadius: 12, padding: 8, minHeight: 110, minWidth: 0 }}>
      <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8, textTransform: "capitalize", color: key === today ? "var(--accent-2)" : "var(--text)" }}>{title}{extra}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{list.map(card)}{list.length === 0 && droppable && <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", textAlign: "center", padding: "10px 0" }}>—</div>}</div>
    </div>
  );

    <div data-testid="week-board">

        {days.map(d => col(d, fmtDay(d, { weekday: "long", day: "numeric" }), byDay(d), true))}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 8, marginTop: 12 }}>

/* ---------------- Admin : congés ---------------- */
function AdminLeaves({ me, session, accounts, leaves, notify }) {
  const today = parisDay();
  const [notes, setNotes] = useState({});
  const [who, setWho] = useState(""); const [start, setStart] = useState(""); const [end, setEnd] = useState(""); const [reason, setReason] = useState(""); const [busy, setBusy] = useState(false);
  const name = (id) => (accounts.find(a => a.id === id) || {}).display_name || "Ancien membre";
  const pending = leaves.filter(l => l.status === "pending").sort((a, b) => a.start_date.localeCompare(b.start_date));
  const coming = leaves.filter(l => l.status === "approved" && l.end_date >= today).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const decide = async (l, status) => {
    const { error } = await supabase.rpc("decide_leave", { p_id: l.id, p_status: status, p_note: (notes[l.id] || "").trim() });
    if (error) { notify(error.message, "err"); return; }
    callApi("/api/notify-leave", { action: "decision", id: l.id }, session).catch(() => {});
    notify(status === "approved" ? "Congé accepté · la personne est prévenue." : "Demande refusée · la personne est prévenue.");
  };
  const add = async () => {
    if (busy) return;
    if (!who || !start) { notify("Choisis la personne et le premier jour.", "err"); return; }
    const last = end || start; if (last < start) { notify("La date de fin est avant le début.", "err"); return; }
    setBusy(true);
    const { data, error } = await supabase.from("leave_requests").insert({ server_id: me.server_id, user_id: who, start_date: start, end_date: last, reason: reason.trim().slice(0, 300), status: "approved" }).select().single();
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    if (data && who !== me.id) callApi("/api/notify-leave", { action: "decision", id: data.id }, session).catch(() => {});
    setWho(""); setStart(""); setEnd(""); setReason("");
    notify("Congé posé.");
  };
  const remove = async (l) => { if (!window.confirm(`Supprimer ce congé de ${name(l.user_id)} ?`)) return; const { error } = await supabase.from("leave_requests").delete().eq("id", l.id); notify(error ? error.message : "Congé supprimé.", error ? "err" : "ok"); };
  const card = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 14, padding: "18px 20px", marginBottom: 18 };
  return (

  const myMeetings = meetings.filter(m => parisDay(Date.parse(m.starts_at)) === today && (m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined")));
  const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id));
  const timed = mine.filter(t => t.due === today && t.due_time);
  const allDay = mine.filter(t => t.due === today && !t.due_time);
  const late = mine.filter(t => t.due && t.due < today);
  const items = [
    ...myMeetings.map(m => ({ k: "m-" + m.id, at: Date.parse(m.starts_at), end: Date.parse(m.ends_at), kind: "meeting", m })),
    ...timed.map(t => ({ k: "t-" + t.id, at: parisInstant(today, t.due_time), end: parisInstant(today, t.due_time), kind: "task", t })),
  ].sort((a, b) => a.at - b.at);
  const myLeave = leaves.find(l => l.user_id === me.id && l.status === "approved" && l.start_date <= today && l.end_date >= today);
  const away = leaves.filter(l => l.user_id !== me.id && l.status === "approved" && l.start_date <= today && l.end_date >= today).map(l => ({ l, u: accounts.find(a => a.id === l.user_id) })).filter(x => x.u);
  const next = items.find(i => i.end >= now);

        {next && <span style={{ fontSize: 12.5, color: "var(--accent-2)", fontWeight: 600 }}>{minsTo > 0 ? `Prochain : ${next.kind === "meeting" ? next.m.title : next.t.title} · dans ${minsTo >= 60 ? `${Math.floor(minsTo / 60)} h ${String(minsTo % 60).padStart(2, "0")}` : `${minsTo} min`}` : `En cours : ${next.kind === "meeting" ? next.m.title : next.t.title}`}</span>}

      {myLeave && <div role="status" style={{ marginTop: 12, background: "#16281F", border: "1px solid #234B36", color: "#8FD6AE", borderRadius: 10, padding: "9px 12px", fontSize: 13.5 }}>🌴 Tu es en congé aujourd'hui ({fmtLeave(myLeave)}). Pas de rappels par email.</div>}
      {(extras.events.length > 0 || extras.birthdays.length > 0) && (
        <div data-testid="day-extras" style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
          {extras.events.map(ev => <div key={ev.id} style={{ background: "var(--bg)", borderRadius: 10, padding: "8px 12px", fontSize: 13.5 }}>🎉 <strong>{ev.title}</strong>{ev.end_date !== ev.start_date ? <span style={{ color: "var(--text-dimmer)" }}> · jusqu'au {fmtDay(ev.end_date, { day: "numeric", month: "long" })}</span> : null}</div>)}
          {extras.birthdays.map(a => <div key={a.id} style={{ background: "var(--bg)", borderRadius: 10, padding: "8px 12px", fontSize: 13.5 }}>🎂 C'est l'anniversaire de <strong>{a.id === me.id ? "toi" : a.display_name}</strong> aujourd'hui !</div>)}

      )}
      {empty && !myLeave && <div style={{ marginTop: 10, fontSize: 13.5, color: "var(--text-dim)" }}>Rien de prévu aujourd'hui. Profites-en ✨</div>}
      {items.length > 0 && (<>
        <div style={sec}>Planning</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {items.map(i => i.kind === "meeting" ? (
            <div key={i.k} style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--bg)", borderRadius: 10, padding: "9px 12px", opacity: i.end < now ? 0.5 : 1 }}>
              <span style={{ minWidth: 92, fontSize: 12.5, fontWeight: 700, color: "#7DB4FF" }}>{fmtHM(i.at)} – {fmtHM(i.end)}</span>
              <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>📹 {i.m.title}</span>

            <button key={i.k} type="button" onClick={() => onOpen(i.t.id)} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: "var(--bg)", border: "none", borderRadius: 10, padding: "9px 12px", cursor: "pointer", color: "var(--text)", opacity: i.at < now ? 0.75 : 1 }}>

              <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>✅ {i.t.title}</span>
              {i.at < now && <span style={{ fontSize: 11.5, color: "#FF9A8F" }}>dépassée</span>}

        </div>

      {allDay.length > 0 && (<>
        <div style={sec}>À finir aujourd'hui</div>

        </div>
      )}
    </section>
  );
}

/* ---------------- Photos : réduction avant envoi (limite de 5 Mo) ---------------- */
async function shrinkImage(file, maxSide = 1600) {
  if (!file || !(file.type || "").startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    URL.revokeObjectURL(url);
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    if (scale === 1 && file.size <= 1.5 * 1024 * 1024) return file;
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    if (!blob || blob.size >= file.size) return file;
    const base = (file.name || "photo").replace(/\.[^.]+$/, "");
    return new File([blob], base + ".jpg", { type: "image/jpeg", lastModified: Date.now() });
  } catch (_) { return file; }
}

/** Calcule mes statistiques personnelles à partir des tâches qui me sont assignées. */
function computeStats(tasks, meId, now = Date.now()) {
  const today = parisDay(now);
  const monday = shiftDay(today, -(isoWd(today) - 1)), lastMonday = shiftDay(monday, -7);
  const mine = tasks.filter(t => assigneeIds(t).includes(meId));
  const done = mine.filter(t => t.done && t.done_at).map(t => ({ t, day: parisDay(Date.parse(t.done_at)) }));
  const thisWeek = done.filter(x => x.day >= monday && x.day <= today);
  const lastWeek = done.filter(x => x.day >= lastMonday && x.day < monday);
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = shiftDay(today, -i); days.push({ day: d, n: done.filter(x => x.day === d).length }); }
  const since30 = shiftDay(today, -29);
  const dueDone = done.filter(x => x.day >= since30 && x.t.due);
  const onTime = dueDone.filter(x => x.day <= x.t.due).length;
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = shiftDay(today, -i);
    if (done.some(x => x.day === d)) streak++; else if (i > 0) break;
  }
  const overdue = mine.filter(t => !t.done && t.due && t.due < today).length;
  const perProject = new Map();
  for (const x of thisWeek) perProject.set(x.t.project_id || "", (perProject.get(x.t.project_id || "") || 0) + 1);
  return { thisWeek: thisWeek.length, lastWeek: lastWeek.length, days, rate: dueDone.length ? Math.round(100 * onTime / dueDone.length) : null, dueDone: dueDone.length, streak, overdue, perProject: [...perProject.entries()].sort((a, b) => b[1] - a[1]) };
}
function MyStats({ me, tasks, projects }) {
  const st = useMemo(() => computeStats(tasks, me.id), [tasks, me.id]);
  const max = Math.max(1, ...st.days.map(d => d.n));
  const delta = st.thisWeek - st.lastWeek;
  const big = { fontFamily: "Fraunces, serif", fontSize: 24, fontWeight: 600 };
  const sub = { fontSize: 12.5, color: "var(--text-dim)" };
  return (
    <div data-my-stats style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>Mes statistiques</div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "16px 18px" }}>
        <div style={{ display: "flex", gap: 26, flexWrap: "wrap", alignItems: "flex-start" }}>
          <div><div style={big} data-stat="week">{st.thisWeek}</div><div style={sub}>terminée(s) cette semaine</div><div style={{ fontSize: 12, marginTop: 2, color: delta > 0 ? "#5FBF8B" : delta < 0 ? "#FFB648" : "var(--text-dimmer)" }}>{delta === 0 ? "comme la semaine dernière" : (delta > 0 ? "+" : "") + delta + " vs la semaine dernière (" + st.lastWeek + ")"}</div></div>
          <div><div style={big} data-stat="rate">{st.rate === null ? "—" : st.rate + " %"}</div><div style={sub}>à temps (30 derniers jours)</div><div style={{ fontSize: 12, marginTop: 2, color: "var(--text-dimmer)" }}>{st.dueDone ? `sur ${st.dueDone} tâche(s) avec échéance` : "pas encore d'échéance terminée"}</div></div>
          <div><div style={big} data-stat="streak">{st.streak}{st.streak > 0 ? " 🔥" : ""}</div><div style={sub}>jour(s) d'affilée avec une tâche terminée</div></div>
          <div><div style={{ ...big, color: st.overdue ? "#FF9A8F" : undefined }} data-stat="overdue">{st.overdue}</div><div style={sub}>en retard en ce moment</div></div>
        </div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 54, marginTop: 16 }} aria-label="Tâches terminées sur 14 jours">
          {st.days.map(d => (<div key={d.day} title={`${fmtDay(d.day, { day: "numeric", month: "short" })} : ${d.n}`} style={{ flex: 1, height: d.n ? Math.max(8, Math.round(54 * d.n / max)) : 3, background: d.n ? "#5FBF8B" : "var(--border-soft)", borderRadius: 3 }} />))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-dimmer)", marginTop: 4 }}><span>il y a 14 jours</span><span>aujourd'hui</span></div>
        {st.perProject.length > 0 && projects.length > 0 && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12, alignItems: "center" }}>
            <span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Cette semaine par projet :</span>
            {st.perProject.map(([pid, n]) => { const p = projects.find(x => x.id === pid); return <span key={pid || "none"} style={{ display: "inline-flex", gap: 6, alignItems: "center", fontSize: 12.5 }}>{p ? <ProjectChip project={p} /> : <span style={{ color: "var(--text-dim)" }}>Sans projet</span>}<strong>{n}</strong></span>; })}
          </div>
        )}
      </div>
    </div>
  );
}

  const doing = mine.filter(t => t.doing && !(t.due && daysUntil(t.due) <= 3));

/* ---------------- Export : tâches en CSV, agenda en .ics ---------------- */
const csvCell = (v) => { const t = String(v ?? ""); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
function buildTasksCsv(tasks, accounts, projects) {
  const head = ["Titre", "Statut", "Priorité", "Échéance", "Heure", "Assignés", "Projet", "Étiquettes", "Récurrence", "Notes", "Sous-tâches faites", "Créée le"];
  const rows = tasks.map(t => {
    const who = assigneeIds(t).map(id => (accounts.find(a => a.id === id) || {}).display_name).filter(Boolean).join(", ");
    const proj = (projects.find(p => p.id === t.project_id) || {}).name || "";
    const subs = t.subtasks || [];
    return [t.title, t.done ? "Terminée" : t.doing ? "En cours" : "À faire", (PRIORITIES.find(p => p.id === t.priority) || {}).label || "", t.due || "", t.due_time ? hhmm(t.due_time) : "", who, proj, [t.label, ...(t.tags || [])].filter(Boolean).join(" "), t.recurrence ? ((RECURRENCES.find(r => r.value === t.recurrence) || {}).label || t.recurrence) : "", t.notes || "", subs.length ? `${subs.filter(x => x.done).length}/${subs.length}` : "", t.created_at ? parisDay(Date.parse(t.created_at)) : ""];
  });
  // Point-virgule + BOM : s'ouvre correctement dans Excel en français
  return "\ufeff" + [head, ...rows].map(r => r.map(csvCell).join(";")).join("\r\n") + "\r\n";
}
const icsEsc = (v) => String(v || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const icsFoldLine = (line) => { const out = []; let cur = line; while (cur.length > 73) { out.push(cur.slice(0, 73)); cur = " " + cur.slice(73); } out.push(cur); return out.join("\r\n"); };
const icsUtc = (ms) => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
function buildCalendarIcs({ me, tasks, meetings, attendees }) {
  const stamp = icsUtc(Date.now());
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Le Carnet//FR", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Le Carnet"];
  for (const m of meetings) {
    if (m.created_by !== me.id && !attendees.some(a => a.meeting_id === m.id && a.user_id === me.id)) continue;
    L.push("BEGIN:VEVENT", `UID:meeting-${m.id}@le-carnet`, `DTSTAMP:${stamp}`, `DTSTART:${icsUtc(Date.parse(m.starts_at))}`, `DTEND:${icsUtc(Date.parse(m.ends_at))}`, `SUMMARY:${icsEsc("📹 " + m.title)}`, `DESCRIPTION:${icsEsc((m.notes ? m.notes + "\n" : "") + "Appel : " + meetLink(m))}`, `URL:${meetLink(m)}`, "END:VEVENT");
  }
  for (const t of tasks) {
    if (t.done || !t.due || !assigneeIds(t).includes(me.id)) continue;
    L.push("BEGIN:VEVENT", `UID:task-${t.id}@le-carnet`, `DTSTAMP:${stamp}`);
    if (t.due_time) { const a = parisInstant(t.due, hhmm(t.due_time)); L.push(`DTSTART:${icsUtc(a)}`, `DTEND:${icsUtc(a + 30 * 60000)}`); }
    else L.push(`DTSTART;VALUE=DATE:${t.due.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${shiftDay(t.due, 1).replace(/-/g, "")}`);
    L.push(`SUMMARY:${icsEsc("☑ " + t.title)}`, ...(t.notes ? [`DESCRIPTION:${icsEsc(t.notes)}`] : []), "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFoldLine).join("\r\n") + "\r\n";
}
function downloadText(name, mime, content) {
  const url = URL.createObjectURL(new Blob([content], { type: mime + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function ExportCard({ me, tasks, accounts, projects, meetings, attendees, notify, card }) {
  const today = parisDay();
  const exportCsv = (mineOnly) => {
    const list = mineOnly ? tasks.filter(t => assigneeIds(t).includes(me.id)) : tasks;
    downloadText(`le-carnet-taches-${today}.csv`, "text/csv", buildTasksCsv(list, accounts, projects));
    notify(`${list.length} tâche(s) exportée(s).`);
  };
  const exportIcs = () => {
    const ics = buildCalendarIcs({ me, tasks, meetings, attendees });
    downloadText(`le-carnet-agenda-${today}.ics`, "text/calendar", ics);
    notify("Agenda exporté : ouvre le fichier pour l'ajouter à Google Agenda, Outlook ou Apple Calendrier.");
  };
  return (
    <div data-export-card style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Exporter mes données</div>
      <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 12px" }}>Garde une copie de tes tâches (tableur) ou ajoute tes échéances et réunions à un autre agenda. Seul ce serveur est concerné.</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button type="button" data-export="csv-mine" onClick={() => exportCsv(true)} style={chipBtn}>⬇ Mes tâches (CSV)</button>
        <button type="button" data-export="csv-all" onClick={() => exportCsv(false)} style={chipBtn}>⬇ Toutes les tâches visibles (CSV)</button>
        <button type="button" data-export="ics" onClick={exportIcs} style={chipBtn}>📅 Mon agenda (.ics)</button>
      </div>
    </div>
  );
}

function InstallCard({ card }) {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(n => n + 1); window.addEventListener('carnet-install-ready', f); return () => window.removeEventListener('carnet-install-ready', f); }, []);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const prompt = window.__installPrompt;
  const install = async () => {
    if (!prompt) return;
    prompt.prompt();
    try { await prompt.userChoice; } catch (_) {}
    window.__installPrompt = null; force(n => n + 1);
  };
  return (
    <div style={card}>

const statusOf = (t) => t.done ? "done" : t.doing ? "doing" : "todo";

function TasksView({ me, session, isAdmin, myPerms, accounts, tasks, trashed, templates, comments, attachments, onOpen, notify, projects = [], projectMembers = [] }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showTrash, setShowTrash] = useState(false);
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("priority");
  const [filterLabel, setFilterLabel] = useState(null);
  const [filterDone, setFilterDone] = useState("open");
  const [filterMine, setFilterMine] = useState(false);
  const [filterProject, setFilterProject] = useState("");
  const [showProjects, setShowProjects] = useState(false);
  const canCreateProject = isAdmin || me.role === "moderator";
  const [view, setView] = useState(() => { try { const v = localStorage.getItem("carnet-view"); return v === "kanban" || v === "week" ? v : "list"; } catch (_) { return "list"; } });
  useEffect(() => {
    const f = () => { window.__carnetNewTask = false; if (isAdmin || myPerms.createTasks) { setEditing(null); setShowForm(true); } };
    if (window.__carnetNewTask) f();
    window.addEventListener("carnet-new-task", f);
    return () => window.removeEventListener("carnet-new-task", f);
  }, [isAdmin, myPerms.createTasks]);
  const changeView = (v) => { setView(v); if (v === "week") setFilterMine(true); try { localStorage.setItem("carnet-view", v); } catch (_) {} };
  const moveDue = async (t, day) => {
    const patch = day ? { due: day } : { due: null, due_time: null };
    const { error } = await supabase.from("tasks").update(patch).eq("id", t.id);
    notify(error ? "Tu n'as pas le droit de modifier cette tâche." : (day ? `« ${t.title} » déplacée au ${fmtDay(day, { weekday: "long", day: "numeric", month: "long" })}.` : `« ${t.title} » n'a plus de date.`), error ? "err" : "ok");
  };

  const visible = useMemo(() => {
    let list = tasks.filter(t => {
      if (view === "list") {
        if (filterDone === "open" && t.done) return false;
        if (filterDone === "done" && !t.done) return false;
      }
      if (filterLabel && t.label !== filterLabel) return false;
      if (filterMine && !assigneeIds(t).includes(me.id)) return false;
      if (filterProject === "none" ? t.project_id : (filterProject && t.project_id !== filterProject)) return false;
      if (query && ![t.title, t.notes || "", ...(t.tags || [])].join(" ").toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
    list.sort((a, b) => {
      if (sortBy === "priority") return b.priority - a.priority || dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "due") return dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "title") return a.title.localeCompare(b.title, "fr");
      return 0;
    });
    return list;
  }, [tasks, query, sortBy, filterLabel, filterDone, filterMine, filterProject, view, me.id]);

  const canEditTask = (t) => isAdmin || myPerms.editAnyTask || (t.created_by === me.id && myPerms.editOwnTask);
  const tellAssignees = async (taskId, userIds) => {
    if (!userIds.length) return 0;
    try { const r = await callApi('/api/notify-task', { taskId, userIds }, session); return r.sent || 0; }
    catch (_) { return 0; }
  };
  const saveTemplate = async (draft, name) => {
    const { error } = await supabase.from('task_templates').insert({
      server_id: me.server_id, created_by: me.id, name: name.slice(0, 80), title: draft.title, notes: draft.notes || "",
      label: draft.label, priority: draft.priority, tags: draft.tags || [], recurrence: draft.recurrence || null,
      subtasks: (draft.subtasks || []).map(x => ({ ...x, done: false })),
    });
    return error ? error.message : null;
  };
  const saveTask = async (draft) => {
    const { saveAsTemplate, ...data } = draft;
    data.assignee = (data.assignees || [])[0] || null;
    let message = "";
    if (data.id) {
      const { id, ...rest } = data;
      const { error } = await supabase.from('tasks').update(rest).eq('id', id);
      if (error) { notify(error.message, "err"); return; }
      const added = (rest.assignees || []).filter(x => x !== me.id && !(editing ? assigneeIds(editing) : []).includes(x));
      const sent = await tellAssignees(id, added);
      message = sent ? "Tâche mise à jour · email envoyé." : "Tâche mise à jour.";
    } else {
      const { data: created, error } = await supabase.from('tasks').insert({ ...data, done: false, created_by: me.id, server_id: me.server_id }).select().single();
      if (error) { notify(error.message, "err"); return; }
      const sent = created ? await tellAssignees(created.id, (data.assignees || []).filter(x => x !== me.id)) : 0;
      message = sent ? "Tâche créée · email envoyé." : "Tâche créée.";
    }
    if (saveAsTemplate) {
      const err = await saveTemplate(data, saveAsTemplate);
      message += err ? " (Modèle non enregistré : " + err + ")" : " Modèle enregistré.";
    }
    notify(message);
    setShowForm(false); setEditing(null);
  };
  const deleteTemplate = async (id) => {
    const { error } = await supabase.from('task_templates').delete().eq('id', id);
    notify(error ? error.message : "Modèle supprimé.", error ? "err" : "ok");
  };

  const restoreTask = async (id) => {
    const { error } = await supabase.rpc('restore_task', { p_id: id });
    notify(error ? error.message : "Tâche restaurée.", error ? "err" : "ok");
  };
  const removeTask = async (t) => {
    const { error } = await supabase.rpc('trash_task', { p_id: t.id });
    if (error) { notify(error.message, "err"); return; }
    notify("Tâche placée dans la corbeille.", "ok", { label: "Annuler", onClick: () => restoreTask(t.id) });
  };
  const purgeTask = async (t) => {
    const paths = attachments.filter(a => a.task_id === t.id).map(a => a.path);
    const { error } = await supabase.from('tasks').delete().eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (paths.length) await supabase.storage.from('task-files').remove(paths);
    notify("Tâche supprimée définitivement.");
  };

  const spawnNext = async (t) => {
    const next = nextOccurrence(t.due, t.recurrence);
    const ids = assigneeIds(t);
    const { error } = await supabase.from('tasks').insert({
      title: t.title, notes: t.notes, label: t.label, priority: t.priority, due: next, due_time: t.due_time || null, assignee: ids[0] || null, assignees: ids,
      tags: t.tags || [], subtasks: (t.subtasks || []).map(x => ({ ...x, done: false })), recurrence: t.recurrence,
      done: false, created_by: t.created_by, server_id: me.server_id, project_id: t.project_id || null,
    });
    return { next, error };
  };
  const setStatus = async (t, status) => {
    if (statusOf(t) === status) return;
    const patch = status === "done" ? { done: true } : status === "doing" ? { done: false, doing: true } : { done: false, doing: false };
    const { error } = await supabase.from('tasks').update(patch).eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (status === "done" && !t.done && t.recurrence) {
      const { next, error: e2 } = await spawnNext(t);
      notify(e2 ? "Terminée, mais la prochaine occurrence n'a pas pu être créée." : `Terminée · prochaine échéance : ${formatDue(next, daysUntil(next))}.`, e2 ? "err" : "ok");
    }
  };
  const toggleDone = (t) => setStatus(t, t.done ? "todo" : "done");

  const counts = { open: tasks.filter(t => !t.done).length, late: tasks.filter(t => !t.done && t.due && dueInfo(t).late).length };
  const viewBtn = (id, Icon, title) => (
    <button key={id} type="button" title={title} onClick={() => changeView(id)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6, padding: "8px 10px", background: view === id ? "var(--panel-2)" : "var(--bg-2)", color: view === id ? "var(--text)" : "var(--text-dim)", borderColor: view === id ? "var(--accent)" : "var(--border-soft)" }}><Icon size={14} /> <span className="hide-mobile">{title}</span></button>
  );
  const openEdit = (t) => { setEditing(t); setShowForm(true); };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Tâches</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>{counts.open} en cours{counts.late > 0 && <span style={{ color: "#FF9A8F" }}> · {counts.late} en retard</span>}</p></div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {(projects.length > 0 || canCreateProject) && <button type="button" data-open-projects onClick={() => setShowProjects(true)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6 }}>📁 Projets{projects.length ? ` (${projects.length})` : ""}</button>}
          {trashed.length > 0 && <button type="button" onClick={() => setShowTrash(true)} style={{ ...chipBtn, display: "flex", alignItems: "center", gap: 6 }}><I.Trash size={14} /> Corbeille ({trashed.length})</button>}
          <button onClick={() => { setEditing(null); setShowForm(true); }} style={{ display: (isAdmin || myPerms.createTasks) ? "flex" : "none", alignItems: "center", gap: 7, ...primaryBtn, padding: "10px 16px", width: "auto" }}><I.Plus size={16} /> Nouvelle tâche</button>
        </div>
      </div>
      <div className="task-toolbar" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 6 }}>{viewBtn("list", I.List, "Liste")}{viewBtn("kanban", I.Columns, "Kanban")}{viewBtn("week", I.Calendar, "Semaine")}</div>
        <div style={{ position: "relative", flex: "1 1 220px", minWidth: 180 }}><I.Search size={14} style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)" }} /><input data-search value={query} onChange={e => setQuery(e.target.value)} placeholder="Rechercher (titre, notes, #étiquette)…" style={{ ...inputStyle, paddingLeft: 32, background: "var(--bg-2)" }} /></div>
        <SelectPill icon={I.Sort} value={sortBy} onChange={setSortBy} options={[{ value: "priority", label: "Trier : priorité" }, { value: "due", label: "Trier : échéance" }, { value: "title", label: "Trier : titre" }]} />
        {view === "list" && <SelectPill icon={I.Filter} value={filterDone} onChange={setFilterDone} options={[{ value: "open", label: "À faire" }, { value: "done", label: "Terminées" }, { value: "all", label: "Toutes" }]} />}
        {projects.length > 0 && <SelectPill icon={I.Filter} value={filterProject} onChange={setFilterProject} options={[{ value: "", label: "Tous les projets" }, { value: "none", label: "Sans projet" }, ...projects.map(p => ({ value: p.id, label: (p.is_private ? "🔒 " : "") + p.name }))]} />}
        <button onClick={() => setFilterMine(m => !m)} style={{ ...chipBtn, background: filterMine ? "var(--panel-2)" : "var(--bg-2)", color: filterMine ? "var(--text)" : "var(--text-dim)", borderColor: filterMine ? "var(--accent)" : "var(--border-soft)" }}>Assignées à moi</button>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto" }}>{LABELS.map(l => (<button key={l.id} title={l.name} onClick={() => setFilterLabel(f => f === l.id ? null : l.id)} style={{ width: 22, height: 22, borderRadius: "50%", background: l.hex, cursor: "pointer", border: filterLabel === l.id ? "2px solid var(--text)" : "2px solid transparent" }} />))}</div>
      </div>

      {view === "list" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {visible.length === 0 && <EmptyState text="Aucune tâche ici." />}
          {visible.map(t => (<TaskCard key={t.id} task={t} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} project={projects.find(p => p.id === t.project_id)} commentCount={comments.filter(c => c.task_id === t.id).length} attachCount={attachments.filter(a => a.task_id === t.id).length} onOpen={() => onOpen(t.id)} onTagClick={setQuery} onToggle={() => toggleDone(t)} onEdit={() => openEdit(t)} onDelete={() => removeTask(t)} />))}
        </div>
      ) : view === "week" ? (
        <WeekBoard tasks={visible} accounts={accounts} canEditTask={canEditTask} onOpen={onOpen} onMoveDue={moveDue} />
      ) : (
        <KanbanBoard tasks={visible} accounts={accounts} canEditTask={canEditTask} onOpen={onOpen} onMove={setStatus} />
      )}

      {showProjects && <ProjectsModal projects={projects} members={projectMembers} accounts={accounts} me={me} isAdmin={isAdmin} canCreate={canCreateProject} notify={notify} onClose={() => setShowProjects(false)} />}
      {showForm && <TaskForm projects={projects} projectMembers={projectMembers} defaultProject={filterProject && filterProject !== "none" ? filterProject : ""} initial={editing} meId={me.id} accounts={accounts} templates={templates} tasks={tasks} onDeleteTemplate={deleteTemplate} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={saveTask} />}
      {showTrash && <TrashModal trashed={trashed} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} onRestore={restoreTask} onPurge={purgeTask} onClose={() => setShowTrash(false)} />}
    </div>
  );
}
function SelectPill({ icon: Icon, value, onChange, options }) {
  return (<div style={{ position: "relative" }}><Icon size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /><select value={value} onChange={e => onChange(e.target.value)} style={{ ...chipBtn, paddingLeft: 28, paddingRight: 26, appearance: "none", cursor: "pointer" }}>{options.map(o => <option key={o.value} value={o.value} style={{ background: "var(--bg-2)" }}>{o.label}</option>)}</select><I.Chevron size={12} style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /></div>);
}

/* ---------------- Vue Kanban ---------------- */
function KanbanBoard({ tasks, accounts, canEditTask, onOpen, onMove }) {
  const [overCol, setOverCol] = useState(null);
  const byCol = { todo: [], doing: [], done: [] };
  for (const t of tasks) byCol[statusOf(t)].push(t);
  byCol.done.sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  const DONE_LIMIT = 15;
  const drop = (e, col) => {
    e.preventDefault(); setOverCol(null);
    const id = e.dataTransfer.getData("text/plain");
    const t = tasks.find(x => x.id === id);
    if (t) onMove(t, col);
  };
  return (
    <div className="kanban" style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 14, alignItems: "start" }}>
      {COLUMNS.map((col, ci) => {
        const list = col.id === "done" ? byCol.done.slice(0, DONE_LIMIT) : byCol[col.id];
        return (
          <div key={col.id} onDragOver={e => { e.preventDefault(); if (overCol !== col.id) setOverCol(col.id); }} onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setOverCol(null); }} onDrop={e => drop(e, col.id)}
            style={{ background: overCol === col.id ? "#5B6EF514" : "var(--bg-2)", border: `1px solid ${overCol === col.id ? "var(--accent)" : "var(--border)"}`, borderRadius: 14, padding: 10, minHeight: 140 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 6px 10px", fontSize: 13, fontWeight: 700 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: col.hex }} /> {col.label}
              <span style={{ color: "var(--text-dimmer)", fontWeight: 500 }}>{byCol[col.id].length}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {list.length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", textAlign: "center", padding: "18px 0" }}>Glisse une tâche ici</div>}
              {list.map(t => {
                const label = LABELS.find(l => l.id === t.label) || LABELS[0];
                const prio = PRIORITIES.find(p => p.id === t.priority) || PRIORITIES[1];
                const di = dueInfo(t);
                const late = Boolean(di && di.late);
                const people = assigneeIds(t).map(id => accounts.find(a => a.id === id)).filter(Boolean);
                const editable = canEditTask(t);
                return (
                  <div key={t.id} draggable={editable} onDragStart={e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; }}
                    style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `4px solid ${label.hex}`, borderRadius: 10, padding: "10px 12px", cursor: editable ? "grab" : "default", opacity: t.done ? 0.65 : 1 }}>
                    <div onClick={() => onOpen(t.id)} style={{ fontSize: 13.5, fontWeight: 600, cursor: "pointer", wordBreak: "break-word", textDecoration: t.done ? "line-through" : "none" }}>{t.title}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 11, fontWeight: 600, color: prio.hex }}><I.Flag size={10} /> {prio.label}</span>
                      {t.due && <span style={{ fontSize: 11.5, color: late ? "#FF9A8F" : "var(--text-dim)" }}>{di.label}</span>}
                      {(t.subtasks || []).length > 0 && <span style={{ fontSize: 11.5, color: "var(--text-dim)" }}>☑ {t.subtasks.filter(x => x.done).length}/{t.subtasks.length}</span>}
                      <span style={{ marginLeft: "auto" }}><AvatarStack users={people} size={20} max={3} /></span>
                    </div>
                    {editable && (
                      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                        {ci > 0 && <button type="button" onClick={() => onMove(t, COLUMNS[ci - 1].id)} style={{ ...iconBtn, padding: "2px 8px", fontSize: 11 }} title={"Déplacer vers « " + COLUMNS[ci - 1].label + " »"}>←</button>}
                        {ci < 2 && <button type="button" onClick={() => onMove(t, COLUMNS[ci + 1].id)} style={{ ...iconBtn, padding: "2px 8px", fontSize: 11, marginLeft: ci === 0 ? "auto" : 0 }} title={"Déplacer vers « " + COLUMNS[ci + 1].label + " »"}>→</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              {col.id === "done" && byCol.done.length > DONE_LIMIT && <div style={{ fontSize: 12, color: "var(--text-dimmer)", textAlign: "center" }}>+ {byCol.done.length - DONE_LIMIT} plus ancienne(s) — voir la vue Liste</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Corbeille ---------------- */
function TrashModal({ trashed, accounts, me, isAdmin, myPerms, onRestore, onPurge, onClose }) {
  const can = (t) => isAdmin || me.role === "moderator" || myPerms.deleteAnyTask || (t.created_by === me.id && myPerms.deleteOwnTask);
  const [confirmId, setConfirmId] = useState(null);
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ ...modalStyle, width: 520 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>Corbeille</h2><button type="button" onClick={onClose} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <p style={{ fontSize: 12.5, color: "var(--text-dimmer)", margin: "0 0 16px" }}>Les tâches supprimées sont conservées 30 jours, puis effacées automatiquement.</p>
        {trashed.length === 0 && <EmptyState text="La corbeille est vide." />}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {trashed.map(t => {
            const who = accounts.find(a => a.id === t.deleted_by);
            const daysLeft = Math.max(0, 30 - Math.floor((Date.now() - new Date(t.deleted_at).getTime()) / 86400000));
            return (
              <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 10, padding: "10px 12px", flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 150 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, wordBreak: "break-word" }}>{t.title}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>Supprimée {who ? "par " + who.display_name + " " : ""}· encore {daysLeft} j</div>
                </div>
                {can(t) ? (confirmId === t.id ? (<>
                  <button type="button" onClick={() => { setConfirmId(null); onPurge(t); }} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, color: "#FF9A8F" }}>Confirmer</button>
                  <button type="button" onClick={() => setConfirmId(null)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12 }}>Non</button>
                </>) : (<>
                  <button type="button" onClick={() => onRestore(t.id)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 5 }}><I.Undo size={12} /> Restaurer</button>
