function RichText({ text, accounts }) {
  const segs = String(text).split(/(https:\/\/meet\.jit\.si\/LeCarnet-[A-Za-z0-9-]+)/);
  if (segs.length > 1) return <>{segs.map((sg, i) => i % 2 ? <a key={i} href={sg} target="_blank" rel="noopener noreferrer" style={{ display: "inline-block", background: "linear-gradient(135deg,var(--accent),var(--accent-2))", color: "#fff", fontWeight: 600, borderRadius: 8, padding: "5px 12px", textDecoration: "none", margin: "2px 0" }}>📹 Rejoindre l'appel</a> : <RichText key={i} text={sg} accounts={accounts} />)}</>;
  const parts = [];
  const re = /(^|[^A-Za-z0-9._-])@([A-Za-z0-9._-]{3,30})/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const name = m[2].replace(/[._-]+$/, "");
    if (!accounts.some(a => a.username && a.username.toLowerCase() === name.toLowerCase())) continue;
    const start = m.index + m[1].length;
    parts.push(text.slice(last, start));
    parts.push(<span key={start} style={{ color: "var(--accent-2)", fontWeight: 600, background: "#5B6EF51F", borderRadius: 4, padding: "0 3px" }}>@{name}</span>);
    last = start + 1 + name.length;
  }
  parts.push(text.slice(last));
  return <>{parts}</>;
}

/** Annonces de l'équipe (publiées depuis l'Espace Administrateur) : bandeau masquable sur cet appareil. */
const ANN_COLORS = { info: "#5B9EF5", important: "#FFB648", success: "#5FBF8B" };
function AnnouncementBanner({ items = [] }) {
  const KEY = "carnet-ann-hidden";
  const [hidden, setHidden] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (_) { return []; } });
  const now = Date.now();
  const shown = items.filter(a => a.active && !hidden.includes(a.id) && (!a.expires_at || Date.parse(a.expires_at) > now)).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 3);
  const hide = (id) => { const next = [...hidden, id].slice(-100); setHidden(next); try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (_) {} };
  if (!shown.length) return null;
  return (
    <div data-announcements style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
      {shown.map(a => { const c = ANN_COLORS[a.level] || ANN_COLORS.info; return (
        <div key={a.id} data-announcement={a.title} role="status" style={{ display: "flex", gap: 12, alignItems: "flex-start", background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `5px solid ${c}`, borderRadius: 10, padding: "10px 14px" }}>
          <span aria-hidden="true" style={{ fontSize: 18 }}>📣</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 14 }}>{a.title}</div>
            {a.body && <div style={{ fontSize: 13, color: "var(--text-dim)", marginTop: 3, whiteSpace: "pre-wrap" }}>{a.body}</div>}
          </div>
          <button type="button" data-announcement-hide onClick={() => hide(a.id)} aria-label="Masquer l'annonce" style={{ background: "none", border: "none", color: "var(--text-dim)", cursor: "pointer", fontSize: 16, padding: 2 }}>✕</button>
        </div>); })}
    </div>
  );
}
function AlertBanner({ inline }) {
  const [alert, setAlert] = useState(null);
  const [hidden, setHidden] = useState(false);
  const keyOf = (a) => a.id + "|" + a.display_at + "|" + a.message;
  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const q = (cols) => supabase.from('system_alerts').select(cols).lte('display_at', new Date().toISOString()).order('display_at', { ascending: false }).limit(5);
        let { data, error } = await q('id,message,display_at,is_maintenance,maint_end');
        if (error) ({ data, error } = await q('id,message,display_at,is_maintenance'));   // migration 07 pas encore lancée
        if (error || !alive) return;
        const now = new Date();
        // Une annonce de maintenance disparaît toute seule une fois la maintenance terminée.
        const a = (data || []).find(r => r.message && r.message.trim() && (!r.is_maintenance || (r.maint_end && new Date(r.maint_end) > now)));
        if (!a) { setAlert(null); return; }
        let dismissed = null;
        try { dismissed = localStorage.getItem("carnet-alert-dismissed"); } catch (_) {}
        setAlert(a); setHidden(dismissed === keyOf(a));
      } catch (_) {}
    };
    load();
    const id = setInterval(load, 5 * 60 * 1000);
    const onVis = () => { if (!document.hidden) load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { alive = false; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  if (!alert || hidden) return null;
  const close = () => { try { localStorage.setItem("carnet-alert-dismissed", keyOf(alert)); } catch (_) {} setHidden(true); };
  return (
    <div className="alert-banner" role="status" style={{ ...(inline ? { marginBottom: 18 } : { position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 45, width: "min(560px, 92vw)", boxShadow: "0 12px 30px rgba(0,0,0,.45)" }), display: "flex", alignItems: "flex-start", gap: 10, background: "#2A2410", border: "1px solid #6B5A1E", color: "#FFE3A0", borderRadius: 12, padding: "11px 14px", fontSize: 13.5, lineHeight: 1.45 }}>
      <I.Alert size={17} style={{ flexShrink: 0, marginTop: 1, color: "#FFC97A" }} />
      <div style={{ flex: 1, minWidth: 0, wordBreak: "break-word" }}>{alert.message}</div>
      <button type="button" onClick={close} aria-label="Fermer l'annonce" style={{ background: "none", border: "none", color: "#FFE3A0", cursor: "pointer", padding: 2, flexShrink: 0 }}><I.X size={16} /></button>
    </div>
  );
}

    return () => sub.subscription.unsubscribe();
  }, []);

  // Maintenance programmée : si elle démarre pendant qu'on utilise l'appli, on est envoyé sur la page de maintenance
  // (vérification chaque minute et au retour sur l'onglet). Une erreur réseau ne bloque jamais l'appli.
  useEffect(() => {
    let stop = false;
    const check = async () => {
      try {
        const { data, error } = await supabase.from('maintenance_active').select('id').limit(1);
        if (!stop && !error && data && data.length) location.replace('/maintenance.html');
      } catch (_) {}
    };
    const id = setInterval(check, 60000);
    const onVis = () => { if (!document.hidden) check(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { stop = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);

  const [profileChecked, setProfileChecked] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [recovery, setRecovery] = useState(false);

  useEffect(() => {
    let cancelled = false;
    async function loadProfile() {
      if (session === undefined) return;
      if (!session) { setProfile(null); setProfileChecked(true); return; }
      const { data } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (!cancelled) { setProfile(data || null); setProfileChecked(true); }
    }
    loadProfile();
    const id = setInterval(loadProfile, 8000); // revérifie si une demande a été approuvée
    return () => { cancelled = true; clearInterval(id); };
  }, [session, reloadKey]);

  if (session === undefined || !profileChecked) {
    return <Shell><div style={{ minHeight: "100vh", display: "grid", placeItems: "center" }}><Spinner /></div></Shell>;
  }

  if (session && recovery) {
    return <Shell footer><ResetPassword notify={notify} onDone={() => setRecovery(false)} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!session) {
    const inviteToken = new URLSearchParams(window.location.search).get("invite");
    if (inviteToken) return <Shell footer><InviteAccept token={inviteToken} notify={notify} />{toast && <Toast toast={toast} />}</Shell>;
    return <Shell footer><AuthGate notify={notify} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!profile && ((session.user.app_metadata && session.user.app_metadata.providers) || []).includes("google")) {
    return <Shell footer><CompleteProfile session={session} notify={notify} onDone={() => setReloadKey(k => k + 1)} onLogout={() => supabase.auth.signOut()} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!profile) {
    return (
      <Shell>
        <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
          <div style={{ maxWidth: 380, textAlign: "center", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 16, padding: 32 }}>
            <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 19, margin: "0 0 8px" }}>Aucun accès</h1>
            <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 }}>Votre compte n'est rattaché à aucun serveur pour l'instant. Demandez un nouveau code d'invitation, ou créez votre propre serveur.</p>
            <button onClick={() => supabase.auth.signOut()} style={{ ...secondaryBtn, width: "100%" }}>Se déconnecter</button>
          </div>
        </div>
        {toast && <Toast toast={toast} />}
      </Shell>
    );
  }

  if (profile.status === "pending") {
    return <Shell footer><PendingScreen onLogout={() => supabase.auth.signOut()} />{toast && <Toast toast={toast} />}</Shell>;
  }

  return (
    <Shell noAlert>
      <Workspace me={profile} session={session} onLogout={() => supabase.auth.signOut()} notify={notify} onProfileChanged={() => setReloadKey(k => k + 1)} />
      {toast && <Toast toast={toast} />}
    </Shell>
  );
}

/* ---------------- Acceptation d'une invitation reçue par email ---------------- */
function InviteAccept({ token, notify }) {
  const [info, setInfo] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [username, setUsername] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    callApi('/api/accept-invite', { action: 'check', token })
      .then(setInfo)
      .catch(e => setLoadErr(e.message));
  }, [token]);

  const goHome = () => { window.location.href = window.location.pathname; };

  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      await callApi('/api/accept-invite', { action: 'accept', token, username: username.trim(), displayName: displayName.trim(), password });
      const { error } = await supabase.auth.signInWithPassword({ email: info.email, password });
      if (error) throw new Error("Compte créé, mais la connexion a échoué. Connectez-vous manuellement.");
      window.history.replaceState({}, "", window.location.pathname);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div onKeyDown={(e) => { if (e.key === "Enter" && info) submit(); }} style={{ width: 400, maxWidth: "92vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><NotebookMark size={34} /></div>
        {!info && !loadErr && <div style={{ display: "grid", placeItems: "center", padding: 20 }}><Spinner /></div>}
        {loadErr && (
          <div style={{ textAlign: "center" }}>
            <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 20, margin: "0 0 10px" }}>Invitation indisponible</h1>
            <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6, marginBottom: 20 }}>{loadErr}</p>
            <button type="button" onClick={goHome} style={{ ...secondaryBtn, width: "100%" }}>Aller à la connexion</button>
          </div>
        )}
        {info && (
          <div>
            <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, textAlign: "center", margin: "0 0 4px" }}>Rejoindre « {info.serverName} »</h1>
            {info.existingAccount && (
              <div data-existing-account style={{ textAlign: "center" }}>
                <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6, margin: "10px 0 18px" }}>{info.email} a déjà un compte Le Carnet. Pas besoin d'en créer un autre : connectez-vous avec votre compte, puis ouvrez <strong>« Mes serveurs » → « Rejoindre »</strong> (menu « Plus » sur téléphone) et collez ce lien d'invitation.</p>
                <button type="button" data-copy-invite onClick={async () => { await copyText(window.location.href); notify("Lien d'invitation copié."); }} style={{ ...secondaryBtn, width: "100%", marginBottom: 10 }}>Copier le lien d'invitation</button>
                <button type="button" onClick={goHome} style={{ ...primaryBtn, width: "100%" }}>Aller à la connexion</button>
              </div>
            )}
            {!info.existingAccount && (<>
            <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 20px" }}>Créez votre compte pour {info.email}</p>
            <Field label="Identifiant (pour vous connecter)"><input autoFocus value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
            <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
            <Field label="Mot de passe (8 caractères minimum)">
              <div style={{ position: "relative" }}>
                <input type={showPw ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} style={{ ...inputStyle, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowPw(v => !v)} style={eyeBtn}>{showPw ? <I.EyeOff size={16} /> : <I.Eye size={16} />}</button>
              </div>
            </Field>
            {err && <div style={{ display: "flex", gap: 8, alignItems: "center", color: "#FF9A8F", fontSize: 13, margin: "4px 0 14px" }}><I.Alert size={14} /> {err}</div>}
            <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Création…" : "Créer mon compte"}</button>
            </>)}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Après une première connexion Google : choisir son serveur ---------------- */
function CompleteProfile({ session, notify, onDone, onLogout }) {
  const user = session.user;
  const email = user.email || "";
  const meta = user.user_metadata || {};
  const [step, setStep] = useState("loading"); // loading | invite | choose | create | join | done-pending
  const [invites, setInvites] = useState([]);
  const [serverName, setServerName] = useState("");
  const [joinCode, setJoinCode] = useState("");
  const [displayName, setDisplayName] = useState(meta.full_name || meta.name || "");
  const [username, setUsername] = useState(email.split("@")[0].replace(/[^A-Za-z0-9._-]/g, "").slice(0, 30));
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    callApi('/api/accept-invite', { action: 'my-invites' }, session)
      .then(r => { setInvites(r.invites || []); setStep((r.invites || []).length ? "invite" : "choose"); })
      .catch(() => setStep("choose"));
  }, []);

  const friendly = (e) => /duplicate|unique/i.test(e.message || "") ? "Cet identifiant est déjà pris, choisissez-en un autre." : (e.message || "Erreur");
  const needIdentity = () => !username.trim() || !displayName.trim();

  const claim = async (inv) => {
    if (needIdentity()) { setErr("Renseignez votre nom et votre identifiant."); return; }
    setBusy(true); setErr("");
    try {
      await callApi('/api/accept-invite', { action: 'claim-invite', inviteId: inv.id, username: username.trim(), displayName: displayName.trim() }, session);
      notify("Bienvenue dans « " + inv.serverName + " » !");
      onDone();
    } catch (e) { setErr(friendly(e)); }
    setBusy(false);
  };
  const createServer = async () => {
    if (!serverName.trim() || needIdentity()) { setErr("Remplissez tous les champs."); return; }
    setBusy(true); setErr("");
    try {
      const { data: server, error: sErr } = await supabase.from('servers').insert({ name: serverName.trim(), owner_id: user.id }).select().single();
      if (sErr) throw sErr;
      const { error: pErr } = await supabase.from('profiles').insert({ id: user.id, server_id: server.id, username: username.trim(), email, display_name: displayName.trim(), color: "#9B7EF5" });
      if (pErr) throw pErr;
      notify("Votre serveur est prêt !");
      onDone();
    } catch (e) { setErr(friendly(e)); }
    setBusy(false);
  };
  const joinServer = async () => {
    if (!joinCode.trim() || needIdentity()) { setErr("Remplissez tous les champs."); return; }
    setBusy(true); setErr("");
    try {
      const { data: found, error: sErr } = await supabase.rpc('server_for_code', { p_code: joinCode });
      const server = Array.isArray(found) ? found[0] : found;
      if (sErr || !server) throw new Error("Code d'invitation introuvable.");
      const { error: pErr } = await supabase.from('profiles').insert({ id: user.id, server_id: server.id, username: username.trim(), email, display_name: displayName.trim(), color: "#5B9EF5" });
      if (pErr) throw pErr;
      onDone();
    } catch (e) { setErr(friendly(e)); }
    setBusy(false);
  };

  const cardStyle = { width: 400, maxWidth: "92vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" };
  const identityFields = (
    <div>
      <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
      <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
    </div>
  );
  const errBox = err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>;
  const wrap = (children) => (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}><NotebookMark size={32} /></div>
        {children}
        <button type="button" onClick={onLogout} style={{ ...secondaryBtn, width: "100%", marginTop: 14 }}>Se déconnecter</button>
      </div>
    </div>
  );

  if (step === "loading") return wrap(<div style={{ display: "grid", placeItems: "center", padding: 16 }}><Spinner /></div>);

  if (step === "invite") {
    const inv = invites[0];
    return wrap(<div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 20, textAlign: "center", margin: "0 0 6px" }}>Vous avez été invité(e)</h1>
      <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13.5, margin: "0 0 18px" }}>Rejoignez « {inv.serverName} » avec {email}.</p>
      {identityFields}{errBox}
      <button type="button" onClick={() => claim(inv)} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "…" : "Rejoindre " + inv.serverName}</button>
      <button type="button" onClick={() => setStep("choose")} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", marginTop: 12, width: "100%" }}>Plutôt créer ou rejoindre un autre serveur</button>
    </div>);
  }

  if (step === "choose") {
    const opt = (onClick, grad, icon, title, sub) => (
      <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 11, padding: "14px 16px", marginBottom: 10, cursor: "pointer" }}>
        <div style={{ width: 36, height: 36, borderRadius: 9, background: grad, display: "grid", placeItems: "center", flexShrink: 0 }}>{icon}</div>
        <div><div style={{ fontWeight: 600, fontSize: 14, color: "var(--text)" }}>{title}</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>{sub}</div></div>
      </button>
    );
    return wrap(<div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, textAlign: "center", margin: "0 0 4px" }}>Bienvenue{displayName ? ", " + displayName.split(" ")[0] : ""} !</h1>
      <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 20px" }}>Connecté avec {email}. Choisissez votre espace.</p>
      {opt(() => { setErr(""); setStep("create"); }, "linear-gradient(135deg,var(--admin),#B08CFA)", <I.Shield size={17} color="#fff" />, "Créer un nouveau serveur", "Vous en serez l'administrateur")}
      {opt(() => { setErr(""); setStep("join"); }, "linear-gradient(135deg,var(--accent),var(--accent-2))", <I.UserPlus size={17} color="#fff" />, "Rejoindre un serveur existant", "Avec un code d'invitation")}
    </div>);
  }

  const isCreate = step === "create";
  return wrap(<div>
    <button onClick={() => { setStep("choose"); setErr(""); }} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 12 }}>← Retour</button>
    <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 19, margin: "0 0 16px" }}>{isCreate ? "Nouveau serveur" : "Rejoindre un serveur"}</h1>
    {isCreate
      ? <Field label="Nom du serveur"><input value={serverName} onChange={e => setServerName(e.target.value)} placeholder="ex. Famille Borget" style={inputStyle} /></Field>
      : <Field label="Code d'invitation"><input value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="ex. a1b2c3d4" style={inputStyle} /></Field>}
    {identityFields}{errBox}
    <button type="button" onClick={isCreate ? createServer : joinServer} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "…" : isCreate ? "Créer le serveur" : "Envoyer la demande"}</button>
  </div>);
}

  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);

      <button type="button" onClick={onBack} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 14 }}>← Retour</button>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 21, margin: "0 0 6px" }}>Mot de passe oublié</h1>

        <p style={{ color: "var(--text-dim)", fontSize: 13, margin: "0 0 18px" }}>Saisissez votre email ou votre identifiant : nous vous envoyons un lien pour choisir un nouveau mot de passe.</p>

        <button type="button" onClick={send} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Envoi…" : "Envoyer le lien"}</button>
      </div>)}
    </div>
  );
}
function ResetPassword({ onDone, notify }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (busy) return;
    if (pw.length < 8) { setErr("Le mot de passe doit faire au moins 8 caractères."); return; }
    if (pw !== pw2) { setErr("Les deux mots de passe sont différents."); return; }
    setBusy(true); setErr("");
    const { error } = await supabase.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    notify("Mot de passe modifié.");
    onDone();
  };
  return (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>

/* ---------------- Login ---------------- */
function Login({ notify }) {
  const [identifier, setIdentifier] = useState(""); // username OU email
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState("login"); // login | forgot

  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      let email = identifier.trim();
      if (!email.includes("@")) {
        const { data } = await supabase.rpc('email_for_username', { p_username: identifier.trim() });
        if (!data) throw new Error("Identifiant ou mot de passe incorrect.");
        email = data;
      }
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw new Error("Identifiant ou mot de passe incorrect.");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const onKey = (e) => { if (e.key === "Enter") submit(); };
  if (mode === "forgot") return <ForgotPassword initial={identifier} onBack={() => setMode("login")} />;

  return (
    <div onKeyDown={onKey} style={{ width: "100%", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}><div style={{ width: 48, height: 48, borderRadius: 13, background: "linear-gradient(135deg,var(--accent),var(--accent-2))", display: "grid", placeItems: "center", boxShadow: "0 8px 20px rgba(91,110,245,.35)" }}><I.Lock size={20} color="#fff" /></div></div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, textAlign: "center", margin: "0 0 4px" }}>Content de vous revoir</h1>
      <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 22px" }}>Connectez-vous à votre serveur.</p>
      <Field label="Identifiant ou email"><input autoFocus value={identifier} onChange={e => setIdentifier(e.target.value)} style={inputStyle} /></Field>
      <Field label="Mot de passe">
        <div style={{ position: "relative" }}>
          <input type={showPw ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} style={{ ...inputStyle, paddingRight: 40 }} />
          <button type="button" onClick={() => setShowPw(s => !s)} style={eyeBtn}>{showPw ? <I.EyeOff size={16} /> : <I.Eye size={16} />}</button>
        </div>
      </Field>
      {err && <div style={{ display: "flex", gap: 8, alignItems: "center", color: "#FF9A8F", fontSize: 13, margin: "4px 0 14px" }}><I.Alert size={14} /> {err}</div>}
      <div style={{ textAlign: "right", margin: "-6px 0 12px" }}><button type="button" onClick={() => setMode("forgot")} style={{ background: "none", border: "none", color: "var(--accent-2)", fontSize: 12.5, cursor: "pointer", padding: 0 }}>Mot de passe oublié ?</button></div>
      <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Connexion…" : "Se connecter"}</button>
      <OrDivider />
      <GoogleButton label="Continuer avec Google" onError={setErr} />
    </div>
  );
}

/* ---------------- Création de compte : nouveau serveur ou rejoindre ---------------- */
function Signup({ notify }) {
  const [step, setStep] = useState("choose"); // choose | create | join | done-pending
  const [serverName, setServerName] = useState("");
  const [joinCode, setJoinCode] = useState("");
  const [username, setUsername] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const doSignupCore = async () => {
    const EXISTS = "Cette adresse a déjà un compte Le Carnet. Connectez-vous avec, puis ouvrez « Mes serveurs » (menu Plus sur téléphone) pour créer un autre serveur ou en rejoindre un : vous gardez le même compte.";
    const { data, error } = await supabase.auth.signUp({ email: email.trim(), password });
    if (error) throw new Error(/already|registered|exists/i.test(error.message) ? EXISTS : error.message);
    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error(EXISTS);
    let session = data.session;
    if (!session) {
      // Confirmation email activée côté Supabase : on tente une connexion directe
      // (fonctionne si la confirmation est désactivée malgré tout).
      const r = await supabase.auth.signInWithPassword({ email: email.trim(), password });
      if (r.error) throw new Error("Vérifiez votre boîte mail pour confirmer votre compte, puis revenez vous connecter.");
      session = r.data.session;
    }
    return session;
  };

  const createServer = async () => {
    if (!serverName.trim() || !username.trim() || !displayName.trim() || !email.trim() || !password) return;
    setBusy(true); setErr("");
    try {
      const session = await doSignupCore();
      const { data: server, error: sErr } = await supabase.from('servers').insert({ name: serverName.trim(), owner_id: session.user.id }).select().single();
      if (sErr) throw sErr;
      const { error: pErr } = await supabase.from('profiles').insert({
        id: session.user.id, server_id: server.id, username: username.trim(), email: email.trim(),
        display_name: displayName.trim(), color: "#9B7EF5",
      });
      if (pErr) throw pErr;
      notify("Votre serveur est prêt !");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const joinServer = async () => {
    if (!joinCode.trim() || !username.trim() || !displayName.trim() || !email.trim() || !password) return;
    setBusy(true); setErr("");
    try {
      const session = await doSignupCore();
      const { data: found, error: sErr } = await supabase.rpc('server_for_code', { p_code: joinCode });
      const server = Array.isArray(found) ? found[0] : found;
      if (sErr || !server) throw new Error("Code d'invitation introuvable.");
      const { error: pErr } = await supabase.from('profiles').insert({
        id: session.user.id, server_id: server.id, username: username.trim(), email: email.trim(),
        display_name: displayName.trim(), color: "#5B9EF5",
      });
      if (pErr) throw pErr;
      setStep("done-pending");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const cardStyle = { width: "100%", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "30px 28px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" };

  if (step === "choose") {
    return (
      <div style={cardStyle}>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, textAlign: "center", margin: "0 0 4px" }}>Créer un compte</h1>
        <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13, margin: "0 0 22px" }}>Chaque serveur est un espace totalement séparé.</p>
        <GoogleButton label="S'inscrire avec Google" onError={setErr} />
        {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginTop: 10 }}>{err}</div>}
        <OrDivider />
        <button onClick={() => setStep("create")} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 11, padding: "14px 16px", marginBottom: 10, cursor: "pointer" }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: "linear-gradient(135deg,var(--admin),#B08CFA)", display: "grid", placeItems: "center", flexShrink: 0 }}><I.Shield size={17} color="#fff" /></div>
          <div><div style={{ fontWeight: 600, fontSize: 14, color: "var(--text)" }}>Créer un nouveau serveur</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Vous en serez l'administrateur</div></div>
        </button>
        <button onClick={() => setStep("join")} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 11, padding: "14px 16px", cursor: "pointer" }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: "linear-gradient(135deg,var(--accent),var(--accent-2))", display: "grid", placeItems: "center", flexShrink: 0 }}><I.UserPlus size={17} color="#fff" /></div>
          <div><div style={{ fontWeight: 600, fontSize: 14, color: "var(--text)" }}>Rejoindre un serveur existant</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Avec un code d'invitation</div></div>
        </button>
      </div>
    );
  }

  if (step === "done-pending") {
    return (
      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><I.Check size={34} color="#5FBF8B" /></div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 20, textAlign: "center", margin: "0 0 8px" }}>Demande envoyée</h1>
        <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6 }}>L'administrateur de ce serveur doit approuver votre demande. Vous pouvez patienter sur cette page, ou revenir plus tard en vous connectant.</p>
      </div>
    );
  }

  const isCreate = step === "create";
  return (
    <div style={cardStyle}>
      <button onClick={() => { setStep("choose"); setErr(""); }} style={{ background: "none", border: "none", color: "var(--text-dimmer)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 14 }}>← Retour</button>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 19, margin: "0 0 18px" }}>{isCreate ? "Nouveau serveur" : "Rejoindre un serveur"}</h1>
      {isCreate
        ? <Field label="Nom du serveur"><input value={serverName} onChange={e => setServerName(e.target.value)} placeholder="ex. Famille Borget" style={inputStyle} /></Field>
        : <Field label="Code d'invitation"><input value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="ex. a1b2c3d4" style={inputStyle} /></Field>}
      <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
      <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
      <Field label="Email"><input type="email" value={email} onChange={e => setEmail(e.target.value)} style={inputStyle} /></Field>
      <Field label="Mot de passe"><input type="password" value={password} onChange={e => setPassword(e.target.value)} style={inputStyle} /></Field>
      {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>}
      <button type="button" onClick={isCreate ? createServer : joinServer} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>
        {busy ? "…" : isCreate ? "Créer le serveur" : "Envoyer la demande"}
      </button>
    </div>
  );
}

function useLiveTable(table, setRows, shape) {
  const loadRef = useRef(null);
  useEffect(() => {
    let alive = true;
    const load = () => {
      let q = supabase.from(table).select('*');
      if (shape) q = shape(q);
      q.then(({ data }) => { if (alive) setRows(data || []); });
    };
    loadRef.current = load;
    load();
    const ch = supabase.channel(table + '-live').on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
    return () => { alive = false; supabase.removeChannel(ch); };
  }, []);
  return () => loadRef.current && loadRef.current();
}

function Workspace({ me, session, onLogout, notify, onProfileChanged }) {

  const [attendees, setAttendees] = useState([]);

  const [inviteFromUrl] = useState(() => { try { const t = new URLSearchParams(window.location.search).get("invite"); return t && t.length >= 20 ? t : ""; } catch (_) { return ""; } });
  const [taskFromUrl] = useState(() => { try { return new URLSearchParams(window.location.search).get("task") || ""; } catch (_) { return ""; } });
  const [tasksReady, setTasksReady] = useState(false);
  // Messages non lus : on retient, par conversation, la date du dernier message lu (propre à cet appareil)
  const readKey = "carnet-read-" + me.id;
  const [readMap, setReadMap] = useState(() => { try { const v = JSON.parse(localStorage.getItem(readKey) || "null"); if (v && v.init) return v; } catch (_) {} return { init: new Date().toISOString() }; });
  useEffect(() => { try { localStorage.setItem(readKey, JSON.stringify(readMap)); } catch (_) {} }, [readMap]);
  const markRead = (key, ts) => setReadMap(prev => ((prev[key] || prev.init) >= ts ? prev : { ...prev, [key]: ts }));
  const [showServers, setShowServers] = useState(Boolean(inviteFromUrl));
  useEffect(() => { if (inviteFromUrl) { try { window.history.replaceState({}, "", window.location.pathname); } catch (_) {} } }, []);
  const [serverName, setServerName] = useState("");
  useEffect(() => { supabase.from('servers').select('name').eq('id', me.server_id).maybeSingle().then(({ data }) => setServerName((data && data.name) || "")); }, [me.server_id]);
  const [, setClock] = useState(0);
  const [openId, setOpenId] = useState(null);
  const myPerms = useMemo(() => effectivePerms(me), [me]);
  const isAdmin = me.role === "admin";

  useLiveTable('profiles', setAccounts);
  useLiveTable('tasks', (rows) => { setTasksAll(rows); setTasksReady(true); });
  useLiveTable('task_comments', setComments);
  useLiveTable('messages', setMessages);
  useLiveTable('channel_messages', setChannelMsgs, q => q.order('ts', { ascending: false }).limit(300));
  const reloadAttachments = useLiveTable('task_attachments', setAttachments);
  useLiveTable('task_templates', setTemplates);
  const reloadVotes = useLiveTable('poll_votes', setPollVotes);
  useLiveTable('leave_requests', setLeaves);
  useLiveTable('meetings', setMeetings);
  useLiveTable('meeting_attendees', setAttendees);
  useLiveTable('team_events', setTeamEvents);
  useLiveTable('reactions', setReactions);
  useLiveTable('projects', setProjects);
  useLiveTable('project_members', setProjectMembers);
  const reloadMeetingFiles = useLiveTable('meeting_attachments', setMeetingFiles);
  useLiveTable('message_attachments', setMessageFiles);
  useLiveTable('announcements', setAnnouncements);
  useLiveTable('time_entries', setTimeEntries);
  useLiveTable('notes', setNotes);
  useEffect(() => { const id = setInterval(() => setClock(c => c + 1), 60000); return () => clearInterval(id); }, []);

  useEffect(() => { if (tab === "admin" && !isAdmin) setTab("home"); }, [tab, isAdmin]);
  const tasks = useMemo(() => tasksAll.filter(t => !t.deleted_at), [tasksAll]);
  const trashed = useMemo(() => tasksAll.filter(t => t.deleted_at).sort((a, b) => b.deleted_at.localeCompare(a.deleted_at)), [tasksAll]);
  const people = useMemo(() => accounts.filter(a => a.status !== "pending"), [accounts]);
  const unread = useMemo(() => {
    const lr = (k) => readMap[k] || readMap.init, u = {};
    for (const m of channelMsgs) if (m.from_id !== me.id && m.ts > lr("channel")) u.channel = (u.channel || 0) + 1;
    for (const m of messages) if (m.to_id === me.id && m.ts > lr(m.from_id)) u[m.from_id] = (u[m.from_id] || 0) + 1;
    return u;
  }, [messages, channelMsgs, readMap, me.id]);
  const unreadTotal = Object.values(unread).reduce((n, x) => n + x, 0);
  const openTask = openId ? tasks.find(t => t.id === openId) : null;
  // Lien direct vers une tâche (?task=…) : ouvre la tâche, ou explique pourquoi elle est introuvable
  useEffect(() => {
    if (!taskFromUrl || !tasksReady) return;
    try { window.history.replaceState({}, "", window.location.pathname); } catch (_) {}
    if (tasksAll.some(t => t.id === taskFromUrl && !t.deleted_at)) setOpenId(taskFromUrl);
    else notify("Cette tâche est introuvable dans ce serveur. Elle est peut-être dans un autre de vos serveurs (« Mes serveurs »), ou elle a été supprimée.", "err");
  }, [tasksReady]);

  const tabs = [
    { id: "home", label: "Accueil", icon: I.Home },
    { id: "tasks", label: "Tâches", icon: I.Check },
    { id: "calendar", label: "Calendrier", icon: I.Calendar },
    { id: "meetings", label: "Réunions", icon: I.Video, secondary: true },
    { id: "reports", label: "Rapports", icon: I.Chart, secondary: true },
    { id: "notes", label: "Notes", icon: I.Note, secondary: true },
    { id: "messages", label: "Messages", icon: I.Message },
    { id: "profile", label: "Profil", icon: I.User, secondary: true },
    ...(isAdmin ? [{ id: "admin", label: "Admin", icon: I.Shield, secondary: true }] : []),
  ];
  const [moreOpen, setMoreOpen] = useState(false);
  const goTab = (id) => { setMoreOpen(false); setTab(id); };
  const openFromAnywhere = (id) => setOpenId(id);
  useDesktopNotifications({ me, tasks, meetings, attendees, messages, channelMsgs, leaves, accounts: people });
  // Recherche globale : Ctrl+K (ou ⌘K), même dans un champ de saisie
  useEffect(() => {
    const h = (ev) => { if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key && ev.key.toLowerCase() === "k") { ev.preventDefault(); setShowPalette(v => !v); } };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);
  // Raccourcis clavier (ignorés quand on tape dans un champ ou qu'une fenêtre est ouverte)
  useEffect(() => {
    let gAt = 0;
    const h = (ev) => {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      const el = ev.target, tag = el && el.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (el && el.isContentEditable)) return;
      if (ev.key === "Escape") { setShowHelp(false); return; }
      if (ev.key === "?") { setShowHelp(v => !v); ev.preventDefault(); return; }
      if (document.querySelector(".modal-card")) return;
      const k = ev.key.toLowerCase();
      if (Date.now() - gAt < 1500) {
        const map = { h: "home", t: "tasks", c: "calendar", r: "meetings", s: "reports", n: "notes", m: "messages", p: "profile", a: "admin" };
        gAt = 0;
        if (map[k] && (k !== "a" || isAdmin)) { setTab(map[k]); ev.preventDefault(); }
        return;
      }
      if (k === "g") { gAt = Date.now(); return; }
      if (k === "n" && (isAdmin || myPerms.createTasks)) { window.__carnetNewTask = true; setTab("tasks"); setTimeout(() => window.dispatchEvent(new Event("carnet-new-task")), 60); ev.preventDefault(); }
      else if (k === "/") { setTab("tasks"); setTimeout(() => { const i = document.querySelector("input[data-search]"); if (i) i.focus(); }, 90); ev.preventDefault(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [isAdmin, myPerms.createTasks]);

  return (
    <div className="app-shell" style={{ position: "relative", zIndex: 1, display: "flex", minHeight: "100vh" }}>
      <aside className="paper app-sidebar" style={{ width: 236, flexShrink: 0, borderRight: "1px solid var(--border)", padding: "24px 16px", display: "flex", flexDirection: "column", gap: 18 }}>

/* ============================================================
   Agenda : heure de Paris, congés, horaires, conflits, appels vidéo
   ============================================================ */
const TZ = "Europe/Paris";
const _dtf = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
function parisParts(ms) { const o = {}; for (const p of _dtf.formatToParts(new Date(ms))) o[p.type] = p.value; return o; }
const parisDay = (ms = Date.now()) => { const p = parisParts(ms); return `${p.year}-${p.month}-${p.day}`; };
const parisHM = (ms) => { const p = parisParts(ms); return `${p.hour}:${p.minute}`; };
function parisInstant(day, hm = "00:00") {
  const [y, m, d] = day.split("-").map(Number); const [h, mi] = hm.slice(0, 5).split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const off = (ms) => { const p = parisParts(ms); return Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day), Number(p.hour), Number(p.minute), Number(p.second)) - ms; };
  const t = guess - off(guess);
  return guess - off(t);
}
const shiftDay = (day, n) => { const d = new Date(day + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const isoWd = (day) => { const w = new Date(day + "T12:00:00Z").getUTCDay(); return w === 0 ? 7 : w; };
const fmtDay = (day, opts) => new Date(day + "T12:00:00Z").toLocaleDateString("fr-FR", { timeZone: "UTC", ...(opts || { weekday: "long", day: "numeric", month: "long" }) });
const fmtHM = (ms) => parisHM(ms).replace(":", "h");
const fmtWhen = (m) => {
  const s = Date.parse(m.starts_at), e = Date.parse(m.ends_at);
  const ds = parisDay(s), de = parisDay(e);
  return ds === de ? `${fmtDay(ds)}, ${fmtHM(s)} – ${fmtHM(e)}` : `${fmtDay(ds)} ${fmtHM(s)} → ${fmtDay(de)} ${fmtHM(e)}`;
};
const fmtLeave = (l) => (l.start_date === l.end_date ? fmtDay(l.start_date) : `du ${fmtDay(l.start_date, { day: "numeric", month: "long" })} au ${fmtDay(l.end_date, { day: "numeric", month: "long", year: "numeric" })}`);
const JITSI = "https://meet.jit.si/LeCarnet-";
const callLink = (room) => JITSI + room;
/** Lien d'appel d'une réunion : lien personnalisé (Meet, Zoom, Teams…) sinon appel Jitsi du Carnet. */
const customCallUrl = (m) => (m && typeof m.call_url === "string" && /^https:\/\/\S+$/.test(m.call_url) ? m.call_url : "");
const meetLink = (m) => customCallUrl(m) || callLink(m.room);
const meetJoin = (m, name) => customCallUrl(m) || joinLink(m.room, name);
const joinLink = (room, name) => JITSI + room + (name ? "#userInfo.displayName=" + encodeURIComponent('"' + name + '"') : "");
const copyText = async (text) => { try { await navigator.clipboard.writeText(text); return true; } catch (_) { return false; } };

function outsideHoursC(wh, s, e) {
  if (!wh) return false;
  const point = e <= s; let cur = s;
  for (let g = 0; g < 14 && (cur < e || (point && g === 0)); g++) {
    const day = parisDay(cur); const next = parisInstant(shiftDay(day, 1));
    const segEnd = point ? cur : Math.min(e, next);
    const ranges = wh[String(isoWd(day))] || [];
    if (!ranges.some(([a, b]) => parisInstant(day, a) <= cur && segEnd <= parisInstant(day, b))) return true;
    cur = next;
  }
  return false;
}
/** Raisons pour lesquelles `user` n'est pas disponible. busy : lignes de busy_for pour cette personne. */
function conflictsC({ s, e, user, busy = [], tasks = [], allDay = false, ignoreTaskId = null }) {
  const out = []; const point = e <= s;
  const ov = (b) => (point ? Date.parse(b.starts_at) <= s && s < Date.parse(b.ends_at) : s < Date.parse(b.ends_at) && e > Date.parse(b.starts_at));
  if (allDay) {
    const day = parisDay(s); const d0 = parisInstant(day), d1 = parisInstant(shiftDay(day, 1));
    if (busy.some(b => b.kind === "leave" && d0 < Date.parse(b.ends_at) && d1 > Date.parse(b.starts_at))) out.push({ kind: "leave" });
    return out;
  }
  if (busy.some(b => b.kind === "leave" && ov(b))) out.push({ kind: "leave" });
  else if (outsideHoursC(user && user.work_hours, s, e)) out.push({ kind: "hours" });
  if (busy.some(b => b.kind === "meeting" && ov(b))) out.push({ kind: "meeting" });
  if (busy.some(b => b.kind === "google" && ov(b))) out.push({ kind: "google" });
  if (point) {
    const same = tasks.find(t => t.id !== ignoreTaskId && !t.done && t.due && t.due_time && assigneeIds(t).includes(user.id) && Math.abs(parisInstant(t.due, t.due_time) - s) < 60000);
    if (same) out.push({ kind: "task", label: same.title });
  }
  return out;
}
const reasonLine = (r, name, you) => {
  const who = you ? "Vous" : name;
  switch (r.kind) {
    case "leave": return you ? "Vous êtes en congé à cette date" : `${name} est en congé à cette date`;
    case "hours": return you ? "C'est en dehors de vos horaires de disponibilité" : `C'est en dehors des horaires de ${name}`;
    case "meeting": return `${who} ${you ? "as" : "a"} déjà une réunion à ce moment-là`;
    case "google": return you ? "Votre agenda externe est occupé à ce moment-là" : `L'agenda externe de ${name} est occupé à ce moment-là`;
    case "task": return `${who} ${you ? "as" : "a"} déjà une tâche à la même heure (« ${r.label} »)`;
    default: return "";
  }
};
/** Créneaux occupés (rpc busy_for) d'un groupe de personnes sur une période. */
function useBusy(userIds, fromMs, toMs, ignoreMeetingId) {
  const [rows, setRows] = useState([]);
  const key = JSON.stringify([[...userIds].sort(), fromMs, toMs, ignoreMeetingId || null]);
  useEffect(() => {
    if (!userIds.length || !fromMs || !toMs) { setRows([]); return; }
    let alive = true;
    const t = setTimeout(() => {
      supabase.rpc("busy_for", { p_users: userIds, p_from: new Date(fromMs).toISOString(), p_to: new Date(toMs).toISOString(), p_ignore_meeting: ignoreMeetingId || null })
        .then(({ data, error }) => { if (alive) setRows(error ? [] : (data || [])); });
    }, 250);
    return () => { alive = false; clearTimeout(t); };
  }, [key]);
  return rows;
}
function ConflictBox({ lines }) {

function Badge({ s }) { const [l, c] = statusBadge(s); return <span style={{ fontSize: 11.5, fontWeight: 700, color: c, background: c + "22", borderRadius: 10, padding: "2px 9px", whiteSpace: "nowrap" }}>{l}</span>; }
const dateInputs = (a, setA, b, setB, min) => (

/* ---------------- Profil : mes congés ---------------- */
function LeaveCard({ me, session, isAdmin, leaves, notify, card }) {
  const today = parisDay();
  const [start, setStart] = useState(""); const [end, setEnd] = useState(""); const [reason, setReason] = useState(""); const [busy, setBusy] = useState(false);
  const mine = leaves.filter(l => l.user_id === me.id && (l.end_date >= today || l.status === "pending")).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const submit = async () => {
    if (busy) return;
    if (!start) { notify("Choisissez le premier jour.", "err"); return; }
    const last = end || start;
    if (last < start) { notify("La date de fin est avant le début.", "err"); return; }
    setBusy(true);
    const { data, error } = await supabase.from("leave_requests").insert({ server_id: me.server_id, user_id: me.id, start_date: start, end_date: last, reason: reason.trim().slice(0, 300), status: "pending" }).select().single();
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    if (data) callApi("/api/notify-leave", { action: "request", id: data.id }, session).catch(() => {});
    setStart(""); setEnd(""); setReason("");
    notify("Demande envoyée à l'administrateur.");
  };
  const cancel = async (l) => { const { error } = await supabase.from("leave_requests").delete().eq("id", l.id); notify(error ? error.message : "Demande retirée.", error ? "err" : "ok"); };
  return (
    <div style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>🌴 Mes congés</div>
      {isAdmin ? (
        <p style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.55, margin: 0 }}>Vous êtes l'administrateur : posez les congés (les vôtres et ceux des autres) dans <strong>Admin → Congés</strong>. Ils sont acceptés tout de suite.</p>
      ) : (<>
        <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 12px", lineHeight: 1.5 }}>Demandez des jours de congé à l'administrateur. Une fois acceptés, on ne vous prévient plus par email pour vos tâches, et les autres voient que vous êtes absent(e).</p>
        {dateInputs(start, setStart, end, setEnd, today)}
        <Field label="Motif (optionnel)"><input value={reason} onChange={e => setReason(e.target.value)} maxLength={300} placeholder="Vacances, rendez-vous médical…" style={inputStyle} /></Field>
        <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, padding: "10px 22px", opacity: busy ? 0.6 : 1 }}>{busy ? "Envoi…" : "Envoyer la demande"}</button>
      </>)}
      {mine.length > 0 && (
        <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
          {mine.map(l => (
            <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", background: "var(--bg)", borderRadius: 10, padding: "9px 12px", fontSize: 13.5 }}>
              <div style={{ flex: 1, minWidth: 160 }}><div style={{ fontWeight: 600 }}>{fmtLeave(l)}</div>{(l.reason || l.admin_note) && <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>{l.reason}{l.admin_note ? ` · Réponse : ${l.admin_note}` : ""}</div>}</div>
              <Badge s={l.status} />
              {l.status === "pending" && !isAdmin && <button type="button" onClick={() => cancel(l)} style={{ ...secondaryBtn, width: "auto", padding: "4px 10px", fontSize: 12 }}>Retirer</button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const WEEKDAYS = [[1, "Lundi"], [2, "Mardi"], [3, "Mercredi"], [4, "Jeudi"], [5, "Vendredi"], [6, "Samedi"], [7, "Dimanche"]];
function HoursCard({ me, session, notify, onChanged, card }) {
  const [wh, setWh] = useState(me.work_hours || null);
  const [busy, setBusy] = useState(false);
  const saved = JSON.stringify(me.work_hours || null);
  const dirty = JSON.stringify(wh) !== saved;
  const setDay = (k, ranges) => setWh(w => { const n = { ...(w || {}) }; if (ranges) n[k] = ranges; else delete n[k]; return n; });
  const toMin = (s) => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  const problem = () => {
    for (const [k, ranges] of Object.entries(wh || {})) {
      let prev = -1;
      for (const [a, b] of ranges) { if (!a || !b || toMin(b) <= toMin(a)) return "L'heure de fin doit être après l'heure de début."; if (toMin(a) < prev) return "Les deux plages d'une même journée ne doivent pas se chevaucher."; prev = toMin(b); }
    }
    return null;
  };
  const save = async () => {
    const p = problem(); if (p) { notify(p, "err"); return; }
    setBusy(true);
    try { await callApi("/api/manage-account", { action: "update-self", patch: { work_hours: wh && Object.keys(wh).length ? wh : null } }, session); notify("Horaires enregistrés."); onChanged(); }
    catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const enable = () => setWh({ 1: [["09:00", "18:00"]], 2: [["09:00", "18:00"]], 3: [["09:00", "18:00"]], 4: [["09:00", "18:00"]], 5: [["09:00", "18:00"]] });
  const timeIn = (v, on, label) => <input type="time" value={v} onChange={e => on(e.target.value)} aria-label={label} style={{ ...inputStyle, width: 112, padding: "7px 8px" }} />;
  return (
    <div style={card}>

                </label>

                    {timeIn(r[0], v => setDay(k, ranges.map((x, j) => j === i ? [v, x[1]] : x)), `${name} début ${i + 1}`)}–{timeIn(r[1], v => setDay(k, ranges.map((x, j) => j === i ? [x[0], v] : x)), `${name} fin ${i + 1}`)}
                  </span>
                ))}
                {on && ranges.length === 1 && <button type="button" onClick={() => setDay(k, [[ranges[0][0], "12:00"], ["14:00", ranges[0][1] > "14:00" ? ranges[0][1] : "18:00"]])} style={{ ...chipBtn, fontSize: 12 }}>+ pause</button>}
                {on && ranges.length === 2 && <button type="button" onClick={() => setDay(k, [[ranges[0][0], ranges[1][1]]])} style={{ ...chipBtn, fontSize: 12 }}>Retirer la pause</button>}
              </div>
            );
          })}
        </div>
      )}
      <button type="button" onClick={save} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "10px 22px", marginTop: 14, opacity: busy || !dirty ? 0.5 : 1 }}>{busy ? "Enregistrement…" : "Enregistrer mes horaires"}</button>
    </div>
  );
}

          <button type="button" disabled={busy} onClick={() => run({ action: "disconnect" }, () => "Agenda déconnecté.")} style={{ ...secondaryBtn, width: "auto", padding: "8px 16px", color: "#FF9A8F", borderColor: "#6A3532" }}>Déconnecter</button>

        <button type="button" disabled={busy || !url.trim()} onClick={() => run({ action: "connect", url: url.trim() }, r => `Agenda connecté : ${r.slots} créneau(x) occupé(s).`)} style={{ ...primaryBtn, padding: "10px 22px", opacity: busy || !url.trim() ? 0.5 : 1 }}>{busy ? "Connexion…" : "Connecter mon agenda"}</button>
        <details style={{ marginTop: 14, fontSize: 13, color: "var(--text-dim)", lineHeight: 1.6 }}>
          <summary style={{ cursor: "pointer", color: "var(--accent-2)", fontWeight: 600 }}>Où trouver ce lien dans Google Agenda ?</summary>

/* ---------------- Réunions ---------------- */
const RECUR = { daily: "chaque jour", weekly: "chaque semaine", biweekly: "toutes les deux semaines", monthly: "chaque mois" };
const MAX_OCC = 52;
/** Jours (AAAA-MM-JJ) des occurrences d'une série, du premier jour jusqu'au jour de fin inclus ; au plus 52. */
function occurrenceDays(start, rule, until) {
  const out = [];
  if (!start || !until || !RECUR[rule] || until < start) return start ? [start] : [];
  const [y0, m0, d0] = start.split("-").map(Number);
  for (let k = 0; out.length < MAX_OCC; k++) {
    let day;
    if (rule === "monthly") {
      const t = (m0 - 1) + k, y = y0 + Math.floor(t / 12), m = (t % 12) + 1;
      const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
      if (d0 > last) { if (y > Number(until.slice(0, 4)) + 1) break; continue; }   // pas de 31 en avril : on saute ce mois
      day = `${y}-${String(m).padStart(2, "0")}-${String(d0).padStart(2, "0")}`;
    } else day = shiftDay(start, k * (rule === "daily" ? 1 : rule === "weekly" ? 7 : 14));
    if (day > until) break;
    out.push(day);
  }
  return out;
}
const daysBetween = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const RESP = { accepted: ["✓", "#5FBF8B", "a accepté"], declined: ["✗", "#FF6B5E", "a refusé"], invited: ["?", "#9098A8", "n'a pas répondu"] };
function MeetingForm({ meetings = [], template = null, fileCount = 0, initial, me, accounts, attendees, leaves, tasks, onCancel, onSaved, session, notify }) {
  const src = initial || template;   // « Dupliquer » : on part d'une réunion existante, comme nouvelle réunion (une semaine plus tard)
  const startInit = src ? Date.parse(src.starts_at) : null;
  const day0 = () => (initial ? parisDay(startInit) : template ? dupDay() : shiftDay(parisDay(), 1));
  const dupDay = () => { const d = shiftDay(parisDay(startInit), 7), t = shiftDay(parisDay(), 1); return d < t ? t : d; };
  const [title, setTitle] = useState(src?.title || "");
  const [notes, setNotes] = useState(src?.notes || "");
  const [day, setDay] = useState(initial ? parisDay(startInit) : template ? dupDay() : shiftDay(parisDay(), 1));
  const [from, setFrom] = useState(src ? parisHM(startInit) : "10:00");
  const [to, setTo] = useState(src ? parisHM(Date.parse(src.ends_at)) : "11:00");
  const [people, setPeople] = useState(() => src ? attendees.filter(a => a.meeting_id === src.id && a.user_id !== me.id).map(a => a.user_id) : []);
  const [busy, setBusy] = useState(false);
  const [repeat, setRepeat] = useState("");                       // "" = pas de répétition (nouvelle réunion seulement)
  const [until, setUntil] = useState(() => shiftDay(day0(), 90));
  const [applyTo, setApplyTo] = useState("one");                  // modification d'une série : "one" | "following"
  const [pendingFiles, setPendingFiles] = useState([]);
  const [callUrlText, setCallUrlText] = useState(src?.call_url || "");
  const callUrlOk = !callUrlText.trim() || /^https:\/\/\S+$/.test(callUrlText.trim());
  const others = accounts.filter(a => a.id !== me.id);
  const s = day && from ? parisInstant(day, from) : 0, e = day && to ? parisInstant(day, to) : 0;
  const valid = s && e > s && e - s <= 12 * 3600e3;
  const ids = [me.id, ...people];
  const occDays = !initial && repeat ? occurrenceDays(day, repeat, until) : [];
  const repeatOk = !repeat || (occDays.length >= 2 && until <= shiftDay(day, 366));
  const inSeries = Boolean(initial && initial.series_id);
  const busyRows = useBusy(valid ? ids : [], s, e, initial && initial.id);
  const lines = useMemo(() => {
    if (!valid) return [];
    const out = [];
    for (const id of ids) {
      const u = accounts.find(a => a.id === id); if (!u) continue;
      const reasons = conflictsC({ s, e, user: u, busy: busyRows.filter(b => b.user_id === id) });
      for (const r of reasons) out.push(reasonLine(r, u.display_name, id === me.id));
    }
    return out;
  }, [valid, s, e, busyRows, JSON.stringify(ids)]);
  const toggle = (id) => setPeople(l => l.includes(id) ? l.filter(x => x !== id) : [...l, id]);
  const changeFrom = (v) => { // garde la même durée
    if (from && to && v) { const dur = Math.max(15, (Number(to.slice(0, 2)) * 60 + Number(to.slice(3))) - (Number(from.slice(0, 2)) * 60 + Number(from.slice(3)))); const m = Math.min(23 * 60 + 59, Number(v.slice(0, 2)) * 60 + Number(v.slice(3)) + dur); setTo(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0")); }
    setFrom(v);
  };
  const save = async () => {
    if (busy) return;
    if (!title.trim()) { notify("Donnez un titre à la réunion.", "err"); return; }
    if (!valid) { notify(e <= s ? "L'heure de fin doit être après le début." : "Une réunion dure 12 heures au maximum.", "err"); return; }
    if (!repeatOk) { notify(occDays.length < 2 ? "La date de fin de répétition doit permettre au moins deux réunions." : "Une série ne peut pas dépasser un an.", "err"); return; }
    if (!callUrlOk || callUrlText.trim().length > 300) { notify("Le lien d'appel doit commencer par https:// (et faire 300 caractères au maximum).", "err"); return; }
    setBusy(true);
    try {
      const row = { title: title.trim().slice(0, 120), notes: notes.trim().slice(0, 1000), call_url: callUrlText.trim() || null, starts_at: new Date(s).toISOString(), ends_at: new Date(e).toISOString() };
      let id, seriesScope = false;
      if (initial) {
        id = initial.id;
        // Cette réunion seulement, ou celle-ci et les suivantes de la série (même titre, notes, lien, participants ; horaires décalés d'autant)
        const targets = inSeries && applyTo === "following"
          ? meetings.filter(x => x.series_id === initial.series_id && x.starts_at >= initial.starts_at).sort((a, b) => a.starts_at.localeCompare(b.starts_at))
          : [initial];
        seriesScope = targets.length > 1;
        const shift = daysBetween(parisDay(startInit), day);
        for (const t of targets) {
          const rowT = t.id === initial.id ? row : { ...row, starts_at: new Date(parisInstant(shiftDay(parisDay(Date.parse(t.starts_at)), shift), from)).toISOString(), ends_at: new Date(parisInstant(shiftDay(parisDay(Date.parse(t.starts_at)), shift), to)).toISOString() };
          const { error } = await supabase.from("meetings").update(rowT).eq("id", t.id);
          if (error) throw new Error(error.message);
          const old = attendees.filter(a => a.meeting_id === t.id && a.user_id !== me.id).map(a => a.user_id);
          const moved = t.starts_at !== rowT.starts_at || t.ends_at !== rowT.ends_at;
          const removed = moved ? old : old.filter(x => !people.includes(x));
          const added = moved ? people : people.filter(x => !old.includes(x));
          for (const uid_ of removed) await supabase.from("meeting_attendees").delete().eq("meeting_id", t.id).eq("user_id", uid_);
          if (added.length) { const { error: e2 } = await supabase.from("meeting_attendees").insert(added.map(u => ({ meeting_id: t.id, user_id: u }))); if (e2) throw new Error(e2.message); }
        }
      } else if (occDays.length > 1) {
        // Série : chaque occurrence est une vraie réunion (même salon d'appel, même identifiant de série)
        const series_id = crypto.randomUUID ? crypto.randomUUID() : null;
        if (!series_id) throw new Error("Ce navigateur ne permet pas de créer une série.");
        const room = uid() + uid() + uid();
        const rows = occDays.map(d => ({ ...row, starts_at: new Date(parisInstant(d, from)).toISOString(), ends_at: new Date(parisInstant(d, to)).toISOString(), room, series_id, recurrence: repeat, recurrence_until: until, server_id: me.server_id, created_by: me.id }));
        const { data, error } = await supabase.from("meetings").insert(rows).select();
        if (error) throw new Error(error.message);
        const first = data.slice().sort((a, b) => a.starts_at.localeCompare(b.starts_at))[0];
        id = first.id; seriesScope = true;
        const { error: e2 } = await supabase.from("meeting_attendees").insert(data.flatMap(m => [{ meeting_id: m.id, user_id: me.id, response: "accepted" }, ...people.map(u => ({ meeting_id: m.id, user_id: u }))]));
        if (e2) throw new Error(e2.message);
      } else {
        const { data, error } = await supabase.from("meetings").insert({ ...row, server_id: me.server_id, created_by: me.id }).select().single();
        if (error) throw new Error(error.message);
        id = data.id;
        const { error: e2 } = await supabase.from("meeting_attendees").insert([{ meeting_id: id, user_id: me.id, response: "accepted" }, ...people.map(u => ({ meeting_id: id, user_id: u }))]);
        if (e2) throw new Error(e2.message);
      }
      // La réunion est enregistrée : la fenêtre se ferme tout de suite ; fichiers et e-mails partent ensuite, en arrière-plan.
      notify(initial ? (seriesScope ? "Réunions mises à jour." : "Réunion mise à jour.") : seriesScope ? `Série créée : ${occDays.length} réunions.` : "Réunion créée.");
      onSaved();
      const filesToSend = pendingFiles, wasEdit = Boolean(initial), hasGuests = people.length > 0;
      (async () => {
        if (filesToSend.length) {
          const n = await uploadAttachments(filesToSend, { me, folder: "reunions/" + id, table: "meeting_attachments", extra: { meeting_id: id }, existing: fileCount, noun: "réunion", notify });
          if (n < filesToSend.length) notify("Réunion enregistrée, mais certains fichiers n'ont pas pu être joints.", "err");
        }
        if (hasGuests || wasEdit) {
          try {
            const r = await callApi("/api/notify-meeting", { action: wasEdit ? "update" : "invite", meetingId: id, scope: seriesScope ? "series" : "one" }, session);
            const sent = r.sent || 0, conflicts = r.conflicts || 0;
            if (sent || conflicts) notify((sent ? `${sent} e-mail(s) envoyé(s)` : "") + (sent && conflicts ? " · " : "") + (conflicts ? `${conflicts} conflit(s) signalé(s)` : "") + ".");
          } catch (_) {}
        }
      })();
    } catch (err) { notify(err.message, "err"); }
    setBusy(false);
  };
  return (
    <div style={overlayStyle} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) onCancel(); }}>
      <div className="modal-card" style={{ ...modalStyle, width: 500, maxHeight: "92vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier la réunion" : "Nouvelle réunion"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }} aria-label="Fermer"><I.X size={18} /></button></div>
        <Field label="Titre"><input autoFocus value={title} onChange={ev => setTitle(ev.target.value)} maxLength={120} style={inputStyle} aria-label="Titre de la réunion" /></Field>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <div style={{ flex: "2 1 150px" }}><Field label="Jour"><input type="date" value={day} onChange={ev => setDay(ev.target.value)} style={inputStyle} aria-label="Jour de la réunion" /></Field></div>
          <div style={{ flex: "1 1 100px" }}><Field label="Début"><input type="time" value={from} onChange={ev => changeFrom(ev.target.value)} style={inputStyle} aria-label="Heure de début" /></Field></div>
          <div style={{ flex: "1 1 100px" }}><Field label="Fin"><input type="time" value={to} onChange={ev => setTo(ev.target.value)} style={inputStyle} aria-label="Heure de fin" /></Field></div>
        </div>
        <div style={{ fontSize: 11.5, color: "var(--text-dimmer)", margin: "-8px 0 14px" }}>Heure de Paris.</div>
        {!initial && (
          <div data-repeat-block style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 14 }}>
            <div style={{ flex: "1 1 200px" }}><Field label="Répétition"><select data-repeat value={repeat} onChange={ev => setRepeat(ev.target.value)} style={inputStyle} aria-label="Répétition de la réunion"><option value="">Ne pas répéter</option>{Object.entries(RECUR).map(([k, v]) => <option key={k} value={k}>{v[0].toUpperCase() + v.slice(1)}</option>)}</select></Field></div>
            {repeat && <div style={{ flex: "1 1 150px" }}><Field label="Jusqu'au"><input data-repeat-until type="date" value={until} min={day} max={shiftDay(day, 366)} onChange={ev => setUntil(ev.target.value)} style={inputStyle} aria-label="Fin de la répétition" /></Field></div>}
            {repeat && <div data-repeat-count style={{ flex: "1 1 100%", fontSize: 12.5, color: repeatOk ? "var(--text-dim)" : "var(--danger, #c0392b)", marginTop: -6 }}>{!repeatOk ? "Choisissez une date de fin qui permette au moins deux réunions (un an maximum)." : `${occDays.length} réunion${occDays.length > 1 ? "s" : ""} seront créées${occDays.length >= MAX_OCC ? " (52 au maximum)" : ""}, la dernière le ${occDays[occDays.length - 1].split("-").reverse().join("/")}. Les invités reçoivent un seul e-mail.`}</div>}
          </div>
        )}
        {inSeries && (
          <div data-apply-to role="radiogroup" aria-label="Portée de la modification" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
            <span style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 500, width: "100%" }}>🔁 Cette réunion fait partie d'une série ({RECUR[initial.recurrence]})</span>
            <button type="button" role="radio" aria-checked={applyTo === "one"} data-apply="one" onClick={() => setApplyTo("one")} style={{ ...chipBtn, borderColor: applyTo === "one" ? "var(--accent, #5B9EF5)" : undefined }}>Cette réunion seulement</button>
            <button type="button" role="radio" aria-checked={applyTo === "following"} data-apply="following" onClick={() => setApplyTo("following")} style={{ ...chipBtn, borderColor: applyTo === "following" ? "var(--accent, #5B9EF5)" : undefined }}>Celle-ci et les suivantes</button>
          </div>
        )}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Participants {people.length ? `(${people.length})` : ""}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {others.length === 0 && <span style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Personne d'autre sur le serveur pour l'instant.</span>}
            {others.map(a => { const on = people.includes(a.id); return (

            ); })}
          </div>

      </div>
    </div>
  );
}

function MeetingFiles({ m, me, canManage, items, notify, onChanged }) {
  const fileRef = useRef(null), camRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const canAdd = me.role !== "guest";
  const upload = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length || uploading) return;
    setUploading(true);
    let count = items.length;
    for (const f0 of files) {
      const f = await shrinkImage(f0);
      if (count >= MAX_FILES_PER_TASK) { notify(`Maximum ${MAX_FILES_PER_TASK} fichiers par réunion.`, "err"); break; }
      if (f.size > MAX_FILE_BYTES) { notify(`« ${f.name} » dépasse 5 Mo.`, "err"); continue; }
      const safe = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80) || "fichier";
      const path = `${me.server_id}/reunions/${m.id}/${uid()}-${safe}`;
      const up = await supabase.storage.from('task-files').upload(path, f, { contentType: f.type || undefined, upsert: false });
      if (up.error) { notify(up.error.message, "err"); continue; }
      const { error } = await supabase.from('meeting_attachments').insert({ meeting_id: m.id, server_id: me.server_id, uploader_id: me.id, path, filename: f.name, size: f.size, mime: f.type || null });
      if (error) { await supabase.storage.from('task-files').remove([path]); notify(error.message, "err"); continue; }
      count++;
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = "";
    if (camRef.current) camRef.current.value = "";
    onChanged();
  };
  const remove = async (att) => {
    const { error } = await supabase.from('meeting_attachments').delete().eq('id', att.id);
    if (error) { notify(error.message, "err"); return; }
    await supabase.storage.from('task-files').remove([att.path]);
    onChanged();
  };
  return (
    <div data-meeting-files style={{ marginTop: 10, background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 10, padding: "12px 14px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600 }}>Pièces jointes · {items.length}</div>
        {canAdd && (<>
          <input ref={fileRef} type="file" multiple onChange={e => upload(e.target.files)} style={{ display: "none" }} />
          <input ref={camRef} type="file" accept="image/*" capture="environment" aria-label="Prendre une photo" onChange={e => upload(e.target.files)} style={{ display: "none" }} />
          <span style={{ display: "inline-flex", gap: 6 }}>
            <button type="button" onClick={() => camRef.current && camRef.current.click()} disabled={uploading} style={{ ...secondaryBtn, width: "auto", padding: "5px 11px", fontSize: 12, opacity: uploading ? 0.6 : 1 }}>📷 Photo</button>
            <button type="button" onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading} style={{ ...secondaryBtn, width: "auto", padding: "5px 11px", fontSize: 12, display: "flex", alignItems: "center", gap: 6, opacity: uploading ? 0.6 : 1 }}><I.Paperclip size={12} /> {uploading ? "Envoi…" : "Ajouter"}</button>
          </span>
        </>)}
      </div>
      {items.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>{canAdd ? "Aucun fichier. Ordre du jour, présentation, photo du tableau… (5 Mo max chacun)" : "Aucun fichier."}</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {items.map(a => <AttachmentRow key={a.id} att={a} notify={notify} canDelete={a.uploader_id === me.id || canManage} onDelete={() => remove(a)} />)}
      </div>
    </div>
  );
}

        <button type="button" onClick={() => setShowPast(v => !v)} style={{ ...chipBtn, marginTop: 20 }}>{showPast ? "Masquer" : "Voir"} les réunions passées ({past.length})</button>

  );

const THEME_KEY = "carnet-theme";
function getThemeMode() { try { const v = localStorage.getItem(THEME_KEY); return v === "light" || v === "dark" ? v : "auto"; } catch (_) { return "auto"; } }
function applyTheme(mode) {
  let t = mode;
  if (t !== "light" && t !== "dark") t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
}
const isLeapY = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
/** Événements d'équipe et anniversaires d'un jour (iso = AAAA-MM-JJ). */
function dayExtras(iso, events = [], accounts = []) {
  const md = iso.slice(5), y = Number(iso.slice(0, 4));
  return {
    events: events.filter(e => e.start_date <= iso && e.end_date >= iso),
    birthdays: accounts.filter(a => a.status !== "pending" && a.birthday && (a.birthday === md || (a.birthday === "02-29" && md === "02-28" && !isLeapY(y)))),
  };
}

/* ---------------- Profil : anniversaire + apparence ---------------- */
const MONTHS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MONTH_DAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function PersonalCard({ me, session, notify, onChanged, card }) {
  const [mode, setMode] = useState(getThemeMode());
  const [mm, setMm] = useState(me.birthday ? Number(me.birthday.slice(0, 2)) : 0);
  const [dd, setDd] = useState(me.birthday ? Number(me.birthday.slice(3)) : 0);
  const [busy, setBusy] = useState(false);
  const pick = (m) => { setMode(m); try { localStorage.setItem(THEME_KEY, m); } catch (_) {} applyTheme(m); };
  const value = mm && dd ? String(mm).padStart(2, "0") + "-" + String(dd).padStart(2, "0") : "";
  const dirty = value !== (me.birthday || "");
  const save = async () => {
    if (busy) return;
    if ((mm && !dd) || (!mm && dd)) { notify("Choisissez le jour et le mois.", "err"); return; }
    setBusy(true);
    try { await callApi("/api/manage-account", { action: "update-self", patch: { birthday: value } }, session); notify(value ? "Anniversaire enregistré." : "Anniversaire effacé."); onChanged(); }
    catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const sel = { ...inputStyle, width: "auto", minWidth: 110 };
  return (
    <div style={card} data-testid="personal-card">
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Apparence</div>
      <div style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 10 }}>Valable sur cet appareil.</div>
      <div role="group" aria-label="Thème" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 22 }}>
        {[["auto", "🖥️ Automatique"], ["dark", "🌙 Sombre"], ["light", "☀️ Clair"]].map(([k, l]) => (
          <button key={k} type="button" aria-pressed={mode === k} onClick={() => pick(k)} style={{ ...chipBtn, borderColor: mode === k ? "var(--accent)" : undefined, color: mode === k ? "var(--text)" : undefined, fontWeight: mode === k ? 600 : 500 }}>{l}</button>
        ))}
      </div>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>Mon anniversaire</div>
      <div style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 10 }}>Facultatif : il s'affiche dans le calendrier de votre équipe (jour et mois, jamais l'année).</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <select aria-label="Jour de naissance" value={dd} onChange={e => setDd(Number(e.target.value))} style={sel}><option value={0}>Jour</option>{Array.from({ length: mm ? MONTH_DAYS[mm - 1] : 31 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}</option>)}</select>
        <select aria-label="Mois de naissance" value={mm} onChange={e => { const v = Number(e.target.value); setMm(v); if (v && dd > MONTH_DAYS[v - 1]) setDd(0); }} style={sel}><option value={0}>Mois</option>{MONTHS_FR.map((n, i) => <option key={n} value={i + 1}>{n}</option>)}</select>
        <button type="button" onClick={save} disabled={busy || !dirty} style={{ ...primaryBtn, padding: "10px 20px", opacity: busy || !dirty ? 0.5 : 1 }}>{busy ? "…" : "Enregistrer"}</button>
        {me.birthday && <button type="button" onClick={() => { setMm(0); setDd(0); }} style={chipBtn}>Effacer</button>}
      </div>
      <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginTop: 16 }}>Astuce : appuyez sur <kbd style={{ background: "var(--bg-2)", border: "1px solid var(--border-soft)", borderRadius: 5, padding: "1px 6px", fontFamily: "inherit" }}>?</kbd> n'importe où pour voir les raccourcis clavier.</div>
    </div>
  );
}
