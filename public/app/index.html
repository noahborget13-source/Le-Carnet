/** Bouton 📎 de la messagerie : ouvre le sélecteur de fichiers. */
function MsgAttachButton({ onPick }) {
  const ref = useRef(null);
  return (<>
    <input ref={ref} data-msg-input type="file" multiple onChange={e => { onPick(Array.from(e.target.files || [])); e.target.value = ""; }} style={{ display: "none" }} />
    <button type="button" data-msg-attach onClick={() => ref.current && ref.current.click()} title="Joindre un fichier ou une photo (5 Mo max)" aria-label="Joindre un fichier" style={{ ...iconBtn, padding: "0 12px" }}>📎</button>
  </>);
}
function MessagesView({ unread = {}, markRead = () => {}, messageFiles = [], me, session, isAdmin, myPerms, accounts, messages, channelMsgs, pollVotes, reloadVotes, notify, reactions = [] }) {
  const contacts = useMemo(() => accounts.filter(a => a.id !== me.id), [accounts, me.id]);
  const [activeId, setActiveId] = useState("channel");
  const [draft, setDraft] = useState("");
  const [open, setOpen] = useState(false);          // mobile : conversation ouverte en plein écran
  const [showPoll, setShowPoll] = useState(false);
  const [pending, setPending] = useState([]);
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);
  const filesOf = (kind, id) => messageFiles.filter(a => (kind === "channel" ? a.channel_message_id : a.message_id) === id);
  const isChannel = activeId === "channel";
  useEffect(() => { document.body.classList.toggle("chat-open", open); return () => document.body.classList.remove("chat-open"); }, [open]);
  const pick = (id) => { setActiveId(id); setOpen(true); };
  const canSend = isAdmin || myPerms.sendMessages;
  const thread = messages.filter(m => (m.from_id === me.id && m.to_id === activeId) || (m.from_id === activeId && m.to_id === me.id)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const channel = useMemo(() => [...channelMsgs].sort((a, b) => new Date(a.ts) - new Date(b.ts)), [channelMsgs]);
  const shownLen = isChannel ? channel.length : thread.length;
  useEffect(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }, [shownLen, activeId, open]);
  const lastMsgFor = (id) => messages.filter(m => (m.from_id === me.id && m.to_id === id) || (m.from_id === id && m.to_id === me.id)).sort((a, b) => new Date(b.ts) - new Date(a.ts))[0];
  const lastChannel = channel[channel.length - 1];
  // La conversation ouverte (sur mobile : seulement une fois ouverte) est lue dès que son dernier message est affiché
  const latestTs = isChannel ? (lastChannel && lastChannel.ts) : (thread.length && thread[thread.length - 1].ts);
  useEffect(() => {
    const visible = open || (window.matchMedia && window.matchMedia("(min-width: 821px)").matches);
    if (visible && latestTs && !document.hidden) markRead(activeId, latestTs);
  }, [activeId, latestTs, open]);

  const send = async () => {
    const typed = draft.trim();
    if ((!typed && !pending.length) || !canSend || sending) return;
    const files = pending;
    const text = typed || (files.length === 1 ? "📎 " + files[0].name : `📎 ${files.length} fichiers`).slice(0, 200);
    setDraft(""); setPending([]); setSending(true);
    const sendFiles = async (id) => {
      if (!files.length) return;
      const n = await uploadAttachments(files, { me, folder: "messages/" + id, table: "message_attachments", extra: isChannel ? { channel_message_id: id } : { message_id: id }, max: 10, noun: "message", notify });
      if (n < files.length) notify(n ? "Message envoyé, mais certains fichiers n'ont pas pu être joints." : "Message envoyé, mais les fichiers n'ont pas pu être joints.", "err");
    };
    if (isChannel) {
      const { data, error } = await supabase.from('channel_messages').insert({ server_id: me.server_id, from_id: me.id, text: text.slice(0, 2000) }).select().single();
      if (error) { notify(error.message, "err"); setDraft(typed); setPending(files); setSending(false); return; }
      if (data) await sendFiles(data.id);
      if (data && text.includes("@")) notifyMention('channel', data.id, session);
    } else {
      const { data, error } = await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text, server_id: me.server_id }).select().single();
      if (error) { notify(error.message, "err"); setDraft(typed); setPending(files); setSending(false); return; }
      if (data) await sendFiles(data.id);
      if (data) callApi('/api/notify-dm', { messageId: data.id }, session).catch(() => {});
    }
    setSending(false);
  };
  const startCall = async () => {
    if (!canSend || (!isChannel && !activeUser)) return;
    const url = callLink("msg" + uid() + uid() + uid());
    const text = `📞 ${me.display_name} lance un appel vidéo : ${url}`;
    const { error } = isChannel
      ? await supabase.from('channel_messages').insert({ server_id: me.server_id, from_id: me.id, text })
      : await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text, server_id: me.server_id });
    if (error) { notify(error.message, "err"); return; }
    window.open(joinLink(url.slice(JITSI.length), me.display_name), "_blank", "noopener,noreferrer");
  };
  const sendPoll = async ({ question, options, multiple }) => {
    const text = ("📊 " + question).slice(0, 2000);
    const poll = { question, options, multiple, closed: false };
    const { error } = isChannel
      ? await supabase.from('channel_messages').insert({ server_id: me.server_id, from_id: me.id, text, poll })
      : await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text, server_id: me.server_id, poll });
    if (error) { notify(error.message, "err"); return false; }
    setShowPoll(false);
    return true;
  };
  const votesFor = (kind, id) => (pollVotes || []).filter(v => v.msg_kind === kind && v.msg_id === id);
  const delChannel = async (id) => {
    const paths = filesOf('channel', id).map(a => a.path);
    const { error } = await supabase.from('channel_messages').delete().eq('id', id);
    if (error) { notify(error.message, "err"); return; }
    if (paths.length) await supabase.storage.from('task-files').remove(paths);
  };
  const activeUser = accounts.find(a => a.id === activeId);
  const fmt = (ts) => new Date(ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const listBtn = (selected) => ({ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "12px 14px", background: selected ? "var(--panel-2)" : "transparent", border: "none", borderBottom: "1px solid #21252d", cursor: "pointer", textAlign: "left" });

  return (
    <div>
      <h1 className="chat-title" style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: "0 0 20px" }}>Messagerie</h1>
      {showPoll && <PollForm onCancel={() => setShowPoll(false)} onSubmit={sendPoll} />}
      <div className={"chat-wrap" + (open ? " is-open" : "")} style={{ display: "flex", height: "calc(100vh - 150px)", border: "1px solid var(--border)", borderRadius: 14, overflow: "hidden" }}>
        <div className="paper chat-list" style={{ width: 250, flexShrink: 0, borderRight: "1px solid var(--border)", overflowY: "auto" }}>
          <button onClick={() => pick("channel")} style={listBtn(isChannel)}>
            <div style={{ width: 32, height: 32, borderRadius: 10, background: "color-mix(in srgb, var(--accent) 15%, transparent)", color: "var(--accent-2)", display: "grid", placeItems: "center", flexShrink: 0 }}><I.Hash size={16} /></div>
            <div style={{ minWidth: 0, flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)", display: "flex", alignItems: "center", gap: 6 }}>Général{unread.channel > 0 && !isChannel && <span data-unread-conv style={{ background: "#FF6B5E", color: "#fff", borderRadius: 10, fontSize: 10.5, fontWeight: 700, padding: "0 6px" }}>{unread.channel}</span>}</div><div style={{ fontSize: 11.5, color: "var(--text-dimmer)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{lastChannel ? lastChannel.text : "Salon de tout le serveur"}</div></div>
          </button>
          {contacts.map(u => { const last = lastMsgFor(u.id); return (
            <button key={u.id} onClick={() => pick(u.id)} style={listBtn(activeId === u.id)}>
              <Avatar user={u} size={32} />
              <div style={{ minWidth: 0, flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)", display: "flex", alignItems: "center", gap: 6 }}>{u.display_name}{unread[u.id] > 0 && activeId !== u.id && <span data-unread-conv style={{ background: "#FF6B5E", color: "#fff", borderRadius: 10, fontSize: 10.5, fontWeight: 700, padding: "0 6px" }}>{unread[u.id]}</span>}</div><div style={{ fontSize: 11.5, color: "var(--text-dimmer)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last ? last.text : "Aucun message"}</div></div>
            </button>
          );})}
        </div>
        <div className="chat-pane" style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, minHeight: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px", borderBottom: "1px solid var(--border)" }}>
            <button type="button" className="show-mobile" onClick={() => setOpen(false)} style={{ ...iconBtn, border: "none", padding: "4px 8px 4px 0", transform: "rotate(90deg)" }} aria-label="Retour aux conversations"><I.Chevron size={20} /></button>
            {isChannel ? (<><I.Hash size={18} color="var(--accent-2)" /><span style={{ fontWeight: 600, fontSize: 14 }}>Général</span><span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>· tout le serveur</span></>)
              : activeUser ? (<><Avatar user={activeUser} size={28} /><span style={{ fontWeight: 600, fontSize: 14 }}>{activeUser.display_name}</span></>) : null}
          </div>
          <div ref={scrollRef} style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: isChannel ? 12 : 8 }}>
            {isChannel ? (<>
              {channel.length === 0 && <EmptyState text="Aucun message dans le salon. Lancez la discussion !" />}
              {channel.map(m => {
                const author = accounts.find(a => a.id === m.from_id);
                const mentionsMe = new RegExp("(^|[^A-Za-z0-9._-])@" + (me.username || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z0-9_-])", "i").test(m.text);
                return (
                  <div key={m.id} style={{ display: "flex", gap: 10, padding: mentionsMe ? "6px 8px" : 0, margin: mentionsMe ? "0 -8px" : 0, background: mentionsMe ? "color-mix(in srgb, var(--accent) 8%, transparent)" : "transparent", borderRadius: 8 }}>
                    <Avatar user={author} size={30} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}><strong style={{ color: "var(--text)", fontSize: 13 }}>{author ? author.display_name : "Ancien membre"}</strong> · {fmt(m.ts)}</div>
                      {m.poll
                        ? <PollCard kind="channel" msg={m} me={me} isAdmin={isAdmin} accounts={accounts} votes={votesFor("channel", m.id)} onChanged={reloadVotes} notify={notify} />
                        : <div style={{ fontSize: 13.5, whiteSpace: "pre-wrap", wordBreak: "break-word" }}><RichText text={m.text} accounts={accounts} /></div>}
                      <MessageFiles items={filesOf("channel", m.id)} me={me} isAdmin={isAdmin} notify={notify} />
                      <ReactionBar kind="channel" targetId={m.id} reactions={reactions} me={me} accounts={accounts} notify={notify} />
                    </div>
                    {(m.from_id === me.id || isAdmin) && <button type="button" onClick={() => delChannel(m.id)} title="Supprimer" style={{ ...iconBtn, padding: 4, alignSelf: "flex-start", border: "none", color: "var(--text-dimmer)" }}><I.Trash size={13} /></button>}
                  </div>
                );
              })}
            </>) : activeUser ? (<>
              {thread.length === 0 && <EmptyState text="Aucun message. Dites bonjour !" />}
              {thread.map(m => m.poll ? (<div key={m.id} style={{ alignSelf: m.from_id === me.id ? "flex-end" : "flex-start", width: "min(400px, 94%)" }}><div style={{ fontSize: 10.5, color: "var(--text-dimmer)", margin: "0 0 3px 4px", textAlign: m.from_id === me.id ? "right" : "left" }}>{fmt(m.ts)}</div><PollCard kind="dm" msg={m} me={me} isAdmin={isAdmin} accounts={accounts} votes={votesFor("dm", m.id)} onChanged={reloadVotes} notify={notify} /></div>) : (<div key={m.id} style={{ alignSelf: m.from_id === me.id ? "flex-end" : "flex-start", maxWidth: "70%", background: m.from_id === me.id ? "var(--accent)" : "var(--panel-2)", color: m.from_id === me.id ? "#fff" : "var(--text)", padding: "9px 13px", borderRadius: 12, borderBottomRightRadius: m.from_id === me.id ? 3 : 12, borderBottomLeftRadius: m.from_id === me.id ? 12 : 3, fontSize: 13.5, wordBreak: "break-word" }}><RichText text={m.text} accounts={accounts} /><MessageFiles items={filesOf("dm", m.id)} me={me} isAdmin={isAdmin} notify={notify} /><div style={{ fontSize: 10, opacity: 0.6, marginTop: 3 }}>{fmt(m.ts)}</div></div>))}
            </>) : <EmptyState text="Choisissez une conversation." />}
          </div>
          {pending.length > 0 && <div data-msg-pending style={{ padding: "8px 14px 0", borderTop: "1px solid var(--border)", flexShrink: 0 }}><PendingFiles files={pending} setFiles={setPending} max={10} compact /></div>}
          <div style={{ display: "flex", gap: 10, padding: 14, borderTop: pending.length ? "none" : "1px solid var(--border)", flexShrink: 0 }}>
            {isChannel
              ? <MentionInput value={draft} onChange={setDraft} onSubmit={send} disabled={!canSend} people={contacts} placeholder={canSend ? "Écrire dans le salon… (@ pour mentionner)" : "Votre rôle ne permet pas d'envoyer de messages"} style={{ ...inputStyle, background: "var(--bg)", opacity: canSend ? 1 : 0.5 }} />
              : <input value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => { if (e.key === "Enter") send(); }} disabled={!canSend || !activeUser} placeholder={canSend ? "Écrire un message…" : "Votre rôle ne permet pas d'envoyer de messages"} style={{ ...inputStyle, flex: 1, background: "var(--bg)", opacity: canSend ? 1 : 0.5 }} />}
            {canSend && (isChannel || activeUser) && <MsgAttachButton onPick={(list) => setPending(p => [...p, ...list].slice(0, 10))} />}
            {canSend && (isChannel || activeUser) && <button type="button" onClick={startCall} title="Lancer un appel vidéo" aria-label="Lancer un appel vidéo" style={{ ...iconBtn, padding: "0 12px" }}><I.Video size={16} /></button>}
            {canSend && (isChannel || activeUser) && <button type="button" onClick={() => setShowPoll(true)} title="Créer un sondage" aria-label="Créer un sondage" style={{ ...iconBtn, padding: "0 12px" }}><I.Poll size={16} /></button>}
            <button type="button" onClick={send} disabled={!canSend} style={{ background: "var(--accent)", border: "none", color: "#fff", borderRadius: 9, padding: "0 16px", cursor: canSend ? "pointer" : "not-allowed", opacity: canSend ? 1 : 0.5, display: "grid", placeItems: "center" }}><I.Send size={16} /></button>
          </div>
        </div>
      </div>
    </div>
  );
}

   ============================================================ */

/* ---------------- Journal d'activité ---------------- */
const ACTIVITY_TEXT = {
  "task.create": "a créé la tâche", "task.update": "a modifié la tâche", "task.done": "a terminé la tâche", "task.reopen": "a rouvert la tâche",
  "task.trash": "a mis à la corbeille", "task.restore": "a restauré", "task.delete": "a supprimé définitivement",
  "member.join": "a rejoint le serveur", "member.request": "a demandé à rejoindre le serveur", "member.approve": "a approuvé", "member.reject": "a refusé la demande de",
  "member.remove": "a retiré du serveur", "member.role": "a changé le rôle :", "mail.sent": "a envoyé un email", "leave.request": "a demandé un congé", "leave.approve": "a accepté un congé :", "leave.refuse": "a refusé un congé :", "server.rename": "a renommé le serveur en", "server.code": "a renouvelé le code d'invitation",
};
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 48 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
};
const adminBox = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 16px", marginBottom: 20 };
/* ---------------- Aperçu : chiffres clés, activité, points à surveiller ---------------- */
/* ---------------- Membres : demandes, invitations, comptes ---------------- */
/* ---------------- Réglages : serveur + état des emails ---------------- */
/* ---------------- Écrire aux membres (administrateur du serveur) ---------------- */
/* ---------------- Site : annonces (réservé à l'administrateur du site) ---------------- */
/* ---------------- Administration : onglets ---------------- */
function AdminView() {
  // L'administration est un site à part : « Le Carnet — Espace Administrateur » (même connexion).
  useEffect(() => { const id = setTimeout(() => { try { window.location.assign("/admin/"); } catch (_) {} }, 400); return () => clearTimeout(id); }, []);
  return (
    <div data-admin-redirect style={{ maxWidth: 520, margin: "40px auto", textAlign: "center", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 16, padding: "32px 28px" }}>
      <div style={{ fontSize: 34, marginBottom: 6 }}>🛡️</div>
      <h1 style={{ fontFamily: "Literata, serif", fontSize: 22, margin: "0 0 8px" }}>Espace Administrateur</h1>
      <p style={{ color: "var(--text-dim)", fontSize: 13.5, lineHeight: 1.6, margin: "0 0 20px" }}>L'administration se trouve désormais sur un site dédié, avec la même connexion. Vous y êtes redirigé…</p>
      <a href="/admin/" data-admin-link style={{ ...primaryBtn, display: "inline-block", width: "auto", textDecoration: "none", padding: "10px 22px" }}>Ouvrir l'Espace Administrateur</a>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
}
