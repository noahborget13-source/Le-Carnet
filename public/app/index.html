const csvCell = (v) => { const t = String(v ?? ""); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
function buildTasksCsv(tasks, accounts, projects) {
  const head = ["Titre", "Statut", "Priorité", "Échéance", "Heure", "Assignés", "Projet", "Étiquettes", "Récurrence", "Notes", "Sous-tâches faites", "Créée le"];
  const rows = tasks.map(t => {
    const who = assigneeIds(t).map(id => (accounts.find(a => a.id === id) || {}).display_name).filter(Boolean).join(", ");
    const proj = (projects.find(p => p.id === t.project_id) || {}).name || "";
    const subs = t.subtasks || [];
    return [t.title, t.done ? "Terminée" : t.doing ? "En cours" : "À faire", (PRIORITIES.find(p => p.id === t.priority) || {}).label || "", t.due || "", t.due_time ? hhmm(t.due_time) : "", who, proj, [t.label, ...(t.tags || [])].filter(Boolean).join(" "), t.recurrence ? ((RECURRENCES.find(r => r.value === t.recurrence) || {}).label || t.recurrence) : "", t.notes || "", subs.length ? `${subs.filter(x => x.done).length}/${subs.length}` : "", t.created_at ? parisDay(Date.parse(t.created_at)) : ""];
  });
  // Point-virgule + BOM : s'ouvre correctement dans Excel en français
  return "\ufeff" + [head, ...rows].map(r => r.map(csvCell).join(";")).join("\r\n") + "\r\n";
}
const icsEsc = (v) => String(v || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const icsFoldLine = (line) => { const out = []; let cur = line; while (cur.length > 73) { out.push(cur.slice(0, 73)); cur = " " + cur.slice(73); } out.push(cur); return out.join("\r\n"); };
const icsUtc = (ms) => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
function buildCalendarIcs({ me, tasks, meetings, attendees }) {
  const stamp = icsUtc(Date.now());
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Le Carnet//FR", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Le Carnet"];
  for (const m of meetings) {
    if (m.created_by !== me.id && !attendees.some(a => a.meeting_id === m.id && a.user_id === me.id)) continue;
    L.push("BEGIN:VEVENT", `UID:meeting-${m.id}@le-carnet`, `DTSTAMP:${stamp}`, `DTSTART:${icsUtc(Date.parse(m.starts_at))}`, `DTEND:${icsUtc(Date.parse(m.ends_at))}`, `SUMMARY:${icsEsc("📹 " + m.title)}`, `DESCRIPTION:${icsEsc((m.notes ? m.notes + "\n" : "") + "Appel : " + meetLink(m))}`, `URL:${meetLink(m)}`, "END:VEVENT");
  }
  for (const t of tasks) {
    if (t.done || !t.due || !assigneeIds(t).includes(me.id)) continue;
    L.push("BEGIN:VEVENT", `UID:task-${t.id}@le-carnet`, `DTSTAMP:${stamp}`);
    if (t.due_time) { const a = parisInstant(t.due, hhmm(t.due_time)); L.push(`DTSTART:${icsUtc(a)}`, `DTEND:${icsUtc(a + 30 * 60000)}`); }
    else L.push(`DTSTART;VALUE=DATE:${t.due.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${shiftDay(t.due, 1).replace(/-/g, "")}`);
    L.push(`SUMMARY:${icsEsc("☑ " + t.title)}`, ...(t.notes ? [`DESCRIPTION:${icsEsc(t.notes)}`] : []), "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFoldLine).join("\r\n") + "\r\n";
}
/* ---- Export Word (.docx) : fichier ZIP minimal écrit à la main, sans bibliothèque ---- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (bytes) => { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files) {

    parts.push(head, nameB, data);
    central.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), nameB);

const xmlEsc = (v) => String(v ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const docxCell = (w, lines, shade) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${shade}"/>` : ""}</w:tcPr>${(lines.length ? lines : [{ t: "" }]).map(l => `<w:p><w:pPr><w:spacing w:before="0" w:after="40"/></w:pPr><w:r><w:rPr>${l.b ? "<w:b/>" : ""}${l.color ? `<w:color w:val="${l.color}"/>` : ""}<w:sz w:val="${l.sz || 20}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(l.t)}</w:t></w:r></w:p>`).join("")}</w:tc>`;
function buildTasksDocx({ title, subtitle, tasks, accounts, projects }) {
  const cols = [["Tâche", 5200], ["Statut", 1300], ["Priorité", 1200], ["Échéance", 1900], ["Assignés", 2200], ["Projet", 1800]];
  const border = ["top", "left", "bottom", "right", "insideH", "insideV"].map(b => `<w:${b} w:val="single" w:sz="4" w:space="0" w:color="BFC5D2"/>`).join("");
  const head = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${cols.map(([n, w]) => docxCell(w, [{ t: n, b: true, sz: 20 }], "E8EBF5")).join("")}</w:tr>`;
  const rows = tasks.map(t => {

    const proj = (projects.find(p => p.id === t.project_id) || {}).name || "";
    const subs = t.subtasks || [];
    const main = [{ t: t.title, b: true }];
    if ((t.tags || []).length) main.push({ t: t.tags.map(x => "#" + x).join(" "), sz: 16, color: "6B7385" });
    if (t.notes) t.notes.split(/\r?\n/).slice(0, 12).forEach(l => main.push({ t: l, sz: 18, color: "444B5C" }));
    subs.forEach(x => main.push({ t: (x.done ? "☑ " : "☐ ") + x.text, sz: 18 }));
    const due = t.due ? formatDue(t.due, daysUntil(t.due)) + (t.due_time ? " · " + hhmm(t.due_time) : "") : "";
    const status = t.done ? "Terminée" : t.doing ? "En cours" : "À faire";

function downloadBlob(name, blob) {

}

}

function InstallCard({ card }) {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(n => n + 1); window.addEventListener('carnet-install-ready', f); return () => window.removeEventListener('carnet-install-ready', f); }, []);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const prompt = window.__installPrompt;
  const install = async () => {
    if (!prompt) return;
    prompt.prompt();
    try { await prompt.userChoice; } catch (_) {}
    window.__installPrompt = null; force(n => n + 1);
  };
  return (
    <div style={card}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}><I.Check size={16} /> Application</div>

const statusOf = (t) => t.done ? "done" : t.doing ? "doing" : "todo";
const COLUMNS = [
  { id: "todo", label: "À faire", hex: "#9098A8" },
  { id: "doing", label: "En cours", hex: "#FFB648" },
  { id: "done", label: "Terminé", hex: "#5FBF8B" },
];

function TasksView({ savedViews = [], me, session, isAdmin, myPerms, accounts, tasks, trashed, templates, comments, attachments, onOpen, notify, projects = [], projectMembers = [] }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showTrash, setShowTrash] = useState(false);
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("priority");
  const [filterLabel, setFilterLabel] = useState(null);
  const [filterDone, setFilterDone] = useState("open");
  const [filterMine, setFilterMine] = useState(false);
  const [filterProject, setFilterProject] = useState("");
  const [filterDue, setFilterDue] = useState("");
  const [showProjects, setShowProjects] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const canCreateProject = isAdmin || me.role === "moderator";
  const [view, setView] = useState(() => { try { const v = localStorage.getItem("carnet-view"); return v === "kanban" || v === "week" || v === "gantt" || v === "table" || v === "matrix" ? v : "list"; } catch (_) { return "list"; } });
  useEffect(() => {
    const f = () => { window.__carnetNewTask = false; if (isAdmin || myPerms.createTasks) { setEditing(null); setShowForm(true); } };
    if (window.__carnetNewTask) f();
    window.addEventListener("carnet-new-task", f);
    return () => window.removeEventListener("carnet-new-task", f);
  }, [isAdmin, myPerms.createTasks]);
  const changeView = (v) => { setView(v); if (v === "week") setFilterMine(true); try { localStorage.setItem("carnet-view", v); } catch (_) {} };
  const patchTask = async (t, patch) => { const { error } = await supabase.from("tasks").update(patch).eq("id", t.id); if (error) notify("Modification refusée : " + error.message, "err"); };
  const moveDue = async (t, day) => {
    const patch = day ? duePatch(t, day) : { due: null, due_time: null, start_date: null };
    const { error } = await supabase.from("tasks").update(patch).eq("id", t.id);
    notify(error ? "Vous n'avez pas le droit de modifier cette tâche." : (day ? `« ${t.title} » déplacée au ${fmtDay(day, { weekday: "long", day: "numeric", month: "long" })}.` : `« ${t.title} » n'a plus de date.`), error ? "err" : "ok");
  };

  const visible = useMemo(() => {
    let list = tasks.filter(t => {
      if (view === "list") {
        if (filterDone === "open" && t.done) return false;
        if (filterDone === "done" && !t.done) return false;
        if (filterDue === "none" && t.due) return false;
        if (filterDue && filterDue !== "none") {
          if (!t.due) return false;
          const d = daysUntil(t.due);
          if (filterDue === "late" && !(!t.done && dueInfo(t).late)) return false;
          if (filterDue === "today" && d !== 0) return false;
          if (filterDue === "week" && !(d >= 0 && d <= 7)) return false;
        }
      }
      if (filterLabel && t.label !== filterLabel) return false;
      if (filterMine && !assigneeIds(t).includes(me.id)) return false;
      if (filterProject === "none" ? t.project_id : (filterProject && t.project_id !== filterProject)) return false;
      if (query && ![t.title, t.notes || "", ...(t.tags || [])].join(" ").toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
    list.sort((a, b) => {
      if (sortBy === "priority") return b.priority - a.priority || dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "due") return dueKey(a).localeCompare(dueKey(b));
      if (sortBy === "title") return a.title.localeCompare(b.title, "fr");
      return 0;
    });
    return list;
  }, [tasks, query, sortBy, filterLabel, filterDone, filterMine, filterProject, filterDue, view, me.id]);

  const canEditTask = (t) => isAdmin || myPerms.editAnyTask || (t.created_by === me.id && myPerms.editOwnTask);
  const tellAssignees = async (taskId, userIds) => {
    if (!userIds.length) return 0;
    try { const r = await callApi('/api/notify-task', { taskId, userIds }, session); return r.sent || 0; }
    catch (_) { return 0; }
  };
  const saveTemplate = async (draft, name) => {
    const { error } = await supabase.from('task_templates').insert({
      server_id: me.server_id, created_by: me.id, name: name.slice(0, 80), title: draft.title, notes: draft.notes || "",
      label: draft.label, priority: draft.priority, tags: draft.tags || [], recurrence: draft.recurrence || null,
      subtasks: (draft.subtasks || []).map(x => ({ ...x, done: false })),
    });
    return error ? error.message : null;
  };
  const saveTask = async (draft) => {
    const { saveAsTemplate, __files = [], ...data } = draft;
    let taskId = data.id || null, toNotify = [], message;
    data.assignee = (data.assignees || [])[0] || null;
    if (data.id) {
      const { id, ...rest } = data;
      const { error } = await supabase.from('tasks').update(rest).eq('id', id);
      if (error) { notify(error.message, "err"); return; }
      toNotify = (rest.assignees || []).filter(x => x !== me.id && !(editing ? assigneeIds(editing) : []).includes(x));
      message = "Tâche mise à jour.";
    } else {
      const { data: created, error } = await supabase.from('tasks').insert({ ...data, done: false, created_by: me.id, server_id: me.server_id }).select().single();
      if (error) { notify(error.message, "err"); return; }
      taskId = created ? created.id : null;
      toNotify = created ? (data.assignees || []).filter(x => x !== me.id) : [];
      message = "Tâche créée.";
    }
    if (saveAsTemplate) {
      const err = await saveTemplate(data, saveAsTemplate);
      message += err ? " (Modèle non enregistré : " + err + ")" : " Modèle enregistré.";
    }
    // La tâche est enregistrée : la fenêtre se ferme tout de suite. Fichiers et e-mails partent ensuite, en arrière-plan.
    notify(message);
    setShowForm(false); setEditing(null);
    (async () => {
      if (__files.length && taskId) {
        const n = await uploadAttachments(__files, { me, folder: taskId, table: "task_attachments", extra: { task_id: taskId }, existing: attachments.filter(a => a.task_id === taskId).length, noun: "tâche", notify });
        if (n < __files.length) notify("Tâche enregistrée, mais certains fichiers n'ont pas pu être joints.", "err");
      }
      if (taskId && toNotify.length) {
        const sent = await tellAssignees(taskId, toNotify);
        if (sent) notify(sent === 1 ? "E-mail envoyé à la personne assignée." : `E-mails envoyés (${sent}).`);
      }
    })();
  };
  const deleteTemplate = async (id) => {
    const { error } = await supabase.from('task_templates').delete().eq('id', id);
    notify(error ? error.message : "Modèle supprimé.", error ? "err" : "ok");
  };

  const restoreTask = async (id) => {
    const { error } = await supabase.rpc('restore_task', { p_id: id });
    notify(error ? error.message : "Tâche restaurée.", error ? "err" : "ok");
  };
  const removeTask = async (t) => {
    const { error } = await supabase.rpc('trash_task', { p_id: t.id });
    if (error) { notify(error.message, "err"); return; }
    notify("Tâche placée dans la corbeille.", "ok", { label: "Annuler", onClick: () => restoreTask(t.id) });
  };
  const duplicateTask = async (t) => {
    const { data: created, error } = await supabase.from("tasks").insert({
      title: (t.title + " (copie)").slice(0, 200), notes: t.notes || "", label: t.label, priority: t.priority, due: t.due || null, due_time: t.due_time || null, start_date: t.start_date || null,
      assignees: assigneeIds(t), assignee: assigneeIds(t)[0] || null, tags: t.tags || [], subtasks: (t.subtasks || []).map(x => ({ ...x, id: uid(), done: false })),
      recurrence: t.recurrence || null, project_id: t.project_id || null, estimate_min: t.estimate_min || null, done: false, created_by: me.id, server_id: me.server_id,
    }).select().single();
    if (error) { notify(error.message, "err"); return; }
    notify("Tâche dupliquée.", "ok", created ? { label: "Annuler", onClick: async () => { await supabase.rpc("trash_task", { p_id: created.id }); } } : undefined);
  };
  const snoozeTask = async (t, kind) => {
    const day = snoozeTarget(kind);
    const { error } = await supabase.from("tasks").update(duePatch(t, day)).eq("id", t.id);
    if (error) { notify(error.message, "err"); return; }
    notify(`Tâche reportée au ${fmtDay(day, { weekday: "long", day: "numeric", month: "long" })}.`, "ok", { label: "Annuler", onClick: async () => { await supabase.from("tasks").update({ due: t.due || null, start_date: t.start_date || null }).eq("id", t.id); } });
  };
  const purgeTask = async (t) => {
    const paths = attachments.filter(a => a.task_id === t.id).map(a => a.path);
    const { error } = await supabase.from('tasks').delete().eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (paths.length) await supabase.storage.from('task-files').remove(paths);
    notify("Tâche supprimée définitivement.");
  };

  const spawnNext = async (t) => {
    const next = nextOccurrence(t.due, t.recurrence);
    const ids = assigneeIds(t);
    const { error } = await supabase.from('tasks').insert({
      title: t.title, notes: t.notes, label: t.label, priority: t.priority, due: next, start_date: t.start_date && t.due ? shiftDay(next, -daysBetween(t.start_date, t.due)) : null, due_time: t.due_time || null, assignee: ids[0] || null, assignees: ids,
      tags: t.tags || [], subtasks: (t.subtasks || []).map(x => ({ ...x, done: false })), recurrence: t.recurrence,
      done: false, created_by: t.created_by, server_id: me.server_id, project_id: t.project_id || null, estimate_min: t.estimate_min || null,
    });
    return { next, error };
  };
  const setStatus = async (t, status) => {
    if (statusOf(t) === status) return;
    const patch = status === "done" ? { done: true } : status === "doing" ? { done: false, doing: true } : { done: false, doing: false };
    const { error } = await supabase.from('tasks').update(patch).eq('id', t.id);
    if (error) { notify(error.message, "err"); return; }
    if (status === "done" && !t.done && t.recurrence) {
      const { next, error: e2 } = await spawnNext(t);
      notify(e2 ? "Terminée, mais la prochaine occurrence n'a pas pu être créée." : `Terminée · prochaine échéance : ${formatDue(next, daysUntil(next))}.`, e2 ? "err" : "ok");
    }
  };
  const byId = useMemo(() => new Map(tasks.map(t => [t.id, t])), [tasks]);
  const openBlockers = (t) => (t.blocked_by || []).map(id => byId.get(id)).filter(x => x && !x.done);

  // ---- Sélection multiple (vue Liste) : terminer, reporter ou supprimer plusieurs tâches d'un coup
  const [selectMode, setSelectMode] = useState(false);

          <div style={{ display: "flex", gap: 10, justifyContent: "space-between", marginTop: 12, flexWrap: "wrap" }}>

            <button type="button" data-import-next disabled={!text.trim()} onClick={() => readText(text)} style={{ ...primaryBtn, opacity: text.trim() ? 1 : 0.5 }}>Continuer</button>
          </div>
        </div>)}
        {step === "map" && (<div>
          <p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "0 0 12px" }}>{body.length} ligne{body.length > 1 ? "s" : ""} détectée{body.length > 1 ? "s" : ""}. Indiquez quelle colonne correspond à quelle information. Seul le titre est obligatoire.</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))", gap: "0 14px" }}>
            {IMPORT_FIELDS.map(f => (<Field key={f.id} label={f.label + (f.required ? " (obligatoire)" : "")}><select data-map={f.id} value={map[f.id] ?? -1} onChange={e => setMap(m => ({ ...m, [f.id]: Number(e.target.value) }))} style={inputStyle}><option value={-1}>— Ne pas importer —</option>{header.map((h, i) => <option key={i} value={i}>{String(h).trim() || "Colonne " + (i + 1)}</option>)}</select></Field>))}
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "space-between", marginTop: 6 }}>
            <button type="button" onClick={() => setStep("source")} style={secondaryBtn}>Retour</button>
            <button type="button" data-import-preview disabled={!(map.title >= 0)} onClick={() => setStep("preview")} style={{ ...primaryBtn, opacity: map.title >= 0 ? 1 : 0.5 }}>Vérifier</button>

        {step === "preview" && (<div>
          <p data-import-summary style={{ fontSize: 14, margin: "0 0 10px" }}><strong>{good.length}</strong> tâche{good.length > 1 ? "s" : ""} prête{good.length > 1 ? "s" : ""} à importer{warned ? ` (dont ${warned} avec une remarque)` : ""}{bad ? <span style={{ color: "var(--late)" }}> · {bad} ligne{bad > 1 ? "s" : ""} ignorée{bad > 1 ? "s" : ""}</span> : null}.</p>

              <tbody>{results.slice(0, 100).map((r, i) => (<tr key={i} data-import-row={r.task ? (r.warnings.length ? "warn" : "ok") : "error"} style={{ borderTop: "1px solid var(--border-soft)", opacity: r.task ? 1 : 0.8 }}>
                <td style={{ padding: "6px 10px", color: "var(--text-dimmer)" }}>{i + 2}</td>

                <td>{r.task && r.task.due ? fmtDay(r.task.due, { day: "numeric", month: "short", year: "numeric" }) + (r.task.due_time ? " " + r.task.due_time : "") : ""}</td>
                <td>{r.task ? (PRIORITIES.find(p => p.id === r.task.priority) || {}).label : ""}</td>
                <td style={{ color: r.task ? "#FFB648" : "var(--late)", paddingRight: 10 }}>{r.task ? r.warnings.join(" ; ") : "Ignorée : " + r.error}</td>
              </tr>))}</tbody>
            </table>
          </div>
          {results.length > 100 && <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 6 }}>Aperçu limité aux 100 premières lignes ; toutes seront importées.</div>}
          <div style={{ display: "flex", gap: 10, justifyContent: "space-between", marginTop: 14 }}>
            <button type="button" onClick={() => setStep("map")} disabled={busy} style={secondaryBtn}>Retour</button>
            <button type="button" data-import-run disabled={busy || !good.length} onClick={run} style={{ ...primaryBtn, opacity: good.length ? 1 : 0.5 }}>{busy ? `Import… ${progress}/${good.length}` : `Importer ${good.length} tâche${good.length > 1 ? "s" : ""}`}</button>
          </div>
        </div>)}
      </div>
    </div>
  );
}

const TBL_CELL = { padding: "4px 6px", verticalAlign: "middle" };
const TBL_FIELD = { ...inputStyle, padding: "6px 8px", fontSize: 13, background: "transparent", borderColor: "transparent" };
function TableRow({ t, ed, projects, accounts, onOpen, onMove, onPatch, onMoveDue }) {
    const [title, setTitle] = useState(t.title);
    useEffect(() => { setTitle(t.title); }, [t.title]);
    const commitTitle = () => { const v = title.trim(); if (!v) { setTitle(t.title); return; } if (v !== t.title) onPatch(t, { title: v.slice(0, 200) }); };
    return (
      <tr data-trow={t.title} style={{ borderTop: "1px solid var(--border-soft)", opacity: t.done ? 0.7 : 1 }}>
        <td style={TBL_CELL}><input type="checkbox" data-trow-done checked={t.done} disabled={!ed} onChange={() => onMove(t, t.done ? "todo" : "done")} aria-label={"Terminée : " + t.title} style={{ accentColor: "var(--accent)", width: 16, height: 16 }} /></td>
        <td style={{ ...TBL_CELL, minWidth: 200 }}><div style={{ display: "flex", alignItems: "center", gap: 4 }}><input data-cell-title value={title} disabled={!ed} onChange={e => setTitle(e.target.value)} onBlur={commitTitle} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { setTitle(t.title); e.target.blur(); } }} style={{ ...TBL_FIELD, textDecoration: t.done ? "line-through" : "none", fontWeight: 600 }} /><button type="button" data-trow-open onClick={() => onOpen(t.id)} title="Ouvrir la tâche" style={{ ...iconBtn, border: "none", fontSize: 12 }}>↗</button></div></td>
        <td style={TBL_CELL}><select data-cell-status value={statusOf(t)} disabled={!ed} onChange={e => onMove(t, e.target.value)} style={TBL_FIELD}>{COLUMNS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}</select></td>
        <td style={TBL_CELL}><select data-cell-priority value={t.priority} disabled={!ed} onChange={e => onPatch(t, { priority: Number(e.target.value) })} style={{ ...TBL_FIELD, color: (PRIORITIES.find(p => p.id === t.priority) || PRIORITIES[1]).hex, fontWeight: 600 }}>{PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}</select></td>
        <td style={TBL_CELL}><input data-cell-due type="date" value={t.due || ""} disabled={!ed} onChange={e => onMoveDue(t, e.target.value || null)} style={TBL_FIELD} /></td>
        <td style={TBL_CELL}><select data-cell-assignee value={assigneeIds(t)[0] || ""} disabled={!ed} onChange={e => onPatch(t, { assignees: e.target.value ? [e.target.value] : [], assignee: e.target.value || null })} style={TBL_FIELD}><option value="">Personne</option>{accounts.filter(a => a.role !== "guest" || assigneeIds(t).includes(a.id)).map(a => <option key={a.id} value={a.id}>{a.display_name}</option>)}{assigneeIds(t).length > 1 && <option disabled>(+{assigneeIds(t).length - 1} autre{assigneeIds(t).length > 2 ? "s" : ""})</option>}</select></td>
        {projects.length > 0 && <td style={TBL_CELL}><select data-cell-project value={t.project_id || ""} disabled={!ed} onChange={e => onPatch(t, { project_id: e.target.value || null })} style={TBL_FIELD}><option value="">Sans projet</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></td>}
        <td style={TBL_CELL}><select data-cell-label value={t.label} disabled={!ed} onChange={e => onPatch(t, { label: e.target.value })} style={{ ...TBL_FIELD, color: (LABELS.find(l => l.id === t.label) || LABELS[0]).hex, fontWeight: 600 }}>{LABELS.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select></td>
      </tr>
    );
  }

function TableBoard({ tasks, accounts, projects, canEditTask, onOpen, onMove, onPatch, onMoveDue }) {
  const [sort, setSort] = useState({ key: null, dir: 1 });
  const [group, setGroup] = useState("none");
  const STAT = { todo: "À faire", doing: "En cours", done: "Terminée" };
  const keyOf = (t, k) => k === "title" ? normSearch(t.title) : k === "status" ? ["todo", "doing", "done"].indexOf(statusOf(t)) : k === "priority" ? t.priority : k === "due" ? (t.due || "9999") : k === "assignee" ? normSearch((accounts.find(a => a.id === assigneeIds(t)[0]) || {}).display_name || "zzz") : k === "project" ? normSearch((projects.find(p => p.id === t.project_id) || {}).name || "zzz") : k === "label" ? t.label : 0;
  const sorted = useMemo(() => {
    if (!sort.key) return tasks;
    return [...tasks].sort((a, b) => { const x = keyOf(a, sort.key), y = keyOf(b, sort.key); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
  }, [tasks, sort, accounts, projects]);
  const groupName = (t) => group === "status" ? STAT[statusOf(t)] : group === "priority" ? (PRIORITIES.find(p => p.id === t.priority) || {}).label : group === "assignee" ? ((accounts.find(a => a.id === assigneeIds(t)[0]) || {}).display_name || "Non assignées") : group === "project" ? ((projects.find(p => p.id === t.project_id) || {}).name || "Sans projet") : "";
  const groups = useMemo(() => {
    if (group === "none") return [{ name: "", rows: sorted }];
    const m = new Map(); for (const t of sorted) { const g = groupName(t); if (!m.has(g)) m.set(g, []); m.get(g).push(t); }
    return [...m.entries()].map(([name, rows]) => ({ name, rows }));
  }, [sorted, group, accounts, projects]);
  const th = (key, label, w) => (<th key={key} style={{ textAlign: "left", padding: "8px 8px", fontSize: 12, color: "var(--text-dim)", fontWeight: 600, whiteSpace: "nowrap", width: w }}><button type="button" data-sort-col={key} onClick={() => setSort(s => s.key === key ? (s.dir === 1 ? { key, dir: -1 } : { key: null, dir: 1 }) : { key, dir: 1 })} style={{ background: "none", border: "none", color: "inherit", font: "inherit", cursor: "pointer", padding: 0 }}>{label}{sort.key === key ? (sort.dir === 1 ? " ▲" : " ▼") : ""}</button></th>);
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, fontSize: 13, color: "var(--text-dim)", flexWrap: "wrap" }}>
        <span>Grouper par</span><SelectPill icon={I.Filter} value={group} onChange={setGroup} options={[{ value: "none", label: "Aucun" }, { value: "status", label: "Statut" }, { value: "priority", label: "Priorité" }, { value: "assignee", label: "Personne" }, ...(projects.length ? [{ value: "project", label: "Projet" }] : [])]} />
        <span style={{ marginLeft: "auto", fontSize: 12.5 }}>Modifiez directement dans les cellules. Cliquez sur un titre de colonne pour trier.</span>
      </div>
      <div className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 12, overflowX: "auto" }}>
        <table data-task-table style={{ width: "100%", borderCollapse: "collapse", minWidth: 860 }}>
          <thead><tr style={{ background: "var(--bg-2)" }}><th style={{ width: 34 }} />{th("title", "Titre")}{th("status", "Statut")}{th("priority", "Priorité")}{th("due", "Échéance")}{th("assignee", "Assigné")}{projects.length > 0 && th("project", "Projet")}{th("label", "Étiquette")}</tr></thead>
          {groups.map((g, gi) => (<tbody key={gi}>
            {g.name && <tr data-group={g.name}><td colSpan={projects.length > 0 ? 8 : 7} style={{ padding: "10px 10px 6px", fontWeight: 700, fontSize: 13, background: "var(--bg-2)", borderTop: "1px solid var(--border-soft)" }}>{g.name} <span style={{ color: "var(--text-dimmer)", fontWeight: 500 }}>· {g.rows.length}</span></td></tr>}
            {g.rows.map(t => <TableRow key={t.id} t={t} ed={canEditTask(t)} projects={projects} accounts={accounts} onOpen={onOpen} onMove={onMove} onPatch={onPatch} onMoveDue={onMoveDue} />)}
          </tbody>))}
          {tasks.length === 0 && <tbody><tr><td colSpan={8} style={{ padding: 24, textAlign: "center", color: "var(--text-dimmer)" }}>Aucune tâche ici.</td></tr></tbody>}
        </table>
      </div>
    </div>
  );
}

/* ---------------- Ajout rapide en langage naturel ---------------- */
const QA_DAYS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const QA_MONTHS = ["janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre"];
/** Lit une phrase comme « Appeler Paul demain 14h #famille !urgente @bob +Maison » et en tire une tâche. */
function parseQuickAdd(input, ctx) {
  const { accounts = [], projects = [], today = parisDay(), nowMs = Date.now() } = ctx || {};
  let text = " " + String(input || "").replace(/\s+/g, " ").trim() + " ";
  const out = { title: "", due: null, due_time: null, priority: null, tags: [], assignees: [], project_id: null, unknown: [] };
  // mots-clés : #étiquette, !priorité, @personne, +projet
  text = text.replace(/\s#([\p{L}\d_-]{1,30})(?=\s)/gu, (m, t) => { const v = t.toLowerCase(); if (!out.tags.includes(v) && out.tags.length < 10) out.tags.push(v); return " "; });
  text = text.replace(/\s!([\p{L}]{2,10})(?=\s)/gu, (m, w) => { const k = normSearch(w); if (/^(urgent|urgente|haute|high|important|importante)$/.test(k)) out.priority = 3; else if (/^(normale|normal|moyenne)$/.test(k)) out.priority = 2; else if (/^(basse|bas|low|faible)$/.test(k)) out.priority = 1; else return m; return " "; });
  text = text.replace(/\s@([\p{L}\d._-]{1,40})(?=\s)/gu, (m, w) => { const k = normSearch(w); const a = accounts.find(x => normSearch(x.username) === k) || accounts.find(x => normSearch(x.display_name).split(" ")[0] === k) || accounts.find(x => normSearch(x.display_name).replace(/\s/g, "").startsWith(k)); if (a) { if (!out.assignees.includes(a.id)) out.assignees.push(a.id); } else out.unknown.push("@" + w); return " "; });
  text = text.replace(/\s\+([\p{L}\d_-]{1,40})(?=\s)/gu, (m, w) => { const k = normSearch(w); const p = projects.find(x => normSearch(x.name).replace(/\s/g, "") === k) || projects.find(x => normSearch(x.name).replace(/\s/g, "").startsWith(k)); if (p) out.project_id = p.id; else out.unknown.push("+" + w); return " "; });
  // heure : « 14h », « 14h30 », « 14:30 », « à 9h »
  let timeFound = null;
  text = text.replace(/(?:\s(?:à|a)\s|\s)(\d{1,2})(?:h(\d{2})?|:(\d{2}))(?=\s)/i, (m, h, m1, m2) => { const hh = +h, mm = +(m1 || m2 || 0); if (hh > 23 || mm > 59) return m; timeFound = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); return " "; });
  // date
  const lead = "(?:\\s(?:pour|avant|le|vers)(?=\\s))?";
  let day = null;
  const tryRe = (re, fn) => { if (day) return; const m = re.exec(text); if (!m) return; const d = fn(m); if (d) { day = d; text = text.replace(re, " "); } };
  tryRe(new RegExp(lead + "\\s(?:aujourd'hui|aujourdhui)(?=\\s)", "i"), () => today);
  tryRe(new RegExp(lead + "\\s(?:apr[èe]s-?demain)(?=\\s)", "i"), () => shiftDay(today, 2));
  tryRe(new RegExp(lead + "\\sdemain(?=\\s)", "i"), () => shiftDay(today, 1));
  tryRe(new RegExp(lead + "\\sdans (\\d{1,3}) (jours?|semaines?|mois)(?=\\s)", "i"), (m) => { const n = +m[1]; return /semaine/i.test(m[2]) ? shiftDay(today, 7 * n) : /mois/i.test(m[2]) ? shiftDay(today, 30 * n) : shiftDay(today, n); });
  tryRe(new RegExp(lead + "\\s(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?: prochain)?(?=\\s)", "i"), (m) => { const target = QA_DAYS.indexOf(m[1].toLowerCase()) + 1; let n = (target - isoWd(today) + 7) % 7; if (n === 0) n = 7; return shiftDay(today, n); });
  const mk = (d, mo, y) => { const yy = y ? (y < 100 ? 2000 + y : y) : null; const base = yy || +today.slice(0, 4); const dt = new Date(Date.UTC(base, mo - 1, d)); if (dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null; let s = `${base}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`; if (!yy && s < today) s = `${base + 1}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`; return s; };
  tryRe(new RegExp(lead + "\\s(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?(?=\\s)", "i"), (m) => mk(+m[1], +m[2], m[3] ? +m[3] : 0));
  tryRe(new RegExp(lead + "\\s(\\d{1,2})(?:er)? (janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)(?: (\\d{4}))?(?=\\s)", "i"), (m) => mk(+m[1], QA_MONTHS.indexOf(normSearch(m[2])) + 1, m[3] ? +m[3] : 0));
  if (!day && timeFound) { const [h, mi] = timeFound.split(":").map(Number); const nowParis = new Date(nowMs).toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" }); day = (h * 60 + mi) * 60000 > (+nowParis.slice(0, 2) * 60 + +nowParis.slice(3, 5)) * 60000 ? today : shiftDay(today, 1); }
  out.due = day; out.due_time = day ? timeFound : null;
  out.title = text.replace(/\s+/g, " ").trim().slice(0, 200);
  return out;
}
function QuickAdd({ me, accounts, projects, onCreate }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const parsed = useMemo(() => parseQuickAdd(text, { accounts, projects }), [text, accounts, projects]);
  const nameOf = (id) => (accounts.find(a => a.id === id) || {}).display_name || "";
  const chips = [];
  if (text.trim()) {
    if (parsed.due) chips.push(["due", "Échéance : " + fmtDay(parsed.due, { weekday: "long", day: "numeric", month: "long" }) + (parsed.due_time ? " à " + parsed.due_time : "")]);
    if (parsed.priority) chips.push(["prio", "Priorité : " + (PRIORITIES.find(p => p.id === parsed.priority) || {}).label]);
    for (const id of parsed.assignees) chips.push(["who", "Pour : " + nameOf(id)]);
    for (const t of parsed.tags) chips.push(["tag", "#" + t]);
    if (parsed.project_id) chips.push(["proj", "Projet : " + (projects.find(p => p.id === parsed.project_id) || {}).name]);
    for (const u of parsed.unknown) chips.push(["unk", "« " + u + " » est inconnu"]);
  }
  const submit = async (ev) => {
    ev.preventDefault();
    if (busy || !parsed.title) return;
    setBusy(true);
    const ok = await onCreate(parsed);
    setBusy(false);
    if (ok) setText("");
  };
  return (
    <form onSubmit={submit} data-quick-add-form style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", gap: 8 }}>
        <input data-quick-add value={text} onChange={e => setText(e.target.value)} maxLength={300} aria-label="Ajout rapide d'une tâche" placeholder="Ajout rapide : Appeler Paul demain 14h #famille !urgente @bob" style={{ ...inputStyle, background: "var(--panel)" }} />
        <VoiceButton onText={(t) => setText(prev => (prev ? prev + " " : "") + t)} />
        <button type="submit" data-quick-add-go disabled={busy || !parsed.title} style={{ ...primaryBtn, padding: "0 18px", opacity: parsed.title ? 1 : 0.5, whiteSpace: "nowrap" }}>Ajouter</button>
      </div>
      {chips.length > 0 && <div data-quick-preview style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8, fontSize: 12.5 }}>{parsed.title && <span style={{ color: "var(--text-dim)", alignSelf: "center" }}>« {parsed.title} »</span>}{chips.map(([k, c], i) => <span key={i} data-qa-chip={k} style={{ background: k === "unk" ? "color-mix(in srgb, var(--late) 14%, transparent)" : "color-mix(in srgb, var(--accent) 12%, transparent)", color: k === "unk" ? "var(--late)" : "var(--text)", borderRadius: 6, padding: "2px 8px" }}>{c}</span>)}</div>}
    </form>
  );
}

/* ---------------- Vues enregistrées ---------------- */
function SavedViewsBar({ me, savedViews, current, onApply, notify }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const mine = savedViews.filter(v => v.user_id === me.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const same = (a, b) => JSON.stringify(Object.keys(current).sort().map(k => [k, (a || {})[k] ?? null])) === JSON.stringify(Object.keys(current).sort().map(k => [k, (b || {})[k] ?? null]));
  const save = async (ev) => {
    ev.preventDefault();
    const n = name.trim().slice(0, 40);
    if (!n || busy) return;
    setBusy(true);
    const { error } = await supabase.from("saved_views").insert({ server_id: me.server_id, user_id: me.id, name: n, filters: current });
    setBusy(false);
    if (error) { notify(/duplicate|unique/i.test(error.message) ? "Une vue porte déjà ce nom." : error.message, "err"); return; }
    setName(""); setAdding(false); notify("Vue enregistrée.");
  };
  const del = async (v) => { const { error } = await supabase.from("saved_views").delete().eq("id", v.id); if (error) notify(error.message, "err"); else notify("Vue supprimée."); };
  if (!mine.length && !adding) return (<div style={{ marginBottom: 14 }}><button type="button" data-view-add onClick={() => setAdding(true)} style={{ ...chipBtn, fontSize: 12.5 }}>☆ Enregistrer cette vue</button></div>);
  return (
    <div data-saved-views style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 14 }}>
      <span style={{ fontSize: 12.5, color: "var(--text-dim)" }}>Mes vues</span>
      {mine.map(v => { const on = same(v.filters, current); return (
        <span key={v.id} style={{ display: "inline-flex", alignItems: "stretch" }}>
          <button type="button" data-saved-view={v.name} aria-pressed={on} onClick={() => onApply(v.filters)} style={{ ...chipBtn, borderRadius: "8px 0 0 8px", borderRight: "none", background: on ? "var(--panel-2)" : "var(--bg-2)", color: on ? "var(--text)" : "var(--text-dim)", borderColor: on ? "var(--accent)" : "var(--border-soft)", fontWeight: on ? 600 : 500 }}>{v.name}</button>
          <button type="button" data-saved-view-del={v.name} aria-label={"Supprimer la vue " + v.name} onClick={() => del(v)} style={{ ...chipBtn, borderRadius: "0 8px 8px 0", padding: "8px 8px", borderColor: on ? "var(--accent)" : "var(--border-soft)" }}>×</button>
        </span>); })}
      {adding ? (
        <form onSubmit={save} style={{ display: "inline-flex", gap: 6 }}>
          <input autoFocus data-view-name value={name} onChange={e => setName(e.target.value)} maxLength={40} placeholder="Nom de la vue" aria-label="Nom de la vue" style={{ ...inputStyle, width: 170, padding: "6px 10px", fontSize: 13 }} />
          <button type="submit" data-view-save disabled={busy || !name.trim()} style={{ ...primaryBtn, padding: "0 14px", fontSize: 13 }}>Enregistrer</button>
          <button type="button" onClick={() => { setAdding(false); setName(""); }} style={{ ...chipBtn }}>Annuler</button>
        </form>
      ) : (mine.length < 20 && <button type="button" data-view-add onClick={() => setAdding(true)} style={{ ...chipBtn, fontSize: 12.5 }}>☆ Enregistrer cette vue</button>)}
    </div>
  );
}

/* ---------------- Matrice de priorités ---------------- */
function MatrixBoard({ tasks, accounts, onOpen }) {
  const open = tasks.filter(t => !t.done);
  const urgent = (t) => Boolean(t.due) && daysUntil(t.due) <= 2;
  const important = (t) => t.priority >= 2;
  const quads = [
    { id: "now", title: "À faire maintenant", hint: "Urgent et important", hex: "#FF6B5E", test: t => urgent(t) && important(t) },
    { id: "plan", title: "À planifier", hint: "Important, sans urgence", hex: "#5B9EF5", test: t => !urgent(t) && important(t) },
    { id: "delegate", title: "À déléguer ou expédier", hint: "Urgent, moins important", hex: "#FFB648", test: t => urgent(t) && !important(t) },
    { id: "later", title: "Plus tard", hint: "Ni urgent ni important", hex: "#8A94A6", test: t => !urgent(t) && !important(t) },
  ];
  return (
    <div>
      <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 10px" }}>Urgent : échéance dans 2 jours ou moins, ou dépassée. Important : priorité Normale ou Urgente. Seules les tâches non terminées apparaissent.</p>
      <div data-matrix style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 12 }}>
        {quads.map(q => { const list = open.filter(q.test).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999")); return (
          <section key={q.id} data-quadrant={q.id} className="paper" style={{ border: "1px solid var(--border-soft)", borderTop: "3px solid " + q.hex, borderRadius: 12, padding: "12px 14px", minHeight: 160 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}><strong style={{ fontSize: 14 }}>{q.title}</strong><span style={{ fontSize: 12, color: "var(--text-dimmer)" }}>{q.hint} · {list.length}</span></div>
            {list.length === 0 && <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", padding: "14px 0" }}>Rien dans cette case.</div>}
            {list.slice(0, 12).map(t => { const people = assigneeIds(t).map(id => accounts.find(a => a.id === id)).filter(Boolean); return (
              <button key={t.id} type="button" data-matrix-task={t.title} onClick={() => onOpen(t.id)} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: "var(--bg-2)", border: "1px solid var(--border-soft)", borderRadius: 9, padding: "7px 10px", marginBottom: 6, cursor: "pointer", color: "var(--text)", font: "inherit", fontSize: 13 }}>
                <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontWeight: 600 }}>{t.title}</span>
                {t.due && <span style={{ fontSize: 11.5, color: daysUntil(t.due) < 0 ? "var(--late)" : "var(--text-dim)" }}>{formatDue(t.due, daysUntil(t.due))}</span>}
                {people.length > 0 && <AvatarStack users={people} size={18} max={2} />}
              </button>); })}
            {list.length > 12 && <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>+ {list.length - 12} autre(s)</div>}
          </section>); })}
      </div>
    </div>
  );
}

/* ---------------- Point quotidien d'équipe ---------------- */
const MOODS = [["😞", "Difficile"], ["😕", "Moyen"], ["😐", "Neutre"], ["🙂", "Bien"], ["😄", "Excellent"]];
function CheckinsPanel({ me, accounts, checkins, notify }) {
  const today = parisDay();
  const [day, setDay] = useState(today);
  const mine = checkins.find(c => c.user_id === me.id && c.day === day) || null;
  const canWrite = me.role !== "guest";
  const [mood, setMood] = useState(mine ? mine.mood : null);
  const [did, setDid] = useState(mine ? mine.did : "");
  const [will, setWill] = useState(mine ? mine.will : "");
  const [blockers, setBlockers] = useState(mine ? mine.blockers : "");
  const [busy, setBusy] = useState(false);
  useEffect(() => { setMood(mine ? mine.mood : null); setDid(mine ? mine.did : ""); setWill(mine ? mine.will : ""); setBlockers(mine ? mine.blockers : ""); }, [day, mine && mine.id, mine && mine.updated_at]);
  const dayRows = checkins.filter(c => c.day === day).sort((a, b) => (a.user_id === me.id ? -1 : b.user_id === me.id ? 1 : a.created_at.localeCompare(b.created_at)));
  const who = (id) => accounts.find(a => a.id === id);
  const missing = day === today ? accounts.filter(a => a.role !== "guest" && !dayRows.some(c => c.user_id === a.id)) : [];
  const save = async (ev) => {
    ev.preventDefault();
    if (busy) return;
    if (!mood && !did.trim() && !will.trim() && !blockers.trim()) { notify("Renseignez au moins une information.", "err"); return; }
    setBusy(true);
    const row = { mood: mood || null, did: did.trim().slice(0, 600), will: will.trim().slice(0, 600), blockers: blockers.trim().slice(0, 600) };
    const { error } = mine ? await supabase.from("checkins").update(row).eq("id", mine.id) : await supabase.from("checkins").insert({ ...row, server_id: me.server_id, user_id: me.id, day });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    notify(mine ? "Point mis à jour." : "Point enregistré. Merci !");
  };
  const del = async () => { if (!mine) return; const { error } = await supabase.from("checkins").delete().eq("id", mine.id); if (error) notify(error.message, "err"); else notify("Point supprimé."); };
  const avg = dayRows.filter(c => c.mood).length ? dayRows.filter(c => c.mood).reduce((s, c) => s + c.mood, 0) / dayRows.filter(c => c.mood).length : null;
  const ta = (label, val, set, ph, key) => (<Field label={label}><textarea data-checkin-field={key} value={val} onChange={e => set(e.target.value)} rows={2} maxLength={600} placeholder={ph} style={{ ...inputStyle, resize: "vertical" }} /></Field>);
  return (
    <div data-checkins>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <button type="button" data-checkin-prev onClick={() => setDay(shiftDay(day, -1))} style={chipBtn} aria-label="Jour précédent">←</button>
        <strong data-checkin-day style={{ fontSize: 15 }}>{day === today ? "Aujourd'hui" : fmtDay(day, { weekday: "long", day: "numeric", month: "long" })}</strong>
        <button type="button" data-checkin-next disabled={day >= today} onClick={() => setDay(shiftDay(day, 1))} style={{ ...chipBtn, opacity: day >= today ? 0.4 : 1 }} aria-label="Jour suivant">→</button>
        {day !== today && <button type="button" onClick={() => setDay(today)} style={chipBtn}>Revenir à aujourd'hui</button>}
        {avg != null && <span style={{ marginLeft: "auto", fontSize: 13, color: "var(--text-dim)" }}>Humeur moyenne : {MOODS[Math.round(avg) - 1][0]} {avg.toFixed(1).replace(".", ",")}/5</span>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))", gap: 14, alignItems: "start" }}>
        {canWrite && (
          <form onSubmit={save} data-checkin-form className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 14, padding: "16px 18px" }}>
            <h2 style={{ fontFamily: "Literata, serif", fontSize: 17, fontWeight: 600, margin: "0 0 12px" }}>{mine ? "Votre point" : "Faire votre point"}</h2>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 6, fontWeight: 500 }}>Comment allez-vous ?</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>{MOODS.map(([e, l], i) => (<button key={i} type="button" data-mood={i + 1} aria-pressed={mood === i + 1} title={l} onClick={() => setMood(mood === i + 1 ? null : i + 1)} style={{ fontSize: 22, width: 44, height: 44, borderRadius: 10, cursor: "pointer", background: mood === i + 1 ? "color-mix(in srgb, var(--accent) 16%, transparent)" : "var(--bg-2)", border: "1.5px solid " + (mood === i + 1 ? "var(--accent)" : "var(--border-soft)") }}>{e}</button>))}</div>
            {ta("Ce que j'ai fait", did, setDid, "Rapport terminé, appel avec le client…", "did")}
            {ta("Ce que je prévois", will, setWill, "Préparer le devis…", "will")}
            {ta("Ce qui me bloque", blockers, setBlockers, "Rien, ou une personne ou une information qui manque.", "blockers")}
            <div style={{ display: "flex", gap: 10, justifyContent: "space-between" }}>
              {mine ? <button type="button" data-checkin-del onClick={del} style={{ ...secondaryBtn, padding: "10px 16px" }}>Supprimer</button> : <span />}
              <button type="submit" data-checkin-save disabled={busy} style={{ ...primaryBtn, padding: "10px 20px" }}>{mine ? "Mettre à jour" : "Enregistrer"}</button>
            </div>
          </form>
        )}
        <div>
          <h2 style={{ fontFamily: "Literata, serif", fontSize: 17, fontWeight: 600, margin: "0 0 10px" }}>Les points de l'équipe · {dayRows.length}</h2>
          {dayRows.length === 0 && <div className="paper" style={{ border: "1px dashed var(--border-soft)", borderRadius: 12, padding: 20, color: "var(--text-dim)", fontSize: 14 }}>{day === today ? "Personne n'a encore fait son point aujourd'hui." : "Aucun point ce jour-là."}</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {dayRows.map(c => { const u = who(c.user_id); return (
              <article key={c.id} data-checkin={u ? u.display_name : "?"} className="paper" style={{ border: "1px solid var(--border-soft)", borderLeft: c.blockers.trim() ? "3px solid var(--late)" : "1px solid var(--border-soft)", borderRadius: 12, padding: "12px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 6 }}>{u && <Avatar user={u} size={26} />}<strong style={{ fontSize: 14 }}>{u ? u.display_name : "Ancien membre"}</strong>{c.mood && <span title={MOODS[c.mood - 1][1]} style={{ fontSize: 18, marginLeft: "auto" }}>{MOODS[c.mood - 1][0]}</span>}</div>
                {c.did.trim() && <p style={{ margin: "4px 0", fontSize: 13.5 }}><span style={{ color: "var(--text-dim)" }}>Fait : </span>{c.did}</p>}
                {c.will.trim() && <p style={{ margin: "4px 0", fontSize: 13.5 }}><span style={{ color: "var(--text-dim)" }}>Prévu : </span>{c.will}</p>}
                {c.blockers.trim() && <p data-blockers style={{ margin: "4px 0", fontSize: 13.5 }}><span style={{ color: "var(--late)", fontWeight: 600 }}>Blocage : </span>{c.blockers}</p>}
              </article>); })}
          </div>
          {missing.length > 0 && <p data-missing style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginTop: 12 }}>Pas encore de point : {missing.map(a => a.display_name).join(", ")}.</p>}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Habitudes ---------------- */
const WD_SHORT = ["L", "M", "M", "J", "V", "S", "D"];
const WD_LONG = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
function habitStreak(h, logSet, today) {
  const sched = (d) => (h.weekdays || [1, 2, 3, 4, 5, 6, 7]).includes(isoWd(d));
  let d = today, n = 0;
  if (sched(d) && !logSet.has(h.id + "|" + d)) d = shiftDay(d, -1);
  for (let i = 0; i < 400; i++) {
    if (d < parisDay(Date.parse(h.created_at)) && !logSet.has(h.id + "|" + d)) break;
    if (sched(d)) { if (logSet.has(h.id + "|" + d)) n++; else break; }
    d = shiftDay(d, -1);
  }
  return n;
}
function HabitModal({ me, initial, onClose, notify }) {
  const [name, setName] = useState(initial ? initial.name : "");
  const [emoji, setEmoji] = useState(initial ? initial.emoji : "");
  const [days, setDays] = useState(initial ? initial.weekdays : [1, 2, 3, 4, 5, 6, 7]);
  const [busy, setBusy] = useState(false);
  const toggle = (d) => setDays(l => l.includes(d) ? (l.length > 1 ? l.filter(x => x !== d) : l) : [...l, d].sort());
  const save = async (ev) => {
    ev.preventDefault();
    if (busy) return;
    if (!name.trim()) { notify("Donnez un nom à l'habitude.", "err"); return; }
    setBusy(true);
    const row = { name: name.trim().slice(0, 60), emoji: emoji.trim().slice(0, 4), weekdays: days };
    const { error } = initial ? await supabase.from("habits").update(row).eq("id", initial.id) : await supabase.from("habits").insert({ ...row, user_id: me.id, server_id: me.server_id });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    notify(initial ? "Habitude modifiée." : "Habitude ajoutée."); onClose();
  };
  return (
    <div style={overlayStyle} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) onClose(); }}>
      <form className="modal-card" data-habit-form onSubmit={save} style={modalStyle}>
        <h2 style={{ fontFamily: "Literata, serif", fontSize: 20, fontWeight: 600, margin: "0 0 14px" }}>{initial ? "Modifier l'habitude" : "Nouvelle habitude"}</h2>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ width: 70 }}><Field label="Icône"><input value={emoji} onChange={e => setEmoji(e.target.value)} maxLength={4} aria-label="Icône" placeholder="🚶" style={{ ...inputStyle, textAlign: "center" }} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Habitude"><input autoFocus data-habit-name value={name} onChange={e => setName(e.target.value)} maxLength={60} placeholder="Lire 20 minutes" style={inputStyle} /></Field></div>
        </div>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 6, fontWeight: 500 }}>Jours concernés</div>
        <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>{WD_SHORT.map((l, i) => (<button key={i} type="button" data-habit-day={i + 1} aria-pressed={days.includes(i + 1)} title={WD_LONG[i]} onClick={() => toggle(i + 1)} style={{ width: 36, height: 36, borderRadius: 9, cursor: "pointer", fontWeight: 600, background: days.includes(i + 1) ? "var(--accent)" : "var(--bg-2)", color: days.includes(i + 1) ? "#fff" : "var(--text-dim)", border: "1px solid var(--border-soft)" }}>{l}</button>))}</div>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}><button type="button" onClick={onClose} style={secondaryBtn}>Annuler</button><button type="submit" data-habit-save disabled={busy} style={primaryBtn}>{initial ? "Enregistrer" : "Ajouter"}</button></div>
      </form>
    </div>
  );
}
function HabitsView({ me, habits, logs, notify }) {
  const today = parisDay();
  const [modal, setModal] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const logSet = useMemo(() => new Set(logs.map(l => l.habit_id + "|" + l.day)), [logs]);
  const active = habits.filter(h => !h.archived && h.user_id === me.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const archived = habits.filter(h => h.archived && h.user_id === me.id);
  const days = Array.from({ length: 7 }, (_, i) => shiftDay(today, i - 6));
  const toggle = async (h, d) => {
    const on = logSet.has(h.id + "|" + d);
    const { error } = on ? await supabase.from("habit_logs").delete().eq("habit_id", h.id).eq("day", d) : await supabase.from("habit_logs").insert({ habit_id: h.id, user_id: me.id, day: d });
    if (error) notify(error.message, "err");
  };
  const archive = async (h, v) => { const { error } = await supabase.from("habits").update({ archived: v }).eq("id", h.id); if (error) notify(error.message, "err"); else notify(v ? "Habitude archivée." : "Habitude réactivée."); };
  const remove = async (h) => { if (!window.confirm(`Supprimer l'habitude « ${h.name} » et tout son historique ?`)) return; const { error } = await supabase.from("habits").delete().eq("id", h.id); if (error) notify(error.message, "err"); else notify("Habitude supprimée."); };
  const dueToday = active.filter(h => (h.weekdays || []).includes(isoWd(today)));
  const doneToday = dueToday.filter(h => logSet.has(h.id + "|" + today)).length;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 18, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Habitudes</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0", maxWidth: 560 }}>Vos routines personnelles, cochées jour après jour. Elles restent privées : personne d'autre ne les voit.</p></div>
        <button type="button" data-habit-new onClick={() => setModal({ initial: null })} style={{ ...primaryBtn, padding: "10px 18px", display: "flex", alignItems: "center", gap: 7 }}><I.Plus size={15} /> Nouvelle habitude</button>
      </div>
      {dueToday.length > 0 && <div data-habit-summary style={{ fontSize: 14, marginBottom: 12 }}><strong>{doneToday} sur {dueToday.length}</strong> faite{doneToday > 1 ? "s" : ""} aujourd'hui{doneToday === dueToday.length ? ". Journée complète !" : "."}</div>}
      {active.length === 0 && <div data-habit-empty className="paper" style={{ border: "1px dashed var(--border-soft)", borderRadius: 14, padding: "30px 22px", textAlign: "center", color: "var(--text-dim)", fontSize: 14 }}>Aucune habitude pour le moment. Ajoutez-en une, par exemple « Marcher 20 minutes » ou « Écrire dans le carnet ».</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {active.map(h => { const streak = habitStreak(h, logSet, today); return (
          <div key={h.id} data-habit={h.name} className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 14, padding: "12px 16px", display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 180px", minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{h.emoji ? h.emoji + " " : ""}{h.name}</div>
              <div data-habit-streak style={{ fontSize: 12.5, color: streak > 0 ? "var(--text)" : "var(--text-dimmer)" }}>{streak > 0 ? `🔥 Série de ${streak} jour${streak > 1 ? "s" : ""}` : "Pas de série en cours"}{h.weekdays.length < 7 ? " · " + h.weekdays.map(d => WD_LONG[d - 1].slice(0, 3)).join(", ") : ""}</div>
            </div>
            <div style={{ display: "flex", gap: 5 }}>{days.map(d => { const sched = h.weekdays.includes(isoWd(d)); const on = logSet.has(h.id + "|" + d); return (
              <button key={d} type="button" data-habit-cell={d} data-on={on ? "1" : "0"} disabled={!sched && !on} title={fmtDay(d, { weekday: "long", day: "numeric", month: "long" })} onClick={() => toggle(h, d)} style={{ width: 34, height: 40, borderRadius: 9, cursor: sched || on ? "pointer" : "default", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 1, background: on ? "var(--accent)" : "var(--bg-2)", color: on ? "#fff" : sched ? "var(--text-dim)" : "var(--text-dimmer)", border: "1px solid " + (d === today ? "var(--accent)" : "var(--border-soft)"), opacity: sched || on ? 1 : 0.45, fontSize: 10.5 }}><span>{WD_SHORT[isoWd(d) - 1]}</span><span style={{ fontSize: 13, fontWeight: 700 }}>{on ? "✓" : Number(d.slice(8))}</span></button>); })}</div>
            <div style={{ display: "flex", gap: 6 }}><button type="button" data-habit-edit onClick={() => setModal({ initial: h })} style={chipBtn}>Modifier</button><button type="button" data-habit-archive onClick={() => archive(h, true)} style={chipBtn}>Archiver</button></div>
          </div>); })}
      </div>
      {archived.length > 0 && <div style={{ marginTop: 18 }}>
        <button type="button" data-habit-archived-toggle onClick={() => setShowArchived(v => !v)} style={chipBtn}>{showArchived ? "Masquer" : "Voir"} les habitudes archivées ({archived.length})</button>
        {showArchived && <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>{archived.map(h => (<div key={h.id} data-habit-archived={h.name} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, color: "var(--text-dim)" }}><span style={{ flex: 1 }}>{h.emoji} {h.name}</span><button type="button" onClick={() => archive(h, false)} style={chipBtn}>Réactiver</button><button type="button" data-habit-delete onClick={() => remove(h)} style={{ ...chipBtn, color: "var(--late)" }}>Supprimer</button></div>))}</div>}
      </div>}
      {modal && <HabitModal me={me} initial={modal.initial} onClose={() => setModal(null)} notify={notify} />}
    </div>
  );

        </div>)}

        {past.length > 0 && <div style={{ marginTop: 16 }}><button type="button" data-appt-past-toggle onClick={() => setShowPast(!showPast)} style={chipBtn}>{showPast ? "Masquer" : "Afficher"} les rendez-vous passés ({past.length})</button>
          {showPast && <div className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 12, overflow: "hidden", marginTop: 10 }}>{past.slice(0, 30).map(row)}</div>}</div>}
      </div>}
      {panel === "avail" && canBook && <MyAvailabilities me={me} availabilities={availabilities} notify={notify} />}
    </div>
  );
}

/* ---------------- Mode concentration ---------------- */
const focusMin = () => (typeof window !== "undefined" && window.__FOCUS_MS) || 60000;
const fmtCountdown = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
function focusBeep() { try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; const c = new C(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 660; g.gain.value = 0.05; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 350); } catch (_) {} }
function FocusSession({ me, tasks, focus, setFocus, onStart, onOpen, notify }) {
  const [now, setNow] = useState(Date.now());
  const busy = useRef(false);
  useEffect(() => { if (!focus) return; const id = setInterval(() => setNow(Date.now()), 500); return () => clearInterval(id); }, [Boolean(focus)]);
  useEffect(() => {
    if (!focus || busy.current || now < focus.endsAt) return;
    busy.current = true;
    (async () => {
      if (focus.phase === "work") {
        const { data: running } = await supabase.from("time_entries").select("*").eq("user_id", me.id).is("ended_at", null);
        for (const r of running || []) if (r.task_id === focus.taskId) await supabase.from("time_entries").update({ ended_at: new Date(Math.min(focus.endsAt, Date.now())).toISOString() }).eq("id", r.id);
        focusBeep();
        notify(`Séance terminée : ${focus.workMin} min de concentration enregistrées. Pause de ${focus.breakMin} min.`);
        setFocus({ ...focus, phase: "break", endsAt: Date.now() + focus.breakMin * focusMin(), rounds: (focus.rounds || 0) + 1 });
      } else if (focus.phase === "break") {
        focusBeep();
        setFocus({ ...focus, phase: "idle" });
      }
      busy.current = false;
    })();
  }, [now, focus]);
  if (!focus) return null;
  const t = tasks.find(x => x.id === focus.taskId);
  const left = focus.endsAt - now;
  const stopNow = async () => {
    const { data: running } = await supabase.from("time_entries").select("*").eq("user_id", me.id).is("ended_at", null);
    for (const r of running || []) if (r.task_id === focus.taskId) await stopEntry(r);
    notify("Séance arrêtée. Le temps écoulé est enregistré."); setFocus(null);
  };
  const phaseLabel = focus.phase === "work" ? "Concentration" : focus.phase === "break" ? "Pause" : "Pause terminée";
  return (
    <div data-focus data-phase={focus.phase} role="timer" style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--panel)", border: "1px solid " + (focus.phase === "work" ? "var(--accent)" : "#1F9D6B"), borderRadius: 12, padding: "10px 16px", marginBottom: 14, flexWrap: "wrap" }}>
      <span aria-hidden="true" style={{ fontSize: 18 }}>{focus.phase === "work" ? "🎯" : "☕"}</span>
      <strong style={{ fontSize: 13.5 }}>{phaseLabel}</strong>
      {focus.phase !== "idle" && <span data-focus-clock style={{ fontFamily: "Literata, serif", fontSize: 24, fontVariantNumeric: "tabular-nums", fontWeight: 600 }}>{fmtCountdown(left)}</span>}
      {t && <button type="button" onClick={() => onOpen(t.id)} style={{ background: "none", border: "none", color: "var(--text-dim)", cursor: "pointer", fontSize: 13, padding: 0, textAlign: "left", maxWidth: 260, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.title}</button>}
      {(focus.rounds || 0) > 0 && <span data-focus-rounds style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{focus.rounds} séance{focus.rounds > 1 ? "s" : ""} terminée{focus.rounds > 1 ? "s" : ""}</span>}
      <span style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
        {focus.phase === "work" && <button type="button" data-focus-extend onClick={() => setFocus({ ...focus, endsAt: focus.endsAt + 5 * focusMin(), workMin: focus.workMin + 5 })} style={chipBtn}>+ 5 min</button>}
        {focus.phase === "work" && <button type="button" data-focus-stop onClick={stopNow} style={{ ...chipBtn, color: "var(--late)", borderColor: "#FF6B5E" }}>■ Terminer</button>}
        {focus.phase === "break" && <button type="button" data-focus-skip onClick={() => setFocus(null)} style={chipBtn}>Passer la pause</button>}
        {focus.phase === "idle" && t && <button type="button" data-focus-again onClick={() => onStart(t, focus.workMin, focus.breakMin, focus.rounds)} style={chipBtn}>Nouvelle séance</button>}
        {focus.phase === "idle" && <button type="button" data-focus-close onClick={() => setFocus(null)} style={chipBtn}>Fermer</button>}
      </span>
    </div>
  );
}

/* ---------------- Fil d'activité ---------------- */
function ActivityView({ me, accounts, tasks, comments, notes, objectives, meetings, announcements, checkins, bookings, resources, onOpen, onNote, goTo }) {
  const [filter, setFilter] = useState("all");
  const [limit, setLimit] = useState(60);
  const who = (id) => (accounts.find(a => a.id === id) || {}).display_name || "Un ancien membre";
  const events = useMemo(() => {
    const ev = [];
    const taskById = new Map(tasks.map(t => [t.id, t]));
    for (const t of tasks) {
      if (t.created_at) ev.push({ id: "tc" + t.id, ts: t.created_at, actor: t.created_by, kind: "task", text: "a créé la tâche", subject: t.title, open: () => onOpen(t.id) });
      if (t.done && t.done_at) ev.push({ id: "td" + t.id, ts: t.done_at, actor: assigneeIds(t)[0] || null, kind: "task", text: assigneeIds(t).length ? "a terminé la tâche" : "La tâche suivante a été terminée :", subject: t.title, open: () => onOpen(t.id) });
    }
    for (const c of comments) { const t = taskById.get(c.task_id); if (t) ev.push({ id: "c" + c.id, ts: c.created_at, actor: c.author_id, kind: "comment", text: "a commenté", subject: t.title, extra: String(c.text || "").slice(0, 140), open: () => onOpen(t.id) }); }
    for (const n of notes) ev.push({ id: "n" + n.id, ts: n.updated_at || n.created_at, actor: n.updated_by || n.created_by, kind: "note", text: "a modifié la note", subject: n.title, open: () => onNote(n.id) });
    for (const o of objectives) ev.push({ id: "o" + o.id, ts: o.created_at, actor: o.created_by, kind: "team", text: "a fixé l'objectif", subject: o.title, open: () => goTo("objectives") });
    const seen = new Set();
    for (const m of [...meetings].sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""))) { const k = m.series_id || m.id; if (seen.has(k)) continue; seen.add(k); if (m.created_at) ev.push({ id: "m" + m.id, ts: m.created_at, actor: m.created_by, kind: "team", text: m.series_id ? "a planifié la série de réunions" : "a planifié la réunion", subject: m.title, open: () => goTo("meetings") }); }
    for (const a of announcements) if (a.created_at) ev.push({ id: "a" + a.id, ts: a.created_at, actor: a.created_by || null, kind: "team", text: "a publié l'annonce", subject: a.title || a.message || "", open: null });
    for (const c of checkins) ev.push({ id: "k" + c.id, ts: c.updated_at || c.created_at, actor: c.user_id, kind: "team", text: "a fait son point du jour", subject: "", open: () => goTo("team") });
    for (const b of bookings) { const r = resources.find(x => x.id === b.resource_id); ev.push({ id: "b" + b.id, ts: b.created_at, actor: b.user_id, kind: "team", text: "a réservé", subject: r ? r.name : "une ressource", open: () => goTo("bookings") }); }
    return ev.filter(e => e.ts).sort((a, b) => b.ts.localeCompare(a.ts));
  }, [tasks, comments, notes, objectives, meetings, announcements, checkins, bookings, resources]);
  const shown = events.filter(e => filter === "all" || (filter === "tasks" ? (e.kind === "task" || e.kind === "comment") : filter === "notes" ? e.kind === "note" : e.kind === "team"));
  const today = parisDay();
  const dayLabel = (d) => d === today ? "Aujourd'hui" : d === shiftDay(today, -1) ? "Hier" : fmtDay(d, { weekday: "long", day: "numeric", month: "long" });
  const groups = []; for (const e of shown.slice(0, limit)) { const d = parisDay(Date.parse(e.ts)); const g = groups[groups.length - 1]; if (g && g.day === d) g.items.push(e); else groups.push({ day: d, items: [e] }); }
  const fb = (id, label) => (<button key={id} type="button" data-activity-filter={id} aria-pressed={filter === id} onClick={() => { setFilter(id); setLimit(60); }} style={{ ...chipBtn, background: filter === id ? "var(--panel-2)" : "transparent", color: filter === id ? "var(--text)" : "var(--text-dim)", fontWeight: filter === id ? 600 : 500, borderColor: filter === id ? "var(--accent)" : "var(--border-soft)" }}>{label}</button>);
  const timeOf = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" }).replace(":", "h");
  return (
    <div>
      <div style={{ marginBottom: 16 }}><h1 style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Activité</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0", maxWidth: 560 }}>Ce qui s'est passé récemment dans votre serveur : tâches, commentaires, notes, réunions, objectifs.</p></div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>{fb("all", "Tout")}{fb("tasks", "Tâches et commentaires")}{fb("notes", "Notes")}{fb("team", "Équipe")}</div>
      {shown.length === 0 && <div data-activity-empty className="paper" style={{ border: "1px dashed var(--border-soft)", borderRadius: 14, padding: "28px 22px", textAlign: "center", color: "var(--text-dim)", fontSize: 14 }}>Aucune activité pour ce filtre.</div>}
      {groups.map(g => (
        <section key={g.day} data-activity-day={g.day} style={{ marginBottom: 18 }}>

              <Row key={e.id} {...(e.open ? { type: "button", onClick: e.open } : {})} data-activity-item={e.kind} style={{ display: "flex", alignItems: "flex-start", gap: 10, width: "100%", textAlign: "left", padding: "10px 14px", background: "transparent", border: "none", borderTop: i ? "1px solid var(--border-soft)" : "none", color: "var(--text)", font: "inherit", fontSize: 13.5, cursor: e.open ? "pointer" : "default" }}>
                {u ? <Avatar user={u} size={24} /> : <span style={{ width: 24, height: 24 }} />}
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span>{e.actor ? <strong>{who(e.actor)}</strong> : null}{e.actor ? " " : ""}{e.text}{e.subject ? <> <strong>« {e.subject} »</strong></> : null}</span>
                  {e.extra && <span style={{ display: "block", color: "var(--text-dim)", fontSize: 12.5, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.extra}</span>}
                </span>
                <span style={{ fontSize: 12, color: "var(--text-dimmer)", whiteSpace: "nowrap" }}>{timeOf(e.ts)}</span>
              </Row>); })}
          </div>
        </section>
      ))}
      {shown.length > limit && <button type="button" data-activity-more onClick={() => setLimit(l => l + 60)} style={chipBtn}>Afficher plus ({shown.length - limit} restantes)</button>}
    </div>
  );

/* ---------------- Revue hebdomadaire ---------------- */
function WeeklyReview({ me, tasks, meetings, attendees, timeEntries, notify, onClose, onOpen }) {
  const [step, setStep] = useState(0);
  const [saved, setSaved] = useState(false);
  const today = parisDay();
  const weekAgo = shiftDay(today, -7), nextWeek = shiftDay(today, 7);
  const mineOpen = tasks.filter(t => !t.done && assigneeIds(t).includes(me.id));
  const doneWeek = tasks.filter(t => t.done && t.done_at && parisDay(Date.parse(t.done_at)) >= weekAgo && assigneeIds(t).includes(me.id));
  const timeMs = timeEntries.filter(e => e.user_id === me.id && e.started_at && parisDay(Date.parse(e.started_at)) >= weekAgo).reduce((n, e) => n + entryMs(e), 0);
  const overdue = mineOpen.filter(t => t.due && t.due < today).sort((a, b) => a.due.localeCompare(b.due));
  const upcoming = mineOpen.filter(t => t.due && t.due >= today && t.due <= nextWeek).sort((a, b) => a.due.localeCompare(b.due));
  const undated = mineOpen.filter(t => !t.due);
  const mine = (m) => m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined");
  const meets = meetings.filter(m => mine(m) && Date.parse(m.starts_at) >= Date.now() && Date.parse(m.starts_at) < parisInstant(nextWeek)).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const nextMonday = shiftDay(today, ((8 - isoWd(today)) % 7) || 7);
  const reschedule = async (t, day) => { const { error } = await supabase.from("tasks").update(duePatch(t, day)).eq("id", t.id); if (error) notify(error.message, "err"); };
  const finish = async (t) => { const { error } = await supabase.from("tasks").update({ done: true }).eq("id", t.id); if (error) notify(error.message, "err"); };
  const drop = async (t) => { const { error } = await supabase.rpc("trash_task", { p_id: t.id }); if (error) notify(error.message, "err"); else notify("Tâche placée dans la corbeille."); };
  const steps = ["Bilan", "En retard", "À planifier", "Semaine à venir"];
  const dayLabel = (d) => fmtDay(d, { weekday: "short", day: "numeric", month: "short" });
  const taskRow = (t, actions) => (
    <div key={t.id} data-review-task={t.title} style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", padding: "8px 0", borderTop: "1px solid var(--border-soft)" }}>
      <button type="button" onClick={() => onOpen(t.id)} style={{ flex: "1 1 160px", minWidth: 0, textAlign: "left", background: "none", border: "none", color: "var(--text)", cursor: "pointer", fontSize: 13.5, fontWeight: 600, padding: 0 }}>{t.title}{t.due ? <span style={{ fontWeight: 400, color: t.due < today ? "var(--late)" : "var(--text-dim)" }}> · {dayLabel(t.due)}</span> : null}</button>
      {actions}
    </div>);
  const act = (label, fn, key, danger) => <button key={key} type="button" data-review-act={key} onClick={fn} style={{ ...chipBtn, fontSize: 12, padding: "5px 9px", color: danger ? "var(--late)" : undefined }}>{label}</button>;
  const body = () => {
    if (step === 0) return (<div>
      <p style={{ fontSize: 14, margin: "0 0 12px" }}>Voici votre semaine écoulée.</p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 12 }}>

        <div data-review-stat="late" className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 10, padding: 12 }}><div style={{ fontFamily: "Literata, serif", fontSize: 26, fontWeight: 700, color: overdue.length ? "var(--late)" : undefined }}>{overdue.length}</div><div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>en retard</div></div>

    </div>);

      {overdue.map(t => taskRow(t, <>{act("Demain", () => reschedule(t, shiftDay(today, 1)), "tomorrow")}{act("Lundi", () => reschedule(t, nextMonday), "monday")}{act("+ 1 semaine", () => reschedule(t, shiftDay(today, 7)), "week")}{!t.recurrence && act("Terminée", () => finish(t), "done")}{act("Abandonner", () => drop(t), "drop", true)}</>))}
    </div>);

      <p style={{ fontSize: 14, margin: "0 0 8px" }}>{undated.length ? "Ces tâches n'ont pas de date. Donnez-leur une échéance, ou laissez-les telles quelles." : "Toutes vos tâches ont une échéance."}</p>

      {upcoming.map(t => taskRow(t, null))}

    </div>);

    const { error } = await supabase.from("notes").insert({ server_id: me.server_id, created_by: me.id, title, body: lines.join("\n").slice(0, 20000) });
    if (error) { notify(error.message, "err"); return; }
    setSaved(true); notify("Revue enregistrée dans vos notes.");

  return (
    <div style={overlayStyle} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) onClose(); }}>
      <div className="modal-card" data-review style={{ ...modalStyle, width: 640 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}><h2 style={{ fontFamily: "Literata, serif", fontSize: 20, fontWeight: 600, margin: 0 }}>Revue de la semaine</h2><button type="button" onClick={onClose} aria-label="Fermer" style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>{steps.map((s, i) => (<button key={s} type="button" data-review-step={i} aria-current={step === i ? "step" : undefined} onClick={() => setStep(i)} style={{ ...chipBtn, fontSize: 12.5, background: step === i ? "var(--panel-2)" : "transparent", color: step === i ? "var(--text)" : "var(--text-dim)", fontWeight: step === i ? 600 : 500, borderColor: step === i ? "var(--accent)" : "var(--border-soft)" }}>{i + 1}. {s}</button>))}</div>
        <div style={{ minHeight: 180 }}>{body()}</div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16 }}>
          <button type="button" data-review-prev disabled={step === 0} onClick={() => setStep(step - 1)} style={{ ...secondaryBtn, padding: "10px 16px", opacity: step === 0 ? 0.5 : 1 }}>Précédent</button>
          {step < 3 ? <button type="button" data-review-next onClick={() => setStep(step + 1)} style={{ ...primaryBtn, padding: "10px 20px" }}>Suivant</button> : <button type="button" data-review-done onClick={onClose} style={{ ...primaryBtn, padding: "10px 20px" }}>Terminer</button>}
        </div>
      </div>
    </div>
  );
}

const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch (_) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const lsJson = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v === null || v === undefined ? fb : v; } catch (_) { return fb; } };
const getAccent = () => { const v = lsGet(ACCENT_KEY, "bleu"); return ACCENTS.some(a => a.id === v) ? v : "bleu"; };
const getZoom = () => { const n = Number(lsGet(ZOOM_KEY, "100")); return ZOOMS.some(z => z[0] === n) ? n : 100; };

  r.style.setProperty("--accent", c[0]); r.style.setProperty("--accent-2", c[1]); r.style.setProperty("--ring", c[2]);
  r.style.setProperty("--accent-glow", `rgba(${c[3]},${light ? ".22" : ".32"})`);
}
function applyZoom(n) { try { document.body.style.zoom = n && n !== 100 ? String(n / 100) : ""; } catch (_) {} }

/* ---------------- Lot F : ouverture publique ---------------- */
const fmtEst = (m) => { m = Number(m) || 0; if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} h ${String(r).padStart(2, "0")}` : `${h} h`; };
const EST_OPTIONS = [5, 10, 15, 30, 45, 60, 90, 120, 180, 240, 360, 480];
const escH = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Accessibilité : contraste renforcé et animations réduites (réglages propres à l'appareil) */
const A11Y_CONTRAST = "carnet-contrast", A11Y_MOTION = "carnet-motion";
function applyA11y() {
  try {
    const r = document.documentElement;
    r.setAttribute("data-contrast", lsGet(A11Y_CONTRAST, "off") === "on" ? "high" : "normal");
    r.setAttribute("data-motion", lsGet(A11Y_MOTION, "auto") === "reduce" ? "reduce" : "auto");
  } catch (_) {}
}
function A11yPrefs() {
  const [hc, setHc] = useState(lsGet(A11Y_CONTRAST, "off") === "on");
  const [rm, setRm] = useState(lsGet(A11Y_MOTION, "auto") === "reduce");
  const flip = (key, v, set, on, off) => { set(v); lsSet(key, v ? on : off); applyA11y(); };
  const row = (id, label, hint, val, onChange) => (
    <label style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "6px 0", cursor: "pointer" }}>

      {row("motion", "Réduire les animations", "Supprime les transitions et mouvements. Appliqué d'office si votre système le demande.", rm, (v) => flip(A11Y_MOTION, v, setRm, "reduce", "auto"))}
