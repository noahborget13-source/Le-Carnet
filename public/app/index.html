}

/* Ne pas déranger : plage horaire pendant laquelle aucune alerte du navigateur n'est affichée */
const DND_KEY = "carnet-dnd", LEAD_KEY = "carnet-remind-lead";
const getDnd = () => { const v = lsJson(DND_KEY, null); return v && typeof v === "object" ? { on: Boolean(v.on), from: /^\d\d:\d\d$/.test(v.from) ? v.from : "22:00", to: /^\d\d:\d\d$/.test(v.to) ? v.to : "07:00" } : { on: false, from: "22:00", to: "07:00" }; };
function dndActive(now = Date.now()) {
  const d = getDnd(); if (!d.on) return false;
  const hm = parisHM(now);
  return d.from === d.to ? false : d.from < d.to ? hm >= d.from && hm < d.to : hm >= d.from || hm < d.to;
}
const getLead = () => { const n = Number(lsGet(LEAD_KEY, "10")); return [0, 5, 10, 30, 60].includes(n) ? n : 10; };
function ReminderPrefs() {
  const [lead, setLead] = useState(getLead());
  const [dnd, setDnd] = useState(getDnd());
  const upd = (p) => { const n = { ...dnd, ...p }; setDnd(n); lsSet(DND_KEY, JSON.stringify(n)); };
  const small = { ...inputStyle, width: "auto", minWidth: 96, padding: "7px 10px" };
  return (

        <input type="checkbox" data-dnd-on checked={dnd.on} onChange={e => upd({ on: e.target.checked })} /> Couper les alertes du navigateur pendant une plage horaire
      </label>
      {dnd.on && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", fontSize: 13.5 }}>

          à <input type="time" data-dnd-to aria-label="Fin" value={dnd.to} onChange={e => e.target.value && upd({ to: e.target.value })} style={small} />

        </div>
      )}
    </div>
  );
}

/* Impression de l'agenda (jour ou semaine) */
function printAgenda({ me, tasks, meetings, attendees, from, days, title }) {
  const mine = tasks.filter(t => !t.done && !t.deleted_at && assigneeIds(t).includes(me.id));
  const today = parisDay();
  let body = "";
  const late = days === 1 && from === today ? mine.filter(t => t.due && t.due < today) : [];
  for (let i = 0; i < days; i++) {
    const day = shiftDay(from, i);
    const ms = meetings.filter(m => parisDay(Date.parse(m.starts_at)) === day && (m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined"))).sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
    const ts = mine.filter(t => t.due === day).sort((a, b) => String(a.due_time || "99").localeCompare(String(b.due_time || "99")));
    const total = ts.reduce((s, t) => s + (t.estimate_min || 0), 0);
    body += `<h2>${escH(fmtDay(day, { weekday: "long", day: "numeric", month: "long" }))}${total ? `<small> · ${escH(fmtEst(total))} de travail estimé</small>` : ""}</h2>`;
    if (!ms.length && !ts.length) { body += `<p class="none">Rien de prévu.</p>`; continue; }
    body += "<ul>";
    for (const m of ms) body += `<li><b>${escH(fmtHM(Date.parse(m.starts_at)))} – ${escH(fmtHM(Date.parse(m.ends_at)))}</b> Réunion : ${escH(m.title)}</li>`;
    for (const t of ts) body += `<li><span class="box"></span>${t.due_time ? `<b>${escH(hhmm(t.due_time).replace(":", "h"))}</b> ` : ""}${escH(t.title)}${t.estimate_min ? ` <small>(${escH(fmtEst(t.estimate_min))})</small>` : ""}</li>`;
    body += "</ul>";
  }
  if (late.length) body += `<h2>En retard</h2><ul>${late.map(t => `<li><span class="box"></span>${escH(t.title)} <small>(échéance ${escH(fmtDay(t.due, { day: "numeric", month: "long" }))})</small></li>`).join("")}</ul>`;
  const html = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${escH(title)}</title><style>
    body{font:14px/1.5 Georgia,serif;color:#111;margin:28px} h1{font-size:22px;margin:0 0 2px} .sub{color:#555;margin:0 0 18px;font-size:12px}
    h2{font-size:15px;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid #999;text-transform:capitalize} h2 small{font-weight:400;color:#555;text-transform:none}
    ul{list-style:none;margin:0;padding:0} li{padding:4px 0;border-bottom:1px dotted #ccc} .box{display:inline-block;width:11px;height:11px;border:1.5px solid #333;border-radius:2px;margin-right:8px;vertical-align:-1px}
    .none{color:#777;font-style:italic;margin:4px 0} small{color:#555} @media print{body{margin:12mm}}</style></head><body>
    <h1>${escH(title)}</h1><p class="sub">${escH(me.display_name)} · Le Carnet · imprimé le ${escH(fmtDay(today, { day: "numeric", month: "long", year: "numeric" }))}</p>${body}</body></html>`;
  if (typeof window.__printHook === "function") { window.__printHook(html); return; }
  const f = document.createElement("iframe");
  f.setAttribute("aria-hidden", "true"); f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (_) {} setTimeout(() => f.remove(), 3000); }, 250);
}

/* Dictée vocale (reconnaissance du navigateur, en français) */
const speechCtor = () => (typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition || null) : null);
function VoiceButton({ onText }) {
  const [on, setOn] = useState(false);
  const [err, setErr] = useState("");
  const rec = useRef(null);
  const Ctor = speechCtor();
  useEffect(() => () => { try { rec.current && rec.current.abort(); } catch (_) {} }, []);
  if (!Ctor) return null;
  const toggle = () => {
    if (on) { try { rec.current.stop(); } catch (_) {} return; }
    setErr("");
    try {
      const r = new Ctor(); rec.current = r;
      r.lang = "fr-FR"; r.interimResults = false; r.maxAlternatives = 1; r.continuous = false;
      r.onresult = (ev) => { const t = Array.from(ev.results).map(x => x[0] && x[0].transcript).join(" ").trim(); if (t) onText(t); };
      r.onerror = (ev) => { setErr(ev && ev.error === "not-allowed" ? "Micro refusé : autorisez-le dans les réglages du navigateur." : "La dictée n'a pas fonctionné, réessayez."); setOn(false); };
      r.onend = () => setOn(false);
      r.start(); setOn(true);
    } catch (_) { setErr("La dictée n'est pas disponible ici."); setOn(false); }
  };
  return (
    <>
      <button type="button" data-quick-voice aria-pressed={on} aria-label={on ? "Arrêter la dictée" : "Dicter une tâche"} title={on ? "Je vous écoute… (cliquez pour arrêter)" : "Dicter une tâche"} onClick={toggle} style={{ ...chipBtn, padding: "0 13px", fontSize: 17, background: on ? "color-mix(in srgb, var(--late) 18%, transparent)" : undefined, borderColor: on ? "var(--late)" : undefined }}>{on ? "⏺" : "🎤"}</button>
      {err && <span data-quick-voice-err role="status" style={{ fontSize: 12, color: "var(--late)", alignSelf: "center", maxWidth: 160 }}>{err}</span>}
    </>
  );
}

function TipCard() {

  return (
    <div data-tip style={{ marginBottom: 26 }}>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "13px 16px", display: "flex", gap: 12, alignItems: "flex-start", flexWrap: "wrap" }}>

function GettingStarted({ me, tasks, notes, goTo, onHelp, onHide }) {

      </div>

            <span style={{ textDecoration: done ? "line-through" : "none" }}>{label}</span>
          </button>
        ))}
      </div>
    </section>
  );
}

const FB_KINDS = [["idee", "💡 Une idée"], ["bug", "🐞 Un problème"], ["question", "❓ Une question"], ["compliment", "💚 Un compliment"]];
function downloadFile(name, mime, content) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function buildExport(me, data) {
  const owns = (x) => [x.user_id, x.created_by, x.owner_id, x.booked_by, x.person_id].includes(me.id);
  const mineT = data.tasks.filter(t => assigneeIds(t).includes(me.id) || t.created_by === me.id);
  const going = data.meetings.filter(m => m.created_by === me.id || data.attendees.some(a => a.meeting_id === m.id && a.user_id === me.id));
  return {
    exporte_le: new Date().toISOString(),
    application: "Le Carnet",
    compte: { nom: me.display_name, identifiant: me.username, email: me.email, role: me.role, anniversaire: me.birthday || null },
    taches: mineT,
    notes: data.notes.filter(owns),
    suivi_du_temps: data.timeEntries.filter(owns),
    habitudes: data.habits.filter(owns),
    journal_des_habitudes: data.habitLogs.filter(owns),
    reunions: going,
    rendez_vous: data.appointments.filter(x => [x.user_id, x.created_by, x.host_id, x.guest_id, x.booked_by].includes(me.id)),
  };
}
function tasksCsv(me, data) {
  const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["Titre", "Statut", "Priorité", "Échéance", "Heure", "Étiquettes", "Projet", "Estimation (min)", "Créée le", "Terminée le"];
  const rows = data.tasks.filter(t => assigneeIds(t).includes(me.id) || t.created_by === me.id).map(t => [
    t.title, t.done ? "Terminée" : "À faire", (PRIORITIES.find(p => p.id === t.priority) || {}).label || "", t.due || "", t.due_time ? hhmm(t.due_time) : "",
    (t.tags || []).join(", "), (data.projects.find(p => p.id === t.project_id) || {}).name || "", t.estimate_min || "", t.created_at ? parisDay(Date.parse(t.created_at)) : "", t.done_at ? parisDay(Date.parse(t.done_at)) : "",
  ]);
  return "\uFEFF" + [head, ...rows].map(r => r.map(q).join(";")).join("\r\n");
}

function AchievementsCard({ me, tasks, meetings, attendees, card }) {
  const s = useMemo(() => {
    const mine = tasks.filter(t => t.done && t.done_at && assigneeIds(t).includes(me.id));
    const days = new Set(mine.map(t => parisDay(Date.parse(t.done_at))));
    let streak = 0, d = parisDay(); if (!days.has(d)) d = shiftDay(d, -1);
    while (days.has(d)) { streak++; d = shiftDay(d, -1); }
    let best = 0, run = 0;
    [...days].sort().forEach((x, i, arr) => { run = i > 0 && shiftDay(arr[i - 1], 1) === x ? run + 1 : 1; best = Math.max(best, run); });
    const onTime = mine.filter(t => t.due && parisDay(Date.parse(t.done_at)) <= t.due).length;
    const team = mine.filter(t => assigneeIds(t).length > 1).length;
    const proj = mine.filter(t => t.project_id).length;
    const meets = meetings.filter(m => Date.parse(m.ends_at) < Date.now() && (m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response === "accepted"))).length;
    return { done: mine.length, streak: Math.max(streak, best), onTime, team, proj, meets };
  }, [tasks, meetings, attendees, me.id]);
  const B = [
    ["first", "🌱", "Premier pas", "Terminer une tâche", s.done, 1],
    ["ten", "✅", "Efficace", "Terminer 10 tâches", s.done, 10],
    ["fifty", "🏆", "Productif", "Terminer 50 tâches", s.done, 50],
    ["hundred", "💯", "Centurion", "Terminer 100 tâches", s.done, 100],
    ["streak3", "🔥", "En série", "3 jours d'affilée avec une tâche terminée", s.streak, 3],
    ["streak7", "⚡", "Inarrêtable", "7 jours d'affilée avec une tâche terminée", s.streak, 7],
    ["ontime", "⏰", "Ponctuel", "5 tâches terminées dans les temps", s.onTime, 5],
    ["team", "🤝", "Équipier", "5 tâches terminées à plusieurs", s.team, 5],
    ["proj", "🗂️", "Organisé", "5 tâches terminées dans des projets", s.proj, 5],
    ["meet", "📹", "Sociable", "Participer à 3 réunions", s.meets, 3],
  ];
  const got = B.filter(b => b[4] >= b[5]).length;
  return (
    <div style={card} data-achievements>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 2 }}>Mes succès <span data-ach-count style={{ fontWeight: 400, color: "var(--text-dim)", fontSize: 13 }}>· {got}/{B.length}</span></div>
      <div style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 12 }}>Ils se débloquent tout seuls, au fil de votre utilisation. Personne d'autre ne les voit.</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 8 }}>
        {B.map(([id, ic, name, hint, v, goal]) => { const ok = v >= goal; return (
          <div key={id} data-badge={id} data-unlocked={ok ? "1" : "0"} title={hint} style={{ background: "var(--bg)", border: "1px solid " + (ok ? "#5FBF8B" : "var(--border-soft)"), borderRadius: 11, padding: "10px 11px", opacity: ok ? 1 : 0.62 }}>
            <div style={{ fontSize: 22, filter: ok ? "none" : "grayscale(1)" }} aria-hidden="true">{ic}</div>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{name}</div>
            <div style={{ fontSize: 11.5, color: "var(--text-dim)", lineHeight: 1.4 }}>{ok ? "Débloqué ✓" : `${Math.min(v, goal)}/${goal} · ${hint}`}</div>
          </div>); })}
      </div>
    </div>
  );
}

function DailyGoal({ me, tasks }) {
  const key = "carnet-goal-" + me.id;
  const [goal, setGoalRaw] = useState(() => { const n = Number(lsGet(key, "3")); return n >= 1 && n <= 20 ? n : 3; });
  const setGoal = (n) => { const v = Math.max(1, Math.min(20, n)); setGoalRaw(v); lsSet(key, String(v)); };
  const today = parisDay();
  const done = tasks.filter(t => t.done && t.done_at && assigneeIds(t).includes(me.id) && parisDay(Date.parse(t.done_at)) === today).length;
  const reached = done >= goal, pct = Math.min(1, done / goal), R = 26, C = 2 * Math.PI * R;
  const streak = doneStreak(me, tasks);
  return (
    <div data-goal data-reached={reached ? "1" : "0"} style={{ marginBottom: 26 }}>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 16px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
        <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label={`${done} sur ${goal}`}>
          <circle cx="32" cy="32" r={R} fill="none" stroke="var(--bg-2)" strokeWidth="7" />
          <circle cx="32" cy="32" r={R} fill="none" stroke={reached ? "#5FBF8B" : "var(--accent)"} strokeWidth="7" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - pct)} transform="rotate(-90 32 32)" />
          <text x="32" y="37" textAnchor="middle" fontSize="15" fontWeight="700" fill="var(--text)">{done}/{goal}</text>
        </svg>
        <div style={{ flex: 1, minWidth: 180 }}>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, color: "var(--text-dimmer)", textTransform: "uppercase" }}>Objectif du jour</div>
          <div data-goal-text style={{ fontSize: 14.5, fontWeight: 600 }}>{reached ? "Objectif atteint, bravo ! 🎉" : `Encore ${goal - done} tâche${goal - done > 1 ? "s" : ""} à terminer aujourd'hui`}</div>

    </div>
  );
}

function EveningReview({ me, tasks, meetings, attendees, notify }) {
  const now = Date.now();
  if (parisHM(now) < "17:00") return null;
  const today = parisDay(now), tomorrow = shiftDay(today, 1);
  const mine = tasks.filter(t => assigneeIds(t).includes(me.id) && !t.deleted_at);
  const doneToday = mine.filter(t => t.done && t.done_at && parisDay(Date.parse(t.done_at)) === today).length;
  const left = mine.filter(t => !t.done && t.due === today);
  const tmr = mine.filter(t => !t.done && t.due === tomorrow);
  const tmrEst = tmr.reduce((a, t) => a + (t.estimate_min || 0), 0);
  const tmrMeet = meetings.filter(m => parisDay(Date.parse(m.starts_at)) === tomorrow && (m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined"))).length;
  const carry = async () => {
    const back = []; let ok = 0;
    for (const t of left) { const { error } = await supabase.from("tasks").update(duePatch(t, tomorrow)).eq("id", t.id); if (!error) { ok++; back.push(t); } }
    notify(`${ok} tâche(s) reportée(s) à demain.`, ok ? "ok" : "err", ok ? { label: "Annuler", onClick: async () => { for (const t of back) await supabase.from("tasks").update({ due: t.due, start_date: t.start_date || null }).eq("id", t.id); } } : undefined);
  };
  return (
    <section data-evening aria-label="Bilan du soir" style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: "4px solid #9B7EF5", borderRadius: 14, padding: "14px 18px", marginBottom: 26 }}>
      <h2 style={{ fontFamily: "Literata, serif", fontSize: 18, fontWeight: 600, margin: "0 0 8px" }}>🌙 Bilan du soir</h2>
      <div style={{ fontSize: 14, lineHeight: 1.65 }}>
        <div data-evening-done>{doneToday > 0 ? <>Aujourd'hui, vous avez terminé <strong>{doneToday}</strong> tâche{doneToday > 1 ? "s" : ""}. Bien joué.</> : "Aucune tâche terminée aujourd'hui, et ce n'est pas grave : demain est un autre jour."}</div>
        {left.length > 0 && <div data-evening-left><strong>{left.length}</strong> tâche{left.length > 1 ? "s" : ""} prévue{left.length > 1 ? "s" : ""} pour aujourd'hui {left.length > 1 ? "restent" : "reste"} à faire.</div>}
        <div data-evening-tomorrow>Demain : <strong>{tmr.length}</strong> tâche{tmr.length > 1 ? "s" : ""}{tmrEst ? ` (${fmtEst(tmrEst)} estimées)` : ""}{tmrMeet ? ` et ${tmrMeet} réunion${tmrMeet > 1 ? "s" : ""}` : ""}.</div>
      </div>
      {left.length > 0 && <button type="button" data-evening-carry onClick={carry} style={{ ...chipBtn, marginTop: 10 }}>↷ Reporter le reste à demain</button>}
    </section>
  );
}

function printHtml(html) {
  if (typeof window.__printHook === "function") { window.__printHook(html); return; }
  const f = document.createElement("iframe");
  f.setAttribute("aria-hidden", "true"); f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (_) {} setTimeout(() => f.remove(), 3000); }, 250);
}

            <button type="button" data-list-copy onClick={copyList} style={chipBtn}>Copier en texte</button>

            {mine(cur) && <button type="button" data-list-delete onClick={() => remove(cur)} style={{ ...chipBtn, color: "var(--late)" }}>Supprimer la liste</button>}
          </div>
        </div>); })()}
      {modal && (
        <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) setModal(false); }}>
          <div className="modal-card" role="dialog" aria-label="Nouvelle liste" style={{ ...modalStyle, width: 420 }}>
            <h2 style={{ fontFamily: "Literata, serif", fontSize: 20, margin: "0 0 14px" }}>Nouvelle liste</h2>

            <Field label="Nom"><input data-list-name autoFocus value={name} maxLength={60} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === "Enter" && create()} style={inputStyle} /></Field>

            <div style={{ display: "flex", gap: 8, marginTop: 6 }}><button type="button" onClick={() => setModal(false)} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" data-list-create onClick={create} disabled={!name.trim()} style={{ ...primaryBtn, flex: 1 }}>Créer</button></div>
          </div>
        </div>)}
    </div>
  );
}

/* ===== Dépenses partagées ===== */
function computeBalances(expenses, settlements) {
  const bal = {}, add = (id, v) => { bal[id] = (bal[id] || 0) + v; };
  for (const e of expenses) {
    const ids = [...e.split_among].sort(), base = Math.floor(e.amount_cents / ids.length), rest = e.amount_cents - base * ids.length;
    add(e.paid_by, e.amount_cents);
    ids.forEach((id, i) => add(id, -(base + (i < rest ? 1 : 0))));
  }
  for (const s of settlements) { add(s.from_user, s.amount_cents); add(s.to_user, -s.amount_cents); }
  return bal;
}
function suggestTransfers(bal) {
  const d = [], c = [];
  Object.entries(bal).forEach(([id, v]) => { if (v < 0) d.push({ id, v: -v }); else if (v > 0) c.push({ id, v }); });
  d.sort((a, b) => b.v - a.v || a.id.localeCompare(b.id)); c.sort((a, b) => b.v - a.v || a.id.localeCompare(b.id));
  const out = []; let i = 0, j = 0;
  while (i < d.length && j < c.length) { const m = Math.min(d[i].v, c[j].v); if (m > 0) out.push({ from: d[i].id, to: c[j].id, amount: m }); d[i].v -= m; c[j].v -= m; if (!d[i].v) i++; if (!c[j].v) j++; }
  return out;
}

  const paidByMe = expenses.filter(e => e.paid_by === me.id).reduce((a, e) => a + e.amount_cents, 0);
  const myShare = expenses.reduce((a, e) => { if (!e.split_among.includes(me.id)) return a; const ids = [...e.split_among].sort(), base = Math.floor(e.amount_cents / ids.length), rest = e.amount_cents - base * ids.length; return a + base + (ids.indexOf(me.id) < rest ? 1 : 0); }, 0);
  const myBal = bal[me.id] || 0;
  const canDel = (x) => x.created_by === me.id || me.role === "admin";
  const openNew = () => { setTitle(""); setAmount(""); setPayer(me.id); setDay(parisDay()); setParts(people.map(p => p.id)); setModal(true); };
  const cents = parseEur(amount);
  const valid = title.trim() && cents > 0 && parts.length > 0;
  const save = async () => {

    const { error } = await supabase.from("expenses").insert({ server_id: me.server_id, title: title.trim(), amount_cents: cents, paid_by: payer, split_among: parts, spent_on: day, created_by: me.id });

  const delExpense = async (e) => { if (!window.confirm(`Supprimer la dépense « ${e.title} » ?`)) return; const { error } = await supabase.from("expenses").delete().eq("id", e.id); if (error) notify(error.message, "err"); };
  const settle = async (t) => {

  const exportCsv = () => {

        {[["total", "Total des dépenses", fmtEur(total), "var(--text)"], ["paid", "Vous avez payé", fmtEur(paidByMe), "var(--text)"], ["share", "Votre part", fmtEur(myShare), "var(--text)"], ["bal", "Votre solde", (myBal > 0 ? "+" : "") + fmtEur(myBal), myBal > 0 ? "#5FBF8B" : myBal < 0 ? "var(--late)" : "var(--text)"]].map(([id, l, v, c]) => (

      {expenses.length > 0 && (<div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 16, marginBottom: 22 }}>
        <section className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 14, padding: "14px 16px" }}>

/* ===== Charge de l'équipe ===== */
function WorkloadView({ me, people, tasks, meetings, attendees, leaves, onOpen }) {
  const [range, setRange] = useState(14);
  const [pick, setPick] = useState(null);
  const today = parisDay();
  const days = Array.from({ length: range }, (_, i) => shiftDay(today, i));
  const cap = 480;
  const open = useMemo(() => tasks.filter(t => !t.done && !t.deleted_at && t.due), [tasks]);
  const cell = (uid, day) => {
    const ts = open.filter(t => t.due === day && assigneeIds(t).includes(uid));
    const ms = meetings.filter(m => parisDay(Date.parse(m.starts_at)) === day && (m.created_by === uid || attendees.some(a => a.meeting_id === m.id && a.user_id === uid && a.response !== "declined")));
    const est = ts.reduce((a, t) => a + (t.estimate_min || 0), 0);
    const meet = ms.reduce((a, m) => a + Math.max(0, Math.round((Date.parse(m.ends_at) - Date.parse(m.starts_at)) / 60000)), 0);
    const leave = leaves.some(l => l.user_id === uid && l.status === "approved" && l.start_date <= day && l.end_date >= day);
    return { ts, ms, est, meet, total: est + meet, noEst: ts.filter(t => !t.estimate_min).length, leave };
  };
  const bg = (c) => c.leave ? "repeating-linear-gradient(45deg, var(--bg-2), var(--bg-2) 6px, transparent 6px, transparent 12px)" : c.total === 0 ? "transparent" : c.total / cap >= 1 ? "rgba(255,100,95,.42)" : c.total / cap >= 0.5 ? "rgba(255,182,72,.38)" : "rgba(95,191,139,.34)";
  const grid = people.map(p => ({ p, cells: days.map(d => cell(p.id, d)) }));
  const sel = pick ? cell(pick.uid, pick.day) : null;
  const doPrint = () => printHtml(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Charge de l'équipe</title><style>body{font:12px/1.4 Georgia,serif;margin:20px;color:#111}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 6px;text-align:center}th:first-child,td:first-child{text-align:left}.o{background:#ffd1ce}.m{background:#ffe7b8}.g{background:#cfeedd}</style></head><body><h1>Charge de l'équipe</h1><p>Heures estimées (tâches + réunions), ${range} prochains jours.</p><table><tr><th></th>${days.map(d => `<th>${escH(fmtDay(d, { weekday: "short", day: "numeric" }))}</th>`).join("")}</tr>${grid.map(r => `<tr><td>${escH(r.p.display_name)}</td>${r.cells.map(c => `<td class="${c.total / cap >= 1 ? "o" : c.total / cap >= 0.5 ? "m" : c.total ? "g" : ""}">${c.leave ? "congé" : c.total ? escH(fmtEst(c.total)) : ""}</td>`).join("")}</tr>`).join("")}</table></body></html>`);
  return (
    <div data-workload-view>
      {pageTitle("Charge", "Qui est surchargé, qui a de la marge ? Chaque case additionne le temps estimé des tâches et les réunions du jour (huit heures = journée pleine).", <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{[7, 14, 28].map(n => <button key={n} type="button" data-workload-range={n} aria-pressed={range === n} onClick={() => setRange(n)} style={{ ...chipBtn, borderColor: range === n ? "var(--accent)" : undefined, background: range === n ? "var(--panel-2)" : "transparent" }}>{n} jours</button>)}<button type="button" data-workload-print onClick={doPrint} style={chipBtn}>🖨 Imprimer</button></div>)}
      <div className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 14, overflowX: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 12.5 }}>
          <thead><tr><th style={{ textAlign: "left", padding: "8px 12px", position: "sticky", left: 0, background: "var(--panel)", minWidth: 130 }}>Personne</th>{days.map(d => <th key={d} style={{ padding: "8px 4px", fontWeight: 600, minWidth: 54, color: isoWd(d) >= 6 ? "var(--text-dimmer)" : "var(--text-dim)" }}>{fmtDay(d, { weekday: "short" })}<div style={{ fontWeight: 400 }}>{fmtDay(d, { day: "numeric", month: "numeric" })}</div></th>)}</tr></thead>
          <tbody>
            {grid.map(({ p, cells }) => (
              <tr key={p.id} data-workload-row={p.display_name}>
                <td style={{ padding: "7px 12px", position: "sticky", left: 0, background: "var(--panel)", fontWeight: p.id === me.id ? 700 : 500, whiteSpace: "nowrap" }}>{p.display_name}{cells.some(c => c.total > cap) && <span data-overload title="Journée surchargée" style={{ marginLeft: 6 }}>⚠️</span>}</td>
                {cells.map((c, i) => { const d = days[i]; return (
                  <td key={d} style={{ padding: 2, opacity: isoWd(d) >= 6 && !c.total ? 0.45 : 1 }}>
                    <button type="button" data-wl-cell={p.display_name + "|" + d} data-minutes={c.total} data-leave={c.leave ? "1" : "0"} onClick={() => setPick({ uid: p.id, day: d })} title={c.leave ? "En congé" : c.total ? `${fmtEst(c.total)} (${c.ts.length} tâche(s), ${c.ms.length} réunion(s))` : "Libre"} style={{ width: "100%", minHeight: 34, border: pick && pick.uid === p.id && pick.day === d ? "2px solid var(--accent)" : "1px solid var(--border-soft)", borderRadius: 7, background: bg(c), color: "var(--text)", cursor: "pointer", font: "inherit", fontSize: 12 }}>{c.leave ? "🌴" : c.total ? fmtEst(c.total) : ""}{c.noEst > 0 && !c.leave && <sup title={`${c.noEst} tâche(s) sans estimation`} style={{ color: "var(--text-dimmer)" }}>+{c.noEst}</sup>}</button>
                  </td>); })}
              </tr>))}
          </tbody>
        </table>
      </div>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12, color: "var(--text-dim)", margin: "10px 2px 16px" }}>
        {[["rgba(95,191,139,.5)", "Moins de 4 h"], ["rgba(255,182,72,.5)", "4 à 8 h"], ["rgba(255,100,95,.55)", "Plus de 8 h"]].map(([c, l]) => <span key={l} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 14, height: 14, borderRadius: 4, background: c }} /> {l}</span>)}
        <span>🌴 Congé · <sup>+n</sup> tâches sans estimation</span>
      </div>

function InboxCard({ me, tasks, notify }) {
  const list = tasks.filter(t => !t.done && !t.deleted_at && !t.due && assigneeIds(t).includes(me.id));

  const cur = queue ? tasks.find(t => t.id === queue[i]) : null;
  const next = () => setI(n => n + 1);
  const setDay = async (kind) => {
    if (!cur) return;
    const day = kind === "today" ? parisDay() : snoozeTarget(kind);
    const { error } = await supabase.from("tasks").update(duePatch(cur, day)).eq("id", cur.id);
    if (error) { notify(error.message, "err"); return; }
    next();
  };
  const trash = async () => { if (!cur) return; const { error } = await supabase.rpc("trash_task", { p_id: cur.id }); if (error) { notify(error.message, "err"); return; } next(); };

  });
  const done = queue && i >= queue.length;

    <>
      {list.length > 0 && !queue && (
        <div data-inbox style={{ marginBottom: 26 }}>

            <span aria-hidden="true" style={{ fontSize: 22 }}>📥</span>
            <div style={{ flex: 1, minWidth: 200 }}><div style={{ fontSize: 14.5, fontWeight: 600 }}><span data-inbox-count>{list.length}</span> tâche{list.length > 1 ? "s" : ""} sans date</div><div style={{ fontSize: 13, color: "var(--text-dim)" }}>Donnez-leur un jour en quelques secondes, une par une.</div></div>

          </div>
        </div>)}
      {queue && (
        <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) setQueue(null); }}>
          <div className="modal-card" role="dialog" aria-label="Trier ma boîte" data-triage-modal style={{ ...modalStyle, width: 460 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>

              <span data-triage-progress style={{ fontSize: 13, color: "var(--text-dim)" }}>{Math.min(i + 1, queue.length)} sur {queue.length}</span>
            </div>
            {done || !cur ? (
              <div data-triage-done style={{ textAlign: "center", padding: "20px 0" }}><div style={{ fontSize: 40 }}>🎉</div><div style={{ fontSize: 15, fontWeight: 600, margin: "6px 0 14px" }}>Boîte triée !</div><button type="button" data-triage-close onClick={() => setQueue(null)} style={primaryBtn}>Terminer</button></div>
            ) : (<>
              <div data-triage-task style={{ background: "var(--bg)", border: "1px solid var(--border-soft)", borderRadius: 12, padding: "16px 18px", marginBottom: 14 }}>
                <div style={{ fontSize: 17, fontWeight: 600, overflowWrap: "anywhere" }}>{cur.title}</div>
                {cur.notes && <div style={{ fontSize: 13, color: "var(--text-dim)", marginTop: 6, whiteSpace: "pre-wrap" }}>{cur.notes.slice(0, 200)}</div>}
              </div>

                {btn("today", "1 · Aujourd'hui", () => setDay("today"))}{btn("tomorrow", "2 · Demain", () => setDay("tomorrow"))}{btn("monday", "3 · Lundi", () => setDay("monday"))}{btn("week", "4 · Dans une semaine", () => setDay("week"))}
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {btn("skip", "5 · Plus tard", next)}{btn("trash", "Corbeille", trash)}
                <button type="button" onClick={() => setQueue(null)} style={{ ...chipBtn, marginLeft: "auto" }}>Arrêter</button>

function doneStreak(me, tasks) {
  const days = new Set(tasks.filter(t => t.done && t.done_at && assigneeIds(t).includes(me.id)).map(t => parisDay(Date.parse(t.done_at))));
  let n = 0, d = parisDay(); if (!days.has(d)) d = shiftDay(d, -1);
  while (days.has(d)) { n++; d = shiftDay(d, -1); }
  return n;
}
function printWeekReview({ me, tasks, meetings, attendees }) {
  const today = parisDay(), monday = shiftDay(today, 1 - isoWd(today)), sunday = shiftDay(monday, 6);
  const mine = tasks.filter(t => assigneeIds(t).includes(me.id) && !t.deleted_at);
  const dd = (t) => parisDay(Date.parse(t.done_at));
  const done = mine.filter(t => t.done && t.done_at && dd(t) >= monday && dd(t) <= sunday);
  const late = mine.filter(t => !t.done && t.due && t.due < today);
  const next = mine.filter(t => !t.done && t.due && t.due >= today && t.due <= shiftDay(today, 7)).sort((a, b) => a.due.localeCompare(b.due));
  const meets = meetings.filter(m => { const d = parisDay(Date.parse(m.starts_at)); return d >= monday && d <= sunday && (m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined")); }).length;
  const est = done.reduce((a, t) => a + (t.estimate_min || 0), 0);
  const ul = (arr, f) => arr.length ? `<ul>${arr.map(f).join("")}</ul>` : `<p class="none">Aucune.</p>`;
  printHtml(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Bilan de la semaine</title><style>body{font:14px/1.55 Georgia,serif;color:#111;margin:28px}h1{font-size:22px;margin:0}h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #999}.sub{color:#555;font-size:12px;margin:2px 0 14px}ul{margin:0;padding-left:20px}.none{color:#777;font-style:italic;margin:4px 0}.k{display:flex;gap:24px;margin:10px 0}.k b{font-size:22px;display:block}@media print{body{margin:12mm}}</style></head><body><h1>Bilan de la semaine</h1><p class="sub">${escH(me.display_name)} · du ${escH(fmtDay(monday, { day: "numeric", month: "long" }))} au ${escH(fmtDay(sunday, { day: "numeric", month: "long", year: "numeric" }))}</p><div class="k"><div><b>${done.length}</b>tâche(s) terminée(s)</div><div><b>${meets}</b>réunion(s)</div><div><b>${escH(est ? fmtEst(est) : "—")}</b>travail estimé terminé</div></div><h2>Terminé cette semaine</h2>${ul(done, t => `<li>${escH(t.title)}</li>`)}<h2>En retard</h2>${ul(late, t => `<li>${escH(t.title)} <small>(échéance ${escH(fmtDay(t.due, { day: "numeric", month: "long" }))})</small></li>`)}<h2>À venir (7 jours)</h2>${ul(next, t => `<li>${escH(t.title)} <small>(${escH(fmtDay(t.due, { weekday: "long", day: "numeric", month: "long" }))})</small></li>`)}</body></html>`);
}

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", marginBottom: 12 }}>{[1, 5, 10, 15, 30].map(m => <button key={m} type="button" data-timer-preset={m} onClick={() => start(m)} style={chipBtn}>{m} min</button>)}
        <span style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><input type="number" data-timer-custom min={1} max={600} value={custom} onChange={e => setCustom(e.target.value)} style={{ ...inputStyle, width: 74, padding: "6px 8px" }} aria-label="Durée en minutes" /><button type="button" data-timer-custom-go onClick={() => start(Math.min(600, Math.max(1, Number(custom) || 1)))} style={chipBtn}>Lancer</button></span></div>
      <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
        {endAt ? <button type="button" data-timer-pause onClick={pause} style={{ ...secondaryBtn, width: "auto", padding: "9px 18px" }}>Pause</button> : paused ? <button type="button" data-timer-resume onClick={resume} style={{ ...primaryBtn, width: "auto", padding: "9px 18px" }}>Reprendre</button> : null}
        {(endAt || paused) ? <button type="button" data-timer-reset onClick={reset} style={{ ...secondaryBtn, width: "auto", padding: "9px 18px" }}>Réinitialiser</button> : null}</div>
      <p style={{ fontSize: 12, color: "var(--text-dimmer)", textAlign: "center", margin: "14px 0 0" }}>Un signal sonore retentit à la fin tant que Le Carnet reste ouvert. Pour un minuteur lié à une tâche, utilisez le mode Focus.</p>
    </div>
  );
}

/* ---------------- Lot I : Idées et Liens ---------------- */
/* ===== Boîte à idées ===== */
const IDEA_STATUS = { new: ["Nouvelle", "var(--text-dim)"], kept: ["Retenue", "#5B8DEF"], done: ["Réalisée", "#1F9D6B"], dropped: ["Écartée", "var(--text-dimmer)"] };
function IdeasView({ me, people, ideas, votes, notify }) {
  const canWrite = me.role !== "guest", isAdmin = me.role === "admin";
  const [filter, setFilter] = useState("all"), [sort, setSort] = useState("votes");
  const [title, setTitle] = useState(""), [details, setDetails] = useState("");
  const [open, setOpen] = useState(null), [busy, setBusy] = useState(false);
  const votesOf = (id) => votes.filter(v => v.idea_id === id);
  const counts = { all: ideas.length }; for (const k of Object.keys(IDEA_STATUS)) counts[k] = ideas.filter(i => i.status === k).length;
  const shown = ideas.filter(i => filter === "all" || i.status === filter).sort((a, b) =>
    sort === "votes" ? votesOf(b.id).length - votesOf(a.id).length || b.created_at.localeCompare(a.created_at) : b.created_at.localeCompare(a.created_at));
  const submit = async (ev) => {
    ev.preventDefault(); const t = title.trim(); if (!t || busy) return; setBusy(true);
    const { error } = await supabase.from("ideas").insert({ server_id: me.server_id, title: t, details: details.trim(), created_by: me.id });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setTitle(""); setDetails(""); notify("Idée proposée. Merci !");
  };
  const vote = async (i) => {
    const mineV = votesOf(i.id).some(v => v.user_id === me.id);
    const { error } = mineV
      ? await supabase.from("idea_votes").delete().eq("idea_id", i.id).eq("user_id", me.id)
      : await supabase.from("idea_votes").insert({ idea_id: i.id, user_id: me.id, server_id: me.server_id });
    if (error) notify(error.message, "err");
  };
  const setStatus = async (i, status) => { const { error } = await supabase.from("ideas").update({ status }).eq("id", i.id); if (error) notify(error.message, "err"); else notify("Statut mis à jour : " + IDEA_STATUS[status][0].toLowerCase() + "."); };
  const remove = async (i) => { if (!window.confirm(`Supprimer l'idée « ${i.title} » ?`)) return; const { error } = await supabase.from("ideas").delete().eq("id", i.id); if (error) notify(error.message, "err"); else notify("Idée supprimée."); };
  const toTask = async (i) => {
    const { error } = await supabase.from("tasks").insert({ title: i.title.slice(0, 120), notes: (i.details || "").slice(0, 2000), label: LABELS[0].id, priority: 2, assignees: [me.id], assignee: me.id, tags: [], done: false, created_by: me.id, server_id: me.server_id });
    if (error) { notify(error.message, "err"); return; }
    notify("Tâche créée à partir de l'idée.");
    if (isAdmin && i.status === "new") setStatus(i, "kept");
  };
  const copyIdea = async (i) => { await copyText(`${i.title}${i.details ? "\n" + i.details : ""}\n(${votesOf(i.id).length} vote${votesOf(i.id).length > 1 ? "s" : ""})`); notify("Idée copiée."); };
  const mineV = (i) => votesOf(i.id).some(v => v.user_id === me.id);
  const chip = (id, label) => <button key={id} type="button" data-idea-filter={id} aria-pressed={filter === id} onClick={() => setFilter(id)} style={{ ...chipBtn, background: filter === id ? "var(--panel-2)" : "transparent", fontWeight: filter === id ? 600 : 500 }}>{label} · {counts[id] || 0}</button>;
  return (
    <div data-ideas-view>
      {pageTitle("Idées", "Proposez, votez, décidez ensemble : les idées les plus soutenues remontent en haut, et les administrateurs choisissent celles qui passent à l'action.")}
      {canWrite ? (
        <form onSubmit={submit} className="paper" style={{ border: "1px solid var(--border-soft)", borderRadius: 14, padding: 14, marginBottom: 16, display: "grid", gap: 8 }}>
          <input data-idea-title value={title} onChange={e => setTitle(e.target.value)} maxLength={120} placeholder="Votre idée en une phrase…" aria-label="Titre de l'idée" style={inputStyle} />
          {title.trim() && <textarea data-idea-details value={details} onChange={e => setDetails(e.target.value)} maxLength={1500} rows={3} placeholder="Précisions (facultatif)" aria-label="Précisions" style={{ ...inputStyle, resize: "vertical" }} />}
          <div><button type="submit" data-idea-submit disabled={!title.trim() || busy} style={{ ...primaryBtn, width: "auto", padding: "9px 18px" }}>Proposer l'idée</button></div>
        </form>) : <p style={{ color: "var(--text-dim)", fontSize: 13.5 }}>En tant qu'invité, vous pouvez consulter les idées mais pas en proposer ni voter.</p>}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 14 }}>
        {chip("all", "Toutes")}{Object.entries(IDEA_STATUS).map(([k, v]) => chip(k, v[0] + "s"))}
        <span style={{ marginLeft: "auto", display: "flex", gap: 6, alignItems: "center", fontSize: 13, color: "var(--text-dim)" }}>Tri
          <select data-idea-sort value={sort} onChange={e => setSort(e.target.value)} style={{ ...inputStyle, width: "auto", padding: "6px 10px" }}><option value="votes">Plus soutenues</option><option value="recent">Plus récentes</option></select></span>
      </div>
      {shown.length === 0 && <div data-ideas-empty className="paper" style={{ border: "1px dashed var(--border-soft)", borderRadius: 14, padding: "30px 22px", textAlign: "center", color: "var(--text-dim)", fontSize: 14, lineHeight: 1.6 }}>{ideas.length === 0 ? "Aucune idée pour l'instant. Lancez-vous : une bonne idée tient souvent en une phrase." : "Aucune idée dans cette catégorie."}</div>}
      <div style={{ display: "grid", gap: 10 }}>
        {shown.map(i => { const n = votesOf(i.id).length, st = IDEA_STATUS[i.status] || IDEA_STATUS.new, mv = mineV(i), canEdit = i.created_by === me.id || isAdmin; return (
          <div key={i.id} data-idea={i.title} data-idea-status={i.status} className="paper" style={{ display: "flex", gap: 14, border: "1px solid var(--border-soft)", borderRadius: 14, padding: "12px 16px", opacity: i.status === "dropped" ? 0.7 : 1 }}>
            <button type="button" data-idea-vote aria-pressed={mv} aria-label={(mv ? "Retirer votre vote pour « " : "Voter pour « ") + i.title + " »"} disabled={!canWrite} onClick={() => vote(i)} style={{ flex: "none", width: 54, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2, border: "1px solid " + (mv ? "var(--accent)" : "var(--border)"), background: mv ? "var(--panel-2)" : "transparent", color: "var(--text)", borderRadius: 12, cursor: canWrite ? "pointer" : "default", fontFamily: "inherit" }}>
              <span aria-hidden="true" style={{ fontSize: 15 }}>▲</span><strong data-idea-count style={{ fontSize: 16 }}>{n}</strong></button>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
                <strong style={{ fontSize: 15.5, overflowWrap: "anywhere" }}>{i.title}</strong>
                <span data-idea-badge style={{ fontSize: 11.5, fontWeight: 600, color: st[1], border: "1px solid currentColor", borderRadius: 20, padding: "1px 8px" }}>{st[0]}</span>
              </div>
              {i.details && <div style={{ fontSize: 13.5, color: "var(--text-dim)", margin: "4px 0 0", whiteSpace: "pre-wrap", overflowWrap: "anywhere", lineHeight: 1.5 }}>{i.details}</div>}
              <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 6 }}>Proposée par {nameOfPerson(people, i.created_by).split(" ")[0]} · {fmtDay(parisDay(new Date(i.created_at)))}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                {isAdmin && <select data-idea-status-set value={i.status} onChange={e => setStatus(i, e.target.value)} aria-label="Statut de l'idée" style={{ ...inputStyle, width: "auto", padding: "4px 8px", fontSize: 12.5 }}>{Object.entries(IDEA_STATUS).map(([k, v]) => <option key={k} value={k}>{v[0]}</option>)}</select>}
                {canWrite && <button type="button" data-idea-task onClick={() => toTask(i)} style={chipBtn}>Créer une tâche</button>}
                <button type="button" data-idea-copy onClick={() => copyIdea(i)} style={chipBtn}>Copier</button>
                {canEdit && <button type="button" data-idea-delete onClick={() => remove(i)} style={{ ...chipBtn, color: "var(--late)" }}>Supprimer</button>}
              </div>
            </div>
          </div>); })}
      </div>
    </div>
  );
}

/* ===== Bibliothèque de liens ===== */
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (_) { return u; } };
const normUrl = (u) => { const t = String(u || "").trim(); if (!t) return ""; return /^https?:\/\//i.test(t) ? t : "https://" + t; };
function LinksView({ me, people, links, notify }) {
  const canWrite = me.role !== "guest", isAdmin = me.role === "admin";
  const [q, setQ] = useState(""), [tag, setTag] = useState("");
  const [modal, setModal] = useState(null); // { id? }
  const [f, setF] = useState({ title: "", url: "", description: "", tags: "" });
  const canEdit = (l) => l.created_by === me.id || isAdmin;
  const allTags = [...new Set(links.flatMap(l => l.tags || []))].sort((a, b) => a.localeCompare(b, "fr"));
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const shown = links.filter(l => (!tag || (l.tags || []).includes(tag)) && (!q.trim() || norm([l.title, l.url, l.description, (l.tags || []).join(" ")].join(" ")).includes(norm(q.trim()))))
    .sort((a, b) => Number(b.pinned) - Number(a.pinned) || b.created_at.localeCompare(a.created_at));
  const openNew = () => { setF({ title: "", url: "", description: "", tags: "" }); setModal({}); };
  const openEdit = (l) => { setF({ title: l.title, url: l.url, description: l.description || "", tags: (l.tags || []).join(", ") }); setModal({ id: l.id }); };
  const tagsOf = (s) => [...new Set(String(s).split(/[,;]/).map(t => t.trim().toLowerCase().slice(0, 20)).filter(Boolean))].slice(0, 6);
  const save = async () => {
    const url = normUrl(f.url);
    if (!/^https?:\/\/[^\s]+$/i.test(url) || url.length < 8) { notify("Cette adresse ne semble pas valide.", "err"); return; }
    const row = { title: (f.title.trim() || hostOf(url)).slice(0, 100), url: url.slice(0, 500), description: f.description.trim().slice(0, 300), tags: tagsOf(f.tags) };
    const { error } = modal.id ? await supabase.from("links").update(row).eq("id", modal.id) : await supabase.from("links").insert({ ...row, server_id: me.server_id, created_by: me.id });
    if (error) { notify(error.message, "err"); return; }
    setModal(null); notify(modal.id ? "Lien modifié." : "Lien ajouté.");
  };
  const pin = async (l) => { const { error } = await supabase.from("links").update({ pinned: !l.pinned }).eq("id", l.id); if (error) notify(error.message, "err"); };
  const remove = async (l) => { if (!window.confirm(`Supprimer le lien « ${l.title} » ?`)) return; const { error } = await supabase.from("links").delete().eq("id", l.id); if (error) notify(error.message, "err"); else notify("Lien supprimé."); };
  const copy = async (l) => { await copyText(l.url); notify("Adresse copiée."); };
  return (
    <div data-links-view>
      {pageTitle("Liens", "La bibliothèque de liens de votre équipe : documents, outils, tableaux de bord… tout au même endroit, avec recherche et étiquettes.", canWrite && <button type="button" data-link-new onClick={openNew} style={{ ...primaryBtn, width: "auto", padding: "10px 18px" }}>+ Ajouter un lien</button>)}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        <input data-link-search type="search" value={q} onChange={e => setQ(e.target.value)} placeholder="Rechercher un lien…" aria-label="Rechercher un lien" style={{ ...inputStyle, flex: 1, minWidth: 200 }} />
      </div>
      {allTags.length > 0 && <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
        <button type="button" data-link-tag="" aria-pressed={!tag} onClick={() => setTag("")} style={{ ...chipBtn, background: !tag ? "var(--panel-2)" : "transparent", fontWeight: !tag ? 600 : 500 }}>Tous</button>
        {allTags.map(t => <button key={t} type="button" data-link-tag={t} aria-pressed={tag === t} onClick={() => setTag(tag === t ? "" : t)} style={{ ...chipBtn, background: tag === t ? "var(--panel-2)" : "transparent", fontWeight: tag === t ? 600 : 500 }}>#{t}</button>)}
      </div>}
      {shown.length === 0 && <div data-links-empty className="paper" style={{ border: "1px dashed var(--border-soft)", borderRadius: 14, padding: "30px 22px", textAlign: "center", color: "var(--text-dim)", fontSize: 14, lineHeight: 1.6 }}>{links.length === 0 ? "Aucun lien pour l'instant. Ajoutez le premier : un document de référence, un outil que tout le monde utilise…" : "Aucun lien ne correspond à votre recherche."}</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 12 }}>
        {shown.map(l => (
          <div key={l.id} data-link={l.title} data-pinned={l.pinned ? "1" : "0"} className="paper" style={{ border: "1px solid " + (l.pinned ? "var(--accent)" : "var(--border-soft)"), borderRadius: 14, padding: "12px 16px", display: "flex", flexDirection: "column", gap: 4 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
              {l.pinned && <span aria-label="Épinglé" title="Épinglé">📌</span>}
              <a data-link-open href={l.url} target="_blank" rel="noopener noreferrer" style={{ fontWeight: 600, fontSize: 15.5, color: "var(--text)", overflowWrap: "anywhere" }}>{l.title}</a>
            </div>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)", overflowWrap: "anywhere" }}>{hostOf(l.url)} · ajouté par {nameOfPerson(people, l.created_by).split(" ")[0]}</div>
            {l.description && <div style={{ fontSize: 13.5, color: "var(--text-dim)", lineHeight: 1.45, overflowWrap: "anywhere" }}>{l.description}</div>}
            {(l.tags || []).length > 0 && <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{l.tags.map(t => <span key={t} style={{ fontSize: 11.5, color: "var(--text-dim)" }}>#{t}</span>)}</div>}
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
              <button type="button" data-link-copy onClick={() => copy(l)} style={chipBtn}>Copier</button>
              {canEdit(l) && <button type="button" data-link-pin onClick={() => pin(l)} style={chipBtn}>{l.pinned ? "Désépingler" : "Épingler"}</button>}
              {canEdit(l) && <button type="button" data-link-edit onClick={() => openEdit(l)} style={chipBtn}>Modifier</button>}
              {canEdit(l) && <button type="button" data-link-delete onClick={() => remove(l)} style={{ ...chipBtn, color: "var(--late)" }}>Supprimer</button>}
            </div>
          </div>))}
      </div>
      {modal && (
        <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) setModal(null); }}>
          <div className="modal-card" role="dialog" aria-label={modal.id ? "Modifier le lien" : "Nouveau lien"} style={{ ...modalStyle, width: 460 }}>
            <h2 style={{ fontFamily: "Literata, serif", fontSize: 20, margin: "0 0 14px" }}>{modal.id ? "Modifier le lien" : "Nouveau lien"}</h2>
            <Field label="Adresse"><input data-link-url autoFocus value={f.url} onChange={e => setF({ ...f, url: e.target.value })} maxLength={500} placeholder="https://…" style={inputStyle} /></Field>
            <Field label="Titre (facultatif)"><input data-link-title value={f.title} onChange={e => setF({ ...f, title: e.target.value })} maxLength={100} placeholder="Par défaut : le nom du site" style={inputStyle} /></Field>
            <Field label="Description (facultatif)"><textarea data-link-desc value={f.description} onChange={e => setF({ ...f, description: e.target.value })} maxLength={300} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>
            <Field label="Étiquettes, séparées par des virgules"><input data-link-tags value={f.tags} onChange={e => setF({ ...f, tags: e.target.value })} placeholder="doc, outils, finance" style={inputStyle} /></Field>
            <div style={{ display: "flex", gap: 8, marginTop: 6 }}><button type="button" onClick={() => setModal(null)} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" data-link-save onClick={save} disabled={!f.url.trim()} style={{ ...primaryBtn, flex: 1 }}>Enregistrer</button></div>
          </div>
        </div>)}
    </div>
  );
}

/* ---------------- Accueil : carte d'activité, bloc-notes rapide, personnalisation ---------------- */
/* ===== Lot L : Contacts et Remerciements ===== */
const vEsc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\;");
const toVCard = (cs) => cs.map(c => ["BEGIN:VCARD", "VERSION:3.0", "FN:" + vEsc(c.name), "N:" + vEsc(c.name) + ";;;;", c.org ? "ORG:" + vEsc(c.org) : null, c.phone ? "TEL:" + vEsc(c.phone) : null, c.email ? "EMAIL:" + vEsc(c.email) : null, c.address ? "ADR:;;" + vEsc(c.address) + ";;;;" : null, c.notes ? "NOTE:" + vEsc(c.notes) : null, (c.tags || []).length ? "CATEGORIES:" + c.tags.map(vEsc).join(",") : null, "END:VCARD"].filter(Boolean).join("\r\n")).join("\r\n") + "\r\n";
const ctCell = (v) => { let s = String(v == null ? "" : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
const toContactsCsv = (cs) => "\uFEFF" + [["Nom", "Téléphone", "E-mail", "Organisation", "Adresse", "Notes", "Étiquettes"].map(ctCell).join(";")].concat(cs.map(c => [c.name, c.phone, c.email, c.org, c.address, c.notes, (c.tags || []).join(", ")].map(ctCell).join(";"))).join("\r\n") + "\r\n";
const telHref = (p) => "tel:" + String(p || "").replace(/[^\d+]/g, "");
const EMPTY_CONTACT = { name: "", phone: "", email: "", org: "", address: "", notes: "", tags: "" };
function ContactsView({ me, people, contacts, notify }) {
  const canWrite = me.role !== "guest", isAdmin = me.role === "admin";
  const [q, setQ] = useState(""), [tag, setTag] = useState(""), [favOnly, setFavOnly] = useState(false);
  const [modal, setModal] = useState(null), [f, setF] = useState(EMPTY_CONTACT);
  const canEdit = (c) => c.created_by === me.id || isAdmin;
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const allTags = [...new Set(contacts.flatMap(c => c.tags || []))].sort((a, b) => a.localeCompare(b, "fr"));
  const shown = contacts.filter(c => (!favOnly || c.favorite) && (!tag || (c.tags || []).includes(tag)) && (!q.trim() || norm([c.name, c.org, c.phone, String(c.phone || "").replace(/\D/g, ""), c.email, c.address, c.notes, (c.tags || []).join(" ")].join(" ")).includes(norm(q.trim()))))
    ;
  const letterOf = (c) => { const l = norm(c.name).trim().charAt(0).toUpperCase(); return /[A-Z]/.test(l) ? l : "#"; };
  shown.sort((a, b) => (letterOf(a) === "#") - (letterOf(b) === "#") || a.name.localeCompare(b.name, "fr", { sensitivity: "base" }));
  const groups = []; for (const c of shown) { const l = letterOf(c); if (!groups.length || groups[groups.length - 1][0] !== l) groups.push([l, []]); groups[groups.length - 1][1].push(c); }
  const tagsOf = (s) => [...new Set(String(s).split(/[,;]/).map(t => t.trim().toLowerCase().slice(0, 20)).filter(Boolean))].slice(0, 6);
  const openNew = () => { setF(EMPTY_CONTACT); setModal({}); };
  const openEdit = (c) => { setF({ name: c.name, phone: c.phone || "", email: c.email || "", org: c.org || "", address: c.address || "", notes: c.notes || "", tags: (c.tags || []).join(", ") }); setModal({ id: c.id }); };
  const save = async () => {
    const name = f.name.trim(); if (!name) { notify("Le nom est obligatoire.", "err"); return; }
    const email = f.email.trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { notify("Cette adresse e-mail ne semble pas valide.", "err"); return; }
    const row = { name: name.slice(0, 100), phone: f.phone.trim().slice(0, 30), email: email.slice(0, 120), org: f.org.trim().slice(0, 100), address: f.address.trim().slice(0, 200), notes: f.notes.trim().slice(0, 500), tags: tagsOf(f.tags) };
    const { error } = modal.id ? await supabase.from("contacts").update(row).eq("id", modal.id) : await supabase.from("contacts").insert({ ...row, server_id: me.server_id, created_by: me.id });
    if (error) { notify(error.message, "err"); return; }
    setModal(null); notify(modal.id ? "Contact modifié." : "Contact ajouté.");
  };
  const fav = async (c) => { const { error } = await supabase.from("contacts").update({ favorite: !c.favorite }).eq("id", c.id); if (error) notify(error.message, "err"); };
  const remove = async (c) => { if (!window.confirm(`Supprimer le contact « ${c.name} » ?`)) return; const { error } = await supabase.from("contacts").delete().eq("id", c.id); if (error) notify(error.message, "err"); else notify("Contact supprimé."); };
  const copy = async (c) => { await copyText([c.name, c.org, c.phone, c.email, c.address].filter(Boolean).join("\n")); notify("Fiche copiée."); };
  const exportAs = (kind) => {

const HOME_SECTIONS = [["inbox", "Boîte de réception (tâches sans date)"], ["countdown", "Compte à rebours"], ["podium", "Podium de la semaine"], ["goal", "Objectif du jour"], ["evening", "Bilan du soir (après 17 h)"], ["start", "Guide « Premiers pas »"], ["tip", "Astuce du jour"], ["quote", "Pensée du jour"], ["kudos", "Remerciements reçus"], ["agenda", "Anniversaires et jours fériés"], ["pins", "Tâches épinglées"], ["stats", "Mes statistiques"], ["heat", "Carte d'activité"], ["scratch", "Bloc-notes rapide"], ["recap", "Récap de la semaine"]];
function ActivityHeat({ me, tasks }) {
  const WEEKS = 26;
  const { cells, total, best } = useMemo(() => {
    const today = parisDay(), counts = new Map();
    for (const t of tasks) if (t.done && t.done_at && assigneeIds(t).includes(me.id)) { const d = parisDay(Date.parse(t.done_at)); counts.set(d, (counts.get(d) || 0) + 1); }
    const monday = shiftDay(today, 1 - isoWd(today) - (WEEKS - 1) * 7);
    const out = []; let total = 0, best = 0;
    for (let w = 0; w < WEEKS; w++) for (let d = 0; d < 7; d++) { const day = shiftDay(monday, w * 7 + d), n = day > today ? -1 : (counts.get(day) || 0); if (n > 0) total += n; best = Math.max(best, n); out.push({ day, n, w, d }); }
    return { cells: out, total, best };
  }, [tasks, me.id]);
  const level = (n) => n <= 0 ? 0 : best <= 1 ? 4 : Math.min(4, Math.ceil((n / best) * 4));
  const shade = (l) => l === 0 ? "var(--bg-2)" : `color-mix(in srgb, var(--accent) ${[0, 28, 50, 75, 100][l]}%, transparent)`;
  return (
    <div data-heat style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10 }}>Carte d'activité</div>
      <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 16px" }}>
        <div style={{ overflowX: "auto", paddingBottom: 4 }}>
          <div style={{ display: "grid", gridTemplateRows: "repeat(7, 12px)", gridAutoFlow: "column", gridAutoColumns: "12px", gap: 3, width: "max-content" }}>
            {cells.map(c => <div key={c.day} data-heat-cell={c.day} data-count={Math.max(0, c.n)} title={c.n < 0 ? "" : `${fmtDay(c.day, { weekday: "long", day: "numeric", month: "long" })} : ${c.n} tâche${c.n > 1 ? "s" : ""} terminée${c.n > 1 ? "s" : ""}`} style={{ gridRow: c.d + 1, gridColumn: c.w + 1, width: 12, height: 12, borderRadius: 3, background: c.n < 0 ? "transparent" : shade(level(c.n)), border: c.n < 0 ? "none" : "1px solid var(--border-soft)" }} />)}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, fontSize: 12, color: "var(--text-dim)", flexWrap: "wrap" }}>
          <span data-heat-total><strong>{total}</strong> tâche{total > 1 ? "s" : ""} terminée{total > 1 ? "s" : ""} ces 6 derniers mois</span>
          <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 4 }}>Moins {[0, 1, 2, 3, 4].map(l => <span key={l} style={{ width: 12, height: 12, borderRadius: 3, background: shade(l), border: "1px solid var(--border-soft)" }} />)} Plus</span>
        </div>
      </div>
    </div>
  );
}
