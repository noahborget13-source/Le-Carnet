async function callApi(path, body, session) {
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 30000) : null;   // jamais d'attente infinie
  let res;
  try {
    res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session.access_token } : {}) },
      body: JSON.stringify(body),
      ...(ctl ? { signal: ctl.signal } : {}),
    });
  } catch (e) { throw new Error(e && e.name === "AbortError" ? "Le serveur met trop de temps à répondre. Réessayez." : "Connexion impossible. Vérifiez votre réseau."); }
  finally { if (timer) clearTimeout(timer); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Erreur serveur");
  return data;
}

function AlertBanner({ inline }) {
  const [alert, setAlert] = useState(null);
  const [hidden, setHidden] = useState(false);
  const keyOf = (a) => a.id + "|" + a.display_at + "|" + a.message;
  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const q = (cols) => supabase.from('system_alerts').select(cols).lte('display_at', new Date().toISOString()).order('display_at', { ascending: false }).limit(5);
        let { data, error } = await q('id,message,display_at,is_maintenance,maint_end');
        if (error) ({ data, error } = await q('id,message,display_at,is_maintenance'));   // migration 07 pas encore lancée
        if (error || !alive) return;
        const now = new Date();
        // Une annonce de maintenance disparaît toute seule une fois la maintenance terminée.
        const a = (data || []).find(r => r.message && r.message.trim() && (!r.is_maintenance || (r.maint_end && new Date(r.maint_end) > now)));
        if (!a) { setAlert(null); return; }
        let dismissed = null;
        try { dismissed = localStorage.getItem("carnet-alert-dismissed"); } catch (_) {}
        setAlert(a); setHidden(dismissed === keyOf(a));
      } catch (_) {}
    };
    load();
    const id = setInterval(load, 5 * 60 * 1000);
    const onVis = () => { if (!document.hidden) load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { alive = false; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  if (!alert || hidden) return null;
  const close = () => { try { localStorage.setItem("carnet-alert-dismissed", keyOf(alert)); } catch (_) {} setHidden(true); };
  return (
    <div className="alert-banner" role="status" style={{ ...(inline ? { marginBottom: 18 } : { position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 45, width: "min(560px, 92vw)", boxShadow: "0 12px 30px rgba(0,0,0,.45)" }), display: "flex", alignItems: "flex-start", gap: 10, background: "var(--warn-bg)", border: "1px solid var(--warn-border)", color: "var(--warn-text)", borderRadius: 12, padding: "11px 14px", fontSize: 13.5, lineHeight: 1.45 }}>
      <I.Alert size={17} style={{ flexShrink: 0, marginTop: 1, color: "#FFC97A" }} />
      <div style={{ flex: 1, minWidth: 0, wordBreak: "break-word" }}>{alert.message}</div>
      <button type="button" onClick={close} aria-label="Fermer l'annonce" style={{ background: "none", border: "none", color: "var(--warn-text)", cursor: "pointer", padding: 2, flexShrink: 0 }}><I.X size={16} /></button>
    </div>
  );
}

  const done = list.filter(t => t.done && inRange(dayOf(t.done_at)));
  const open = list.filter(t => !t.done);
  const late = open.filter(t => t.due && t.due < today);
  const dueIn = list.filter(t => t.due && t.due >= from && t.due <= today);
  const onTime = dueIn.filter(t => t.done && dayOf(t.done_at) && dayOf(t.done_at) <= t.due);
  const lead = done.map(t => daysBetween(dayOf(t.created_at), dayOf(t.done_at))).filter(n => n >= 0);
  const avgLead = lead.length ? lead.reduce((a, b) => a + b, 0) / lead.length : null;

  const step = days > 31 ? 7 : 1;
  const series = [];
  for (let d = from; d <= today; d = shiftDay(d, step)) {

    series.push({ day: d, created: created.filter(t => { const x = dayOf(t.created_at); return x >= d && x <= end; }).length, done: done.filter(t => { const x = dayOf(t.done_at); return x >= d && x <= end; }).length });
  }

    const mine = list.filter(t => assigneeIds(t).includes(a.id));
    return { user: a, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length, late: mine.filter(t => !t.done && t.due && t.due < today).length };
  }).filter(r => r.done || r.open).sort((a, b) => b.done - a.done || b.open - a.open);

  }).filter(r => r.done || r.open);
  const byLabel = LABELS.map(l => ({ ...l, done: done.filter(t => t.label === l.id).length, open: open.filter(t => t.label === l.id).length })).filter(r => r.done || r.open);

}

/* ---------------- Aperçu : chiffres clés, activité, points à surveiller ---------------- */
function AdminSite({ notify }) {
  const [rows, setRows] = useState(null);
  const [msg, setMsg] = useState("");
  const [when, setWhen] = useState("");
  const [busy, setBusy] = useState(false);
  // Maintenance programmée
  const [mStart, setMStart] = useState("");
  const [mEnd, setMEnd] = useState("");
  const [mMsg, setMMsg] = useState("");
  const [mMsgEdited, setMMsgEdited] = useState(false);
  const [mConfirm, setMConfirm] = useState(false);
  const [mBusy, setMBusy] = useState(false);
  const load = async () => {
    const q = (cols) => supabase.from('system_alerts').select(cols).order('display_at', { ascending: false }).limit(40);
    let { data, error } = await q('id,message,display_at,is_maintenance,maint_start,maint_end');
    if (error) ({ data, error } = await q('id,message,display_at,is_maintenance'));      // migration 07 pas encore lancée
    if (error) notify(error.message, "err");
    setRows(data || []);
  };
  useEffect(() => { load(); }, []);
  const fmtDate = (iso) => new Date(iso).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
  const fmtHour = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
  const sameDay = (a, b) => new Date(a).toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" }) === new Date(b).toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" });
  const publish = async () => {
    const text = msg.trim();
    if (!text || busy) return;
    setBusy(true);
    const at = when ? new Date(when).toISOString() : new Date().toISOString();
    const { error } = await supabase.from('system_alerts').insert({ message: text.slice(0, 300), display_at: at, is_maintenance: false });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setMsg(""); setWhen("");
    notify(when ? "Annonce programmée." : "Annonce publiée.");
    load();
  };
  const remove = async (id, label) => {
    const { error } = await supabase.from('system_alerts').delete().eq('id', id);
    if (error) { notify(error.message, "err"); return; }
    notify(label || "Annonce supprimée.");
    load();
  };

  // ---- maintenance : validation + message proposé
  const startD = mStart ? new Date(mStart) : null, endD = mEnd ? new Date(mEnd) : null;
  const mError = !startD || !endD ? null
    : startD.getTime() < Date.now() + 60000 ? "Le début doit être dans le futur (au moins une minute)."
    : endD <= startD ? "La fin doit être après le début."
    : endD.getTime() - startD.getTime() > 48 * 3600000 ? "Une maintenance programmée dure 48 h au maximum."
    : null;
  const mValid = Boolean(startD && endD && !mError);
  const suggested = mValid ? `Maintenance prévue ${sameDay(startD, endD) ? `le ${startD.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Paris" })} de ${fmtHour(startD)} à ${fmtHour(endD)}` : `du ${fmtDate(startD)} au ${fmtDate(endD)}`}. Le site sera indisponible pendant ce temps.` : "";
  const shownMsg = mMsgEdited ? mMsg : suggested;
  const scheduleMaintenance = async () => {
    if (!mValid || mBusy) return;
    if (!mConfirm) { setMConfirm(true); return; }
    setMBusy(true);
    const text = shownMsg.trim().slice(0, 300);
    const { error } = await supabase.from('system_alerts').insert({
      is_maintenance: true, maint_start: startD.toISOString(), maint_end: endD.toISOString(),
      message: text || null, display_at: new Date().toISOString(),
    });
    setMBusy(false); setMConfirm(false);
    if (error) { notify(/maint_start|maint_end/.test(error.message) ? "Lancez d'abord migration-07-maintenance-programmee.sql dans Supabase." : error.message, "err"); return; }
    setMStart(""); setMEnd(""); setMMsg(""); setMMsgEdited(false);
    notify("Maintenance programmée.");
    load();
  };

  const ann = (rows || []).filter(r => !r.is_maintenance && r.message && r.message.trim());
  const maint = (rows || []).filter(r => r.is_maintenance).sort((a, b) => new Date(b.maint_start || b.display_at) - new Date(a.maint_start || a.display_at));
  const live = ann.find(r => new Date(r.display_at) <= new Date());
  const status = (r) => new Date(r.display_at) > new Date() ? ["Programmée", "#5B9EF5"] : (live && r.id === live.id) ? ["Affichée", "#5FBF8B"] : ["Remplacée", "var(--text-dimmer)"];
  const mStatus = (r) => {
    const now = Date.now(), s = r.maint_start ? new Date(r.maint_start).getTime() : null, e = r.maint_end ? new Date(r.maint_end).getTime() : null;
    if (s && s > now) return ["Programmée", "#5B9EF5"];
    if (e && e <= now) return ["Terminée", "var(--text-dimmer)"];
    return [s || e ? "En cours" : "En cours (manuelle)", "#FFB648"];
  };
  const dtInput = (v, set, label) => <div style={{ flex: "1 1 200px" }}><Field label={label}><input type="datetime-local" value={v} onChange={e => { set(e.target.value); setMConfirm(false); }} style={inputStyle} /></Field></div>;
  return (
    <div>
      <div style={adminBox}>
        <AdminHeading>Programmer une maintenance</AdminHeading>
        <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 10px", lineHeight: 1.5 }}>À l'heure de début, tous les visiteurs (vous compris) sont envoyés sur la page « Maintenance en cours ». À l'heure de fin, le site revient tout seul, sans rien à faire. Un bandeau peut prévenir à l'avance.</p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          {dtInput(mStart, setMStart, "Début (heure de votre appareil)")}
          {dtInput(mEnd, setMEnd, "Fin (obligatoire)")}
        </div>
        <Field label="Bandeau d'avertissement (300 caractères maximum, laissez vide pour ne rien afficher)"><textarea value={shownMsg} maxLength={300} rows={2} onChange={e => { setMMsg(e.target.value); setMMsgEdited(true); setMConfirm(false); }} placeholder="Choisissez un début et une fin : le message est proposé automatiquement" style={{ ...inputStyle, resize: "vertical" }} /></Field>
        {mError && <div style={{ fontSize: 12.5, color: "var(--late)", marginBottom: 10 }}>{mError}</div>}
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button type="button" onClick={scheduleMaintenance} disabled={!mValid || mBusy} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", opacity: mValid && !mBusy ? 1 : 0.5, ...(mConfirm ? { background: "#E2574C", boxShadow: "none" } : {}) }}>
            {mBusy ? "…" : mConfirm ? "Confirmer la programmation" : "Programmer la maintenance"}
          </button>
          {mConfirm && !mBusy && <button type="button" onClick={() => setMConfirm(false)} style={{ ...secondaryBtn, width: "auto", padding: "9px 14px" }}>Annuler</button>}
        </div>
        {maint.length > 0 && (
          <div style={{ marginTop: 18 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600, marginBottom: 4 }}>Maintenances</div>
            {maint.slice(0, 8).map(r => { const [lab, col] = mStatus(r); return (
              <div key={r.id} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderTop: "1px solid var(--border)" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5 }}>{r.maint_start ? <>{fmtDate(r.maint_start)} → {r.maint_end ? fmtDate(r.maint_end) : "sans fin"}</> : "Maintenance manuelle (is_maintenance dans Supabase)"}</div>
                  <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 3 }}>heure de Paris{r.message ? " · " + r.message : ""}</div>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, color: col, border: `1px solid ${col}`, borderRadius: 6, padding: "2px 7px", whiteSpace: "nowrap" }}>{lab}</span>
                <button type="button" onClick={() => remove(r.id, lab === "Programmée" ? "Maintenance annulée." : "Maintenance supprimée.")} style={{ ...iconBtn, color: "var(--late)" }} title={lab === "Programmée" ? "Annuler la maintenance" : "Supprimer"} aria-label={lab === "Programmée" ? "Annuler la maintenance" : "Supprimer la maintenance"}><I.Trash size={14} /></button>
              </div>
            ); })}
          </div>
        )}
      </div>
      <div style={adminBox}>
        <AdminHeading>Nouvelle annonce</AdminHeading>
        <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 10px", lineHeight: 1.5 }}>Un bandeau visible par tous les visiteurs, sur l'accueil et dans l'application. Il apparaît à l'heure choisie ; la plus récente remplace la précédente.</p>
        <Field label="Message (300 caractères maximum)"><textarea value={msg} maxLength={300} onChange={e => setMsg(e.target.value)} rows={2} placeholder="Nouvelle fonction : les sondages dans la messagerie" style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 220px" }}><Field label="Afficher à partir de (heure de votre appareil)"><input type="datetime-local" value={when} onChange={e => setWhen(e.target.value)} style={inputStyle} /></Field></div>
          <button type="button" onClick={publish} disabled={!msg.trim() || busy} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", marginBottom: 14, opacity: msg.trim() && !busy ? 1 : 0.5 }}>{busy ? "…" : when ? "Programmer" : "Publier maintenant"}</button>
        </div>
      </div>
      <div style={adminBox}>
        <AdminHeading>Annonces</AdminHeading>
        {rows === null && <div style={{ padding: 10, display: "grid", placeItems: "center" }}><Spinner /></div>}
        {rows && ann.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune annonce.</div>}
        <div style={{ display: "flex", flexDirection: "column" }}>
          {ann.map(r => { const [lab, col] = status(r); return (
            <div key={r.id} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderTop: "1px solid var(--border)" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, wordBreak: "break-word" }}>{r.message}</div>
                <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 3 }}>{fmtDate(r.display_at)} (heure de Paris)</div>
              </div>
              <span style={{ fontSize: 11, fontWeight: 700, color: col, border: `1px solid ${col}`, borderRadius: 6, padding: "2px 7px", whiteSpace: "nowrap" }}>{lab}</span>
              <button type="button" onClick={() => remove(r.id)} style={{ ...iconBtn, color: "var(--late)" }} title="Supprimer" aria-label="Supprimer l'annonce"><I.Trash size={14} /></button>
            </div>
          ); })}
        </div>
      </div>
    </div>
  );
}

const supraDate = (iso) => new Date(iso).toLocaleString("fr-FR", { timeZone: "Europe/Paris", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function useSupraApi(session, action, deps = []) {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let alive = true;
    setState(s => ({ ...s, loading: true }));
    callApi("/api/admin-tools", { action, ...(deps[0] || {}) }, session).then(d => { if (alive) setState({ loading: false, data: d, error: null }); }).catch(e => { if (alive) setState({ loading: false, data: null, error: e.message }); });
    return () => { alive = false; };
  }, [tick, JSON.stringify(deps)]);
  return [state, () => setTick(t => t + 1)];
}

  useEffect(() => { const id = setTimeout(() => setDq(q.trim()), 250); return () => clearTimeout(id); }, [q]);
  const [st, reload] = useSupraApi(session, "supra-users", [{ q: dq }]);
  const unban = async (u) => {
    if (!window.confirm(`Débannir ${u.display_name} ?`)) return;
    try { await callApi("/api/admin-tools", { action: "supra-ban", userId: u.id, banned: false, alsoLinked: false }, session); notify("Compte débanni."); reload(); } catch (e) { notify(e.message, "err"); }
  };
  const users = (st.data && st.data.users) || [];
  return (
    <div data-supra-accounts>
      <input data-supra-search value={q} onChange={e => setQ(e.target.value)} placeholder="Rechercher par nom, identifiant, email ou serveur…" aria-label="Rechercher un compte" style={{ ...inputStyle, maxWidth: 460, marginBottom: 14 }} />
      {st.error && <EmptyState text={st.error} />}
      {!st.error && users.length === 0 && !st.loading && <EmptyState text="Aucun compte ne correspond." />}
      <div style={{ display: "grid", gap: 8 }}>
        {users.map(u => (
          <div key={u.id} data-supra-user={u.display_name} data-banned={u.banned_at ? "1" : "0"} style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", background: "var(--panel)", border: "1px solid " + (u.banned_at ? "#C2392B" : "var(--border)"), borderRadius: 12, padding: "10px 14px" }}>
            <div style={{ flex: "1 1 220px", minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 14 }}>{u.display_name} <span style={{ fontWeight: 400, color: "var(--text-dimmer)", fontSize: 12.5 }}>@{u.username}</span></div>
              <div style={{ fontSize: 12.5, color: "var(--text-dim)", overflow: "hidden", textOverflow: "ellipsis" }}>{u.email} · {u.server} · {u.role === "admin" ? "administrateur" : u.role === "moderator" ? "modérateur" : u.role === "guest" ? "invité" : "membre"}{u.status === "pending" ? " · en attente" : ""}</div>
              {u.banned_at && <div style={{ fontSize: 12.5, color: "var(--late)", marginTop: 2 }}>Banni le {supraDate(u.banned_at)}{u.ban_reason ? " — " + u.ban_reason : ""}</div>}
            </div>
            {u.banned_at
              ? <button type="button" data-unban onClick={() => unban(u)} style={chipBtn}>Débannir</button>
              : <button type="button" data-ban-open onClick={() => setBan(u)} style={{ ...chipBtn, color: "var(--late)" }}>Bannir</button>}
          </div>))}
      </div>
      {st.data && st.data.total > users.length && !dq && <p style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginTop: 10 }}>{users.length} comptes affichés sur {st.data.total} : utilisez la recherche pour affiner.</p>}
      {ban && <BanModal user={ban} session={session} notify={notify} onClose={() => setBan(null)} onDone={() => { setBan(null); reload(); }} />}
    </div>
  );
}
function SupraEmails({ session, notify }) {
  const [settings, setSettings] = useState(null);
  const [log, reloadLog] = useSupraApi(session, "supra-mail-log");
  const [subject, setSubject] = useState(""); const [message, setMessage] = useState("");
  const [audience, setAudience] = useState("admins"); const [serverId, setServerId] = useState("");
  const [confirm, setConfirm] = useState(false); const [busy, setBusy] = useState(false);
  const [ov] = useSupraApi(session, "supra-overview");
  const loadSettings = async () => { const { data } = await supabase.from("platform_settings").select("key,value"); const o = {}; for (const r of data || []) o[r.key] = r.value; setSettings(o); };
  useEffect(() => { loadSettings(); }, []);
  const toggle = async (key) => {
    const next = !(settings[key] !== false);
    const { error } = await supabase.from("platform_settings").upsert({ key, value: next, updated_at: new Date().toISOString() });
    if (error) { notify(error.message, "err"); return; }
    setSettings({ ...settings, [key]: next }); notify(next ? "Alerte activée." : "Alerte désactivée.");
  };
  const testMail = async () => { try { const r = await callApi("/api/admin-tools", { action: "supra-test-mail" }, session); notify(`Email de test envoyé (${r.to} adresse${r.to > 1 ? "s" : ""}).`); reloadLog(); } catch (e) { notify(e.message, "err"); } };
  const valid = subject.trim() && message.trim();
  const send = async () => {
    if (!valid || busy) return;
    if (!confirm) { setConfirm(true); return; }
    setBusy(true);
    try { const r = await callApi("/api/admin-tools", { action: "supra-broadcast", subject: subject.trim(), message: message.trim(), audience, serverId: serverId || undefined }, session); notify(`${r.sent} email${r.sent > 1 ? "s" : ""} envoyé${r.sent > 1 ? "s" : ""}${r.failed ? ` (${r.failed} échec${r.failed > 1 ? "s" : ""})` : ""}.`); setSubject(""); setMessage(""); setConfirm(false); reloadLog(); }
    catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const sw = (key, label, hint) => (
    <label key={key} data-alert={key} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderTop: "1px solid var(--border-soft)", cursor: "pointer" }}>
      <input type="checkbox" checked={settings ? settings[key] !== false : false} disabled={!settings} onChange={() => toggle(key)} style={{ marginTop: 4 }} />
      <span><span style={{ fontSize: 14, fontWeight: 600 }}>{label}</span><span style={{ display: "block", fontSize: 12.5, color: "var(--text-dim)", marginTop: 2 }}>{hint}</span></span>
    </label>);
  const d = log.data;
  return (
    <div data-supra-emails>
      <Panel title="Alertes que vous recevez par email" id="alerts" right={<button type="button" data-test-mail onClick={testMail} style={chipBtn}>Envoyer un email de test</button>}>
        {d && !d.mailConfigured && <div style={{ background: "var(--warn-bg)", border: "1px solid var(--warn-border)", color: "var(--warn-text)", borderRadius: 10, padding: "10px 14px", fontSize: 13, marginBottom: 10 }}>Les emails ne sont pas configurés sur Vercel (GMAIL_USER et GMAIL_APP_PASSWORD).</div>}
        {d && d.owners && d.owners.length > 0 && <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 6px" }}>Envoyées à : {d.owners.join(", ")}</p>}
        {sw("notify_signup", "Nouveau compte ou demande d'adhésion", "Un email dès qu'une personne rejoint ou demande à rejoindre un serveur.")}
        {sw("notify_server", "Nouveau serveur", "Un email dès qu'un serveur est créé.")}
      </Panel>
      <Panel title="Écrire aux administrateurs ou à tous les membres" id="broadcast">
        <Field label="Destinataires">
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <select data-bc-audience value={audience} onChange={e => { setAudience(e.target.value); setConfirm(false); }} style={{ ...inputStyle, width: "auto" }}><option value="admins">Les administrateurs de serveur</option><option value="all">Tous les membres</option></select>
            <select data-bc-server value={serverId} onChange={e => { setServerId(e.target.value); setConfirm(false); }} style={{ ...inputStyle, width: "auto" }}><option value="">Tous les serveurs</option>{((ov.data && ov.data.servers) || []).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select>
          </div>
        </Field>
        <Field label="Objet"><input data-bc-subject value={subject} onChange={e => { setSubject(e.target.value); setConfirm(false); }} maxLength={120} style={inputStyle} /></Field>
        <Field label="Message"><textarea data-bc-message value={message} onChange={e => { setMessage(e.target.value); setConfirm(false); }} rows={5} maxLength={5000} style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <button type="button" data-bc-send disabled={!valid || busy} onClick={send} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", opacity: valid ? 1 : 0.5 }}>{busy ? "Envoi…" : confirm ? "Confirmer l'envoi" : "Envoyer"}</button>
        <p style={{ fontSize: 12, color: "var(--text-dimmer)", margin: "10px 0 0" }}>100 destinataires au maximum par envoi, 3 envois groupés par heure.</p>
      </Panel>
      <Panel title="Derniers emails envoyés par le site" id="maillog" right={d && d.available ? <span style={{ fontSize: 12.5, color: "var(--text-dim)" }}>7 jours : {d.sent7d} envoyés, {d.failed7d} échec(s)</span> : null}>
        {d && !d.available && <EmptyState text="Journal indisponible." />}
        {d && d.available && d.rows.length === 0 && <EmptyState text="Aucun email pour l'instant." />}
        {d && d.rows.map((r, i) => <div key={i} style={{ display: "flex", gap: 10, padding: "7px 0", borderTop: i ? "1px solid var(--border-soft)" : "none", fontSize: 13 }}><span style={{ color: r.ok ? "#1F9D6B" : "var(--late)", width: 16 }}>{r.ok ? "✓" : "✗"}</span><span style={{ flex: 1, minWidth: 0 }}>{r.subject}{r.error ? <span style={{ color: "var(--late)" }}> — {r.error}</span> : null}</span><span style={{ color: "var(--text-dimmer)", whiteSpace: "nowrap" }}>{supraDate(r.at)}</span></div>)}
      </Panel>
    </div>
  );
}
const SUPRA_LOG_LABEL = { ban: "Bannissement", unban: "Fin de bannissement", broadcast: "Envoi groupé" };
function SupraLog({ session }) {
  const [st] = useSupraApi(session, "supra-log");
  if (st.loading && !st.data) return <div style={{ display: "grid", placeItems: "center", padding: 30 }}><Spinner /></div>;
  if (st.error) return <EmptyState text={st.error} />;
  const rows = st.data.rows;
  return (
    <div data-supra-log>
      {rows.length === 0 && <EmptyState text="Aucune action enregistrée pour l'instant." />}
      <div style={{ display: "grid", gap: 6 }}>{rows.map(r => (
        <div key={r.id} data-log-row={r.action} style={{ display: "flex", gap: 12, flexWrap: "wrap", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 10, padding: "9px 14px", fontSize: 13.5 }}>
          <strong style={{ minWidth: 150 }}>{SUPRA_LOG_LABEL[r.action] || r.action}</strong>
          <span style={{ flex: 1, minWidth: 140 }}>{r.target_label}{r.detail ? <span style={{ color: "var(--text-dim)" }}> — {r.detail}</span> : null}</span>
          <span style={{ color: "var(--text-dimmer)" }}>{supraDate(r.created_at)}</span>
        </div>))}</div>
    </div>
  );
}
function SupraWorkspace({ me, session, notify, onLogout }) {
  const [page, setPage] = useState(() => { try { const p = localStorage.getItem("carnet-supra-page"); return SUPRA_NAV.some(g => g.items.some(i => i[0] === p)) ? p : "overview"; } catch (_) { return "overview"; } });
  const [menuOpen, setMenuOpen] = useState(false);
  const go = (p) => { setPage(p); setMenuOpen(false); try { localStorage.setItem("carnet-supra-page", p); } catch (_) {} try { window.scrollTo(0, 0); } catch (_) {} };
  const navBtn = ([id, label, icon]) => (
    <button key={id} type="button" data-supra-nav={id} aria-current={page === id ? "page" : undefined} onClick={() => go(id)} className="adm-nav-btn"><span aria-hidden="true">{icon}</span><span style={{ flex: 1, textAlign: "left" }}>{label}</span></button>);
  const title = SUPRA_NAV.flatMap(g => g.items).find(x => x[0] === page);
  return (
    <div className="adm-layout">
      <header className="adm-top">
        <button type="button" className="adm-burger" aria-label="Menu" aria-expanded={menuOpen} onClick={() => setMenuOpen(v => !v)}>☰</button>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}><I.Shield size={20} color="var(--admin)" /><strong style={{ fontFamily: "Literata, serif", fontSize: 16 }}>Le Carnet — Supra Admin</strong></div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <a href="/admin/" style={{ ...chipBtn, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>Espace administrateur</a>
          <a href="/app/" style={{ ...chipBtn, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>← Application</a>
          <button type="button" onClick={onLogout} style={chipBtn} title="Se déconnecter">⎋</button>
        </div>
      </header>
      <div className="adm-body">
        <nav className={"adm-side" + (menuOpen ? " open" : "")} aria-label="Navigation du Supra Admin">
          {SUPRA_NAV.map(g => (<div key={g.group}><div className="adm-group">{g.group}</div>{g.items.map(navBtn)}</div>))}
          <div style={{ marginTop: "auto", padding: "14px 12px 4px", fontSize: 12, color: "var(--text-dimmer)", display: "flex", alignItems: "center", gap: 8 }}><Avatar user={me} size={22} /> <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{me.display_name}</span></div>
        </nav>
        <main className="adm-main">
          <div style={{ marginBottom: 18 }}><h1 data-supra-title style={{ fontFamily: "Literata, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>{title ? title[1] : ""}</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>Réservé au propriétaire de la plateforme.</p></div>
          {page === "overview" && <SupraOverview session={session} go={go} />}
          {page === "accounts" && <SupraAccounts session={session} notify={notify} />}
          {page === "emails" && <SupraEmails session={session} notify={notify} />}
          {page === "site" && <AdminSite notify={notify} />}
          {page === "patch" && <AdminPatchNotes />}
          {page === "log" && <SupraLog session={session} />}
          <SiteFooter />
        </main>
      </div>
    </div>
  );
}
function SupraApp() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [owner, setOwner] = useState(null);
  const [toast, setToast] = useState(null);
  const notify = (text, kind = "ok", action) => {
    setToast({ text, kind, action: action && { label: action.label, onClick: () => { setToast(null); action.onClick(); } }, key: uid() });
    clearTimeout(notify._t);
    notify._t = setTimeout(() => setToast(null), action ? 8000 : 3200);
  };
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    let cancelled = false;
    if (session === undefined) return;
    if (!session) { setProfile(null); setOwner(false); return; }
    setOwner(null);
    (async () => {
      const [{ data: p }, { data: isOwner, error }] = await Promise.all([supabase.from("profiles").select("*").eq("id", session.user.id).single(), supabase.rpc("is_platform_admin")]);
      if (!cancelled) { setProfile(p || null); setOwner(!error && isOwner === true); }
    })();
    return () => { cancelled = true; };
  }, [session && session.user && session.user.id]);
  if (session === undefined || owner === null) return <Shell noAlert><div style={{ minHeight: "100vh", display: "grid", placeItems: "center" }}><Spinner /></div></Shell>;
  if (!session) return <AdminGate title="Connexion requise" text="Le Supra Admin utilise la même connexion que l'application. Connectez-vous d'abord dans Le Carnet, puis revenez ici." action="Ouvrir Le Carnet" href="/app/" />;
  if (!owner || !profile) return <AdminGate title="Accès réservé" text="Cet espace est réservé au propriétaire de la plateforme." action="Retour à l'application" href="/app/" onLogout={() => supabase.auth.signOut()} />;
  return <Shell noAlert><SupraWorkspace me={profile} session={session} notify={notify} onLogout={() => supabase.auth.signOut()} />{toast && <Toast toast={toast} />}</Shell>;
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SupraApp />);
}
</script>
</body>
