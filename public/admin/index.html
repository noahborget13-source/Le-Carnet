function AdminApp() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [checked, setChecked] = useState(false);
  const [toast, setToast] = useState(null);
  const notify = (text, kind = "ok", action) => {
    setToast({ text, kind, action: action && { label: action.label, onClick: () => { setToast(null); action.onClick(); } }, key: uid() });
    clearTimeout(notify._t);
    notify._t = setTimeout(() => setToast(null), action ? 8000 : 3200);
  };
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      if (session === undefined) return;
      if (!session) { setProfile(null); setChecked(true); return; }
      const { data } = await supabase.from("profiles").select("*").eq("id", session.user.id).single();
      if (!cancelled) { setProfile(data || null); setChecked(true); }
    };
    load();
    const id = setInterval(load, 15000);
    return () => { cancelled = true; clearInterval(id); };
  }, [session]);
  if (session === undefined || !checked) return <Shell><div style={{ minHeight: "100vh", display: "grid", placeItems: "center" }}><Spinner /></div></Shell>;
  if (!session) return <AdminGate title="Connexion requise" text="L'Espace Administrateur utilise la même connexion que l'application. Connectez-vous d'abord dans Le Carnet, puis revenez ici." action="Ouvrir Le Carnet" href="/app/" />;
  if (!profile || profile.status === "pending" || profile.role !== "admin") return <AdminGate title="Accès réservé" text="Cet espace est réservé aux administrateurs du serveur." action="Retour à l'application" href="/app/" onLogout={() => supabase.auth.signOut()} />;
  return <Shell noAlert><AdminWorkspace me={profile} session={session} notify={notify} onLogout={() => supabase.auth.signOut()} />{toast && <Toast toast={toast} />}</Shell>;
}

function AdminWorkspace({ me, session, notify, onLogout }) {
  const [page, setPage] = useState(() => { try { return localStorage.getItem("carnet-admin-page") || "dashboard"; } catch (_) { return "dashboard"; } });
  const [accounts, setAccounts] = useState([]);
  const [tasksAll, setTasksAll] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [meetings, setMeetings] = useState([]);
  const [attendees, setAttendees] = useState([]);
  const [projects, setProjects] = useState([]);
  const [projectMembers, setProjectMembers] = useState([]);
  const [announcements, setAnnouncements] = useState([]);
  const [attachments, setAttachments] = useState([]);
  const [notes, setNotes] = useState([]);
  const [timeEntries, setTimeEntries] = useState([]);
  const [server, setServer] = useState(null);
  const [siteAdmin, setSiteAdmin] = useState(false);
  const [mailStatus, setMailStatus] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  useLiveTable("profiles", setAccounts);
  useLiveTable("tasks", setTasksAll);
  useLiveTable("leave_requests", setLeaves);
  useLiveTable("meetings", setMeetings);
  useLiveTable("meeting_attendees", setAttendees);
  useLiveTable("projects", setProjects);
  useLiveTable("project_members", setProjectMembers);
  useLiveTable("announcements", setAnnouncements);
  useLiveTable("task_attachments", setAttachments);
  useLiveTable("notes", setNotes);
  useLiveTable("time_entries", setTimeEntries);
  const loadMail = async () => { try { setMailStatus(await callApi("/api/admin-tools", { action: "status" }, session)); } catch (e) { setMailStatus({ error: e.message }); } };
  useEffect(() => { supabase.from("servers").select("*").eq("id", me.server_id).single().then(({ data }) => setServer(data)); }, [me.server_id]);
  useEffect(() => { supabase.rpc("is_platform_admin").then(({ data, error }) => setSiteAdmin(!error && data === true)); loadMail(); }, []);
  const tasks = useMemo(() => tasksAll.filter(t => !t.deleted_at), [tasksAll]);
  const approved = useMemo(() => accounts.filter(a => a.status !== "pending"), [accounts]);
  const pending = useMemo(() => accounts.filter(a => a.status === "pending"), [accounts]);
  const pendingLeaves = leaves.filter(l => l.status === "pending").length;
  const go = (p) => { setPage(p); setMenuOpen(false); try { localStorage.setItem("carnet-admin-page", p); } catch (_) {} try { window.scrollTo(0, 0); } catch (_) {} };
  const cur = (page === "site" || page === "patch") && !siteAdmin ? "dashboard" : page;
  const badges = { members: pending.length, leaves: pendingLeaves };
  const navBtn = ([id, label, icon]) => (
    <button key={id} type="button" data-admin-nav={id} aria-current={cur === id ? "page" : undefined} onClick={() => go(id)} className="adm-nav-btn">
      <span aria-hidden="true">{icon}</span><span style={{ flex: 1, textAlign: "left" }}>{label}</span>
      {badges[id] > 0 && <span style={{ background: "#FFB648", color: "#1a1405", borderRadius: 10, fontSize: 11, fontWeight: 700, padding: "1px 7px" }}>{badges[id]}</span>}
    </button>
  );
  const title = [...ADMIN_NAV.flatMap(g => g.items), ...ADMIN_SITE_NAV].find(x => x[0] === cur);
  return (
    <div className="adm-layout">
      <header className="adm-top">
        <button type="button" className="adm-burger" aria-label="Menu" aria-expanded={menuOpen} onClick={() => setMenuOpen(v => !v)}>☰</button>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}><I.Shield size={20} color="var(--admin)" /><strong style={{ fontFamily: "Fraunces, serif", fontSize: 16 }}>Le Carnet — Espace Administrateur</strong></div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <a href="/app/" data-back-app style={{ ...chipBtn, textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 6 }}>← Retour à l'application</a>
          <button type="button" onClick={onLogout} style={chipBtn} title="Se déconnecter">⎋</button>
        </div>
      </header>
      <div className="adm-body">
        <nav className={"adm-side" + (menuOpen ? " open" : "")} aria-label="Navigation de l'espace administrateur">
          {ADMIN_NAV.map(g => (<div key={g.group}><div className="adm-group">{g.group}</div>{g.items.map(navBtn)}</div>))}
          {siteAdmin && <div><div className="adm-group">Plateforme</div>{ADMIN_SITE_NAV.map(navBtn)}</div>}
          <div style={{ marginTop: "auto", padding: "14px 12px 4px", fontSize: 12, color: "var(--text-dimmer)", display: "flex", alignItems: "center", gap: 8 }}><Avatar user={me} size={22} /> <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{me.display_name}</span></div>
        </nav>
        <main className="adm-main">
          <div style={{ marginBottom: 18 }}>
            <h1 data-admin-title style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>{title ? title[1] : ""}</h1>
            <p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>{server ? server.name + " · " : ""}{approved.length} compte(s) · {tasks.length} tâche(s)</p>
          </div>
          {cur === "dashboard" && <AdminDashboard approved={approved} pending={pending} tasks={tasks} leaves={leaves} meetings={meetings} mailStatus={mailStatus} announcements={announcements} go={go} />}
          {cur === "reports" && <AdminReports approved={approved} tasksAll={tasksAll} meetings={meetings} attendees={attendees} projects={projects} notify={notify} />}
          {cur === "workload" && <AdminWorkload accounts={approved} tasks={tasks} meetings={meetings} attendees={attendees} leaves={leaves} />}
          {cur === "members" && <AdminMembers me={me} session={session} approved={approved} pending={pending} tasks={tasks} notify={notify} />}
          {cur === "leaves" && <AdminLeaves me={me} session={session} accounts={accounts} leaves={leaves} notify={notify} />}
          {cur === "announcements" && <AdminAnnouncements me={me} announcements={announcements} notify={notify} />}
          {cur === "mail" && <AdminMail me={me} session={session} approved={approved} status={mailStatus} notify={notify} />}
          {cur === "tasks" && <AdminTasks me={me} tasksAll={tasksAll} accounts={approved} projects={projects} attachments={attachments} notify={notify} />}
          {cur === "projects" && <AdminProjects projects={projects} members={projectMembers} tasks={tasks} accounts={approved} />}
          {cur === "meetings" && <AdminMeetings me={me} session={session} meetings={meetings} attendees={attendees} accounts={approved} notify={notify} />}
          {cur === "settings" && (<>
            {server && <ServerSettings server={server} setServer={setServer} me={me} session={session} approved={approved} notify={notify} onChanged={() => {}} />}
            <EmailsCard status={mailStatus} reload={loadMail} session={session} notify={notify} />
          </>)}
          {cur === "data" && <AdminData tasksAll={tasksAll} accounts={accounts} projects={projects} projectMembers={projectMembers} meetings={meetings} attendees={attendees} leaves={leaves} announcements={announcements} notes={notes} timeEntries={timeEntries} server={server} notify={notify} />}
          {cur === "journal" && <ActivityLog accounts={accounts} bare />}
          {cur === "status" && <AdminStatus session={session} notify={notify} go={go} />}
          {cur === "patch" && <AdminPatchNotes />}
          {cur === "site" && <AdminSite notify={notify} />}
          <SiteFooter />
        </main>
      </div>
    </div>
  );
}

function ActivityChart({ series, today }) {
  const max = Math.max(1, ...series.map(x => Math.max(x.created, x.done)));
  const w = 100 / Math.max(1, series.length);
  return (<>
    <div style={{ display: "flex", gap: 14, fontSize: 12, color: "var(--text-dim)", marginBottom: 8 }}><span><span style={{ display: "inline-block", width: 10, height: 10, background: "#5FBF8B", borderRadius: 2, marginRight: 5 }} />Terminées</span><span><span style={{ display: "inline-block", width: 10, height: 10, background: "var(--text-dimmer)", borderRadius: 2, marginRight: 5 }} />Créées</span></div>
    <svg data-admin-chart viewBox="0 0 100 40" preserveAspectRatio="none" style={{ width: "100%", height: 150, display: "block" }} role="img" aria-label="Tâches créées et terminées">
      {series.map((x, i) => (<g key={x.day}>
        <rect x={i * w + w * 0.1} width={w * 0.38} y={40 - x.created / max * 38} height={x.created / max * 38} fill="var(--text-dimmer)" opacity="0.7"><title>{`${fmtDay(x.day, { day: "numeric", month: "short" })} : ${x.created} créée(s)`}</title></rect>
        <rect x={i * w + w * 0.5} width={w * 0.38} y={40 - x.done / max * 38} height={x.done / max * 38} fill="#5FBF8B"><title>{`${fmtDay(x.day, { day: "numeric", month: "short" })} : ${x.done} terminée(s)`}</title></rect>
      </g>))}
    </svg>
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-dimmer)", marginTop: 4 }}><span>{series.length ? fmtDay(series[0].day, { day: "numeric", month: "short" }) : ""}</span><span>{fmtDay(today, { day: "numeric", month: "short" })}</span></div>
  </>);
}

function AdminDashboard({ approved, pending, tasks, leaves, meetings, mailStatus, announcements, go }) {
  const today = parisDay();
  const r = useMemo(() => computeReport({ tasks, meetings, attendees: [], accounts: approved, projects: [], days: 30, projectId: "", today }), [tasks, meetings, approved, today]);
  const upcoming = meetings.filter(m => Date.parse(m.ends_at) > Date.now() && Date.parse(m.starts_at) < Date.now() + 7 * 864e5).length;
  const pendingLeaves = leaves.filter(l => l.status === "pending").length;
  const activeAnn = announcements.filter(a => a.active && (!a.expires_at || Date.parse(a.expires_at) > Date.now())).length;
  return (<>
    <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
      <Kpi id="members" value={approved.length} label="Membres" hint={pending.length ? `${pending.length} demande(s) en attente` : "aucune demande en attente"} onClick={() => go("members")} />
      <Kpi id="open" value={r.open} label="Tâches en cours" hint="à ce jour" onClick={() => go("tasks")} />
      <Kpi id="late" value={r.late} label="En retard" color={r.late ? "#FF6B5E" : undefined} hint="à ce jour" onClick={() => go("tasks")} />
      <Kpi id="done30" value={r.done} label="Terminées" hint="sur 30 jours" color="#5FBF8B" onClick={() => go("reports")} />
      <Kpi id="meetings7" value={upcoming} label="Réunions" hint="dans les 7 jours" onClick={() => go("meetings")} />
      <Kpi id="leaves" value={pendingLeaves} label="Congés à traiter" color={pendingLeaves ? "#FFB648" : undefined} onClick={() => go("leaves")} />
      <Kpi id="ann" value={activeAnn} label="Annonces actives" onClick={() => go("announcements")} />
    </div>
    <Panel title="Activité des 30 derniers jours" id="chart"><ActivityChart series={r.series} today={today} /></Panel>
    <AdminOverview approved={approved} pending={pending} tasks={tasks} mailStatus={mailStatus} go={go} />
  </>);
}

function AdminReports({ approved, tasksAll, meetings, attendees, projects, notify }) {
  const [days, setDays] = useState(30);
  const [projectId, setProjectId] = useState("");
  const today = parisDay();
  const tasks = useMemo(() => tasksAll.filter(t => !t.deleted_at), [tasksAll]);
  const r = useMemo(() => computeReport({ tasks, meetings, attendees, accounts: approved, projects, days, projectId, today }), [tasks, meetings, attendees, approved, projects, days, projectId, today]);
  const maxP = Math.max(1, ...r.people.map(x => x.done + x.open)), maxPr = Math.max(1, ...r.byProject.map(x => x.done + x.open)), maxL = Math.max(1, ...r.byLabel.map(x => x.done + x.open));
  const exportCsv = () => {
    const rows = [["Personne", "Terminées sur la période", "En cours", "En retard"], ...r.people.map(x => [x.user.display_name, x.done, x.open, x.late])];
    downloadText(`rapport-${today}.csv`, "text/csv", "﻿" + rows.map(l => l.map(csvCell).join(";")).join("\r\n") + "\r\n");
    notify("Rapport exporté.");
  };
  return (<>
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 14 }}>
      {REPORT_PERIODS.map(([n, l]) => <button key={n} type="button" data-report-days={n} aria-pressed={days === n} onClick={() => setDays(n)} style={{ ...chipBtn, borderColor: days === n ? "var(--accent)" : "var(--border-soft)", color: days === n ? "var(--text)" : "var(--text-dim)" }}>{l}</button>)}
      {projects.length > 0 && <select data-report-project value={projectId} onChange={e => setProjectId(e.target.value)} aria-label="Projet" style={{ ...inputStyle, width: "auto", padding: "7px 10px" }}><option value="">Tous les projets</option><option value="none">Sans projet</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
      <button type="button" data-report-export onClick={exportCsv} style={{ ...chipBtn, marginLeft: "auto" }}>⬇ Exporter (CSV)</button>
    </div>
    <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
      <Kpi id="r-done" value={r.done} label="Terminées" color="#5FBF8B" hint={`sur ${days} jours`} />
      <Kpi id="r-created" value={r.created} label="Créées" hint={`sur ${days} jours`} />
      <Kpi id="r-late" value={r.late} label="En retard" color={r.late ? "#FF6B5E" : undefined} hint="à ce jour" />
      <Kpi id="r-ontime" value={r.onTimeRate === null ? "—" : r.onTimeRate + " %"} label="Ponctualité" hint={r.dueCount ? `${r.dueCount} échéance(s)` : "aucune échéance"} />
      <Kpi id="r-lead" value={r.avgLead === null ? "—" : (r.avgLead < 1 ? "< 1 j" : Math.round(r.avgLead * 10) / 10 + " j")} label="Délai moyen" hint="création → fin" />
      <Kpi id="r-meet" value={Math.round(r.meetingHours * 10) / 10 + " h"} label="En réunion" hint={`${r.meetings} réunion(s)`} />
    </div>
    <Panel title={days > 31 ? "Activité par semaine" : "Activité par jour"} id="r-chart"><ActivityChart series={r.series} today={today} /></Panel>
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
      <div style={{ flex: "1 1 380px", minWidth: 0 }}><Panel title="Par personne" id="r-people">{r.people.length === 0 ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune tâche assignée.</div> : r.people.map(x => <BarRow key={x.user.id} avatar={<Avatar user={x.user} size={18} />} label={x.user.display_name} value={x.done} max={maxP} color="#5FBF8B" extra={` terminée${x.done > 1 ? "s" : ""} · ${x.open} en cours${x.late ? " · " + x.late + " en retard" : ""}`} />)}</Panel></div>
      <div style={{ flex: "1 1 380px", minWidth: 0 }}>
        <Panel title="Par projet" id="r-projects">{r.byProject.length === 0 ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune tâche.</div> : r.byProject.map(x => <BarRow key={x.id} label={x.name} value={x.done} max={maxPr} color="#5B9EF5" extra={` terminée${x.done > 1 ? "s" : ""} · ${x.open} en cours`} />)}</Panel>
        <Panel title="Par étiquette" id="r-labels">{r.byLabel.length === 0 ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune tâche.</div> : r.byLabel.map(x => <BarRow key={x.id} label={x.name} value={x.done} max={maxL} color={x.hex} extra={` terminée${x.done > 1 ? "s" : ""} · ${x.open} en cours`} />)}</Panel>
      </div>
    </div>
  </>);
}

function AdminAnnouncements({ me, announcements, notify }) {
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [level, setLevel] = useState("info");
  const [expires, setExpires] = useState("");
  const [busy, setBusy] = useState(false);
  const LV = { info: ["Information", "#5B9EF5"], important: ["Important", "#FFB648"], success: ["Bonne nouvelle", "#5FBF8B"] };
  const publish = async () => {
    if (busy) return;
    if (!title.trim()) { notify("Donnez un titre à l'annonce.", "err"); return; }
    setBusy(true);
    const { error } = await supabase.from("announcements").insert({ server_id: me.server_id, created_by: me.id, title: title.trim().slice(0, 120), body: body.trim().slice(0, 1000), level, expires_at: expires ? new Date(parisInstant(expires, "23:59")).toISOString() : null });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setTitle(""); setBody(""); setExpires(""); setLevel("info");
    notify("Annonce publiée : tous les membres la verront dans l'application.");
  };
  const toggle = async (a) => { const { error } = await supabase.from("announcements").update({ active: !a.active }).eq("id", a.id); if (error) notify(error.message, "err"); };
  const remove = async (a) => { if (!window.confirm(`Supprimer l'annonce « ${a.title} » ?`)) return; const { error } = await supabase.from("announcements").delete().eq("id", a.id); if (error) notify(error.message, "err"); };
  const sorted = announcements.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
  const live = (a) => a.active && (!a.expires_at || Date.parse(a.expires_at) > Date.now());
  return (<>
    <Panel title="Nouvelle annonce" id="ann-form">
      <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 12px" }}>Une annonce s'affiche en bandeau en haut de l'application pour tous les membres. Chacun peut la masquer sur son appareil.</p>
      <Field label="Titre"><input data-ann-title value={title} onChange={e => setTitle(e.target.value)} maxLength={120} style={inputStyle} placeholder="Ex. Fermeture exceptionnelle vendredi" /></Field>
      <Field label="Message (facultatif)"><textarea data-ann-body value={body} onChange={e => setBody(e.target.value)} rows={3} maxLength={1000} style={{ ...inputStyle, resize: "vertical" }} /></Field>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
        <div style={{ flex: "1 1 200px" }}><Field label="Niveau"><select data-ann-level value={level} onChange={e => setLevel(e.target.value)} style={inputStyle}>{Object.entries(LV).map(([k, v]) => <option key={k} value={k}>{v[0]}</option>)}</select></Field></div>
        <div style={{ flex: "1 1 200px" }}><Field label="Masquer automatiquement après le (facultatif)"><input data-ann-expires type="date" value={expires} min={parisDay()} onChange={e => setExpires(e.target.value)} style={inputStyle} /></Field></div>
        <button type="button" data-ann-publish onClick={publish} disabled={busy} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", marginBottom: 14, opacity: busy ? 0.6 : 1 }}>{busy ? "Publication…" : "Publier"}</button>
      </div>
    </Panel>
    <Panel title={`Annonces (${sorted.length})`} id="ann-list">
      {sorted.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune annonce pour l'instant.</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {sorted.map(a => (
          <div key={a.id} data-ann={a.id} style={{ borderLeft: `4px solid ${(LV[a.level] || LV.info)[1]}`, background: "var(--bg)", borderRadius: 8, padding: "10px 14px", opacity: live(a) ? 1 : 0.6 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <strong style={{ fontSize: 14 }}>{a.title}</strong>
              <span style={{ fontSize: 11, color: (LV[a.level] || LV.info)[1], fontWeight: 700 }}>{(LV[a.level] || LV.info)[0]}</span>
              <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>{live(a) ? "Affichée" : a.active ? "Expirée" : "Masquée"}{a.expires_at ? ` · jusqu'au ${fmtDay(parisDay(Date.parse(a.expires_at)), { day: "numeric", month: "short" })}` : ""}</span>
              <span style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
                <button type="button" data-ann-toggle onClick={() => toggle(a)} style={chipBtn}>{a.active ? "Masquer" : "Réafficher"}</button>
                <button type="button" data-ann-delete onClick={() => remove(a)} style={{ ...chipBtn, color: "#FF9A8F" }}>Supprimer</button>
              </span>
            </div>
            {a.body && <div style={{ fontSize: 13, color: "var(--text-dim)", marginTop: 6, whiteSpace: "pre-wrap" }}>{a.body}</div>}
          </div>
        ))}
      </div>
    </Panel>
  </>);
}

function AdminTasks({ me, tasksAll, accounts, projects, attachments, notify }) {
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("open");     // open | late | done | nobody | trash | all
  const [who, setWho] = useState("");
  const [proj, setProj] = useState("");
  const [picked, setPicked] = useState([]);
  const [target, setTarget] = useState("");
  const [busy, setBusy] = useState(false);
  const today = parisDay();
  const byId = (id) => accounts.find(a => a.id === id);
  const rows = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return tasksAll.filter(t => {
      if (status === "trash") { if (!t.deleted_at) return false; } else if (t.deleted_at) return false;
      if (status === "open" && t.done) return false;
      if (status === "done" && !t.done) return false;
      if (status === "late" && !(!t.done && t.due && t.due < today)) return false;
      if (status === "nobody" && (t.done || assigneeIds(t).length)) return false;
      if (who && !assigneeIds(t).includes(who)) return false;
      if (proj && (proj === "none" ? t.project_id : t.project_id !== proj)) return false;
      if (needle && !(t.title || "").toLowerCase().includes(needle)) return false;
      return true;
    }).sort((a, b) => (status === "trash" ? b.deleted_at.localeCompare(a.deleted_at) : dueKey(a).localeCompare(dueKey(b))));
  }, [tasksAll, q, status, who, proj, today]);
  useEffect(() => { setPicked(p => p.filter(id => rows.some(t => t.id === id))); }, [rows]);
  const sel = rows.filter(t => picked.includes(t.id));
  const allOn = rows.length > 0 && picked.length === rows.length;
  const run = async (label, fn) => {
    if (busy || !sel.length) return;
    setBusy(true);
    let ok = 0, err = null;
    for (const t of sel) { const e = await fn(t); if (e) err = e.message || String(e); else ok++; }
    setBusy(false); setPicked([]);
    notify(err ? `${label} : ${ok} réussie(s), erreur : ${err}` : `${ok} tâche(s) ${label}.`, err ? "err" : "ok");
  };
  const reassign = () => { if (!target) { notify("Choisissez la personne à qui réassigner.", "err"); return; } const p = byId(target); run(`réassignée(s) à ${p ? p.display_name : "?"}`, async (t) => (await supabase.from("tasks").update({ assignees: [target], assignee: target }).eq("id", t.id)).error); };
  const finish = () => run("terminée(s)", async (t) => (await supabase.from("tasks").update({ done: true }).eq("id", t.id)).error);
  const trash = () => { if (!window.confirm(`Mettre ${sel.length} tâche(s) à la corbeille ?`)) return; run("mise(s) à la corbeille", async (t) => (await supabase.rpc("trash_task", { p_id: t.id })).error); };
  const restore = () => run("restaurée(s)", async (t) => (await supabase.rpc("restore_task", { p_id: t.id })).error);
  const purge = () => {
    if (!window.confirm(`Supprimer définitivement ${sel.length} tâche(s) ? Cette action est irréversible.`)) return;
    run("supprimée(s) définitivement", async (t) => {
      const paths = attachments.filter(a => a.task_id === t.id).map(a => a.path);
      const { error } = await supabase.from("tasks").delete().eq("id", t.id);
      if (!error && paths.length) await supabase.storage.from("task-files").remove(paths);
      return error;
    });
  };
  const trashCount = tasksAll.filter(t => t.deleted_at).length;
  const st = [["open", "À faire"], ["late", "En retard"], ["nobody", "Sans responsable"], ["done", "Terminées"], ["trash", `Corbeille (${trashCount})`], ["all", "Toutes"]];
  return (<>
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
      {st.map(([k, l]) => <button key={k} type="button" data-task-status={k} aria-pressed={status === k} onClick={() => setStatus(k)} style={{ ...chipBtn, borderColor: status === k ? "var(--accent)" : "var(--border-soft)", color: status === k ? "var(--text)" : "var(--text-dim)" }}>{l}</button>)}
    </div>
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
      <input data-task-search value={q} onChange={e => setQ(e.target.value)} placeholder="Rechercher une tâche…" aria-label="Rechercher une tâche" style={{ ...inputStyle, flex: "1 1 220px", width: "auto" }} />
      <select data-task-who value={who} onChange={e => setWho(e.target.value)} aria-label="Responsable" style={{ ...inputStyle, width: "auto" }}><option value="">Toutes les personnes</option>{accounts.map(a => <option key={a.id} value={a.id}>{a.display_name}</option>)}</select>
      {projects.length > 0 && <select data-task-project value={proj} onChange={e => setProj(e.target.value)} aria-label="Projet" style={{ ...inputStyle, width: "auto" }}><option value="">Tous les projets</option><option value="none">Sans projet</option>{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
    </div>
    {picked.length > 0 && (
      <div data-task-bulk style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 12, padding: "10px 14px", marginBottom: 12, position: "sticky", top: 8, zIndex: 5 }}>
        <strong style={{ fontSize: 13, marginRight: "auto" }}>{picked.length} sélectionnée(s)</strong>
        {status === "trash" ? (<>
          <button type="button" data-bulk="restore" disabled={busy} onClick={restore} style={chipBtn}>↩ Restaurer</button>
          <button type="button" data-bulk="purge" disabled={busy} onClick={purge} style={{ ...chipBtn, color: "#FF9A8F" }}>Supprimer définitivement</button>
        </>) : (<>
          <select data-bulk-target value={target} onChange={e => setTarget(e.target.value)} aria-label="Réassigner à" style={{ ...inputStyle, width: "auto", padding: "6px 10px" }}><option value="">Réassigner à…</option>{accounts.map(a => <option key={a.id} value={a.id}>{a.display_name}</option>)}</select>
          <button type="button" data-bulk="reassign" disabled={busy || !target} onClick={reassign} style={{ ...chipBtn, opacity: target ? 1 : 0.5 }}>Réassigner</button>
          <button type="button" data-bulk="done" disabled={busy} onClick={finish} style={chipBtn}>✓ Terminer</button>
          <button type="button" data-bulk="trash" disabled={busy} onClick={trash} style={{ ...chipBtn, color: "#FF9A8F" }}>🗑 Corbeille</button>
        </>)}
      </div>
    )}
    <div style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflowX: "auto" }}>
      <table data-task-table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 640 }}>
        <thead><tr style={{ textAlign: "left", color: "var(--text-dimmer)", fontSize: 12 }}>
          <th style={{ padding: "10px 12px", width: 32 }}><input type="checkbox" data-pick-all checked={allOn} onChange={() => setPicked(allOn ? [] : rows.map(t => t.id))} aria-label="Tout sélectionner" /></th>
          <th style={{ padding: "10px 6px" }}>Tâche</th><th style={{ padding: "10px 6px" }}>Responsables</th><th style={{ padding: "10px 6px" }}>Échéance</th><th style={{ padding: "10px 6px" }}>Statut</th><th style={{ padding: "10px 12px" }} />
        </tr></thead>
        <tbody>
          {rows.length === 0 && <tr><td colSpan={6} style={{ padding: 24, textAlign: "center", color: "var(--text-dimmer)" }}>Aucune tâche ne correspond.</td></tr>}
          {rows.slice(0, 300).map(t => {
            const who2 = assigneeIds(t).map(byId).filter(Boolean), late = !t.done && t.due && t.due < today;
            const label = LABELS.find(l => l.id === t.label) || LABELS[0];
            return (
              <tr key={t.id} data-task-row={t.title} style={{ borderTop: "1px solid var(--border-soft)" }}>
                <td style={{ padding: "8px 12px" }}><input type="checkbox" data-pick={t.id} checked={picked.includes(t.id)} onChange={() => setPicked(p => p.includes(t.id) ? p.filter(x => x !== t.id) : [...p, t.id])} aria-label={"Sélectionner « " + t.title + " »"} /></td>
                <td style={{ padding: "8px 6px", maxWidth: 320 }}><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: label.hex, marginRight: 8 }} /><span style={{ textDecoration: t.done ? "line-through" : "none" }}>{t.title}</span></td>
                <td style={{ padding: "8px 6px" }}>{who2.length ? <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><AvatarStack users={who2} size={20} max={3} /><span style={{ color: "var(--text-dim)", fontSize: 12 }}>{who2.map(u => u.display_name).join(", ")}</span></span> : <span style={{ color: "#FFC97A", fontSize: 12 }}>Personne</span>}</td>
                <td style={{ padding: "8px 6px", color: late ? "#FF9A8F" : "var(--text-dim)", whiteSpace: "nowrap" }}>{t.due ? formatDue(t.due, daysUntil(t.due)) : "—"}</td>
                <td style={{ padding: "8px 6px", color: "var(--text-dim)" }}>{t.deleted_at ? "Corbeille" : t.done ? "Terminée" : t.doing ? "En cours" : "À faire"}</td>
                <td style={{ padding: "8px 12px", textAlign: "right" }}>{!t.deleted_at && <a href={`/app/?task=${t.id}`} target="_blank" rel="noopener noreferrer" style={{ color: "var(--accent-2)", fontSize: 12.5, textDecoration: "none" }}>Ouvrir ↗</a>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
    <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 8 }}>{rows.length} tâche{rows.length > 1 ? "s" : ""}{rows.length > 300 ? " (300 premières affichées)" : ""}.</div>
  </>);
}

function AdminProjects({ projects, members, tasks, accounts }) {
  const rows = projects.map(p => {
    const mine = tasks.filter(t => t.project_id === p.id), done = mine.filter(t => t.done).length;
    const ppl = members.filter(m => m.project_id === p.id).map(m => accounts.find(a => a.id === m.user_id)).filter(Boolean);
    return { p, total: mine.length, done, open: mine.length - done, late: mine.filter(t => !t.done && t.due && t.due < parisDay()).length, ppl };
  });
  const noProject = tasks.filter(t => !t.project_id);
  return (<>
    {rows.length === 0 && <EmptyState text="Aucun projet. Les projets se créent depuis l'onglet Tâches de l'application." />}
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {rows.map(({ p, total, done, open, late, ppl }) => (
        <div key={p.id} data-project={p.name} style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 18px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <strong style={{ fontSize: 15 }}>{p.name}</strong>
            <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>{p.is_private ? "🔒 Privé" : "Visible par tous"}</span>
            <span style={{ marginLeft: "auto", fontSize: 12.5, color: "var(--text-dim)" }}>{open} en cours · {done} terminée{done > 1 ? "s" : ""}{late ? ` · ${late} en retard` : ""}</span>
          </div>
          <div style={{ background: "var(--bg)", borderRadius: 6, height: 10, overflow: "hidden", margin: "10px 0" }}><div style={{ width: (total ? Math.round(done / total * 100) : 0) + "%", height: "100%", background: "#5FBF8B" }} /></div>
          <div style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12, color: "var(--text-dimmer)" }}>{total ? Math.round(done / total * 100) : 0} % terminé{p.is_private ? <> · <AvatarStack users={ppl} size={20} max={6} /> {ppl.length} membre{ppl.length > 1 ? "s" : ""}</> : ""}</div>
        </div>
      ))}
    </div>
    <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginTop: 12 }}>{noProject.length} tâche{noProject.length > 1 ? "s" : ""} sans projet.</div>
  </>);
}

function AdminMeetings({ me, session, meetings, attendees, accounts, notify }) {
  const [showPast, setShowPast] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const now = Date.now();
  const upcoming = meetings.filter(m => Date.parse(m.ends_at) > now).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const past = meetings.filter(m => Date.parse(m.ends_at) <= now).sort((a, b) => b.starts_at.localeCompare(a.starts_at)).slice(0, 20);
  const cancel = async (m, scope) => {
    const n = meetings.filter(x => x.series_id && x.series_id === m.series_id).length;
    if (!window.confirm(scope === "series" ? `Annuler toute la série « ${m.title} » (${n} réunions) ? Les invités seront prévenus.` : `Annuler la réunion « ${m.title} » ? Les invités seront prévenus.`)) return;
    setBusyId(m.id);
    try { const r = await callApi("/api/notify-meeting", { action: "cancel", meetingId: m.id, scope }, session); notify("Réunion annulée" + (r.sent ? ` · ${r.sent} e-mail(s) envoyé(s).` : ".")); }
    catch (e) { notify(e.message, "err"); }
    setBusyId(null);
  };
  const row = (m) => {
    const org = accounts.find(a => a.id === m.created_by);
    const list = attendees.filter(a => a.meeting_id === m.id);
    const c = (r) => list.filter(a => a.response === r).length;
    const past2 = Date.parse(m.ends_at) <= now;
    return (
      <div key={m.id} data-admin-meeting={m.title} style={{ background: "var(--panel)", border: "1px solid var(--border)", borderLeft: `5px solid ${past2 ? "#4A4F5A" : "#5B9EF5"}`, borderRadius: 12, padding: "12px 16px", opacity: past2 ? 0.75 : 1 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <strong style={{ fontSize: 14.5 }}>{m.title}</strong>
          {m.series_id && <span style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>🔁 {RECUR[m.recurrence] || "série"}</span>}
          <span style={{ fontSize: 12.5, color: "var(--text-dim)", textTransform: "capitalize" }}>{fmtWhen(m)}</span>
          {!past2 && <span style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
            <button type="button" data-meeting-cancel disabled={busyId === m.id} onClick={() => cancel(m, "one")} style={{ ...chipBtn, color: "#FF9A8F" }}>Annuler</button>
            {m.series_id && <button type="button" data-meeting-cancel-series disabled={busyId === m.id} onClick={() => cancel(m, "series")} style={{ ...chipBtn, color: "#FF9A8F" }}>Annuler la série</button>}
          </span>}
        </div>
        <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 4 }}>Organisée par {org ? org.display_name : "un ancien membre"} · {list.length} participant{list.length > 1 ? "s" : ""} ({c("accepted")} ✓ · {c("declined")} ✗ · {c("invited")} sans réponse)</div>
      </div>
    );
  };
  return (<>
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {upcoming.length === 0 && <EmptyState text="Aucune réunion à venir." />}
      {upcoming.map(row)}
    </div>
    {past.length > 0 && <button type="button" onClick={() => setShowPast(v => !v)} style={{ ...chipBtn, marginTop: 16 }}>{showPast ? "Masquer" : "Voir"} les réunions passées ({past.length})</button>}
    {showPast && <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>{past.map(row)}</div>}
  </>);
}

function AdminData({ tasksAll, accounts, projects, projectMembers, meetings, attendees, leaves, announcements, notes = [], timeEntries = [], server, notify }) {
  const today = parisDay();
  const [busy, setBusy] = useState(false);
  const safeProfile = (a) => ({ id: a.id, username: a.username, display_name: a.display_name, email: a.email, role: a.role, status: a.status, created_at: a.created_at });
  const backup = () => {
    if (busy) return; setBusy(true);
    try {
      const data = { app: "Le Carnet", exported_at: new Date().toISOString(), server: server ? { id: server.id, name: server.name } : null, members: accounts.map(safeProfile), projects, project_members: projectMembers, tasks: tasksAll, meetings, meeting_attendees: attendees, leave_requests: leaves, announcements, notes, time_entries: timeEntries };
      downloadText(`sauvegarde-le-carnet-${today}.json`, "application/json", JSON.stringify(data, null, 2));
      notify("Sauvegarde téléchargée. Les fichiers joints ne sont pas inclus.");
    } finally { setBusy(false); }
  };
  const csv = (name, head, rows) => { downloadText(name, "text/csv", "﻿" + [head, ...rows].map(l => l.map(csvCell).join(";")).join("\r\n") + "\r\n"); notify("Export téléchargé."); };
  const exportMembers = () => csv(`membres-${today}.csv`, ["Nom", "Identifiant", "E-mail", "Rôle", "Statut"], accounts.map(a => [a.display_name, a.username, a.email, a.role, a.status]));
  const exportTasks = () => csv(`taches-${today}.csv`, ["Titre", "Statut", "Priorité", "Début", "Échéance", "Responsables", "Projet", "Créée le", "Terminée le"], tasksAll.filter(t => !t.deleted_at).map(t => [t.title, t.done ? "Terminée" : t.doing ? "En cours" : "À faire", (PRIORITIES.find(p => p.id === t.priority) || {}).label || "", t.start_date || "", t.due || "", assigneeIds(t).map(id => (accounts.find(a => a.id === id) || {}).display_name).filter(Boolean).join(", "), (projects.find(p => p.id === t.project_id) || {}).name || "", (t.created_at || "").slice(0, 10), (t.done_at || "").slice(0, 10)]));
  const exportMeetings = () => csv(`reunions-${today}.csv`, ["Titre", "Début", "Fin", "Organisateur", "Participants", "Récurrence"], meetings.map(m => [m.title, m.starts_at, m.ends_at, (accounts.find(a => a.id === m.created_by) || {}).display_name || "", attendees.filter(a => a.meeting_id === m.id).length, RECUR[m.recurrence] || ""]));
  const Item = ({ id, title, text, onClick, primary }) => (
    <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap", padding: "12px 0", borderTop: "1px solid var(--border-soft)" }}>
      <div style={{ flex: "1 1 260px" }}><div style={{ fontWeight: 600, fontSize: 14 }}>{title}</div><div style={{ fontSize: 12.5, color: "var(--text-dim)", marginTop: 2 }}>{text}</div></div>
      <button type="button" data-export={id} disabled={busy} onClick={onClick} style={primary ? { ...primaryBtn, width: "auto", padding: "9px 18px" } : chipBtn}>⬇ Télécharger</button>
    </div>
  );
  return (<>
    <Panel title="Sauvegarde et exports" id="data">
      <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 4px" }}>Conservez une copie des données de votre serveur. Les fichiers joints (pièces jointes) ne sont pas inclus dans la sauvegarde. Les mots de passe ne sont jamais exportés.</p>
      <Item id="backup" primary title="Sauvegarde complète (JSON)" text={`${accounts.length} membre(s), ${tasksAll.length} tâche(s) corbeille comprise, ${projects.length} projet(s), ${meetings.length} réunion(s), congés, annonces, notes et temps passé.`} onClick={backup} />
      <Item id="members" title="Membres (CSV)" text="Nom, identifiant, e-mail, rôle et statut de chaque compte." onClick={exportMembers} />
      <Item id="tasks" title="Tâches (CSV)" text="Toutes les tâches hors corbeille, avec dates, responsables et projet." onClick={exportTasks} />
      <Item id="meetings" title="Réunions (CSV)" text="Toutes les réunions avec organisateur et nombre de participants." onClick={exportMeetings} />
    </Panel>
  </>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AdminApp />);
}

</script>
</body>
</html>
