function RichText({ text, accounts }) {

  const parts = [];
  const re = /(^|[^A-Za-z0-9._-])@([A-Za-z0-9._-]{3,30})/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const name = m[2].replace(/[._-]+$/, "");
    if (!accounts.some(a => a.username && a.username.toLowerCase() === name.toLowerCase())) continue;
    const start = m.index + m[1].length;
    parts.push(text.slice(last, start));
    parts.push(<span key={start} style={{ color: "var(--accent-2)", fontWeight: 600, background: "#5B6EF51F", borderRadius: 4, padding: "0 3px" }}>@{name}</span>);
    last = start + 1 + name.length;
  }
  parts.push(text.slice(last));

}

function AlertBanner({ inline }) {
  const [alert, setAlert] = useState(null);
  const [hidden, setHidden] = useState(false);
  const keyOf = (a) => a.id + "|" + a.display_at + "|" + a.message;
  useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const q = (cols) => supabase.from('system_alerts').select(cols).lte('display_at', new Date().toISOString()).order('display_at', { ascending: false }).limit(5);
        let { data, error } = await q('id,message,display_at,is_maintenance,maint_end');
        if (error) ({ data, error } = await q('id,message,display_at,is_maintenance'));   // migration 07 pas encore lancée
        if (error || !alive) return;
        const now = new Date();
        // Une annonce de maintenance disparaît toute seule une fois la maintenance terminée.
        const a = (data || []).find(r => r.message && r.message.trim() && (!r.is_maintenance || (r.maint_end && new Date(r.maint_end) > now)));
        if (!a) { setAlert(null); return; }
        let dismissed = null;
        try { dismissed = localStorage.getItem("carnet-alert-dismissed"); } catch (_) {}
        setAlert(a); setHidden(dismissed === keyOf(a));
      } catch (_) {}
    };
    load();
    const id = setInterval(load, 5 * 60 * 1000);
    const onVis = () => { if (!document.hidden) load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { alive = false; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  if (!alert || hidden) return null;
  const close = () => { try { localStorage.setItem("carnet-alert-dismissed", keyOf(alert)); } catch (_) {} setHidden(true); };
  return (
    <div className="alert-banner" role="status" style={{ ...(inline ? { marginBottom: 18 } : { position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 45, width: "min(560px, 92vw)", boxShadow: "0 12px 30px rgba(0,0,0,.45)" }), display: "flex", alignItems: "flex-start", gap: 10, background: "#2A2410", border: "1px solid #6B5A1E", color: "#FFE3A0", borderRadius: 12, padding: "11px 14px", fontSize: 13.5, lineHeight: 1.45 }}>
      <I.Alert size={17} style={{ flexShrink: 0, marginTop: 1, color: "#FFC97A" }} />
      <div style={{ flex: 1, minWidth: 0, wordBreak: "break-word" }}>{alert.message}</div>
      <button type="button" onClick={close} aria-label="Fermer l'annonce" style={{ background: "none", border: "none", color: "#FFE3A0", cursor: "pointer", padding: 2, flexShrink: 0 }}><I.X size={16} /></button>
    </div>
  );
}

function useLiveTable(table, setRows, shape) {
  const loadRef = useRef(null);
  useEffect(() => {
    let alive = true;
    const load = () => {
      let q = supabase.from(table).select('*');
      if (shape) q = shape(q);
      q.then(({ data }) => { if (alive) setRows(data || []); });
    };
    loadRef.current = load;
    load();
    const ch = supabase.channel(table + '-live').on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
    return () => { alive = false; supabase.removeChannel(ch); };
  }, []);
  return () => loadRef.current && loadRef.current();
}

const TZ = "Europe/Paris";
const _dtf = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
function parisParts(ms) { const o = {}; for (const p of _dtf.formatToParts(new Date(ms))) o[p.type] = p.value; return o; }
const parisDay = (ms = Date.now()) => { const p = parisParts(ms); return `${p.year}-${p.month}-${p.day}`; };

function parisInstant(day, hm = "00:00") {
  const [y, m, d] = day.split("-").map(Number); const [h, mi] = hm.slice(0, 5).split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const off = (ms) => { const p = parisParts(ms); return Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day), Number(p.hour), Number(p.minute), Number(p.second)) - ms; };
  const t = guess - off(guess);
  return guess - off(t);

function outsideHoursC(wh, s, e) {
  if (!wh) return false;
  const point = e <= s; let cur = s;
  for (let g = 0; g < 14 && (cur < e || (point && g === 0)); g++) {
    const day = parisDay(cur); const next = parisInstant(shiftDay(day, 1));
    const segEnd = point ? cur : Math.min(e, next);
    const ranges = wh[String(isoWd(day))] || [];
    if (!ranges.some(([a, b]) => parisInstant(day, a) <= cur && segEnd <= parisInstant(day, b))) return true;
    cur = next;
  }
  return false;
}
/** Raisons pour lesquelles `user` n'est pas disponible. busy : lignes de busy_for pour cette personne. */
function conflictsC({ s, e, user, busy = [], tasks = [], allDay = false, ignoreTaskId = null }) {
  const out = []; const point = e <= s;
  const ov = (b) => (point ? Date.parse(b.starts_at) <= s && s < Date.parse(b.ends_at) : s < Date.parse(b.ends_at) && e > Date.parse(b.starts_at));
  if (allDay) {
    const day = parisDay(s); const d0 = parisInstant(day), d1 = parisInstant(shiftDay(day, 1));
    if (busy.some(b => b.kind === "leave" && d0 < Date.parse(b.ends_at) && d1 > Date.parse(b.starts_at))) out.push({ kind: "leave" });
    return out;
  }
  if (busy.some(b => b.kind === "leave" && ov(b))) out.push({ kind: "leave" });
  else if (outsideHoursC(user && user.work_hours, s, e)) out.push({ kind: "hours" });
  if (busy.some(b => b.kind === "meeting" && ov(b))) out.push({ kind: "meeting" });
  if (busy.some(b => b.kind === "google" && ov(b))) out.push({ kind: "google" });
  if (point) {
    const same = tasks.find(t => t.id !== ignoreTaskId && !t.done && t.due && t.due_time && assigneeIds(t).includes(user.id) && Math.abs(parisInstant(t.due, t.due_time) - s) < 60000);
    if (same) out.push({ kind: "task", label: same.title });
  }
  return out;
}

/** Créneaux occupés (rpc busy_for) d'un groupe de personnes sur une période. */
function useBusy(userIds, fromMs, toMs, ignoreMeetingId) {
  const [rows, setRows] = useState([]);
  const key = JSON.stringify([[...userIds].sort(), fromMs, toMs, ignoreMeetingId || null]);
  useEffect(() => {
    if (!userIds.length || !fromMs || !toMs) { setRows([]); return; }
    let alive = true;
    const t = setTimeout(() => {
      supabase.rpc("busy_for", { p_users: userIds, p_from: new Date(fromMs).toISOString(), p_to: new Date(toMs).toISOString(), p_ignore_meeting: ignoreMeetingId || null })
        .then(({ data, error }) => { if (alive) setRows(error ? [] : (data || [])); });
    }, 250);
    return () => { alive = false; clearTimeout(t); };
  }, [key]);
  return rows;
}

const RECUR = { daily: "chaque jour", weekly: "chaque semaine", biweekly: "toutes les deux semaines", monthly: "chaque mois" };
const MAX_OCC = 52;
/** Jours (AAAA-MM-JJ) des occurrences d'une série, du premier jour jusqu'au jour de fin inclus ; au plus 52. */
function occurrenceDays(start, rule, until) {
  const out = [];
  if (!start || !until || !RECUR[rule] || until < start) return start ? [start] : [];
  const [y0, m0, d0] = start.split("-").map(Number);
  for (let k = 0; out.length < MAX_OCC; k++) {
    let day;
    if (rule === "monthly") {
      const t = (m0 - 1) + k, y = y0 + Math.floor(t / 12), m = (t % 12) + 1;
      const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
      if (d0 > last) { if (y > Number(until.slice(0, 4)) + 1) break; continue; }   // pas de 31 en avril : on saute ce mois
      day = `${y}-${String(m).padStart(2, "0")}-${String(d0).padStart(2, "0")}`;
    } else day = shiftDay(start, k * (rule === "daily" ? 1 : rule === "weekly" ? 7 : 14));
    if (day > until) break;
    out.push(day);
  }
  return out;
}

function AdminWorkload({ accounts, tasks, meetings, attendees, leaves }) {
  const [wk, setWk] = useState(0);
  const today = parisDay();
  const monday = shiftDay(today, -(isoWd(today) - 1) + wk * 7), sunday = shiftDay(monday, 6);
  const w0 = parisInstant(monday), w1 = parisInstant(shiftDay(sunday, 1));
  const rows = accounts.filter(a => a.status === "approved" && a.role !== "guest").map(u => {
    const mine = tasks.filter(t => !t.done && assigneeIds(t).includes(u.id));
    const dueWeek = mine.filter(t => t.due && t.due >= monday && t.due <= sunday).length;
    const overdue = wk === 0 ? mine.filter(t => t.due && t.due < today).length : 0;
    const noDate = mine.filter(t => !t.due).length;
    const mine_m = meetings.filter(m => attendees.some(a => a.meeting_id === m.id && a.user_id === u.id && a.response !== "declined") && Date.parse(m.starts_at) < w1 && Date.parse(m.ends_at) > w0);
    const mins = mine_m.reduce((n, m) => n + (Math.min(Date.parse(m.ends_at), w1) - Math.max(Date.parse(m.starts_at), w0)) / 60000, 0);
    let leaveDays = 0;
    for (let d = monday; d <= sunday; d = shiftDay(d, 1)) if (leaves.some(l => l.user_id === u.id && l.status === "approved" && l.start_date <= d && l.end_date >= d) && isoWd(d) <= 5) leaveDays++;
    const score = dueWeek + overdue * 1.5 + (mins / 60) * 0.5 + noDate * 0.2;
    return { u, dueWeek, overdue, noDate, meetings: mine_m.length, hours: Math.round(mins / 6) / 10, leaveDays, score };
  }).sort((a, b) => b.score - a.score);
  const avg = rows.length ? rows.reduce((n, r) => n + r.score, 0) / rows.length : 0;
  const max = Math.max(1, ...rows.map(r => r.score));
  const level = (r) => {
    if (r.leaveDays >= 5) return ["En congé", "#8FD6AE"];
    if (r.score === 0) return ["Libre", "#7DB4FF"];
    if (rows.length > 1 && r.score >= avg * 1.5 && r.score >= 4) return ["Chargé", "#FF9A8F"];
    if (rows.length > 1 && r.score <= avg * 0.5) return ["Disponible", "#7DB4FF"];
    return ["Normal", "#9098A8"];
  };
  const fmt = (d) => fmtDay(d, { day: "numeric", month: "short" });
  return (
    <div data-testid="workload">
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        <button type="button" onClick={() => setWk(w => w - 1)} style={chipBtn} aria-label="Semaine précédente">←</button>
        <div style={{ fontWeight: 600, fontSize: 14.5 }}>Semaine du {fmt(monday)} au {fmt(sunday)}{wk === 0 ? " (cette semaine)" : ""}</div>
        <button type="button" onClick={() => setWk(w => w + 1)} style={chipBtn} aria-label="Semaine suivante">→</button>
        {wk !== 0 && <button type="button" onClick={() => setWk(0)} style={chipBtn}>Cette semaine</button>}
      </div>
      <div style={{ fontSize: 12.5, color: "var(--text-dimmer)", marginBottom: 14, lineHeight: 1.5 }}>La charge compte les tâches à finir cette semaine, les tâches en retard (plus lourdes), les réunions et un peu les tâches sans date. C'est un repère pour répartir le travail, pas une mesure exacte.</div>
      {rows.length === 0 && <EmptyState text="Aucun membre à afficher." />}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.map(r => { const [lab, col] = level(r); return (
          <div key={r.u.id} data-person={r.u.display_name} style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "12px 14px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <Avatar user={r.u} size={28} />
              <div style={{ fontWeight: 600, fontSize: 14.5, minWidth: 110 }}>{r.u.display_name}</div>
              <span style={{ fontSize: 11.5, fontWeight: 700, color: col, border: `1px solid ${col}`, borderRadius: 6, padding: "1px 7px" }}>{lab}</span>
              <div style={{ flex: 1, minWidth: 140, height: 8, background: "var(--bg-2)", borderRadius: 6, overflow: "hidden" }}><div style={{ width: `${Math.round((r.score / max) * 100)}%`, height: "100%", background: col }} /></div>
            </div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12.5, color: "var(--text-dim)", marginTop: 8 }}>
              <span>📋 {r.dueWeek} à finir cette semaine</span>
              {r.overdue > 0 && <span style={{ color: "#FF9A8F" }}>⏰ {r.overdue} en retard</span>}
              {r.noDate > 0 && <span>🗂️ {r.noDate} sans date</span>}
              <span>📹 {r.meetings} réunion(s){r.hours ? ` · ${r.hours} h` : ""}</span>
              {r.leaveDays > 0 && <span>🌴 {r.leaveDays} jour(s) de congé</span>}
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}

function showNotif(title, body, tag) {
  if (!bnSupported() || Notification.permission !== "granted" || !bnOn()) return;

  const opts = { body, tag, icon: "/icons/icon-192.png", badge: "/icons/icon-192.png", data: { url: "/app/" } };

/** Surveille les données en direct et prévient (si autorisé) : tâche assignée, réunion qui commence, message privé, mention, congé traité. */
function useDesktopNotifications({ me, tasks, meetings, attendees, messages, channelMsgs, leaves, accounts }) {
  const [ready, setReady] = useState(false);
  const known = useRef({ tasks: new Set(), dm: new Set(), ch: new Set(), leaves: new Map(), meet: new Set() });
  useEffect(() => { const t = setTimeout(() => setReady(true), 3500); return () => clearTimeout(t); }, []);
  const nameOf = (id) => (accounts.find(a => a.id === id) || {}).display_name || "Quelqu'un";
  useEffect(() => {
    const k = known.current;
    const mineTasks = tasks.filter(t => assigneeIds(t).includes(me.id));
    const dms = messages.filter(m => m.to_id === me.id);
    const re = new RegExp("(^|[^A-Za-z0-9._-])@" + (me.username || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z0-9_-])", "i");
    const ments = channelMsgs.filter(m => m.from_id !== me.id && me.username && re.test(m.text));
    const mine = leaves.filter(l => l.user_id === me.id);
    if (!ready) {
      mineTasks.forEach(t => k.tasks.add(t.id)); dms.forEach(m => k.dm.add(m.id)); ments.forEach(m => k.ch.add(m.id)); mine.forEach(l => k.leaves.set(l.id, l.status));
      return;
    }
    for (const t of mineTasks) if (!k.tasks.has(t.id)) { k.tasks.add(t.id); if (t.created_by !== me.id) showNotif("Nouvelle tâche", `${nameOf(t.created_by)} vous a assigné « ${t.title} »`, "task-" + t.id); }
    for (const m of dms) if (!k.dm.has(m.id)) { k.dm.add(m.id); showNotif(`Message de ${nameOf(m.from_id)}`, m.poll ? "📊 Sondage" : String(m.text).slice(0, 120), "dm-" + m.id); }
    for (const m of ments) if (!k.ch.has(m.id)) { k.ch.add(m.id); showNotif(`${nameOf(m.from_id)} vous a mentionné`, String(m.text).slice(0, 120), "ch-" + m.id); }
    for (const l of mine) { const before = k.leaves.get(l.id); k.leaves.set(l.id, l.status); if (before === "pending" && l.status !== "pending") showNotif(l.status === "approved" ? "Congé accepté ✅" : "Demande de congé refusée", l.admin_note || "", "leave-" + l.id); }
  }, [ready, tasks, messages, channelMsgs, leaves, me.id]);
  useEffect(() => {
    const tick = () => {
      const now = Date.now(), k = known.current;
      for (const m of meetings) {
        const going = m.created_by === me.id || attendees.some(a => a.meeting_id === m.id && a.user_id === me.id && a.response !== "declined");
        if (!going) continue;
        const dt = Date.parse(m.starts_at) - now;
        if (dt > 0 && dt <= 10 * 60000 && !k.meet.has(m.id + "s")) { k.meet.add(m.id + "s"); showNotif("Réunion dans " + Math.max(1, Math.round(dt / 60000)) + " min", m.title, "meet-" + m.id); }
        else if (dt <= 0 && dt > -5 * 60000 && !k.meet.has(m.id + "n")) { k.meet.add(m.id + "n"); showNotif("La réunion commence", m.title, "meet-" + m.id); }
      }
    };
    tick(); const id = setInterval(tick, 20000); return () => clearInterval(id);
  }, [meetings, attendees, me.id]);
}

const REPORT_PERIODS = [[7, "7 jours"], [30, "30 jours"], [90, "90 jours"]];
/** Calcule tous les indicateurs d'un rapport (fonction pure, testable). */
function computeReport({ tasks, meetings, attendees, accounts, projects, days, projectId, today }) {
  const from = shiftDay(today, -(days - 1));
  const dayOf = (iso) => (iso ? parisDay(Date.parse(iso)) : null);
  const inRange = (d) => d && d >= from && d <= today;
  const list = tasks.filter(t => !t.deleted_at && (!projectId || (projectId === "none" ? !t.project_id : t.project_id === projectId)));
  const created = list.filter(t => inRange(dayOf(t.created_at)));
  const done = list.filter(t => t.done && inRange(dayOf(t.done_at)));
  const open = list.filter(t => !t.done);
  const late = open.filter(t => t.due && t.due < today);
  const dueIn = list.filter(t => t.due && t.due >= from && t.due <= today);
  const onTime = dueIn.filter(t => t.done && dayOf(t.done_at) && dayOf(t.done_at) <= t.due);
  const lead = done.map(t => daysBetween(dayOf(t.created_at), dayOf(t.done_at))).filter(n => n >= 0);
  const avgLead = lead.length ? lead.reduce((a, b) => a + b, 0) / lead.length : null;
  // Série temporelle : un point par jour (jusqu'à 30 jours), sinon par semaine
  const step = days > 31 ? 7 : 1;
  const series = [];
  for (let d = from; d <= today; d = shiftDay(d, step)) {
    const end = shiftDay(d, step - 1);
    series.push({ day: d, created: created.filter(t => { const x = dayOf(t.created_at); return x >= d && x <= end; }).length, done: done.filter(t => { const x = dayOf(t.done_at); return x >= d && x <= end; }).length });
  }
  const people = accounts.filter(a => a.status !== "pending").map(a => {
    const mine = list.filter(t => assigneeIds(t).includes(a.id));
    return { user: a, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length, late: mine.filter(t => !t.done && t.due && t.due < today).length };
  }).filter(r => r.done || r.open).sort((a, b) => b.done - a.done || b.open - a.open);
  const byProject = [...projects.map(p => ({ id: p.id, name: p.name })), { id: "none", name: "Sans projet" }].map(p => {
    const mine = list.filter(t => (p.id === "none" ? !t.project_id : t.project_id === p.id));
    return { ...p, done: mine.filter(t => t.done && inRange(dayOf(t.done_at))).length, open: mine.filter(t => !t.done).length };
  }).filter(r => r.done || r.open);
  const byLabel = LABELS.map(l => ({ ...l, done: done.filter(t => t.label === l.id).length, open: open.filter(t => t.label === l.id).length })).filter(r => r.done || r.open);
  const mts = meetings.filter(m => inRange(parisDay(Date.parse(m.starts_at))));
  const hours = mts.reduce((a, m) => a + (Date.parse(m.ends_at) - Date.parse(m.starts_at)) / 3600e3, 0);
  return { from, created: created.length, done: done.length, open: open.length, late: late.length, lateTasks: late, dueCount: dueIn.length, onTimeRate: dueIn.length ? Math.round(onTime.length / dueIn.length * 100) : null, avgLead, series, people, byProject, byLabel, meetings: mts.length, meetingHours: hours };
}

async function shrinkImage(file, maxSide = 1600) {
  if (!file || !(file.type || "").startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    URL.revokeObjectURL(url);
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    if (scale === 1 && file.size <= 1.5 * 1024 * 1024) return file;
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    if (!blob || blob.size >= file.size) return file;
    const base = (file.name || "photo").replace(/\.[^.]+$/, "");
    return new File([blob], base + ".jpg", { type: "image/jpeg", lastModified: Date.now() });
  } catch (_) { return file; }
}

/** Calcule mes statistiques personnelles à partir des tâches qui me sont assignées. */
function computeStats(tasks, meId, now = Date.now()) {
  const today = parisDay(now);
  const monday = shiftDay(today, -(isoWd(today) - 1)), lastMonday = shiftDay(monday, -7);
  const mine = tasks.filter(t => assigneeIds(t).includes(meId));
  const done = mine.filter(t => t.done && t.done_at).map(t => ({ t, day: parisDay(Date.parse(t.done_at)) }));
  const thisWeek = done.filter(x => x.day >= monday && x.day <= today);
  const lastWeek = done.filter(x => x.day >= lastMonday && x.day < monday);
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = shiftDay(today, -i); days.push({ day: d, n: done.filter(x => x.day === d).length }); }
  const since30 = shiftDay(today, -29);
  const dueDone = done.filter(x => x.day >= since30 && x.t.due);
  const onTime = dueDone.filter(x => x.day <= x.t.due).length;
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = shiftDay(today, -i);
    if (done.some(x => x.day === d)) streak++; else if (i > 0) break;
  }
  const overdue = mine.filter(t => !t.done && t.due && t.due < today).length;
  const perProject = new Map();
  for (const x of thisWeek) perProject.set(x.t.project_id || "", (perProject.get(x.t.project_id || "") || 0) + 1);
  return { thisWeek: thisWeek.length, lastWeek: lastWeek.length, days, rate: dueDone.length ? Math.round(100 * onTime / dueDone.length) : null, dueDone: dueDone.length, streak, overdue, perProject: [...perProject.entries()].sort((a, b) => b[1] - a[1]) };
}

/** Envoie des fichiers dans le stockage privé puis enregistre une ligne par fichier. Retourne le nombre envoyé. */
async function uploadAttachments(files, { me, folder, table, extra, existing = 0, max = MAX_FILES_PER_TASK, noun = "tâche", notify }) {
  let count = existing, done = 0;
  for (const f0 of files) {
    const f = await shrinkImage(f0);
    if (count >= max) { notify(`Maximum ${max} fichiers par ${noun}.`, "err"); break; }
    if (f.size > MAX_FILE_BYTES) { notify(`« ${f.name} » dépasse 5 Mo.`, "err"); continue; }
    const safe = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80) || "fichier";
    const path = `${me.server_id}/${folder}/${uid()}-${safe}`;
    const up = await supabase.storage.from('task-files').upload(path, f, { contentType: f.type || undefined, upsert: false });
    if (up.error) { notify(up.error.message, "err"); continue; }
    const { error } = await supabase.from(table).insert({ ...extra, server_id: me.server_id, uploader_id: me.id, path, filename: f.name, size: f.size, mime: f.type || null });
    if (error) { await supabase.storage.from('task-files').remove([path]); notify(error.message, "err"); continue; }
    count++; done++;
  }
  return done;
}

/** Fichiers attachés à un message (salon ou privé). */
function MessageFiles({ items, me, isAdmin, notify }) {
  if (!items.length) return null;
  const remove = async (att) => {
    const { error } = await supabase.from('message_attachments').delete().eq('id', att.id);
    if (error) { notify(error.message, "err"); return; }
    await supabase.storage.from('task-files').remove([att.path]);
  };
  return (
    <div data-message-files style={{ display: "flex", flexDirection: "column", gap: 5, marginTop: 6, maxWidth: 340, color: "var(--text)" }}>
      {items.map(a => <AttachmentRow key={a.id} att={a} notify={notify} canDelete={a.uploader_id === me.id || isAdmin} onDelete={() => remove(a)} />)}
    </div>
  );
}

function AttachmentRow({ att, canDelete, onDelete, notify }) {
  const [thumb, setThumb] = useState(null);
  const isImage = (att.mime || "").startsWith("image/");
  useEffect(() => {
    let alive = true;
    if (isImage) supabase.storage.from('task-files').createSignedUrl(att.path, 3600).then(({ data }) => { if (alive && data) setThumb(data.signedUrl); });
    return () => { alive = false; };
  }, [att.path]);
  const open = async () => {
    const { data, error } = await supabase.storage.from('task-files').createSignedUrl(att.path, 120, { download: isImage ? undefined : att.filename });
    if (error || !data) { notify("Impossible d'ouvrir ce fichier.", "err"); return; }
    const a = document.createElement("a");
    a.href = data.signedUrl; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, background: "var(--bg-2)", border: "1px solid var(--border)", borderRadius: 9, padding: "7px 10px" }}>
      {isImage && thumb ? <img src={thumb} alt="" onClick={open} style={{ width: 38, height: 38, objectFit: "cover", borderRadius: 6, cursor: "pointer", flexShrink: 0 }} /> : <div style={{ width: 38, height: 38, borderRadius: 6, background: "var(--panel-2)", display: "grid", placeItems: "center", color: "var(--text-dim)", flexShrink: 0 }}><I.Paperclip size={16} /></div>}
      <button type="button" onClick={open} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", color: "var(--text)", cursor: "pointer", padding: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{att.filename}</div>
        <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>{fileSizeLabel(att.size || 0)}</div>
      </button>
      <button type="button" onClick={open} style={{ ...iconBtn, border: "none" }} title="Télécharger"><I.Download size={14} /></button>
      {canDelete && <button type="button" onClick={onDelete} style={{ ...iconBtn, border: "none", color: "#FF9A8F" }} title="Retirer"><I.Trash size={14} /></button>}
    </div>
  );
}

/* ---------------- Réglages du serveur : nom, code, transfert d'administration ---------------- */
function ServerSettings({ server, setServer, me, session, approved, notify, onChanged }) {
  const [name, setName] = useState(server.name || "");
  const [savingName, setSavingName] = useState(false);
  const [confirmCode, setConfirmCode] = useState(false);
  const [transferTo, setTransferTo] = useState("");
  const [confirmTransfer, setConfirmTransfer] = useState(false);
  const [busy, setBusy] = useState(false);
  const candidates = approved.filter(a => a.id !== me.id);

  const saveName = async () => {
    const v = name.trim();
    if (!v || v === server.name || savingName) return;
    if (v.length > 60) { notify("Le nom du serveur doit faire 60 caractères maximum.", "err"); return; }
    setSavingName(true);
    const { data, error } = await supabase.from('servers').update({ name: v }).eq('id', server.id).select().single();
    setSavingName(false);
    if (error || !data) { notify(error ? error.message : "Modification refusée.", "err"); return; }
    setServer(data);
    notify("Serveur renommé.");
  };
  const newCode = async () => {
    const code = Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2, "0")).join("");
    const { data, error } = await supabase.from('servers').update({ join_code: code }).eq('id', server.id).select().single();
    setConfirmCode(false);
    if (error || !data) { notify(error ? error.message : "Modification refusée.", "err"); return; }
    setServer(data);
    notify("Nouveau code généré. L'ancien ne fonctionne plus.");
  };
  const transfer = async () => {
    if (!transferTo || busy) return;
    setBusy(true);
    try {
      await callApi('/api/manage-account', { action: 'transfer-admin', id: transferTo }, session);
      notify("Administration transférée. Vous êtes maintenant modérateur.");
      onChanged();
    } catch (e) { notify(e.message, "err"); }
    setBusy(false); setConfirmTransfer(false);
  };
  const box = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 16px", marginBottom: 20 };
  const target = candidates.find(c => c.id === transferTo);

  return (
    <div style={box}>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Réglages du serveur</div>
      <Field label="Nom du serveur">
        <div style={{ display: "flex", gap: 8 }}>
          <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === "Enter") saveName(); }} style={inputStyle} />
          <button type="button" onClick={saveName} disabled={savingName || !name.trim() || name.trim() === server.name} style={{ ...primaryBtn, width: "auto", padding: "0 16px", opacity: name.trim() && name.trim() !== server.name ? 1 : 0.5 }}>Renommer</button>
        </div>
      </Field>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
        <div style={{ flex: 1, minWidth: 180 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 4 }}>Code d'invitation</div>
          <div style={{ fontFamily: "monospace", fontSize: 16, fontWeight: 700, color: "var(--accent-2)", letterSpacing: 1 }}>{server.join_code}</div>
        </div>
        <button type="button" onClick={() => { navigator.clipboard?.writeText(server.join_code); notify("Code copié."); }} style={{ ...secondaryBtn, display: "flex", alignItems: "center", gap: 6, padding: "8px 12px" }}><I.Copy size={13} /> Copier</button>
        {confirmCode ? (<>
          <button type="button" onClick={newCode} style={{ ...secondaryBtn, padding: "8px 12px", color: "#FF9A8F" }}>Confirmer : l'ancien code sera invalide</button>
          <button type="button" onClick={() => setConfirmCode(false)} style={{ ...secondaryBtn, padding: "8px 12px" }}>Annuler</button>
        </>) : <button type="button" onClick={() => setConfirmCode(true)} style={{ ...secondaryBtn, padding: "8px 12px" }}>Nouveau code</button>}
      </div>
      <div style={{ borderTop: "1px solid var(--border)", paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8 }}>Transférer l'administration à un autre membre (vous deviendrez modérateur)</div>
        {candidates.length === 0 ? <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucun autre membre pour l'instant.</div> : (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <select value={transferTo} onChange={e => { setTransferTo(e.target.value); setConfirmTransfer(false); }} style={{ ...inputStyle, flex: 1, minWidth: 180, width: "auto" }}>
              <option value="">Choisir une personne…</option>
              {candidates.map(c => <option key={c.id} value={c.id}>{c.display_name} (@{c.username})</option>)}
            </select>
            {!confirmTransfer
              ? <button type="button" disabled={!transferTo} onClick={() => setConfirmTransfer(true)} style={{ ...secondaryBtn, padding: "0 16px", opacity: transferTo ? 1 : 0.5 }}>Transférer</button>
              : <button type="button" disabled={busy} onClick={transfer} style={{ ...secondaryBtn, padding: "0 16px", color: "#FF9A8F" }}>{busy ? "…" : `Confirmer : ${target ? target.display_name : ""} devient admin`}</button>}
          </div>
        )}
      </div>
    </div>
  );
}

const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 48 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
};
const adminBox = { background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 16px", marginBottom: 20 };

/* ---------------- Aperçu : chiffres clés, activité, points à surveiller ---------------- */
function AdminOverview({ approved, pending, tasks, mailStatus, go }) {
  const now = Date.now(), weekAgo = now - 7 * 86400000, monthAgo = now - 30 * 86400000;
  const open = tasks.filter(t => !t.done);
  const late = open.filter(t => t.due && dueInfo(t).late);
  const noOwner = open.filter(t => assigneeIds(t).length === 0);
  const doneWeek = tasks.filter(t => t.done && t.done_at && new Date(t.done_at).getTime() >= weekAgo);
  const createdWeek = tasks.filter(t => t.created_at && new Date(t.created_at).getTime() >= weekAgo);
  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return isoLocal(d); });
  const doneByDay = days.map(day => tasks.filter(t => t.done && t.done_at && isoLocal(new Date(t.done_at)) === day).length);
  const createdByDay = days.map(day => tasks.filter(t => t.created_at && isoLocal(new Date(t.created_at)) === day).length);
  const maxBar = Math.max(1, ...doneByDay, ...createdByDay);
  const load = approved.map(a => {
    const mine = open.filter(t => assigneeIds(t).includes(a.id));
    return { a, open: mine.length, late: mine.filter(t => t.due && dueInfo(t).late).length, done30: tasks.filter(t => t.done && t.done_at && new Date(t.done_at).getTime() >= monthAgo && assigneeIds(t).includes(a.id)).length };
  }).sort((x, y) => y.open - x.open);
  const maxLoad = Math.max(1, ...load.map(l => l.open));

  const alerts = [];
  if (pending.length) alerts.push({ key: "p", text: `${pending.length} demande${pending.length > 1 ? "s" : ""} d'accès en attente`, action: "Examiner", to: "members", color: "#FFC97A" });
  if (late.length) alerts.push({ key: "l", text: `${late.length} tâche${late.length > 1 ? "s" : ""} en retard`, color: "#FF9A8F" });
  if (noOwner.length) alerts.push({ key: "n", text: `${noOwner.length} tâche${noOwner.length > 1 ? "s" : ""} sans responsable`, color: "#FFC97A" });
  if (mailStatus && !mailStatus.error) {
    if (!mailStatus.mailConfigured) alerts.push({ key: "m", text: "L'envoi d'emails n'est pas configuré", action: "Régler", to: "settings", color: "#FF9A8F" });
    else if (!mailStatus.lastRun || Date.now() - new Date(mailStatus.lastRun.ran_at).getTime() > 30 * 60000) alerts.push({ key: "c", text: "Les rappels automatiques ne tournent pas régulièrement", action: "Voir", to: "settings", color: "#FFC97A" });
  }

  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
        <StatCard value={approved.length} label="Membres" hex="#9B7EF5" onClick={() => go("members")} />
        <StatCard value={open.length} label="Tâches en cours" hex="#5B9EF5" />
        <StatCard value={late.length} label="En retard" hex="#FF6B5E" />
        <StatCard value={doneWeek.length} label="Terminées (7 jours)" hex="#5FBF8B" />
        <StatCard value={createdWeek.length} label="Créées (7 jours)" hex="#FFB648" />
      </div>

      <div style={adminBox}>
        <AdminHeading>À surveiller</AdminHeading>
        {alerts.length === 0 ? <div style={{ fontSize: 13.5, color: "#5FBF8B" }}>✓ Tout est en ordre.</div> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {alerts.map(al => (
              <div key={al.key} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13.5 }}>
                <I.Alert size={15} style={{ color: al.color, flexShrink: 0 }} />
                <span style={{ flex: 1 }}>{al.text}</span>
                {al.action && <button type="button" onClick={() => go(al.to)} style={{ ...secondaryBtn, width: "auto", padding: "5px 12px", fontSize: 12.5 }}>{al.action}</button>}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={adminBox}>
        <AdminHeading right={<span style={{ fontSize: 11.5, color: "var(--text-dimmer)", display: "flex", gap: 12 }}><span><span style={{ display: "inline-block", width: 9, height: 9, background: "#5FBF8B", borderRadius: 2, marginRight: 4 }} />terminées</span><span><span style={{ display: "inline-block", width: 9, height: 9, background: "#5B6EF5", borderRadius: 2, marginRight: 4 }} />créées</span></span>}>Activité des 14 derniers jours</AdminHeading>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 5, height: 96 }} role="img" aria-label="Tâches créées et terminées par jour sur 14 jours">
          {days.map((day, i) => (
            <div key={day} title={`${new Date(day + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} : ${doneByDay[i]} terminée(s), ${createdByDay[i]} créée(s)`} style={{ flex: 1, display: "flex", alignItems: "flex-end", justifyContent: "center", gap: 2, height: "100%" }}>
              <div style={{ width: "42%", maxWidth: 12, height: Math.max(doneByDay[i] ? 4 : 1, (doneByDay[i] / maxBar) * 100) + "%", background: "#5FBF8B", borderRadius: "3px 3px 0 0", opacity: doneByDay[i] ? 1 : 0.25 }} />
              <div style={{ width: "42%", maxWidth: 12, height: Math.max(createdByDay[i] ? 4 : 1, (createdByDay[i] / maxBar) * 100) + "%", background: "#5B6EF5", borderRadius: "3px 3px 0 0", opacity: createdByDay[i] ? 1 : 0.25 }} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-dimmer)", marginTop: 6 }}><span>{new Date(days[0] + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</span><span>Aujourd'hui</span></div>
      </div>

      <div style={adminBox}>
        <AdminHeading>Charge par membre</AdminHeading>
        {load.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucun membre.</div>}
        <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
          {load.map(({ a, open: o, late: l, done30 }) => (
            <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, width: 150, minWidth: 130 }}><Avatar user={a} size={24} /><span style={{ fontSize: 13.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.display_name}</span></div>
              <div style={{ flex: 1, minWidth: 140, height: 10, background: "var(--bg-2)", borderRadius: 6, overflow: "hidden", display: "flex" }} role="img" aria-label={`${o} en cours dont ${l} en retard`}>
                <div style={{ width: ((o - l) / maxLoad) * 100 + "%", background: "#5B9EF5" }} />
                <div style={{ width: (l / maxLoad) * 100 + "%", background: "#FF6B5E" }} />
              </div>
              <div style={{ fontSize: 12.5, color: "var(--text-dim)", minWidth: 190 }}>{o} en cours{l > 0 && <span style={{ color: "#FF9A8F" }}> ({l} en retard)</span>} · {done30} terminée(s) en 30 j</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Membres : demandes, invitations, comptes ---------------- */
function AdminMembers({ me, session, approved, pending, tasks, notify }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [invites, setInvites] = useState([]);
  const [inviteEmail, setInviteEmail] = useState("");
  const [inviteRole, setInviteRole] = useState("member");
  const [inviting, setInviting] = useState(false);
  const [q, setQ] = useState("");

  const loadInvites = async () => {
    const { data } = await supabase.from('invites').select('*').is('used_at', null).order('created_at', { ascending: false });
    setInvites(data || []);
  };
  useEffect(() => {
    loadInvites();
    const ch = supabase.channel('invites-' + me.server_id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'invites' }, loadInvites)
      .subscribe();
    return () => { supabase.removeChannel(ch); };
  }, [me.server_id]);

  const sendInvite = async () => {
    if (inviting || !inviteEmail.trim()) return;
    setInviting(true);
    try {
      const r = await callApi('/api/invite', { action: 'send', email: inviteEmail.trim(), role: inviteRole }, session);
      if (r.emailSent) notify("Invitation envoyée à " + inviteEmail.trim() + ".");
      else { navigator.clipboard?.writeText(r.link); notify(r.warning || "Email non envoyé : lien copié.", "err"); }
      setInviteEmail("");
      loadInvites();
    } catch (e) { notify(e.message, "err"); }
    setInviting(false);
  };
  const resendInvite = async (inv) => {
    try {
      const r = await callApi('/api/invite', { action: 'resend', id: inv.id }, session);
      notify(r.emailSent ? "Invitation renvoyée." : (r.warning || "Email non envoyé."), r.emailSent ? "ok" : "err");
      loadInvites();
    } catch (e) { notify(e.message, "err"); }
  };
  const revokeInvite = async (inv) => {
    const { error } = await supabase.from('invites').delete().eq('id', inv.id);
    if (error) { notify(error.message, "err"); return; }
    notify("Invitation annulée.");
    loadInvites();
  };
  const approve = async (a) => {
    const defaults = ROLE_DEFAULT_PERMS.member;
    const { error } = await supabase.from('profiles').update({ status: "approved", role: "member", permissions: defaults }).eq('id', a.id);
    if (error) { notify(error.message, "err"); return; }
    notify(`${a.display_name} a rejoint le serveur.`);
  };
  const reject = async (a) => {
    const { error } = await supabase.from('profiles').delete().eq('id', a.id);
    if (error) { notify(error.message, "err"); return; }
    notify("Demande refusée.");
  };
  const createOrUpdate = async (draft) => {
    try {
      if (draft.id) {
        await callApi('/api/manage-account', { action: 'update', id: draft.id, newPassword: draft.password || null, patch: { username: draft.username, display_name: draft.displayName, color: draft.color, role: draft.role, permissions: draft.permissions } }, session);
        notify("Compte mis à jour.");
      } else {
        await callApi('/api/manage-account', { action: 'create', username: draft.username, email: draft.email, password: draft.password, displayName: draft.displayName, color: draft.color, role: draft.role, permissions: draft.permissions }, session);
        notify(`Compte « ${draft.displayName} » créé.`);
      }
      setShowForm(false); setEditing(null);
    } catch (e) { notify(e.message, "err"); }
  };
  const removeUser = async (a) => {
    if (a.role === "admin") { notify("Impossible de supprimer l'administrateur.", "err"); return; }
    try { await callApi('/api/manage-account', { action: 'delete', id: a.id }, session); notify(`Compte « ${a.display_name} » supprimé.`); }
    catch (e) { notify(e.message, "err"); }
  };
  const shown = approved.filter(a => !q.trim() || [a.display_name, a.username, a.email].join(" ").toLowerCase().includes(q.trim().toLowerCase()));

  return (
    <div>
      {pending.length > 0 && (
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-dim)", marginBottom: 10, display: "flex", alignItems: "center", gap: 7 }}><I.Alert size={14} color="#FFC97A" /> {pending.length} demande(s) en attente</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pending.map(a => (
              <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 14, background: "#2A2410", border: "1px solid #4A3F1A", borderRadius: 12, padding: "12px 16px", flexWrap: "wrap" }}>
                <Avatar user={a} size={32} />
                <div style={{ flex: 1, minWidth: 140 }}><div style={{ fontWeight: 600, fontSize: 14 }}>{a.display_name}</div><div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>@{a.username} · {a.email}</div></div>
                <button onClick={() => approve(a)} style={{ ...primaryBtn, width: "auto", padding: "7px 14px", fontSize: 13 }}>Approuver</button>
                <button onClick={() => reject(a)} style={{ ...secondaryBtn, width: "auto", padding: "7px 14px", fontSize: 13, color: "#FF9A8F" }}>Refuser</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={adminBox}>
        <AdminHeading>Inviter par email</AdminHeading>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input type="email" placeholder="adresse@exemple.com" value={inviteEmail} onChange={e => setInviteEmail(e.target.value)} onKeyDown={e => { if (e.key === "Enter") sendInvite(); }} style={{ ...inputStyle, flex: 1, minWidth: 180, width: "auto" }} />
          <select value={inviteRole} onChange={e => setInviteRole(e.target.value)} style={{ ...inputStyle, width: "auto" }}>{ROLES.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}</select>
          <button type="button" onClick={sendInvite} disabled={inviting} style={{ ...primaryBtn, width: "auto", padding: "10px 18px", opacity: inviting ? 0.6 : 1 }}>{inviting ? "Envoi…" : "Envoyer"}</button>
        </div>
        {invites.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>Invitations en attente</div>
            {invites.map(inv => {
              const expired = new Date(inv.expires_at) < new Date();
              return (
                <div key={inv.id} style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontSize: 13 }}>
                  <span style={{ flex: 1, minWidth: 160, wordBreak: "break-all" }}>{inv.email} <span style={{ color: "var(--text-dimmer)" }}>· {(ROLES.find(r => r.id === inv.role) || ROLES[1]).label}{expired ? " · expirée" : ""}</span></span>
                  <button type="button" onClick={() => resendInvite(inv)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12 }}>Renvoyer</button>
                  <button type="button" onClick={() => revokeInvite(inv)} style={{ ...secondaryBtn, width: "auto", padding: "5px 10px", fontSize: 12, color: "#FF9A8F" }}>Annuler</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 200px" }}><I.Search size={14} style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)" }} /><input value={q} onChange={e => setQ(e.target.value)} placeholder="Chercher un membre…" style={{ ...inputStyle, paddingLeft: 32, background: "var(--bg-2)" }} /></div>
        <button onClick={() => { setEditing(null); setShowForm(true); }} style={{ display: "flex", alignItems: "center", gap: 7, background: "linear-gradient(135deg,var(--admin),#B08CFA)", border: "none", color: "#fff", fontWeight: 600, fontSize: 13.5, padding: "10px 16px", borderRadius: 9, cursor: "pointer", boxShadow: "0 8px 20px rgba(155,126,245,.3)" }}><I.UserPlus size={16} /> Créer un compte</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {shown.length === 0 && <EmptyState text="Aucun membre ne correspond." />}
        {shown.map(a => {
          const mine = tasks.filter(t => assigneeIds(t).includes(a.id) && !t.done);
          const lateN = mine.filter(t => t.due && dueInfo(t).late).length;
          return (
            <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 14, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "12px 16px", flexWrap: "wrap" }}>
              <Avatar user={a} size={34} />
              <div style={{ flex: 1, minWidth: 140 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontWeight: 600, fontSize: 14 }}>{a.display_name}</span>
                  {a.role === "admin" ? <span style={{ fontSize: 10.5, fontWeight: 700, color: "var(--admin)", background: "#9B7EF51A", padding: "2px 7px", borderRadius: 6 }}>ADMIN</span> : <span style={{ fontSize: 10.5, fontWeight: 700, color: "var(--accent-2)", background: "#5B6EF51A", padding: "2px 7px", borderRadius: 6 }}>{(ROLES.find(r => r.id === a.role) || ROLES[1]).label.toUpperCase()}</span>}
                </div>
                <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>@{a.username} · {a.email}</div>
              </div>
              <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{mine.length} tâche(s) en cours{lateN > 0 && <span style={{ color: "#FF9A8F" }}> · {lateN} en retard</span>}</div>
              <button onClick={() => { setEditing(a); setShowForm(true); }} style={iconBtn} title="Modifier" aria-label="Modifier"><I.Settings size={14} /></button>
              {a.role !== "admin" && <button onClick={() => removeUser(a)} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer" aria-label="Supprimer"><I.Trash size={15} /></button>}
            </div>
          );
        })}
      </div>
      {showForm && <UserForm initial={editing} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={createOrUpdate} />}
    </div>
  );
}

/* ---------------- Réglages : serveur + état des emails ---------------- */
function EmailsCard({ status, reload, session, notify }) {
  const [busy, setBusy] = useState(false);
  const test = async () => {
    setBusy(true);
    try { const r = await callApi('/api/admin-tools', { action: 'test-mail' }, session); notify("Email de test envoyé à " + r.to + "."); }
    catch (e) { notify(e.message, "err"); }
    setBusy(false);
  };
  const Line = ({ ok, children, hint }) => (
    <div style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "7px 0", fontSize: 13.5 }}>
      <span style={{ width: 16, flexShrink: 0, fontWeight: 700, color: ok === true ? "#5FBF8B" : ok === false ? "#FF9A8F" : "var(--text-dimmer)" }}>{ok === true ? "✓" : ok === false ? "✗" : "•"}</span>
      <div><div>{children}</div>{hint && <div style={{ fontSize: 12, color: "var(--text-dim)", marginTop: 2, lineHeight: 1.5 }}>{hint}</div>}</div>
    </div>
  );
  const fresh = status && status.lastRun && (Date.now() - new Date(status.lastRun.ran_at).getTime() <= 30 * 60000);
  return (
    <div style={adminBox}>
      <AdminHeading right={<button type="button" onClick={reload} style={{ ...secondaryBtn, width: "auto", padding: "4px 10px", fontSize: 12 }}>Actualiser</button>}><span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}><I.Mail size={15} /> Emails et rappels</span></AdminHeading>
      {!status && <div style={{ padding: 10, display: "grid", placeItems: "center" }}><Spinner /></div>}
      {status && status.error && <Line ok={false} hint="La fonction « admin-tools » n'est probablement pas encore déployée : ajoutez le dossier api/ à jour sur GitHub.">Impossible de lire l'état : {status.error}</Line>}
      {status && !status.error && (<>
        <Line ok={status.mailConfigured} hint={status.mailConfigured ? null : "Ajoutez GMAIL_USER et GMAIL_APP_PASSWORD dans Vercel → Settings → Environment Variables, puis redéployez."}>{status.mailConfigured ? <>Envoi d'emails configuré{status.sender ? <> (expéditeur : {status.sender})</> : null}</> : "Envoi d'emails non configuré"}</Line>
        <Line ok={status.cronSecretSet} hint={status.cronSecretSet ? null : "Ajoutez CRON_SECRET dans Vercel (une longue phrase secrète) et redéployez : sans elle, aucun rappel ne part."}>{status.cronSecretSet ? "Clé des rappels (CRON_SECRET) présente" : "Clé des rappels (CRON_SECRET) absente"}</Line>
        <Line ok={Boolean(fresh)} hint={fresh ? `${status.runs24h} passage(s) sur les dernières 24 h (environ 144 attendus avec un passage toutes les 10 min).` : "Les rappels « il reste peu de temps » demandent un passage toutes les 10 minutes. Lancez planifier-rappels.sql dans Supabase (SQL Editor) pour l'activer."}>{status.lastRun ? <>Dernier passage du planificateur : {ago(status.lastRun.ran_at)}</> : "Le planificateur n'a encore jamais tourné"}</Line>
        <Line ok={null}>{status.mails7d} rappel(s) envoyé(s) sur ce serveur ces 7 derniers jours</Line>
        <div style={{ marginTop: 10 }}><button type="button" onClick={test} disabled={busy || !status.mailConfigured} style={{ ...secondaryBtn, width: "auto", padding: "8px 14px", fontSize: 13, opacity: busy || !status.mailConfigured ? 0.5 : 1 }}>{busy ? "Envoi…" : "M'envoyer un email de test"}</button></div>
      </>)}
    </div>
  );
}

/* ---------------- Écrire aux membres (administrateur du serveur) ---------------- */
function AdminMail({ me, session, approved, status, notify }) {
  const [mode, setMode] = useState("all");            // "all" | "pick"
  const [picked, setPicked] = useState([]);
  const [subject, setSubject] = useState("");
  const [message, setMessage] = useState("");
  const [copy, setCopy] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [busy, setBusy] = useState(false);
  const others = approved.filter(a => a.id !== me.id && a.email);
  const recipients = mode === "all" ? others : others.filter(a => picked.includes(a.id));
  const count = recipients.length + (copy ? 1 : 0);
  const configured = !status || status.error ? true : status.mailConfigured;
  const valid = subject.trim().length > 0 && message.trim().length > 0 && count > 0;
  const toggle = (id) => { setConfirm(false); setPicked(l => l.includes(id) ? l.filter(x => x !== id) : [...l, id]); };
  const send = async () => {
    if (!valid || busy) return;
    if (!confirm) { setConfirm(true); return; }
    setBusy(true);
    try {
      const r = await callApi('/api/admin-tools', { action: 'send-mail', subject: subject.trim(), message: message.trim(), all: mode === "all", userIds: mode === "all" ? [] : picked, copyToMe: copy }, session);
      notify(r.failed ? `${r.sent} email(s) envoyé(s), ${r.failed} échec(s).` : `Email envoyé à ${r.sent} personne${r.sent > 1 ? "s" : ""}.`);
      setSubject(""); setMessage(""); setConfirm(false);
    } catch (e) { notify(e.message, "err"); setConfirm(false); }
    setBusy(false);
  };
  const chip = (on) => ({ display: "inline-flex", alignItems: "center", gap: 7, padding: "6px 11px", borderRadius: 18, cursor: "pointer", fontSize: 13, background: on ? "var(--accent)" : "var(--panel-2)", color: on ? "#fff" : "var(--text)", border: `1.5px solid ${on ? "var(--accent)" : "var(--border)"}` });
  return (
    <div style={adminBox}>
      <AdminHeading><span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}><I.Mail size={15} /> Écrire aux membres</span></AdminHeading>
      <p style={{ fontSize: 13, color: "var(--text-dim)", margin: "0 0 16px", lineHeight: 1.5 }}>Le message part par email depuis l'adresse du site. Les membres peuvent vous répondre directement : leur réponse arrive dans votre boîte mail ({me.email}). Seuls les membres de ce serveur peuvent être destinataires.</p>
      {!configured && <div style={{ background: "#FF9A8F22", border: "1px solid #FF9A8F66", borderRadius: 8, padding: "9px 12px", fontSize: 13, marginBottom: 14 }}>Les emails ne sont pas configurés sur Vercel (GMAIL_USER et GMAIL_APP_PASSWORD). Voir Réglages.</div>}
      <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 6, fontWeight: 500 }}>Destinataires</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        {[["all", `Tous les membres (${others.length})`], ["pick", "Choisir"]].map(([v, lab]) => (
          <button key={v} type="button" aria-pressed={mode === v} onClick={() => { setMode(v); setConfirm(false); }} style={chip(mode === v)}>{lab}</button>
        ))}
      </div>
      {mode === "pick" && (
        <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 12 }}>
          {others.length === 0 && <span style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucun autre membre pour l'instant.</span>}
          {others.map(a => { const on = picked.includes(a.id); return (
            <button key={a.id} type="button" aria-pressed={on} onClick={() => toggle(a.id)} style={chip(on)}><Avatar user={a} size={18} />{a.display_name}</button>
          ); })}
        </div>
      )}
      <Field label="Objet"><input value={subject} maxLength={120} onChange={e => { setSubject(e.target.value); setConfirm(false); }} placeholder="Réunion de famille dimanche" style={inputStyle} /></Field>
      <Field label={`Message (${message.length} / 5000)`}><textarea value={message} maxLength={5000} rows={7} onChange={e => { setMessage(e.target.value); setConfirm(false); }} placeholder="Bonjour à tous, …" style={{ ...inputStyle, resize: "vertical", lineHeight: 1.5 }} /></Field>
      <label style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13.5, cursor: "pointer", marginBottom: 16 }}><input type="checkbox" checked={copy} onChange={e => { setCopy(e.target.checked); setConfirm(false); }} style={{ width: 15, height: 15 }} /> M'envoyer aussi une copie</label>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        <button type="button" onClick={send} disabled={!valid || busy || !configured} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", opacity: valid && !busy && configured ? 1 : 0.5, ...(confirm ? { background: "#E2574C", boxShadow: "none" } : {}) }}>
          {busy ? "Envoi…" : confirm ? `Confirmer l'envoi à ${count} personne${count > 1 ? "s" : ""}` : "Envoyer"}
        </button>
        {confirm && !busy && <button type="button" onClick={() => setConfirm(false)} style={{ ...secondaryBtn, width: "auto", padding: "9px 14px" }}>Annuler</button>}
        {!valid && count === 0 && mode === "pick" && <span style={{ fontSize: 12.5, color: "var(--text-dimmer)" }}>Choisissez au moins un destinataire.</span>}
      </div>
    </div>
  );
}

/* ---------------- Site : annonces (réservé à l'administrateur du site) ---------------- */
function AdminSite({ notify }) {
  const [rows, setRows] = useState(null);
  const [msg, setMsg] = useState("");
  const [when, setWhen] = useState("");
  const [busy, setBusy] = useState(false);
  // Maintenance programmée
  const [mStart, setMStart] = useState("");
  const [mEnd, setMEnd] = useState("");
  const [mMsg, setMMsg] = useState("");
  const [mMsgEdited, setMMsgEdited] = useState(false);
  const [mConfirm, setMConfirm] = useState(false);
  const [mBusy, setMBusy] = useState(false);
  const load = async () => {
    const q = (cols) => supabase.from('system_alerts').select(cols).order('display_at', { ascending: false }).limit(40);
    let { data, error } = await q('id,message,display_at,is_maintenance,maint_start,maint_end');
    if (error) ({ data, error } = await q('id,message,display_at,is_maintenance'));      // migration 07 pas encore lancée
    if (error) notify(error.message, "err");
    setRows(data || []);
  };
  useEffect(() => { load(); }, []);
  const fmtDate = (iso) => new Date(iso).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
  const fmtHour = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
  const sameDay = (a, b) => new Date(a).toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" }) === new Date(b).toLocaleDateString("fr-FR", { timeZone: "Europe/Paris" });
  const publish = async () => {
    const text = msg.trim();
    if (!text || busy) return;
    setBusy(true);
    const at = when ? new Date(when).toISOString() : new Date().toISOString();
    const { error } = await supabase.from('system_alerts').insert({ message: text.slice(0, 300), display_at: at, is_maintenance: false });
    setBusy(false);
    if (error) { notify(error.message, "err"); return; }
    setMsg(""); setWhen("");
    notify(when ? "Annonce programmée." : "Annonce publiée.");
    load();
  };
  const remove = async (id, label) => {
    const { error } = await supabase.from('system_alerts').delete().eq('id', id);
    if (error) { notify(error.message, "err"); return; }
    notify(label || "Annonce supprimée.");
    load();
  };

  // ---- maintenance : validation + message proposé
  const startD = mStart ? new Date(mStart) : null, endD = mEnd ? new Date(mEnd) : null;
  const mError = !startD || !endD ? null
    : startD.getTime() < Date.now() + 60000 ? "Le début doit être dans le futur (au moins une minute)."
    : endD <= startD ? "La fin doit être après le début."
    : endD.getTime() - startD.getTime() > 48 * 3600000 ? "Une maintenance programmée dure 48 h au maximum."
    : null;
  const mValid = Boolean(startD && endD && !mError);
  const suggested = mValid ? `Maintenance prévue ${sameDay(startD, endD) ? `le ${startD.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Paris" })} de ${fmtHour(startD)} à ${fmtHour(endD)}` : `du ${fmtDate(startD)} au ${fmtDate(endD)}`}. Le site sera indisponible pendant ce temps.` : "";
  const shownMsg = mMsgEdited ? mMsg : suggested;
  const scheduleMaintenance = async () => {
    if (!mValid || mBusy) return;
    if (!mConfirm) { setMConfirm(true); return; }
    setMBusy(true);
    const text = shownMsg.trim().slice(0, 300);
    const { error } = await supabase.from('system_alerts').insert({
      is_maintenance: true, maint_start: startD.toISOString(), maint_end: endD.toISOString(),
      message: text || null, display_at: new Date().toISOString(),
    });
    setMBusy(false); setMConfirm(false);
    if (error) { notify(/maint_start|maint_end/.test(error.message) ? "Lancez d'abord migration-07-maintenance-programmee.sql dans Supabase." : error.message, "err"); return; }
    setMStart(""); setMEnd(""); setMMsg(""); setMMsgEdited(false);
    notify("Maintenance programmée.");
    load();
  };

  const ann = (rows || []).filter(r => !r.is_maintenance && r.message && r.message.trim());
  const maint = (rows || []).filter(r => r.is_maintenance).sort((a, b) => new Date(b.maint_start || b.display_at) - new Date(a.maint_start || a.display_at));
  const live = ann.find(r => new Date(r.display_at) <= new Date());
  const status = (r) => new Date(r.display_at) > new Date() ? ["Programmée", "#5B9EF5"] : (live && r.id === live.id) ? ["Affichée", "#5FBF8B"] : ["Remplacée", "var(--text-dimmer)"];
  const mStatus = (r) => {
    const now = Date.now(), s = r.maint_start ? new Date(r.maint_start).getTime() : null, e = r.maint_end ? new Date(r.maint_end).getTime() : null;
    if (s && s > now) return ["Programmée", "#5B9EF5"];
    if (e && e <= now) return ["Terminée", "var(--text-dimmer)"];
    return [s || e ? "En cours" : "En cours (manuelle)", "#FFB648"];
  };
  const dtInput = (v, set, label) => <div style={{ flex: "1 1 200px" }}><Field label={label}><input type="datetime-local" value={v} onChange={e => { set(e.target.value); setMConfirm(false); }} style={inputStyle} /></Field></div>;
  return (
    <div>
      <div style={adminBox}>
        <AdminHeading>Programmer une maintenance</AdminHeading>
        <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 10px", lineHeight: 1.5 }}>À l'heure de début, tous les visiteurs (vous compris) sont envoyés sur la page « Maintenance en cours ». À l'heure de fin, le site revient tout seul, sans rien à faire. Un bandeau peut prévenir à l'avance.</p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          {dtInput(mStart, setMStart, "Début (heure de votre appareil)")}
          {dtInput(mEnd, setMEnd, "Fin (obligatoire)")}
        </div>
        <Field label="Bandeau d'avertissement (300 caractères maximum, laissez vide pour ne rien afficher)"><textarea value={shownMsg} maxLength={300} rows={2} onChange={e => { setMMsg(e.target.value); setMMsgEdited(true); setMConfirm(false); }} placeholder="Choisissez un début et une fin : le message est proposé automatiquement" style={{ ...inputStyle, resize: "vertical" }} /></Field>
        {mError && <div style={{ fontSize: 12.5, color: "#FF9A8F", marginBottom: 10 }}>{mError}</div>}
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button type="button" onClick={scheduleMaintenance} disabled={!mValid || mBusy} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", opacity: mValid && !mBusy ? 1 : 0.5, ...(mConfirm ? { background: "#E2574C", boxShadow: "none" } : {}) }}>
            {mBusy ? "…" : mConfirm ? "Confirmer la programmation" : "Programmer la maintenance"}
          </button>
          {mConfirm && !mBusy && <button type="button" onClick={() => setMConfirm(false)} style={{ ...secondaryBtn, width: "auto", padding: "9px 14px" }}>Annuler</button>}
        </div>
        {maint.length > 0 && (
          <div style={{ marginTop: 18 }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 600, marginBottom: 4 }}>Maintenances</div>
            {maint.slice(0, 8).map(r => { const [lab, col] = mStatus(r); return (
              <div key={r.id} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderTop: "1px solid var(--border)" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5 }}>{r.maint_start ? <>{fmtDate(r.maint_start)} → {r.maint_end ? fmtDate(r.maint_end) : "sans fin"}</> : "Maintenance manuelle (is_maintenance dans Supabase)"}</div>
                  <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 3 }}>heure de Paris{r.message ? " · " + r.message : ""}</div>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, color: col, border: `1px solid ${col}`, borderRadius: 6, padding: "2px 7px", whiteSpace: "nowrap" }}>{lab}</span>
                <button type="button" onClick={() => remove(r.id, lab === "Programmée" ? "Maintenance annulée." : "Maintenance supprimée.")} style={{ ...iconBtn, color: "#FF9A8F" }} title={lab === "Programmée" ? "Annuler la maintenance" : "Supprimer"} aria-label={lab === "Programmée" ? "Annuler la maintenance" : "Supprimer la maintenance"}><I.Trash size={14} /></button>
              </div>
            ); })}
          </div>
        )}
      </div>
      <div style={adminBox}>
        <AdminHeading>Nouvelle annonce</AdminHeading>
        <p style={{ fontSize: 12.5, color: "var(--text-dim)", margin: "0 0 10px", lineHeight: 1.5 }}>Un bandeau visible par tous les visiteurs, sur l'accueil et dans l'application. Il apparaît à l'heure choisie ; la plus récente remplace la précédente.</p>
        <Field label="Message (300 caractères maximum)"><textarea value={msg} maxLength={300} onChange={e => setMsg(e.target.value)} rows={2} placeholder="Nouvelle fonction : les sondages dans la messagerie" style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 220px" }}><Field label="Afficher à partir de (heure de votre appareil)"><input type="datetime-local" value={when} onChange={e => setWhen(e.target.value)} style={inputStyle} /></Field></div>
          <button type="button" onClick={publish} disabled={!msg.trim() || busy} style={{ ...primaryBtn, width: "auto", padding: "10px 20px", marginBottom: 14, opacity: msg.trim() && !busy ? 1 : 0.5 }}>{busy ? "…" : when ? "Programmer" : "Publier maintenant"}</button>
        </div>
      </div>
      <div style={adminBox}>
        <AdminHeading>Annonces</AdminHeading>
        {rows === null && <div style={{ padding: 10, display: "grid", placeItems: "center" }}><Spinner /></div>}
        {rows && ann.length === 0 && <div style={{ fontSize: 13, color: "var(--text-dimmer)" }}>Aucune annonce.</div>}
        <div style={{ display: "flex", flexDirection: "column" }}>
          {ann.map(r => { const [lab, col] = status(r); return (
            <div key={r.id} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderTop: "1px solid var(--border)" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, wordBreak: "break-word" }}>{r.message}</div>
                <div style={{ fontSize: 12, color: "var(--text-dimmer)", marginTop: 3 }}>{fmtDate(r.display_at)} (heure de Paris)</div>
              </div>
              <span style={{ fontSize: 11, fontWeight: 700, color: col, border: `1px solid ${col}`, borderRadius: 6, padding: "2px 7px", whiteSpace: "nowrap" }}>{lab}</span>
              <button type="button" onClick={() => remove(r.id)} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer" aria-label="Supprimer l'annonce"><I.Trash size={14} /></button>
            </div>
          ); })}
        </div>
      </div>
    </div>
  );
}

function UserForm({ initial, onCancel, onSave }) {
  const [username, setUsername] = useState(initial?.username || "");
  const [email, setEmail] = useState(initial?.email || "");
  const [displayName, setDisplayName] = useState(initial?.display_name || "");
  const [password, setPassword] = useState("");
  const [color, setColor] = useState(initial?.color || LABELS[3].hex);
  const [role, setRole] = useState(initial?.role || "member");
  const [permissions, setPermissions] = useState(() => ({ ...ROLE_DEFAULT_PERMS[initial?.role || "member"], ...(initial?.permissions || {}) }));
  const changeRole = (r) => { setRole(r); setPermissions({ ...ROLE_DEFAULT_PERMS[r] }); };
  const togglePerm = (key) => setPermissions(p => ({ ...p, [key]: !p[key] }));
  const submit = () => {
    if (!displayName.trim() || !username.trim()) return;
    if (!initial && (!password || !email.trim())) return;
    onSave({ id: initial?.id, username: username.trim(), email: email.trim(), displayName: displayName.trim(), color, role, permissions, password });
  };
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-card" style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier le compte" : "Nouveau compte"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <Field label="Nom affiché"><input autoFocus value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
        <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
        {!initial && <Field label="Email (sert à se connecter)"><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="personne@exemple.com" style={inputStyle} /></Field>}
        <Field label={initial ? "Nouveau mot de passe (laisser vide pour ne pas changer)" : "Mot de passe"}><input type="text" value={password} onChange={e => setPassword(e.target.value)} style={inputStyle} /></Field>
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Rôle</div>
          <div style={{ display: "flex", gap: 8 }}>{ROLES.map(r => (<button key={r.id} type="button" onClick={() => changeRole(r.id)} style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${role === r.id ? "var(--accent)" : "var(--border-soft)"}`, background: role === r.id ? "#5B6EF51A" : "transparent", color: role === r.id ? "var(--accent-2)" : "var(--text-dim)" }}>{r.label}</button>))}</div>
        </div>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Droits individuels</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, background: "var(--bg)", borderRadius: 10, padding: "10px 12px" }}>
            {PERM_LABELS.map(p => (<label key={p.key} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13, cursor: "pointer" }}><input type="checkbox" checked={!!permissions[p.key]} onChange={() => togglePerm(p.key)} style={{ width: 15, height: 15, accentColor: "var(--accent)" }} />{p.label}</label>))}
          </div>
        </div>
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur du profil</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" onClick={() => setColor(l.hex)} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: color === l.hex ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={submit} style={{ ...primaryBtn, flex: 1 }}>{initial ? "Enregistrer" : "Créer le compte"}</button></div>
      </div>
    </div>
  );
}

function AdminGate({ title, text, action, href, onLogout }) {
