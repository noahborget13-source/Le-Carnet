function effectivePerms(account) {
  if (!account) return {};
  if (account.role === "admin") return { createTasks: true, editAnyTask: true, editOwnTask: true, deleteAnyTask: true, deleteOwnTask: true, sendMessages: true };
  const base = ROLE_DEFAULT_PERMS[account.role] || ROLE_DEFAULT_PERMS.member;
  return { ...base, ...(account.permissions || {}) };
}
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  const t = new Date(todayISO() + "T00:00:00");
  return Math.round((d - t) / 86400000);
}
function formatDue(due, dleft) {
  if (dleft === 0) return "Aujourd'hui";
  if (dleft === 1) return "Demain";
  if (dleft < 0) return `En retard (${Math.abs(dleft)} j)`;
  if (dleft <= 7) return `Dans ${dleft} j`;
  const d = new Date(due + "T00:00:00");
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
}
async function callApi(path, body, session) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session.access_token } : {}) },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Erreur serveur");
  return data;
}

/* ============================================================
   App racine
   ============================================================ */
function App() {
  const [session, setSession] = useState(undefined); // undefined = chargement, null = déconnecté
  const [profile, setProfile] = useState(null);
  const [profileCount, setProfileCount] = useState(null); // pour savoir si c'est le tout premier lancement
  const [toast, setToast] = useState(null);
  const notify = (text, kind = "ok") => {
    setToast({ text, kind, key: uid() });
    clearTimeout(notify._t);
    notify._t = setTimeout(() => setToast(null), 3200);
  };

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    let cancelled = false;
    async function loadProfile() {
      if (session === undefined) return;
      if (!session) { setProfile(null); return; }
      const { data } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (!cancelled) setProfile(data || null);
    }
    loadProfile();
    return () => { cancelled = true; };
  }, [session]);

  useEffect(() => {
    supabase.from('profiles').select('*', { count: 'exact', head: true }).then(({ count }) => setProfileCount(count || 0));
  }, [session]);

  if (session === undefined || profileCount === null) {
    return <Shell><div style={{ minHeight: "100vh", display: "grid", placeItems: "center" }}><Spinner /></div></Shell>;
  }

  if (profileCount === 0) {
    return <Shell><SetupAdmin onDone={() => window.location.reload()} notify={notify} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (!session) {
    return <Shell><Login notify={notify} />{toast && <Toast toast={toast} />}</Shell>;
  }

  if (session && !profile) {
    return <Shell><div style={{ minHeight: "100vh", display: "grid", placeItems: "center" }}><Spinner /></div></Shell>;
  }

  return (
    <Shell>
      <Workspace me={profile} session={session} onLogout={() => supabase.auth.signOut()} notify={notify} />
      {toast && <Toast toast={toast} />}
    </Shell>
  );
}

/* ---------------- Bootstrap : création du tout premier compte admin ---------------- */
function SetupAdmin({ onDone, notify }) {
  const [username, setUsername] = useState("admin");
  const [email, setEmail] = useState("");
  const [displayName, setDisplayName] = useState("Administrateur");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    if (!email || !password || !username.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      await callApi('/api/create-account', { username: username.trim(), email: email.trim(), password, displayName: displayName.trim() || username.trim(), color: "#9B7EF5" });
      const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw error;
      notify("Compte administrateur créé.");
      onDone();
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div style={{ width: 380, maxWidth: "90vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "34px 32px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
          <div style={{ width: 52, height: 52, borderRadius: 14, background: "linear-gradient(135deg,var(--admin),#B08CFA)", display: "grid", placeItems: "center", boxShadow: "0 8px 20px rgba(155,126,245,.35)" }}><I.Shield size={22} color="#fff" /></div>
        </div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, textAlign: "center", margin: "0 0 4px" }}>Bienvenue</h1>
        <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13.5, margin: "0 0 26px" }}>Premier lancement du carnet — crée ton compte administrateur.</p>
        <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
        <Field label="Email (sert à te connecter)"><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="toi@exemple.com" style={inputStyle} /></Field>
        <Field label="Nom affiché"><input value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
        <Field label="Mot de passe"><input type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} style={inputStyle} /></Field>
        {err && <div style={{ color: "#FF9A8F", fontSize: 13, marginBottom: 14 }}>{err}</div>}
        <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Création…" : "Créer mon compte admin"}</button>
      </div>
    </div>
  );
}

/* ---------------- Login ---------------- */
function Login({ notify }) {
  const [identifier, setIdentifier] = useState(""); // username OU email
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      let email = identifier.trim();
      if (!email.includes("@")) {
        const { data } = await supabase.from('profiles').select('email').eq('username', identifier.trim()).single();
        if (!data) throw new Error("Identifiant ou mot de passe incorrect.");
        email = data.email;
      }
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw new Error("Identifiant ou mot de passe incorrect.");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const onKey = (e) => { if (e.key === "Enter") submit(); };

  return (
    <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, position: "absolute", top: 28, left: 32 }}><NotebookMark size={26} /><span style={{ fontFamily: "Fraunces, serif", fontSize: 19 }}>Le Carnet</span></div>
      <div onKeyDown={onKey} style={{ width: 380, maxWidth: "90vw", background: "var(--panel-2)", border: "1px solid var(--border-soft)", borderRadius: 16, padding: "34px 32px", boxShadow: "0 30px 60px rgba(0,0,0,.45)" }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}><div style={{ width: 52, height: 52, borderRadius: 14, background: "linear-gradient(135deg,var(--accent),var(--accent-2))", display: "grid", placeItems: "center", boxShadow: "0 8px 20px rgba(91,110,245,.35)" }}><I.Lock size={22} color="#fff" /></div></div>
        <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 24, textAlign: "center", margin: "0 0 4px" }}>Content de vous revoir</h1>
        <p style={{ textAlign: "center", color: "var(--text-dim)", fontSize: 13.5, margin: "0 0 26px" }}>Connectez-vous pour ouvrir votre carnet de tâches.</p>
        <Field label="Identifiant ou email"><input autoFocus value={identifier} onChange={e => setIdentifier(e.target.value)} style={inputStyle} /></Field>
        <Field label="Mot de passe">
          <div style={{ position: "relative" }}>
            <input type={showPw ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} style={{ ...inputStyle, paddingRight: 40 }} />
            <button type="button" onClick={() => setShowPw(s => !s)} style={eyeBtn}>{showPw ? <I.EyeOff size={16} /> : <I.Eye size={16} />}</button>
          </div>
        </Field>
        {err && <div style={{ display: "flex", gap: 8, alignItems: "center", color: "#FF9A8F", fontSize: 13, margin: "4px 0 14px" }}><I.Alert size={14} /> {err}</div>}
        <button type="button" onClick={submit} disabled={busy} style={{ ...primaryBtn, width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Connexion…" : "Se connecter"}</button>
      </div>
    </div>
  );
}

/* ============================================================
   Workspace
   ============================================================ */
function Workspace({ me, session, onLogout, notify }) {
  const [tab, setTab] = useState("tasks");
  const [tasks, setTasks] = useState([]);
  const [messages, setMessages] = useState([]);
  const [accounts, setAccounts] = useState([]);
  const myPerms = useMemo(() => effectivePerms(me), [me]);
  const isAdmin = me.role === "admin";

  useEffect(() => {
    supabase.from('profiles').select('*').then(({ data }) => setAccounts(data || []));
    const ch = supabase.channel('profiles-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
      supabase.from('profiles').select('*').then(({ data }) => setAccounts(data || []));
    }).subscribe();
    return () => supabase.removeChannel(ch);
  }, []);

  useEffect(() => {
    supabase.from('tasks').select('*').then(({ data }) => setTasks(data || []));
    const ch = supabase.channel('tasks-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
      supabase.from('tasks').select('*').then(({ data }) => setTasks(data || []));
    }).subscribe();
    return () => supabase.removeChannel(ch);
  }, []);

  useEffect(() => {
    supabase.from('messages').select('*').then(({ data }) => setMessages(data || []));
    const ch = supabase.channel('messages-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => {

  const tabs = [

        <nav style={{ display: "flex", flexDirection: "column", gap: 3, marginTop: 6 }}>
          {tabs.map(t => (<button key={t.id} onClick={() => setTab(t.id)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: 9, background: tab === t.id ? "var(--panel-2)" : "transparent", border: "none", cursor: "pointer", color: tab === t.id ? "var(--text)" : "var(--text-dim)", fontSize: 14, fontWeight: 500, textAlign: "left" }}><t.icon size={16} /> {t.label}</button>))}
        </nav>
        <div style={{ marginTop: "auto", paddingTop: 14, borderTop: "1px solid var(--border)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 8px", marginBottom: 10 }}>
            <Avatar user={me} size={30} />
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{me.display_name}</div>
              <div style={{ fontSize: 11.5, color: "var(--text-dimmer)" }}>{isAdmin ? "Administrateur" : (ROLES.find(r => r.id === me.role) || {}).label || "Membre"}</div>
            </div>
          </div>
          <button onClick={onLogout} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "8px 12px", background: "transparent", border: "1px solid var(--border-soft)", borderRadius: 9, color: "var(--text-dim)", fontSize: 13, cursor: "pointer" }}><I.LogOut size={14} /> Se déconnecter</button>

      </aside>

        {tab === "messages" && <MessagesView me={me} myPerms={myPerms} accounts={accounts} messages={messages} />}

/* ============================================================
   Tasks
   ============================================================ */
function TasksView({ me, isAdmin, myPerms, accounts, tasks, notify }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("priority");
  const [filterLabel, setFilterLabel] = useState(null);
  const [filterDone, setFilterDone] = useState("open");
  const [filterMine, setFilterMine] = useState(false);

  const visible = useMemo(() => {
    let list = tasks.filter(t => {
      if (filterDone === "open" && t.done) return false;
      if (filterDone === "done" && !t.done) return false;
      if (filterLabel && t.label !== filterLabel) return false;
      if (filterMine && t.assignee !== me.id) return false;
      if (query && !t.title.toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
    list.sort((a, b) => {
      if (sortBy === "priority") return b.priority - a.priority || (a.due || "9999").localeCompare(b.due || "9999");
      if (sortBy === "due") return (a.due || "9999-99-99").localeCompare(b.due || "9999-99-99");
      if (sortBy === "title") return a.title.localeCompare(b.title, "fr");
      return 0;
    });
    return list;
  }, [tasks, query, sortBy, filterLabel, filterDone, filterMine, me.id]);

  const saveTask = async (draft) => {
    if (draft.id) {
      const { id, ...data } = draft;
      const { error } = await supabase.from('tasks').update(data).eq('id', id);
      if (error) { notify(error.message, "err"); return; }
      notify("Tâche mise à jour.");
    } else {
      const { error } = await supabase.from('tasks').insert({ ...draft, created_by: me.id });
      if (error) { notify(error.message, "err"); return; }
      notify("Tâche créée.");
    }
    setShowForm(false); setEditing(null);
  };
  const removeTask = async (id) => { const { error } = await supabase.from('tasks').delete().eq('id', id); notify(error ? error.message : "Tâche supprimée.", error ? "err" : "ok"); };
  const toggleDone = async (t) => { await supabase.from('tasks').update({ done: !t.done }).eq('id', t.id); };
  const counts = { open: tasks.filter(t => !t.done).length, late: tasks.filter(t => !t.done && t.due && daysUntil(t.due) < 0).length };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0 }}>Tâches</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>{counts.open} en cours{counts.late > 0 && <span style={{ color: "#FF9A8F" }}> · {counts.late} en retard</span>}</p></div>
        <button onClick={() => { setEditing(null); setShowForm(true); }} style={{ display: (isAdmin || myPerms.createTasks) ? "flex" : "none", alignItems: "center", gap: 7, ...primaryBtn, padding: "10px 16px", width: "auto" }}><I.Plus size={16} /> Nouvelle tâche</button>
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 20 }}>
        <div style={{ position: "relative", flex: "1 1 220px", minWidth: 180 }}><I.Search size={14} style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)" }} /><input value={query} onChange={e => setQuery(e.target.value)} placeholder="Rechercher une tâche…" style={{ ...inputStyle, paddingLeft: 32, background: "var(--bg-2)" }} /></div>
        <SelectPill icon={I.Sort} value={sortBy} onChange={setSortBy} options={[{ value: "priority", label: "Trier : priorité" }, { value: "due", label: "Trier : échéance" }, { value: "title", label: "Trier : titre" }]} />
        <SelectPill icon={I.Filter} value={filterDone} onChange={setFilterDone} options={[{ value: "open", label: "À faire" }, { value: "done", label: "Terminées" }, { value: "all", label: "Toutes" }]} />
        <button onClick={() => setFilterMine(m => !m)} style={{ ...chipBtn, background: filterMine ? "var(--panel-2)" : "var(--bg-2)", color: filterMine ? "var(--text)" : "var(--text-dim)", borderColor: filterMine ? "var(--accent)" : "var(--border-soft)" }}>Assignées à moi</button>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto" }}>{LABELS.map(l => (<button key={l.id} title={l.name} onClick={() => setFilterLabel(f => f === l.id ? null : l.id)} style={{ width: 22, height: 22, borderRadius: "50%", background: l.hex, cursor: "pointer", border: filterLabel === l.id ? "2px solid var(--text)" : "2px solid transparent" }} />))}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {visible.length === 0 && <EmptyState text="Aucune tâche ici." />}
        {visible.map(t => (<TaskCard key={t.id} task={t} accounts={accounts} me={me} isAdmin={isAdmin} myPerms={myPerms} onToggle={() => toggleDone(t)} onEdit={() => { setEditing(t); setShowForm(true); }} onDelete={() => removeTask(t.id)} />))}
      </div>
      {showForm && <TaskForm initial={editing} accounts={accounts} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={saveTask} />}
    </div>
  );
}
function SelectPill({ icon: Icon, value, onChange, options }) {
  return (<div style={{ position: "relative" }}><Icon size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /><select value={value} onChange={e => onChange(e.target.value)} style={{ ...chipBtn, paddingLeft: 28, paddingRight: 26, appearance: "none", cursor: "pointer" }}>{options.map(o => <option key={o.value} value={o.value} style={{ background: "var(--bg-2)" }}>{o.label}</option>)}</select><I.Chevron size={12} style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-dimmer)", pointerEvents: "none" }} /></div>);
}
function TaskCard({ task, accounts, me, isAdmin, myPerms, onToggle, onEdit, onDelete }) {
  const label = LABELS.find(l => l.id === task.label) || LABELS[0];
  const prio = PRIORITIES.find(p => p.id === task.priority) || PRIORITIES[1];
  const assignee = accounts.find(a => a.id === task.assignee);
  const dleft = task.due ? daysUntil(task.due) : null;
  const late = dleft !== null && dleft < 0 && !task.done;
  const soon = dleft !== null && dleft >= 0 && dleft <= 2 && !task.done;
  const own = task.created_by === me.id;
  const canEdit = isAdmin || myPerms.editAnyTask || (own && myPerms.editOwnTask);
  const canDelete = isAdmin || myPerms.deleteAnyTask || (own && myPerms.deleteOwnTask);
  return (
    <div className="fade-in" style={{ display: "flex", alignItems: "stretch", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden", opacity: task.done ? 0.55 : 1 }}>
      <div style={{ width: 5, background: label.hex, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 14, padding: "13px 16px", flexWrap: "wrap" }}>
        <button onClick={onToggle} style={{ background: "none", border: "none", cursor: "pointer", color: task.done ? "#5FBF8B" : "var(--text-dimmer)", flexShrink: 0 }}>{task.done ? <I.Check size={20} /> : <I.Circle size={20} />}</button>
        <div style={{ flex: 1, minWidth: 140 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, flexWrap: "wrap" }}><span style={{ fontSize: 14.5, fontWeight: 600, textDecoration: task.done ? "line-through" : "none", color: task.done ? "#7A8190" : "var(--text)" }}>{task.title}</span><span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600, color: prio.hex, background: `${prio.hex}1A`, padding: "2px 7px", borderRadius: 6 }}><I.Flag size={10} /> {prio.label}</span></div>
          {task.notes && <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginTop: 3 }}>{task.notes}</div>}
        </div>
        {task.due && (<div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, flexShrink: 0, color: late ? "#FF9A8F" : soon ? "#FFC97A" : "var(--text-dim)" }}>{late ? <I.Alert size={13} /> : <I.Calendar size={13} />}{formatDue(task.due, dleft)}</div>)}
        {assignee && <div title={assignee.display_name}><Avatar user={assignee} size={26} /></div>}
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {canEdit && <button onClick={onEdit} style={iconBtn} title="Modifier"><I.Settings size={14} /></button>}
          {canDelete && <button onClick={onDelete} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer"><I.Trash size={14} /></button>}
        </div>
      </div>
    </div>
  );
}
function TaskForm({ initial, accounts, onCancel, onSave }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [label, setLabel] = useState(initial?.label || LABELS[0].id);
  const [priority, setPriority] = useState(initial?.priority || 2);
  const [due, setDue] = useState(initial?.due || "");
  const [assignee, setAssignee] = useState(initial?.assignee || accounts[0]?.id || "");
  const submit = () => { if (!title.trim()) return; onSave({ ...(initial || {}), title: title.trim(), notes: notes.trim(), label, priority: Number(priority), due: due || null, assignee, done: initial?.done || false }); };
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier la tâche" : "Nouvelle tâche"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <Field label="Titre"><input autoFocus value={title} onChange={e => setTitle(e.target.value)} style={inputStyle} /></Field>
        <Field label="Notes (optionnel)"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}><Field label="Échéance"><input type="date" value={due} onChange={e => setDue(e.target.value)} style={inputStyle} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Assignée à"><select value={assignee} onChange={e => setAssignee(e.target.value)} style={inputStyle}>{accounts.map(a => <option key={a.id} value={a.id} style={{ background: "var(--bg-2)" }}>{a.display_name}</option>)}</select></Field></div>
        </div>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Priorité</div>
          <div style={{ display: "flex", gap: 8 }}>{PRIORITIES.map(p => (<button key={p.id} type="button" onClick={() => setPriority(p.id)} style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${priority === p.id ? p.hex : "var(--border-soft)"}`, background: priority === p.id ? `${p.hex}1A` : "transparent", color: priority === p.id ? p.hex : "var(--text-dim)" }}>{p.label}</button>))}</div>
        </div>
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500, display: "flex", alignItems: "center", gap: 6 }}><I.Palette size={13} /> Étiquette de couleur</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" title={l.name} onClick={() => setLabel(l.id)} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: label === l.id ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={submit} style={{ ...primaryBtn, flex: 1 }}>{initial ? "Enregistrer" : "Créer la tâche"}</button></div>
      </div>
    </div>
  );
}

/* ============================================================
   Messages
   ============================================================ */
function MessagesView({ me, myPerms, accounts, messages }) {
  const contacts = useMemo(() => accounts.filter(a => a.id !== me.id), [accounts, me.id]);
  const [activeId, setActiveId] = useState(null);
  useEffect(() => { if (!activeId && contacts.length) setActiveId(contacts[0].id); }, [contacts, activeId]);
  const [draft, setDraft] = useState("");
  const bottomRef = useRef(null);
  const thread = messages.filter(m => (m.from_id === me.id && m.to_id === activeId) || (m.from_id === activeId && m.to_id === me.id)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" }); }, [thread.length, activeId]);
  const lastMsgFor = (id) => messages.filter(m => (m.from_id === me.id && m.to_id === id) || (m.from_id === id && m.to_id === me.id)).sort((a, b) => new Date(b.ts) - new Date(a.ts))[0];
  const send = async () => {
    if (!draft.trim() || !activeId || !myPerms.sendMessages) return;
    const text = draft.trim(); setDraft("");
    await supabase.from('messages').insert({ from_id: me.id, to_id: activeId, text });
  };
  const onKey = (e) => { if (e.key === "Enter") send(); };
  const activeUser = accounts.find(a => a.id === activeId);
  return (
    <div>
      <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: "0 0 20px" }}>Messagerie</h1>
      <div style={{ display: "flex", height: "calc(100vh - 150px)", border: "1px solid var(--border)", borderRadius: 14, overflow: "hidden" }}>
        <div className="paper" style={{ width: 250, flexShrink: 0, borderRight: "1px solid var(--border)", overflowY: "auto" }}>
          {contacts.length === 0 && <EmptyState text="Aucun autre membre pour l'instant." />}
          {contacts.map(u => { const last = lastMsgFor(u.id); return (
            <button key={u.id} onClick={() => setActiveId(u.id)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "12px 14px", background: activeId === u.id ? "var(--panel-2)" : "transparent", border: "none", borderBottom: "1px solid #21252d", cursor: "pointer", textAlign: "left" }}>
              <Avatar user={u} size={32} />
              <div style={{ minWidth: 0, flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)" }}>{u.display_name}</div><div style={{ fontSize: 11.5, color: "var(--text-dimmer)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{last ? last.text : "Aucun message"}</div></div>
            </button>
          );})}
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
          {activeUser ? (<>
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px", borderBottom: "1px solid var(--border)" }}><Avatar user={activeUser} size={28} /><span style={{ fontWeight: 600, fontSize: 14 }}>{activeUser.display_name}</span></div>
            <div style={{ flex: 1, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: 8 }}>
              {thread.length === 0 && <EmptyState text="Aucun message. Dites bonjour !" />}
              {thread.map(m => (<div key={m.id} style={{ alignSelf: m.from_id === me.id ? "flex-end" : "flex-start", maxWidth: "70%", background: m.from_id === me.id ? "linear-gradient(135deg,var(--accent),var(--accent-2))" : "var(--panel-2)", color: m.from_id === me.id ? "#fff" : "var(--text)", padding: "9px 13px", borderRadius: 12, borderBottomRightRadius: m.from_id === me.id ? 3 : 12, borderBottomLeftRadius: m.from_id === me.id ? 12 : 3, fontSize: 13.5 }}>{m.text}<div style={{ fontSize: 10, opacity: 0.6, marginTop: 3 }}>{new Date(m.ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</div></div>))}
              <div ref={bottomRef} />
            </div>
            <div style={{ display: "flex", gap: 10, padding: 14, borderTop: "1px solid var(--border)" }}>
              <input value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={onKey} disabled={!myPerms.sendMessages} placeholder={myPerms.sendMessages ? "Écrire un message…" : "Ton rôle ne permet pas d'envoyer de messages"} style={{ ...inputStyle, flex: 1, background: "var(--bg)", opacity: myPerms.sendMessages ? 1 : 0.5 }} />
              <button type="button" onClick={send} disabled={!myPerms.sendMessages} style={{ background: "linear-gradient(135deg,var(--accent),var(--accent-2))", border: "none", color: "#fff", borderRadius: 9, padding: "0 16px", cursor: myPerms.sendMessages ? "pointer" : "not-allowed", opacity: myPerms.sendMessages ? 1 : 0.5, display: "grid", placeItems: "center" }}><I.Send size={16} /></button>
            </div>
          </>) : <EmptyState text="Choisissez une personne pour démarrer une conversation." />}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Admin
   ============================================================ */
function AdminView({ me, session, accounts, tasks, notify }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const createOrUpdate = async (draft) => {
    try {
      if (draft.id) {
        await callApi('/api/manage-account', { action: 'update', id: draft.id, newPassword: draft.password || null, patch: { username: draft.username, display_name: draft.displayName, color: draft.color, role: draft.role, permissions: draft.permissions } }, session);
        notify("Compte mis à jour.");
      } else {
        await callApi('/api/create-account', { username: draft.username, email: draft.email, password: draft.password, displayName: draft.displayName, color: draft.color, role: draft.role, permissions: draft.permissions }, session);
        notify(`Compte « ${draft.displayName} » créé.`);
      }
      setShowForm(false); setEditing(null);
    } catch (e) { notify(e.message, "err"); }
  };
  const removeUser = async (a) => {
    if (a.role === "admin") { notify("Impossible de supprimer l'administrateur.", "err"); return; }
    try { await callApi('/api/manage-account', { action: 'delete', id: a.id }, session); notify(`Compte « ${a.display_name} » supprimé.`); }
    catch (e) { notify(e.message, "err"); }
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
        <div><h1 style={{ fontFamily: "Fraunces, serif", fontSize: 28, fontWeight: 600, margin: 0, display: "flex", alignItems: "center", gap: 10 }}><I.Shield size={24} color="var(--admin)" /> Administration</h1><p style={{ color: "var(--text-dim)", fontSize: 13.5, margin: "6px 0 0" }}>{accounts.length} compte(s) · {tasks.length} tâche(s)</p></div>
        <button onClick={() => { setEditing(null); setShowForm(true); }} style={{ display: "flex", alignItems: "center", gap: 7, background: "linear-gradient(135deg,var(--admin),#B08CFA)", border: "none", color: "#fff", fontWeight: 600, fontSize: 13.5, padding: "10px 16px", borderRadius: 9, cursor: "pointer", boxShadow: "0 8px 20px rgba(155,126,245,.3)" }}><I.UserPlus size={16} /> Créer un compte</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {accounts.map(a => (
          <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 14, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: "12px 16px", flexWrap: "wrap" }}>
            <Avatar user={a} size={34} />
            <div style={{ flex: 1, minWidth: 140 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 600, fontSize: 14 }}>{a.display_name}</span>
                {a.role === "admin" ? <span style={{ fontSize: 10.5, fontWeight: 700, color: "var(--admin)", background: "#9B7EF51A", padding: "2px 7px", borderRadius: 6 }}>ADMIN</span> : <span style={{ fontSize: 10.5, fontWeight: 700, color: "var(--accent-2)", background: "#5B6EF51A", padding: "2px 7px", borderRadius: 6 }}>{(ROLES.find(r => r.id === a.role) || ROLES[1]).label.toUpperCase()}</span>}
              </div>
              <div style={{ fontSize: 12, color: "var(--text-dimmer)" }}>@{a.username}</div>
            </div>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>{tasks.filter(t => t.assignee === a.id && !t.done).length} tâche(s) en cours</div>
            <button onClick={() => { setEditing(a); setShowForm(true); }} style={iconBtn} title="Modifier"><I.Settings size={14} /></button>
            {a.role !== "admin" && <button onClick={() => removeUser(a)} style={{ ...iconBtn, color: "#FF9A8F" }} title="Supprimer"><I.Trash size={15} /></button>}
          </div>
        ))}
      </div>
      {showForm && <UserForm initial={editing} onCancel={() => { setShowForm(false); setEditing(null); }} onSave={createOrUpdate} />}
    </div>
  );
}
function UserForm({ initial, onCancel, onSave }) {
  const [username, setUsername] = useState(initial?.username || "");
  const [email, setEmail] = useState(initial?.email || "");
  const [displayName, setDisplayName] = useState(initial?.display_name || "");
  const [password, setPassword] = useState("");
  const [color, setColor] = useState(initial?.color || LABELS[3].hex);
  const [role, setRole] = useState(initial?.role || "member");
  const [permissions, setPermissions] = useState(() => ({ ...ROLE_DEFAULT_PERMS[initial?.role || "member"], ...(initial?.permissions || {}) }));
  const changeRole = (r) => { setRole(r); setPermissions({ ...ROLE_DEFAULT_PERMS[r] }); };
  const togglePerm = (key) => setPermissions(p => ({ ...p, [key]: !p[key] }));
  const submit = () => {
    if (!displayName.trim() || !username.trim()) return;
    if (!initial && (!password || !email.trim())) return;
    onSave({ id: initial?.id, username: username.trim(), email: email.trim(), displayName: displayName.trim(), color, role, permissions, password });
  };
  return (
    <div style={overlayStyle} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={modalStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}><h2 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{initial ? "Modifier le compte" : "Nouveau compte"}</h2><button type="button" onClick={onCancel} style={{ ...iconBtn, border: "none" }}><I.X size={18} /></button></div>
        <Field label="Nom affiché"><input autoFocus value={displayName} onChange={e => setDisplayName(e.target.value)} style={inputStyle} /></Field>
        <Field label="Identifiant"><input value={username} onChange={e => setUsername(e.target.value)} style={inputStyle} /></Field>
        {!initial && <Field label="Email (sert à se connecter)"><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="personne@exemple.com" style={inputStyle} /></Field>}
        <Field label={initial ? "Nouveau mot de passe (laisser vide pour ne pas changer)" : "Mot de passe"}><input type="text" value={password} onChange={e => setPassword(e.target.value)} style={inputStyle} /></Field>
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Rôle</div>
          <div style={{ display: "flex", gap: 8 }}>{ROLES.map(r => (<button key={r.id} type="button" onClick={() => changeRole(r.id)} style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600, border: `1.5px solid ${role === r.id ? "var(--accent)" : "var(--border-soft)"}`, background: role === r.id ? "#5B6EF51A" : "transparent", color: role === r.id ? "var(--accent-2)" : "var(--text-dim)" }}>{r.label}</button>))}</div>
        </div>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Droits individuels</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, background: "var(--bg)", borderRadius: 10, padding: "10px 12px" }}>
            {PERM_LABELS.map(p => (<label key={p.key} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13, cursor: "pointer" }}><input type="checkbox" checked={!!permissions[p.key]} onChange={() => togglePerm(p.key)} style={{ width: 15, height: 15, accentColor: "var(--accent)" }} />{p.label}</label>))}
          </div>
        </div>
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8, fontWeight: 500 }}>Couleur du profil</div>
          <div style={{ display: "flex", gap: 9 }}>{LABELS.map(l => (<button key={l.id} type="button" onClick={() => setColor(l.hex)} style={{ width: 28, height: 28, borderRadius: "50%", background: l.hex, cursor: "pointer", border: color === l.hex ? "2.5px solid var(--text)" : "2.5px solid transparent" }} />))}</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}><button type="button" onClick={onCancel} style={{ ...secondaryBtn, flex: 1 }}>Annuler</button><button type="button" onClick={submit} style={{ ...primaryBtn, flex: 1 }}>{initial ? "Enregistrer" : "Créer le compte"}</button></div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
}
</script>
</body>
</html>
